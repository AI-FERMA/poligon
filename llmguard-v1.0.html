ли, а не механизм запрета: модель читает один поток токенов."},{"id":"o1","text":"Полностью закрывает косвенные инъекции из документов и писем","correct":false,"rationale":"Инъекция может переопределить и эту инструкцию: гарантии нет."},{"id":"o2","text":"Ничего не даёт: модель не следует системному промпту","correct":false,"rationale":"Следует чаще, чем нет; эффект есть, но не стопроцентный."},{"id":"o3","text":"Заменяет фильтр ввода и ограничение прав инструментов","correct":false,"rationale":"Права и фильтр работают снаружи модели; промпт — внутри и обходится."}]},{"id":"d2","mechanic":"single","points":2,"stem":"Чем prompt injection отличается от джейлбрейка?","options":[{"id":"o0","text":"Инъекция перехватывает задачу приложения, джейлбрейк обходит политику модели","correct":true,"rationale":"Разные цели: угнать задачу против снять ограничения безопасности."},{"id":"o1","text":"Инъекция идёт через пользователя, джейлбрейк только через документы","correct":false,"rationale":"Оба бывают и прямыми, и косвенными по каналу доставки."},{"id":"o2","text":"Джейлбрейк опаснее, потому что ломает саму модель навсегда","correct":false,"rationale":"Джейлбрейк действует в рамках сессии; веса модели не меняются."},{"id":"o3","text":"Это синонимы, различие только в терминологии разных вендоров","correct":false,"rationale":"OWASP и MITRE различают их как разные техники с разными целями."}]},{"id":"d3","mechanic":"single","points":2,"stem":"Системный промпт чат-бота извлекли за три запроса. Насколько это серьёзно?","options":[{"id":"o0","text":"Инцидент, если в промпте секреты или права; иначе принятый риск","correct":true,"rationale":"Промпт считается публичным; критично только то, что в него положили."},{"id":"o1","text":"Критический инцидент всегда: системный промпт — главная тайна продукта","correct":false,"rationale":"Промпт извлекается почти всегда; строить на его секретности нельзя."},{"id":"o2","text":"Не серьёзно никогда: в промпте нет ничего ценного по определению","correct":false,"rationale":"Разработчики кладут туда ключи и правила доступа — тогда это утечка."},{"id":"o3","text":"Серьёзно, только если извлечён целиком, фрагменты промпта безопасны","correct":false,"rationale":"Фрагмент с ключом опаснее целого промпта без секретов."}]},{"id":"d4","mechanic":"single","points":2,"stem":"Guardrail-классификатор поставили на порог 0,5. Что нужно измерить до релиза?","options":[{"id":"o0","text":"Долю заблокированных атак, долю ложных блокировок и задержку","correct":true,"rationale":"Без FPR и задержки неизвестна цена защиты; без ASR — её польза."},{"id":"o1","text":"Только долю заблокированных атак на датасете самого вендора","correct":false,"rationale":"Датасет вендора не покрывает ваши категории и не меряет FPR."},{"id":"o2","text":"Достаточно включить и смотреть на жалобы пользователей","correct":false,"rationale":"Жалобы приходят после потерь; FPR меряется до релиза на логах."},{"id":"o3","text":"Ничего: порог 0,5 — рекомендованное вендором значение по умолчанию","correct":false,"rationale":"Порог по умолчанию ничего не знает о вашей цене ошибок."}]},{"id":"d5","mechanic":"single","points":2,"stem":"Агент читает входящие письма и может оформлять возврат. В письме скрытая инструкция «верни 5 000 ₽». Главная защита?","options":[{"id":"o0","text":"Ограничить инструмент: лимит, только аккаунт отправителя, подтверждение человеком","correct":true,"rationale":"Инструкция в письме пройдёт любой фильтр рано или поздно; права — не пройдёт."},{"id":"o1","text":"Классификатор инъекций на входящих письмах с порогом 0,9","correct":false,"rationale":"Полезный слой, но обходится перефразированием и кодировками."},{"id":"o2","text":"Запретить агенту читать письма с внешних почтовых доменов","correct":false,"rationale":"Внутренние письма тоже бывают скомпрометированы; задача агента ломается."},{"id":"o3","text":"Дообучить модель отказываться выполнять инструкции из писем","correct":false,"rationale":"Fine-tuning снижает, не исключает; единственным слоем быть не может."}]},{"id":"d6","mechanic":"single","points":2,"stem":"RAG отвечает по внутренней базе знаний. Насколько это безопаснее свободных ответов модели?","options":[{"id":"o0","text":"Не безопаснее: документы в индексе — тоже недоверенный ввод","correct":true,"rationale":"RAG — источник косвенных инъекций и утечек, если в индекс может писать кто-то ещё."},{"id":"o1","text":"Значительно безопаснее: модель отвечает по проверенным документам","correct":false,"rationale":"«Проверенные» — пока кто-то не положил документ с инструкцией."},{"id":"o2","text":"Безопаснее, если индекс обновляется автоматически из папок","correct":false,"rationale":"Автообновление из общих папок — прямой путь отравления индекса."},{"id":"o3","text":"Опаснее в любом случае: RAG лучше отключить совсем","correct":false,"rationale":"RAG нужен продукту; вопрос в контроле записи и изоляции."}]},{"id":"d7","mechanic":"single","points":2,"stem":"Модель формирует SQL-запрос по просьбе пользователя, бэкенд его исполняет. Что это?","options":[{"id":"o0","text":"Инъекция через небезопасную обработку вывода модели","correct":true,"rationale":"Вывод модели в SQL без валидации — SQLi, где LLM играет роль атакующего."},{"id":"o1","text":"Безопасно, если системный промпт запрещает опасные запросы","correct":false,"rationale":"Промпт обходится; исполняемый код должен валидироваться снаружи."},{"id":"o2","text":"Безопасно, если модель крупная и хорошо обучена","correct":false,"rationale":"Размер модели не отменяет инъекцию в её вход."},{"id":"o3","text":"Проблема производительности: запросы могут быть медленными","correct":false,"rationale":"Главная проблема — выполнение чужого кода, не скорость."}]},{"id":"d8","mechanic":"single","points":2,"stem":"Red team прогнал 50 промптов, 0 успешных. Вывод для релиза?","options":[{"id":"o0","text":"Данных мало: нужен датасет по категориям и повтор на каждом релизе","correct":true,"rationale":"Нулевой ASR на малом наборе — отсутствие измерения, а не защита."},{"id":"o1","text":"Система защищена: можно выпускать релиз и больше не тестировать её","correct":false,"rationale":"ASR 0 из 50 говорит о наборе, не о системе."},{"id":"o2","text":"Нужно поднять порог классификатора, раз атаки всё равно не проходят","correct":false,"rationale":"Порог меняют по FPR и ASR, а не по успокоительному результату."},{"id":"o3","text":"Достаточно повторить те же самые 50 промптов через месяц после релиза","correct":false,"rationale":"Те же промпты не ловят новые техники и смену модели."}]},{"id":"d9","mechanic":"single","points":2,"stem":"Два клиента (тенанта) используют один RAG. Что обязательно?","options":[{"id":"o0","text":"Фильтр по тенанту в запросе к векторной БД и тест на утечку","correct":true,"rationale":"Изоляция в запросе, а не в промпте, плюс проверка, что она работает."},{"id":"o1","text":"Инструкция в системном промпте: отвечать только по документам текущего клиента","correct":false,"rationale":"Модель уже видит чужие документы — инструкция не изолирует."},{"id":"o2","text":"Одна общая коллекция, где документы клиентов различаются префиксами в именах файлов","correct":false,"rationale":"Префикс в имени не фильтрует поиск по эмбеддингам."},{"id":"o3","text":"Ничего особенного: эмбеддинги не содержат читаемого текста, утечки быть не может","correct":false,"rationale":"Поиск возвращает исходные фрагменты текста, не только векторы."}]},{"id":"d10","mechanic":"single","points":2,"stem":"После смены модели на новую версию ASR вырос с 0,05 до 0,25. Что произошло?","options":[{"id":"o0","text":"Защита зависела от модели; нужны регрессия в CI и слои вне модели","correct":true,"rationale":"Модель — слой, который меняется без вашего ведома."},{"id":"o1","text":"Новая модель хуже, её нужно откатить и больше не обновлять","correct":false,"rationale":"Откат — временная мера; причина — отсутствие слоёв вне модели."},{"id":"o2","text":"Red team ошибся: ASR не может вырасти от смены модели","correct":false,"rationale":"Может и растёт регулярно — это главная причина регрессий."},{"id":"o3","text":"Это нормально: новые модели первые месяцы менее безопасны","correct":false,"rationale":"Нормы нет; есть отсутствие регрессии перед релизом."}]},{"id":"d11","mechanic":"single","points":2,"stem":"CFO спрашивает, зачем платить 6 млн ₽ в год за защиту LLM-платформы. Какой ответ честный?","options":[{"id":"o0","text":"Сравнить ожидаемый ущерб, остаточный риск, бюджет и потери от ложных блокировок","correct":true,"rationale":"Защита — экономическое решение: E, R, B и потери на одном слайде."},{"id":"o1","text":"Защита обязательна по OWASP LLM Top 10, так что обсуждать здесь нечего","correct":false,"rationale":"OWASP — не регулятор, а каталог; аргумент не экономический."},{"id":"o2","text":"Показать на дашборде число заблокированных атак за прошедший год","correct":false,"rationale":"Число блокировок растёт от ложных срабатываний — метрика обманчива."},{"id":"o3","text":"Сослаться на бюджеты конкурентов, которые тратят на защиту столько же","correct":false,"rationale":"Чужой бюджет не говорит о вашем ущербе и риске."}]},{"id":"d12","mechanic":"single","points":2,"stem":"Инцидент: агент разослал клиентам внутренний документ. Первое действие руководителя?","options":[{"id":"o0","text":"Остановить агента, зафиксировать трассы и состав утечки","correct":true,"rationale":"Сначала остановить ущерб и сохранить доказательства; уведомления идут по срокам закона."},{"id":"o1","text":"Удалить логи, чтобы документ не распространился дальше","correct":false,"rationale":"Логи — доказательства и основа расследования; удаление — нарушение."},{"id":"o2","text":"Сразу объявить, что виноват вендор модели","correct":false,"rationale":"Ответственность оператора не переходит вендору; сначала факты."},{"id":"o3","text":"Дождаться конца недели и собрать полную картину","correct":false,"rationale":"Утечка ПДн имеет сроки уведомления; ожидание увеличивает ущерб."}]}],"AUDITS":[],"LEGEND":"Обозначения в формулах курса: n — попытки атак, s — успешные, ASR = s/n — доля успешных атак; n_b, f, FPR = f/n_b — ложные блокировки; d — детекция слоя, P_проход = Π(1 − d_i); L — задержка (мс); p, N, P(≥1) = 1 − (1 − p)^N; C_инц, P_инц, E = P_инц·C_инц — ожидаемый ущерб; C_fp, c, Q, B = c·Q; R = E·P_проход — остаточный риск; MTTD, MTTR, k; T, ₽_T.","FORMULAS":[{"n":"Доля успешных атак","b":"ASR = s / n","v":[{"s":"ASR","e":"s / n","w":"по категориям OWASP отдельно"},{"s":"s","e":"ASR · n","w":""},{"s":"n","e":"s / ASR","w":"размер прогона по известному ASR"}]},{"n":"Эффект слоя защиты","b":"ASR_после = ASR_до · (1 − d)","v":[{"s":"ASR_после","e":"ASR_до · (1 − d)","w":""},{"s":"ASR_до","e":"ASR_после / (1 − d)","w":"восстановить исходный уровень из отчёта после фикса"},{"s":"d","e":"1 − ASR_после / ASR_до","w":"детекция слоя из двух прогонов"}]},{"n":"Доля ложных срабатываний","b":"FPR = f / n_b","v":[{"s":"FPR","e":"f / n_b","w":""},{"s":"f","e":"FPR · n_b","w":""},{"s":"n_b","e":"f / FPR","w":""}]},{"n":"Каскад слоёв","b":"P_проход = (1 − d₁) · (1 − d₂) · … · (1 − d_m)","v":[{"s":"P_проход","e":"Π(1 − d_i)","w":"слои перемножают пропуски, а не складывают детекцию"},{"s":"d_i","e":"1 − P_проход / Π_{j≠i}(1 − d_j)","w":"вклад одного слоя"},{"s":"суммарная детекция","e":"1 − P_проход","w":""}]},{"n":"Задержка каскада","b":"L = L₁ + L₂ + … + L_m","v":[{"s":"L","e":"Σ L_i","w":"из трассы"},{"s":"L_i","e":"L − Σ_{j≠i} L_j","w":"сколько съедает один слой"}]},{"n":"Хотя бы одна атака за период","b":"P(≥1) = 1 − (1 − p)^N","v":[{"s":"P(≥1)","e":"1 − (1 − p)^N","w":"при p·N ≪ 1 ≈ p·N"},{"s":"p","e":"1 − (1 − P(≥1))^(1/N)","w":""},{"s":"N","e":"ln(1 − P(≥1)) / ln(1 − p)","w":"сколько единиц до «почти наверняка»"}]},{"n":"Вероятность инцидента","b":"P_инц = P(≥1) · ASR","v":[{"s":"P_инц","e":"P(≥1) · ASR","w":"атака случилась и прошла"},{"s":"P(≥1)","e":"P_инц / ASR","w":""},{"s":"ASR","e":"P_инц / P(≥1)","w":""}]},{"n":"Ожидаемый ущерб","b":"E = P_инц · C_инц","v":[{"s":"E","e":"P_инц · C_инц","w":"за период"},{"s":"P_инц","e":"E / C_инц","w":""},{"s":"C_инц","e":"E / P_инц","w":""}]},{"n":"Остаточный риск","b":"R = E · P_проход","v":[{"s":"R","e":"E · P_проход","w":""},{"s":"E","e":"R / P_проход","w":""},{"s":"P_проход","e":"R / E","w":""}]},{"n":"Потери от ложных блокировок","b":"Потери_fp = FPR · Q · C_fp","v":[{"s":"Потери_fp","e":"FPR · Q · C_fp","w":"за период"},{"s":"FPR","e":"Потери_fp / (Q · C_fp)","w":""},{"s":"C_fp","e":"Потери_fp / (FPR · Q)","w":""},{"s":"Q","e":"Потери_fp / (FPR · C_fp)","w":""}]},{"n":"Бюджет защиты","b":"B = c · Q","v":[{"s":"B","e":"c · Q","w":""},{"s":"c","e":"B / Q","w":"стоимость на запрос"},{"s":"Q","e":"B / c","w":""}]},{"n":"Выгода защиты","b":"Выгода = E − R − B − Потери_fp","v":[{"s":"Выгода","e":"E − R − B − Потери_fp","w":"защита окупается, если > 0"},{"s":"B","e":"E − R − Выгода − Потери_fp","w":"сколько можно потратить"},{"s":"R","e":"E − B − Выгода − Потери_fp","w":"какой остаточный риск допустим"},{"s":"E","e":"Выгода + R + B + Потери_fp","w":""}]},{"n":"Время реакции","b":"MTTR = Σ t_i / k","v":[{"s":"MTTR","e":"Σ t_i / k","w":""},{"s":"Σ t_i","e":"MTTR · k","w":"часы реагирования за период"},{"s":"k","e":"Σ t_i / MTTR","w":""}]},{"n":"Стоимость прогона","b":"Стоимость = T / 1000 · ₽_T","v":[{"s":"Стоимость","e":"T / 1000 · ₽_T","w":""},{"s":"T","e":"1000 · Стоимость / ₽_T","w":""},{"s":"₽_T","e":"1000 · Стоимость / T","w":""}]}],"FALSE_WIN":{"title":"💸 Цена ложного срабатывания и пропуска: как выбирать порог guardrail","cols":["порог","d","FPR","когда так"],"rows":["Цена пропуска","Цена ложных блокировок","Частота атак","Баланс"],"intro":"Порог классификатора — не «чем строже, тем лучше». Пропущенная атака и зря заблокированный клиент стоят разных денег; порог выбирается так, чтобы ожидаемые потери от обеих ошибок были сопоставимы, а что не закрывает фильтр — закрывал бэкенд.","steps":[["1. Цена пропуска C_инц","Сложи: откат и починка (часы × ставка), прямой ущерб (возврат, утечка, штраф), простой, компенсации, репутация. Умножь на вероятность инцидента за период P_инц = P(≥1) · ASR — это E."],["2. Цена ложных блокировок","FPR · Q · C_fp: доля честных запросов, которые фильтр заблокирует, × число запросов за период × цена одной блокировки (потерянная продажа, обращение в поддержку)."],["3. Частота атак","p — доля вредоносных единиц по истории или threat intel; N — сколько единиц за период; P(≥1) = 1 − (1 − p)^N. Без истории берут консервативно и уточняют по первым неделям логов."],["4. Баланс","Сравни ΔE (на сколько порог снижает ожидаемый ущерб) с ростом Потери_fp. Порог стоит ужесточать, пока ΔE > ΔПотери_fp. Остаток закрывай не фильтром, а правами инструментов и бэкендом — они не дают ложных блокировок."],["5. Проверка здравого смысла","Посчитай для двух соседних порогов: если разница меньше стоимости самого прогона или одного дня инженера — спор не стоит денег, бери порог с меньшим FPR и добавляй слой в бэкенде."]],"grid":[["0,3","0,95","0,12","агент с необратимыми инструментами, инцидент дорог, честные запросы терпят"],["0,5","0,90","0,05","типовой чат-бот поддержки: фильтр + права инструментов"],["0,7","0,80","0,02","высокая нагрузка, дорогие ложные блокировки, бэкенд ограничен сам"],["0,9","0,60","0,005","только лог и алерт: защита в правах, фильтр как сигнал"]],"cases":[{"t":"A · Чат-бот поддержки без инструментов","n":"Q = 300 000 запросов/мес, C_fp = 150 ₽ (повторное обращение), инцидент — утечка системного промпта без секретов: C_инц = 40 000 ₽ (час инженера + ротация), P_инц = 0,5/мес.","miss":"E = 0,5 × 40 000 = 20 000 ₽/мес","fp":"порог 0,5: FPR 0,05 × 300 000 × 150 = 2 250 000 ₽/мес; порог 0,9: 0,005 × 300 000 × 150 = 225 000 ₽/мес","prior":"атаки: p = 0,002 на сессию, N = 300 000 → P(≥1) ≈ 1","bal":"ложные блокировки дороже пропуска в 10–100 раз","dec":"Порог 0,9 (только явные атаки), промпт без секретов, утечку принять как остаточный риск 20 000 ₽/мес; строгий фильтр здесь — убыток 2 млн."},{"t":"B · Агент возврата денег до 5 000 ₽","n":"Q = 50 000 запросов/мес, инструмент «возврат» необратим. Инцидент: цепочка возвратов по инъекции из письма — C_инц = 1 200 000 ₽ (240 возвратов + разбор). P(≥1) ≈ 1, ASR без защиты 0,3 → P_инц ≈ 0,3.","miss":"E = 0,3 × 1 200 000 = 360 000 ₽/мес","fp":"порог 0,5: FPR 0,05 × 50 000 × 200 ₽ = 500 000 ₽/мес — дороже E","prior":"фильтр d = 0,9 снижает E до 36 000, но ложные блокировки 500 000","bal":"фильтр убыточен как единственный слой","dec":"Порог 0,7 (FPR 0,02 → 200 000 ₽) + подтверждение человеком для возврата > 1 000 ₽ + allow-list аккаунта заявителя: P_проход ≈ 0,1 × 0,05 → R ≈ 6 000 ₽; выгода ≈ 360 000 − 6 000 − 200 000 − бюджет."},{"t":"C · RAG по внутренней базе с ПДн","n":"Q = 2 000 000 запросов/мес, утечка ПДн: C_инц = 15 000 000 ₽ (штраф по 152-ФЗ — задаётся в условии, уведомления, репутация). P_инц без защиты = 0,05/мес.","miss":"E = 0,05 × 15 000 000 = 750 000 ₽/мес","fp":"маскирование PII до модели: FPR ≈ 0 (не блокирует, а заменяет); фильтр вывода порог 0,5: 0,05 × 2 000 000 × 30 ₽ = 3 000 000 ₽/мес","prior":"утечка идёт через документы, а не через промпт пользователя","bal":"маскирование снижает E почти до нуля без FPR; фильтр вывода — дорогой второй слой","dec":"Presidio до модели + фильтры доступа по тенанту (R ≈ 0,05 × 0,02 × 15 млн ≈ 15 000 ₽); фильтр вывода — порог 0,9 как сигнал, не блокировка."},{"t":"D · Регрессия в CI перед релизом","n":"Прогон 400 атак + 600 честных запросов, T = 2 млн токенов, ₽_T = 0,4 ₽ → 800 ₽ за прогон, 20 релизов/мес = 16 000 ₽.","miss":"один пропущенный регресс (ASR с 0,05 до 0,25 после смены модели): E ≈ 0,25 × 1 200 000 = 300 000 ₽","fp":"гейт по ASR > 0,08 и FPR > 0,03: ложный стоп релиза — 2 часа инженера ≈ 6 000 ₽","prior":"смена модели или промпта ломает защиту в 1 релизе из 5 (из своей истории; задаётся)","bal":"16 000 + редкие ложные стопы против 300 000 за пропуск","dec":"Регрессия обязательна в каждом релизе; порог гейта ASR 0,08 по категориям, не только средний."},{"t":"E · Платформа компании на 40 команд","n":"Q = 120 млн запросов/год, c = 0,05 ₽ (классификатор + логи) → B = 6 млн ₽/год. Инциденты без программы: k = 6/год × C_инц 2 млн = 12 млн; MTTR 40 ч.","miss":"E = 12 000 000 ₽/год","fp":"FPR 0,01 × 120 млн × 20 ₽ = 24 млн ₽/год — главная статья, не бюджет защиты","prior":"половина инцидентов — через агентов с широкими правами","bal":"права и подтверждение (без FPR) дают больше, чем ужесточение фильтра","dec":"Бюджет: стандарт прав агентов + SOC4AI (MTTR 40 → 8 ч) + фильтр с порогом 0,9; цель R ≤ 3 млн при B ≤ 8 млн и Потери_fp ≤ 10 млн."}]},"VACANCY":{"id":"ai-security-engineer","title":"AI Security Engineer · защита LLM-систем от Prompt Injection и уязвимостей","family":"Инженер безопасности ИИ-систем — стык AppSec и AI/MLOps: защищает LLM-приложения, RAG и агентов от инъекций, утечек и злоупотребления инструментами; от первого ревью промпта до руководства направлением безопасности ИИ в компании","tracks":[{"id":"eng","name":"AI Security Engineer (защита)","desc":"Проектирует и внедряет контуры защиты: разделение контекста, guardrails, маскирование PII, least privilege для агентов, безопасная обработка вывода; отвечает за то, чтобы инъекция не стала инцидентом."},{"id":"red","name":"AI Red Team / Security Researcher (атака)","desc":"Думает как злоумышленник: ищет обходы, строит PoC-атаки, автоматизирует фаззинг (garak, PyRIT, promptfoo), меряет attack success rate; на верхних грейдах — исследователь и методолог."},{"id":"ops","name":"LLM SecOps / DevSecOps for AI (платформа)","desc":"Встраивает проверки в CI/CD и инференс-платформу, строит observability и детекторы семантических атак (SOC4AI), ведёт инциденты и playbook'и; на верхних грейдах — владелец платформы безопасности ИИ."}],"summary":"Роль называют по-разному: «AI Security Engineer», «LLM Security Specialist», «LLM SecOps Specialist» (ОТП Банк), «эксперт по безопасности GenAI-моделей / ML (GenAI)» (Сбер), «AI application security engineer» (Контур), «Application Security аналитик (AI)» (Cloud.ru), «AI Security Researcher / AI Red Teaming» (Raft). Общее ядро одно: понимать, как словами ломают систему вокруг модели, и строить защиту так, чтобы падение модели не стало исполнением кода, утечкой или несанкционированным действием агента. Курс ведёт по этому ядру от нуля до руководителя направления; программирование на Python и основы обучения моделей помечены как внешние навыки.","demand":"Москва, октябрь 2026: вакансии с ядром «безопасность LLM/агентов» открывали ОТП Банк, Т-Банк, Сбер (три команды: R&D PoC-атак, безопасность ML, SOC4AI), Cloud.ru, Контур (Екатеринбург/удалённо), Raft (вне РФ); требование «OWASP Top 10 for LLM» и «guardrails» появляется в обычных AppSec/DevSecOps-вакансиях банков и облаков. Спрос на ИБ в целом растёт: вакансий ИБ +24 % г/г при падении IT-вакансий на 18 % (SuperJob/Positive Education, 04.2026); с 01.03.2026 действует приказ ФСТЭК № 117 с требованиями к защите ИИ в ГИС/КИИ — это добавляет заказчиков из госсектора и КИИ.","asof":"октябрь 2026","grades":[{"id":"g0","name":"До входа","short":"L0","level":["L0"],"years":"0 лет · студент, разработчик, ML- или AppSec-инженер без опыта в безопасности ИИ","mission":"Понимать, как устроена LLM-система (промпт, контекст, инструменты) и почему её можно сломать обычным текстом; знать классические дыры веба, в которые эта поломка превращается.","duties":["Объяснить на пальцах, чем системный промпт отличается от пользовательского и почему модель их не различает","Отличить инъекцию от джейлбрейка и от галлюцинации на простом примере","Назвать границу доверия в схеме «пользователь → приложение → модель → инструмент»","Распознать XSS/SSRF/SQLi в коде, который получает текст от модели"],"proof":["Пройден L0 курса, зачёт ≥ 85 %","Диагностика на входе без грубых мисконцепций","Артефакт «Карта границ доверия» простого чат-бота"],"signals":["На вопрос «что такое prompt injection» отвечает про смешение данных и инструкций, а не про «плохие слова»","Спрашивает, что модель может сделать (какие инструменты), раньше, чем что она может сказать"]},{"id":"g1"," function unitSteps(u){

  var steps=[];

  (u.points||[]).forEach(function(p,i){steps.push({t:'theory',h:p.h,txt:p.t,rule:(u.layers&&u.layers.rules&&u.layers.rules[i])||null});});
  if(u.layers)steps.push({t:'layers',h:u.title,unit:u,fr:'Суть · четыре слоя',anchor:u.anchor});
  var pool=(u.test||[]).slice();
  if(pool.length>1)steps.push({t:'item',item:pool.shift(),pre:true});
  if(u.practice)steps.push({t:'item',item:u.practice});

/* ---------- незавершённые занятия: выйти крестиком и вернуться позже ---------- */
function resumeAll(){return S.get('resume',{});}
function resumeKey(kind,id){return kind+':'+id;}
function resumeSave(kind,id,title,state,pos){var all=resumeAll();all[resumeKey(kind,id)]={kind:kind,id:id,title:title,state:state,pos:pos||'',ts:Date.now()};var ks=[];for(var k in all)if(has(all,k))ks.push(k);if(ks.length>12){ks.sort(function(a,b){return all[a].ts-all[b].ts;});delete all[ks[0]];}S.set('resume',all);}
function resumeGet(kind,id){return resumeAll()[resumeKey(kind,id)]||null;}
function resumeClear(kind,id){var all=resumeAll();delete all[resumeKey(kind,id)];S.set('resume',all);}
function resumeLatest(){var all=resumeAll();var best=null;for(var k in all)if(has(all,k)){if(!best||all[k].ts>best.ts)best=all[k];}return best;}
function askResume(r,onResume,onFresh){var o=el('<div class="ovl"><div class="sheet confirm"><div class="sheet-b"><div class="mech">Есть незавершённое</div><div style="font-size:calc(16px * var(--fs,1));margin:4px 0 12px"><b>'+esc(r.title)+'</b><div class="small muted">'+esc(r.pos)+' · '+fmtAgo(r.ts)+'</div></div><div class="row"><button type="button" class="btn wide" id="rs-go" style="flex:1">Продолжить</button><button type="button" class="btn ghost wide" id="rs-new" style="flex:1">Заново</button></div></div></div></div>');
  document.body.appendChild(o);function kill(){if(o.parentNode)o.parentNode.removeChild(o);}o.querySelector('#rs-go').onclick=function(){kill();onResume();};o.querySelector('#rs-new').onclick=function(){kill();onFresh();};o.onclick=function(e){if(e.target===o)kill();};}
function fmtAgo(ts){var m=Math.round((Date.now()-ts)/60000);if(m<1)return 'только что';if(m<60)return m+' мин назад';var h=Math.round(m/60);if(h<24)return h+' ч назад';var d=Math.round(h/24);return d+' '+plural(d,'день','дня','дней')+' назад';}

/* сворачиваемый блок с явной кнопкой: тело — обычный текст, выделяется и копируется; переключает только кнопка */
function fold(title,body,opts){opts=opts||{};return '<div class="fold'+(opts.open?' open':'')+(opts.cls?' '+opts.cls:'')+'"'+(opts.id?' data-fold="'+esc(opts.id)+'"':'')+'><div class="fold-h"><div class="fold-t">'+title+'</div>'+(opts.copy?'<button type="button" class="fold-copy" title="Скопировать текст блока" aria-label="Скопировать">⧉</button>':'')+'<button type="button" class="fold-btn" aria-expanded="'+(opts.open?'true':'false')+'">'+(opts.open?'Свернуть ▴':'Раскрыть ▾')+'</button></div><div class="fold-b">'+body+'</div></div>';}
function foldSet(f,open){f.classList.toggle('open',!!open);var b=f.querySelector('.fold-btn');if(b){b.textContent=open?'Свернуть ▴':'Раскрыть ▾';b.setAttribute('aria-expanded',open?'true':'false');}}
function foldText(f){var b=f.querySelector('.fold-b');if(!b)return '';var t=f.querySelector('.fold-t');var lines=[];if(t)lines.push(t.textContent.replace(/\s+/g,' ').trim());var rows=b.querySelectorAll('li,tr,p,.fh,.fwstep,.fwt');if(!rows.length)rows=[b];each(rows,function(r){var s=(r.innerText||r.textContent||'').replace(/[ \t]+/g,' ').replace(/\s*\n\s*/g,' ').trim();if(s)lines.push(s);});return lines.join('\n');}
function bindFolds(root,onToggle){each(root.querySelectorAll('.fold'),function(f){if(onToggle)f._onToggle=onToggle;var b=f.querySelector('.fold-btn');if(b&&!b._bound){b._bound=1;var tap=function(e){if(e&&e.preventDefault)e.preventDefault();if(e&&e.stopPropagation)e.stopPropagation();var o=!f.classList.contains('open');foldSet(f,o);if(f._onToggle)f._onToggle(f,o);};b.onclick=tap;}
  var cp=f.querySelector('.fold-copy');if(cp&&!cp._bound){cp._bound=1;cp.onclick=function(e){if(e&&e.preventDefault)e.preventDefault();if(e&&e.stopPropagation)e.stopPropagation();var t=foldText(f);if(typeof copyText==='function')copyText(t,function(ok){toastMsg(ok?'Скопировано':'Не удалось скопировать — выделите текст вручную');});};}});}

/* ================= ГЛИФЫ: параметрические SVG-якоря памяти =================
   Принципы (Mayer: coherence/signaling/contiguity; Paivio: dual coding; Fernandes: drawing effect):
   — один глиф = одно понятие, минимум чернил, подпись внутри картинки, числа задачи — внутри картинки;
   — палитра строго из токенов темы: A синий, B оранжевый, ok/err/gold, line/muted; никаких лишних цветов;
   — геометрия несёт смысл (ширина = шум, площадь = выборка, наклон = тренд), текст — только ярлыки.
   Каждый глиф: G.name(params) → строка <svg>. */
var G={};

function ganiMark(inner){var out="",pos=0,i=0,re=/<(rect|line|circle|path|text|g)\b/g,m;while((m=re.exec(inner))){var te=inner.indexOf(">",m.index);if(te<0)break;var d=Math.min(i*70,840);out+=inner.slice(pos,m.index)+"<"+m[1]+' class="ga" style="animation-delay:'+d+'ms"'+inner.slice(m.index+m[0].length,te+1);pos=te+1;i++;}out+=inner.slice(pos);return out;}

function t(x,y,s,o){o=o||{};return '<text x="'+x+'" y="'+y+'" font-size="'+(o.fs||11)+'" fill="'+(o.c||'var(--muted)')+'"'+(o.a?' text-anchor="'+o.a+'"':'')+(o.b?' font-weight="700"':'')+(o.m?' font-family="var(--mono)"':'')+(o.i?' font-style="italic"':'')+'>'+esc(s)+'</text>';}
function ln(x1,y1,x2,y2,c,w,d){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'var(--line2)')+'" stroke-width="'+(w||1.5)+'"'+(d?' stroke-dasharray="'+d+'"':'')+' stroke-linecap="round"/>';}
function rc(x,y,w,h,c,o){o=o||{};return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+c+'" rx="'+(o.r==null?3:o.r)+'"'+(o.s?' stroke="'+o.s+'" stroke-width="1.5"':'')+(o.op!=null?' opacity="'+o.op+'"':'')+'/>';}
function ci(x,y,r,c,o){o=o||{};return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+c+'"'+(o.s?' stroke="'+o.s+'" stroke-width="1.5"':'')+(o.op!=null?' opacity="'+o.op+'"':'')+'/>';}
function path(d,c,w,fill){return '<path d="'+d+'" stroke="'+(c||'var(--line2)')+'" stroke-width="'+(w||1.5)+'" fill="'+(fill||'none')+'" stroke-linecap="round" stroke-linejoin="round"/>';}

function fmt(n){return fmtNum(n);}

/* Две группы: A и B как две колонки людей; подписи — доли. p={pa,pb,label} */
G.twoGroups=function(p){var h=136;var s='';var ya=92,x0=40,x1=200;function col(x,pct,c,lbl,soft){var hh=Math.max(6,Math.round(pct*64));s+=rc(x,ya-64,80,64,soft,{r:6});s+=rc(x,ya-hh,80,hh,c,{r:6});s+=t(x+40,ya+15,lbl,{a:'middle',b:true,c:c,fs:11});s+=t(x+40,ya-hh-6,fmtPct(pct,1),{a:'middle',m:true,c:INK,fs:12});}
  col(x0,p.pa,A,'A · контроль',ASOFT);col(x1,p.pb,B,'B · вариант',BSOFT);if(p.label){var lf=10;if(p.label.length*5>290)lf=Math.max(8,Math.floor(2900/(p.label.length*5)));s+=t(160,128,p.label,{a:'middle',fs:lf});}return svg(h,s);};

G.noiseCoins=function(p){var s='';var y=60;function coin(x,v,lbl){s+=ci(x,y,26,'var(--card2)',{s:LN});s+=t(x,y+4,fmtPct(v,1),{a:'middle',m:true,b:true,c:INK,fs:13});s+=t(x,y+44,lbl,{a:'middle'});}

G.ppVsPct=function(p){var s='';var y1=36,y2=86;var x0=30,w=260;s+=ln(x0,y1,x0+w,y1,LN,6);s+=rc(x0,y1-3,w*p.a*4,6,A,{r:3});s+=rc(x0+w*p.a*4,y1-3,w*(p.b-p.a)*4,6,B,{r:0});

/* Две колокольни: эффект против шума. p={se, diff} в п.п.; рисуем контроль и вариант, стрелка разницы. */
G.bells=function(p){var s='';var base=92;var sd=Math.max(10,Math.min(40,22));var cx=120,dx=Math.max(8,Math.min(120,p.diff/p.se*sd));

G.ci=function(p){var s='';var dot=ci;var lo=Math.min(p.lo,0,p.mde||0),hi=Math.max(p.hi,0,p.mde||0);var pad=(hi-lo)*0.2||1;lo-=pad;hi+=pad;function X(v){return 24+(v-lo)/(hi-lo)*272;}var y=56;

function calcEval(expr){var s=String(expr).replace(/[\s ]/g,'').replace(/,/g,'.').replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/sqrt/gi,'√');if(!/^[0-9.+\-*/^()%√]+$/.test(s))throw new Error('bad');var i=0;
  function num(){var m=/^\d*\.?\d+/.exec(s.slice(i));if(m){i+=m[0].length;var v=parseFloat(m[0]);if(s[i]==='%'){i++;v/=100;}return v;}if(s[i]==='('){i++;var v2=sum();if(s[i]!==')')throw new Error('paren');i++;return v2;}if(s[i]==='-'){i++;return -num();}if(s[i]==='√'){i++;var v3=num();if(v3<0)throw new Error('neg');return Math.sqrt(v3);}throw new Error('num');}
  function pow(){var a=num();while(s[i]==='^'){i++;a=Math.pow(a,num());}return a;}
  function mul(){var a=pow();while(s[i]==='*'||s[i]==='/'){var op=s[i++];var b=pow();a=op==='*'?a*b:a/b;}return a;}
  function sum(){var a=mul();while(s[i]==='+'||s[i]==='-'){var op=s[i++];var b=mul();a=op==='+'?a+b:a-b;}return a;}
  var r=sum();if(i<s.length)throw new Error('tail');if(!isFinite(r))throw new Error('inf');return r;}
function calcPlain(n){if(!isFinite(n))return '';var r=Math.round(n*1e6)/1e6;var t=String(r);if(/e/.test(t))t=r.toFixed(6);if(t.indexOf('.')>=0)t=t.replace(/0+$/,'').replace(/\.$/,'');return t;}
function fmtCalc(n){if(n==null||isNaN(n))return '—';if(!isFinite(n))return '∞';var neg=n<0;var t=calcPlain(Math.abs(n));if(t==='')t='0';var p=t.split('.');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,' ');return (neg?'−':'')+p.join(',');}
function openCalc(){var hist=S.get('calc',[]);var html='<h3>🧮 Калькулятор</h3><div class="small muted">+ − × ÷ ^ √ скобки и %. Результат округляется до 6 знаков. Тап по результату в истории подставляет его.</div><input class="numin" id="c-in" inputmode="none" autocomplete="off" placeholder="например (0.12-0.10)/0.10" style="margin:8px 0"><div class="kbd" id="c-kbd"></div><div class="res" id="c-res" style="display:none"><div class="big" id="c-val"></div></div>'+(NUM_TARGET?'<button class="btn sm wide" id="c-to" style="margin-top:8px">→ Подставить в ответ задания</button>':'')+'<div id="c-hist" style="margin-top:8px"></div>';
  sheet(html,function(sh,kill){var inp=sh.querySelector('#c-in');var keys=['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','(',')','+','^','√','%','⌫','C','='];var kb=sh.querySelector('#c-kbd');var last=null;
    keys.forEach(function(k){var b=el('<button class="'+(['÷','×','−','+','^','%','(',')','√'].indexOf(k)>=0?'op':(k==='='?'eq':(k==='⌫'||k==='C'?'fn':'')))+'">'+k+'</button>');b.onclick=function(){if(k==='C'){inp.value='';sh.querySelector('#c-res').style.display='none';return;}if(k==='⌫'){inp.value=inp.value.slice(0,-1);return;}if(k==='='){run();return;}inp.value+=(k==='√'?'√(':k);inp.focus();};kb.appendChild(b);});
    function drawHist(){sh.querySelector('#c-hist').innerHTML=hist.slice().reverse().map(function(h){return '<div class="row small" style="justify-content:space-between;margin:4px 0"><span class="muted">'+esc(h.e)+'</span><button class="btn xs ghost num" data-v="'+esc(calcPlain(h.v))+'">= '+fmtCalc(h.v)+'</button></div>';}).join('');each(sh.querySelectorAll('[data-v]'),function(b){b.onclick=function(){inp.value+=b.getAttribute('data-v');inp.focus();};});}
    function run(){try{var v=calcEval(inp.value);last=v;sh.querySelector('#c-res').style.display='';sh.querySelector('#c-val').textContent=fmtCalc(v);hist.push({e:inp.value,v:v});hist=hist.slice(-10);S.set('calc',hist);drawHist();}catch(e){inp.classList.add('shake');setTimeout(function(){inp.classList.remove('shake');},350);}}

function svgLine(pts,w,h,color,opts){opts=opts||{};if(!pts.length)return '';var xs=pts.map(function(p){return p[0];}),ys=pts.map(function(p){return p[1];});var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs),y0=opts.y0!=null?opts.y0:Math.min.apply(null,ys),y1=opts.y1!=null?opts.y1:Math.max.apply(null,ys);if(y1===y0)y1=y0+1;if(x1===x0)x1=x0+1;

function labSize(box){var st=S.get('labsize',{p:5,mde:10,alpha:5,power:80,sides:2,traffic:20000,k:2});
  box.innerHTML='<div class="lab"><h3>Размер выборки для конверсии</h3><div class="small muted">Сколько пользователей на группу (n) нужно, чтобы поймать эффект размером MDE: n ≈ 16·p(1−p)/δ² при α 5% и мощности (1 − β) 80%.</div><div class="two">'+fld('ls-p','Базовая конверсия (p), %',st.p)+fld('ls-mde','MDE (δ, относительный), %',st.mde)+'</div><div class="two">'+fld('ls-alpha','Уровень значимости α, % (ложная победа)',st.alpha)+fld('ls-power','Мощность (1 − β), %',st.power)+'</div><div class="two"><div class="fld"><label>Гипотеза</label><select id="ls-sides"><option value="2"'+(st.sides===2?' selected':'')+'>двусторонняя</option><option value="1"'+(st.sides===1?' selected':'')+'>односторонняя</option></select></div>'+fld('ls-k','Групп (k, включая контроль)',st.k)+'</div>'+fld('ls-traffic','Трафик в тест (N в день), пользователей',st.traffic)+'<button class="btn wide" id="ls-go">Посчитать</button><div id="ls-res"></div></div>';
  function run(){var p=gv('ls-p')/100,mde=gv('ls-mde')/100,alpha=gv('ls-alpha')/100,power=gv('ls-power')/100,sides=+document.getElementById('ls-sides').value,k=gv('ls-k')||2,tr=gv('ls-traffic');if(!(p>0&&p<1&&mde>0&&alpha>0&&alpha<1&&power>0&&power<1))return;

    var p2=p*(1+mde);var n=nProp(p,p2,alpha,power,sides);var total=n*k;var days=tr>0?Math.ceil(total/tr):null;var weeks=days?Math.max(1,Math.ceil(days/7)):null;
    var pts=[];for(var m=0.02;m<=0.3;m+=0.01){pts.push([m*100,nProp(p,p*(1+m),alpha,power,sides)]);}
    var r='<div class="res"><div class="k">На группу</div><div class="big">'+fmtNum(n)+'</div><div class="small muted">Всего '+fmtNum(total)+' при '+k+' '+plural(k,'группе','группах','группах')+(days?' · при '+fmtNum(tr)+'/день — <b>'+days+' '+plural(days,'день','дня','дней')+'</b>, округляй до целых недель: '+weeks+' '+plural(weeks,'неделя','недели','недель'):'')+'</div></div>';

    r+='<svg class="chart" viewBox="0 0 320 120">'+svgLine(pts,320,120,'var(--a)',{fx:function(x){return x+'% MDE';},fy:function(y){return fmtNum(y);},y0:0})+'</svg><div class="small faint">Как растёт n на группу при уменьшении MDE: выборка ∝ 1/MDE². Вдвое меньший эффект — вчетверо больше людей.</div>';
    r+='<div class="sol small">n = (z<sub>1−α/2</sub> + z<sub>1−β</sub>)² · [p₁(1−p₁) + p₂(1−p₂)] / (p₂−p₁)². Здесь z<sub>α</sub> = '+fmtNum(qnorm(1-alpha/(sides===1?1:2)))+', z<sub>β</sub> = '+fmtNum(qnorm(power))+', p₂ − p₁ = '+fmtPct(p2-p,3)+' (абсолютных).\nГрубая формула для памяти: n ≈ 16·p(1−p)/δ² при α=5%, мощности 80%.</div>';
    document.getElementById('ls-res').innerHTML=r;}
  document.getElementById('ls-go').onclick=run;run();}

function labAnalyze(box){var st=S.get('labana',{na:50000,xa:2500,nb:50000,xb:2650,mde:5});

  function run(){var na=gv('la-na'),xa=gv('la-xa'),nb=gv('la-nb'),xb=gv('la-xb'),mde=gv('la-mde')/100;if(!(na>0&&nb>0&&xa>=0&&xb>=0&&xa<=na&&xb<=nb))return;S.set('labana',{na:na,xa:xa,nb:nb,xb:xb,mde:mde*100});labUsed('analyze');

function labSrm(box){var st=S.get('labsrm',{na:50000,nb:49200,ra:50,rb:50});

function labPeek(box){var st=S.get('labpeek',{days:14,n:5000,p:5,eff:0,alpha:5,sims:400});
  box.innerHTML='<div class="lab"><h3>Симулятор подглядывания</h3><div class="small muted">Запускаем сотни A/A-тестов (истинный эффект 0 или заданный) и смотрим, как часто «побеждает» тот, кто проверяет p-value каждый день и останавливается на первом значимом, против того, кто смотрит один раз в конце.</div><div class="two">'+fld('pk-days','Дней теста',st.days)+fld('pk-n','Пользователей в день на группу (n/день)',st.n)+'</div><div class="two">'+fld('pk-p','Базовая конверсия (p), %',st.p)+fld('pk-eff','Истинный эффект (δ, относительный), %',st.eff)+'</div><div class="two">'+fld('pk-alpha','Уровень значимости α, %',st.alpha)+fld('pk-sims','Симуляций',st.sims)+'</div><button class="btn wide" id="pk-go">Запустить симуляцию</button><div id="pk-res"></div></div>';
  function run(){var days=Math.round(gv('pk-days')),n=Math.round(gv('pk-n')),p=gv('pk-p')/100,eff=gv('pk-eff')/100,alpha=gv('pk-alpha')/100,sims=Math.min(2000,Math.max(50,Math.round(gv('pk-sims'))));if(!(days>0&&n>0&&p>0&&p<1&&alpha>0&&alpha<1))return;S.set('labpeek',{days:days,n:n,p:p*100,eff:eff*100,alpha:alpha*100,sims:sims});labUsed('peek');

      for(var d=1;d<=days;d++){var a=Math.round(n*p+gaussRand()*Math.sqrt(n*p*(1-p)));var b=Math.round(n*pb+gaussRand()*Math.sqrt(n*pb*(1-pb)));ca+=Math.max(0,a);cb+=Math.max(0,b);na+=n;nb+=n;var zr=zProp(ca,na,cb,nb);var sig=Math.abs(zr.z)>zc;if(s===0)tr.push([d,zr.p]);if(sig&&!stopped){stopped=true;firstDayHits.push(d);}if(d===days)endSig=sig;}

    r+='<div class="fbk '+(eff?'ok':'bad')+'"><b>'+(eff?'С реальным эффектом обе стратегии ловят его, но подглядывающий переоценивает размер':'Без эффекта честный тест ошибается примерно в α = '+fmtPct(alpha,0)+' случаев, подглядывающий — в '+fmtPct(fpPeek,0))+'</b>'+(eff?'Остановка на первом значимом дне систематически выбирает удачный шум: оценка лифта в такой момент завышена. Это winner\'s curse в чистом виде.':'Каждая дополнительная проверка — ещё один шанс поймать случайный выброс. '+days+' проверок при α='+fmtPct(alpha,0)+' дают ложную победу примерно в '+fmtPct(fpPeek,0)+' экспериментов. Лечится либо фиксированным горизонтом, либо последовательными методами с поправленными границами.')+'</div>';
    if(traj)r+='<svg class="chart" viewBox="0 0 320 120">'+svgLine(traj,320,120,'var(--a)',{y0:0,y1:1,hline:alpha,fx:function(x){return 'день '+x;},fy:function(y){return 'p='+fmtNum(y);}})+'</svg><div class="small faint">Траектория p-value одного случайного теста по дням; пунктир — порог α. Оно гуляет, иногда ныряет под порог и выныривает обратно.</div>';
    if(firstDayHits.length){var cnt={};firstDayHits.forEach(function(d2){cnt[d2]=(cnt[d2]||0)+1;});var pts=[];for(var d3=1;d3<=days;d3++)pts.push([d3,(cnt[d3]||0)/sims*100]);r+='<svg class="chart" viewBox="0 0 320 100">'+svgLine(pts,320,100,'var(--b)',{y0:0,fx:function(x){return 'день '+x;},fy:function(y){return fmtNum(y)+'%';}})+'</svg><div class="small faint">В какой день подглядывающий впервые видел «значимость» (% симуляций). Ранние дни особенно коварны: выборка мала, шум велик.</div>';}
    document.getElementById('pk-res').innerHTML=r;}
  document.getElementById('pk-go').onclick=run;}

/* ================= ПЕРЕДАЧА ПРОГРЕССА: ЯДРО → БУКВЫ → QR ================= */
/* Ядро: res best (2 бита на вопрос по фиксированному порядку ALL_ITEMS), units done, certs, bosses best, etudes/num/audit best, lex уровни, arts best, xp, streak, badges, exam. Кодируется битами, RLE, затем base-52 (латиница без цифр и знаков — камера iOS не примет за ссылку/телефон). */
var XF_ITEM_ORDER=null;
function xfItems(){if(XF_ITEM_ORDER)return XF_ITEM_ORDER;var ids=[];for(var k in ALL_ITEMS)if(has(ALL_ITEMS,k))ids.push(k);ids.sort();XF_ITEM_ORDER=ids;return ids;}
function xfList(arr,key){return arr.map(function(x){return x[key||'id'];}).sort();}
function BitW(){this.bits=[];}
BitW.prototype.w=function(v,n){for(var i=n-1;i>=0;i--)this.bits.push((v>>i)&1);};
BitW.prototype.bytes=function(){var o=[];for(var i=0;i<this.bits.length;i+=8){var b=0;for(var j=0;j<8;j++)b=(b<<1)|(this.bits[i+j]||0);o.push(b);}return o;};
function BitR(bytes){this.b=bytes;this.p=0;}
BitR.prototype.r=function(n){var v=0;for(var i=0;i<n;i++){var bit=(this.b[this.p>>3]>>(7-(this.p&7)))&1;v=(v<<1)|bit;this.p++;}return v;};
function q4(x){return x>=0.999?3:(x>=0.5?2:(x>0?1:0));}
function unq4(v){return [0,0.25,0.5,1][v];}
function xfBuild(){var w=new BitW();w.w(1,8);/* версия ядра */
  var res=S.get('res',{});var items=xfItems();w.w(items.length,16);items.forEach(function(id){w.w(q4((res[id]||{}).best||0),2);});
  var un=S.get('units',{});var us=xfList(D.UNITS);w.w(us.length,8);us.forEach(function(id){var u=un[id];w.w(u?1:0,1);if(u)w.w(Math.round(Math.min(1,u.acc)*15),4);});
  var certs=S.get('certs',{});D.LEVELS.forEach(function(L){w.w(Math.round(Math.min(1,certs[L.id]||0)*15),4);});
  function bests(key,list){var st=S.get(key,{});var ids=xfList(list);w.w(ids.length,8);ids.forEach(function(id){w.w(Math.round(Math.min(1,(st[id]||{}).best||0)*15),4);});}
  bests('bosses',D.BOSSES||[]);bests('etudes',D.ETUDES||[]);bests('num',D.NUM||[]);bests('audit',D.AUDITS||[]);bests('arts',D.ARTIFACTS||[]);
  var lex=S.get('lex',{});var ts=xfList(D.TERMS||[],'name');w.w(ts.length,8);ts.forEach(function(n){w.w(Math.min(3,lex[n]||0),2);});
  w.w(Math.min(totalXp(),1048575),20);w.w(Math.min(streakCount(),255),8);
  var bd=badges();w.w(BADGES.length,5);BADGES.forEach(function(b){w.w(bd.indexOf(b.id)>=0?1:0,1);});
  var ex=S.get('exam',{});w.w(Math.round(Math.min(1,ex.best||0)*15),4);
  var lab=S.get('lab',{});['size','analyze','srm','peek','cuped'].forEach(function(k){w.w(lab[k]?1:0,1);});
  return w.bytes();}
function xfApply(bytes){var r=new BitR(bytes);var ver=r.r(8);if(ver!==1)throw new Error('ver');
  var n=r.r(16);var items=xfItems();if(n!==items.length)throw new Error('items');var res={};items.forEach(function(id){var v=r.r(2);if(v)res[id]={best:unq4(v),n:1,last:unq4(v)};});
  var nu=r.r(8);var us=xfList(D.UNITS);if(nu!==us.length)throw new Error('units');var un={};us.forEach(function(id){if(r.r(1))un[id]={acc:r.r(4)/15,n:1,last:Date.now()};});
  var certs={};D.LEVELS.forEach(function(L){var v=r.r(4);if(v)certs[L.id]=v/15;});
  function bests(list){var ids=xfList(list);var k=r.r(8);if(k!==ids.length)throw new Error('list');var o={};ids.forEach(function(id){var v=r.r(4);if(v)o[id]={best:v/15,n:1};});return o;}
  var bosses=bests(D.BOSSES||[]),etudes=bests(D.ETUDES||[]),num=bests(D.NUM||[]),audit=bests(D.AUDITS||[]),arts=bests(D.ARTIFACTS||[]);
  for(var k in arts)if(has(arts,k))arts[k].versions=[];
  var nt=r.r(8);var ts=xfList(D.TERMS||[],'name');if(nt!==ts.length)throw new Error('terms');var lex={};ts.forEach(function(nm){var v=r.r(2);if(v)lex[nm]=v;});

function auditScore(a){var hit=0,fp=0;a.defects.forEach(function(d){if(AUD.flags[d.id])hit++;});a.decoys.forEach(function(d){if(AUD.flags[d.id])fp++;});var vOk=AUD.verdict===a.verdict;
  var nd=a.defects.length;var fpart=nd?Math.max(0,(hit-fp*0.5)/nd):(fp?0:1);var score=0.7*fpart+0.3*(vOk?1:0);if(hit===nd&&!fp&&vOk)score=1;return {hit:hit,fp:fp,vOk:vOk,score:score};}
