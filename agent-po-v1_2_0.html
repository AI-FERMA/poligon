формата — другой класс дефекта, его ловит валидатор схемы."},{"t":"Команда борется с галлюцинациями, добавляя в промпт «отвечай только правду и не выдумывай»","why":"Промпт не даёт модели фактов; нужны RAG с цитатами, «не знаю» и числа из инструментов."}]},"simple":"Модель говорит уверенно то, чего нет в источниках.","remember":"Снижаем источниками и валидаторами; на цифрах — ноль через инструменты.","sym":"HR","legend":[["HR","доля ответов с неподтверждёнными фактами"]],"rdef":"Уверенное утверждение модели, не подтверждённое источниками или фактами: выдуманный тариф или дата."},{"name":"Системный промпт","level":"L0","def":"Инструкция модели, задающая роль, правила, формат, границы и стиль; действует на весь диалог; версионируется и тестируется как код.","when":"Проектирование поведения агента; каждое изменение — релиз через eval gate.","ex":"«Ты ассистент банка. Отвечай только по фрагментам, цитируй id. Если нет источника — скажи и предложи оператора. Не давай инвестиционных советов». Важно: Промпт — не граница безопасности: инъекции его обходят.","near":[{"t":"Инструкция модели, задающая роль, правила, формат и границы; действует на весь диалог и служит основной границей безопасности агента.","why":"Промпт — спецификация поведения, но не граница безопасности: инъекции его обходят."},{"t":"Сообщение клиента в начале диалога, задающее тему, формат и стиль ответа; действует до следующего сообщения и не версионируется.","why":"Это пользовательский промпт — данные, а не инструкция; системный пишет команда и версионирует как код."}],"nb":[{"t":"Guardrails","d":"Защитный контур вокруг модели: входные и выходные фильтры инъекций, PII, тематики; отдельные сервисы с тестами.","why":"Guard — сервис вне модели; промпт — текст внутри вызова."},{"t":"Structured output","d":"Ответ модели в заданной схеме (JSON Schema): поля, типы, перечисления — чтобы код мог надёжно разобрать результат.","why":"Схема описывает форму ответа; промпт — поведение в целом."}],"apps":{"ok":"Изменение промпта проходит ревью, прогон golden set и релиз под флагом — как изменение кода.","okWhy":"Промпт меняет 100% диалогов и версионируется как код.","bad":[{"t":"Правила безопасности агента хранятся только в системном промпте","why":"Промпт — не граница безопасности; защита — технические слои с тестами."},{"t":"После инцидента команда дописывает в промпт очередной абзац правил; промпт вырос до 4 000 токенов, зато покрывает все случаи.","why":"Правила-заплатки дороги, конфликтуют и не защищают; их место — в guard и валидаторах."},{"t":"Продакт правит промпт в проде за минуту без прогона тестов, потому что «это же просто текст», и откатить можно так же быстро.","why":"Текст меняет поведение сильнее кода — нужен eval gate."}]},"simple":"Должностная инструкция агента, написанная один раз для всех разговоров.","remember":"Версионировать, тестировать, не считать защитой.","sym":"sys","legend":[["sys","роль + правила + формат + границы"]],"rdef":"Инструкция модели, задающая роль, правила, формат, границы и стиль; действует на весь диалог."},{"name":"Structured output","level":"L0","def":"Ответ модели в заданной схеме (JSON Schema): поля, типы, перечисления — чтобы код мог надёжно разобрать результат.","when":"Извлечение параметров, классификация, вызов инструментов, числа и даты.","ex":"{\"intent\": \"dispute\", \"amount\": 1200, \"date\": \"2026-03-04\", \"confidence\": 0.82} Важно: Схему валидируют на стороне кода; невалидный ответ — ретрай или fallback.","near":[{"t":"Ответ модели в заданной схеме (JSON Schema), который модель сама валидирует и исправляет, поэтому код может доверять ему без проверки.","why":"Схему валидируют на стороне кода; невалидный ответ — ретрай или fallback."},{"t":"Ответ модели в оформленном виде: заголовки, списки и таблицы Markdown, чтобы человеку было удобно читать результат в чате.","why":"Markdown — для человека; structured output — для кода, который читает поля по схеме."}],"nb":[{"t":"Function calling / tool use","d":"Механизм, при котором модель возвращает структурированный вызов функции (имя + аргументы), а код исполняет его.","why":"Вызов функции — частный случай структурированного ответа, предназначенный для действия."},{"t":"Системный промпт","d":"Инструкция модели, задающая роль, правила, формат, границы и стиль; действует на весь диалог.","why":"Промпт задаёт поведение, схема — форму ответа."}],"apps":{"ok":"Классификатор интента возвращает JSON по схеме {intent, amount, confidence}, который валидирует код.","okWhy":"Всё, что читает код, — через схему с валидацией.","bad":[{"t":"Оркестратор разбирает свободный текст ответа регулярными выражениями","why":"Хрупко; для кода — JSON-схема."},{"t":"Команда просит модель отвечать клиенту строгим JSON, чтобы ответы были «структурированными», точными и одинаково оформленными.","why":"Клиенту нужен текст; схема — для кода, а не для человека."},{"t":"Невалидный JSON от модели отправляется в систему банка как есть","why":"Валидация — на стороне кода; невалидный ответ — ретрай или fallback."}]},"simple":"Модель заполняет анкету с полями, а не пишет сочинение.","remember":"Если результат читает код — только схема.","sym":"JSON","legend":[["schema","поля, типы, обязательность"]],"rdef":"Ответ модели в заданной схеме (JSON Schema): поля, типы, перечисления — чтобы код разобрал результат."},{"name":"Function calling / tool use","level":"L0","def":"Механизм, при котором модель возвращает структурированный вызов функции (имя + аргументы), а код исполняет его и возвращает результат модели.","when":"Любой доступ агента к данным и действиям: баланс, история, поиск, перевод.","ex":"Модель: call get_transactions(days=7) → код → JSON с операциями → модель формулирует ответ. Важно: Модель предлагает вызов, код решает, исполнять ли: права, allow-list, подтверждение.","near":[{"t":"Механизм, при котором модель напрямую обращается к API банка по описанию инструмента, получает ответ и сама решает, исполнять ли действие.","why":"Модель только предлагает вызов; исполняет и проверяет права код оркестратора."},{"t":"Механизм, при котором код заранее вызывает нужные функции и кладёт их результаты в промпт, а модель лишь формулирует ответ по данным.","why":"Это предзагрузка контекста (workflow-узел), а не выбор вызова моделью."}],"nb":[{"t":"Агент","d":"LLM в цикле: получает цель, выбирает инструмент, наблюдает результат, повторяет до достижения цели или лимита.","why":"Агент — цикл из многих вызовов; function calling — один шаг этого цикла."},{"t":"Structured output","d":"Ответ модели в заданной схеме (JSON Schema): поля, типы, перечисления — чтобы код мог надёжно разобрать результат.","why":"Вызов функции — структурированный ответ особого назначения."}],"apps":{"ok":"Модель возвращает call get_transactions(days=7); оркестратор проверяет права и исполняет вызов.","okWhy":"Модель предлагает, код проверяет и исполняет.","bad":[{"t":"Инженер даёт модели прямой доступ к API банка по описанию инструментов без слоя проверки прав","why":"Нет прав, allow-list, идемпотентности и подтверждения — утечка и дубли."},{"t":"Продакт называет function calling «агентом» и обещает заказчику, что ассистент сам доведёт любую задачу клиента до конца.","why":"Вызов инструмента — один шаг; агент — цикл с состоянием и ограничителями."},{"t":"Чтобы модель точнее выбирала инструмент, команда добавляет в описание каждого по две страницы документации API с примерами.","why":"Длинные описания съедают контекст; точность дают короткие и точные описания."}]},"simple":"Модель не нажимает кнопки сама — она говорит коду, какую кнопку нажать.","remember":"Модель предлагает, код исполняет и проверяет.","sym":"fn","legend":[["fn(args)","имя + аргументы по схеме"]],"rdef":"Механизм, при котором модель возвращает структурированный вызов функции, а код исполняет его и возвращает результат."}],"BOSSES":[],"ETUDES":[],"NUM":[],"ARTIFACTS":[],"CHEAT":[{"title":"Расписание: 10 часов (5 + 5)","lines":["День 1 (5 ч) — техника. 0:00–0:20 Диагностика на входе + L0 юнит 1. 0:20–1:00 L0 юнит 2 + лаборатория «Экономика диалога». 1:00–2:20 L1: цикл агента, RAG, интеграция (три юнита) + босс «Проектирование агента». 2:20–2:30 перерыв. 2:30–3:30 L2: evals и безопасность + босс «Инцидент: инъекция». 3:30–4:30 L3: латентность и экономика + лаборатории «Бюджет латентности», «SLO и GPU» + босс «p95 = 10 с». 4:30–5:00 Аудит «Архитектурное ревью» + шпаргалка «Архитектура на салфетке» вслух.","День 2 (5 ч) — продукт и управление. 0:00–1:00 L4: CJM, метрики + босс «Containment против CSAT». 1:00–2:30 L5: видение/ADR/план, команда, релизы + артефакты «Техническое видение», «Квартальный план». 2:30–2:40 перерыв. 2:40–3:40 L6: ожидания, стратегия + боссы «Демо-эффект», «Смена модели». 3:40–4:20 Этюды (все 5) + «Цифры на пальцах» (4). 4:20–5:00 Мок-интервью (экзамен) + шпаргалка «Банк вопросов» — ответить вслух на 10 случайных.","Если времени меньше: обязательный минимум — L1 полностью, L2 юнит 1, L3 юнит 1, L4 юнит 2, L5 юнит 1, босс «Проектирование агента», шпаргалки «Архитектура на салфетке» и «System design за 45 минут».","Перед собеседованием (30 минут): перечитать «Архитектура на салфетке», «Метрики за 60 секунд», «Фразы для заказчика»; нарисовать схему от руки за 5 минут; проговорить ответ на «расскажите о своём ИИ-продукте» по структуре проблема → решение → метрики → что бы сделали иначе."]},{"title":"DeepSeek Harness на салфетке (dsh · developer preview, MIT, 13.08.2026)","lines":["Тезис: «everything is a plugin» на Cordis — адаптер модели, реестр инструментов, лог сессии, цикл агента заменяемы; «нет привилегированного ядра». Agent = Model + Harness.","Cordis: плагин { name, inject, Config, apply(ctx) } · сервисы ctx.* (tools, llm, agents, sessions, systemPrompt, agentLoop, fs, shell, subprocess, sandbox, approval, skills, subagents, workflowEngine, ptcRuntime, web, lsp, jobs, storage, credentials, sessionTelemetry) · события emit / waterfall(next) / parallel / serial / bail · эффекты с disposer.","Слои: profile ($DSH_HOME/profiles/<name>: package.json dsh.profile.bundles + cordis.patch.yml) → бандлы (dsh-base; web-app / headless / sdk-app / acp-app; sdk-minimal без base) → домашний патч → --patch. Проверка: dsh --profile web --dump-config.","Команды: npx @deepseek-ai/dsh web (127.0.0.1:3080, --no-open) · dsh --profile headless \"задача\" · dsh plugin --profile web add @scope/pkg@x.y.z · --port 8080 · /plan, /compact. Python: pip install deepseek-harness-sdk → DeepSeekHarness(provider, model, cwd, dsh_home, profile='sdk-minimal').run(prompt, session_id).","Пресеты: Standard (файлы, shell, поиск, skills, план, цели, субагенты, workflows) · PTC (run_code против SDK, те же политики; прямой вызов → UNKNOWN_TOOL) · Minimal (bash + str_replace_editor, для бенчмарков) · Creator (инспекция runtime).","Шаг: turn/start → agent/pre-step (reject|enter; pressure-компакция) → step/start → agent/request → system/user message → llm/stream → assistant/message | attempt → tool/call → tools/pre-execute (allow|deny|cancel|ask) → guards (deny) → execute → post-execute (accept|block) → tool/result → step/end → agent/turn-stopping → turn/end.","Лог: append-only session.vN.jsonl[.zstd]; model-visible means logged; resume/fork/replay/eval; approval/* и plan/mode только в лог. По умолчанию session-log-deepseek выгружает события в DeepSeek (до 8 MiB) → enabled: false.","Approvals: allowed-once | rejected | cancelled | unavailable; политики ask (default) и never (CI). Permission presets: workspace-write / danger-full-access → permission/preset. Песочница: read-only / workspace-write / danger-full-access — только файлы; bwrap > Landlock (partial old ABI) > Seatbelt > Windows ACL (partial); сеть — периметром.","Контекст: компакция pressure/overflow → pruning head/middle/tail → summary (llm) → user/message replace; пары tool-call/result сохраняются. Skills: <name>/SKILL.md по рангам 100–600, <available_skills>, skill({name}). Workflows: agent()/parallel()/pipeline(), dispose(). Субагенты: spawn/fork/внешние (Codex, Claude Code, ACP, dsh-sdk), send_message соседям, maxDepth.","Статус: v0.2.1-alpha (окт. 2026), ломающие изменения (Code→PTC, убраны runtime invariant plugins), без аудита (SAFETY.md), PR не принимаются → форк, пиннинг, плагины (topic dsh-plugin). Критика: звёзды ≠ эксплуатация; замена core-плагинов требует downstream-патчей."]},{"title":"Банк вопросов по harness и dsh (ответить вслух)","lines":["Что такое harness и почему Agent = Model + Harness? Из каких слотов он состоит? Какие принципы harness engineering (сбой → правило, ~10 инструментов, генератор ≠ оценщик, успех молчит)?","Чем dsh отличается от Claude Code, Codex, OpenCode? Что значит «нет привилегированного ядра»? Что такое Cordis и пять его идей? Что такое seam и приведите три примера с провайдерами.","Как собирается конфигурация dsh (слои)? Как проверить, какой слой дал строку? Как подключить on-prem модель банка? Чем отличаются профили web / headless / sdk / sdk-minimal / acp?","Опишите шаг агента в dsh по событиям. Где ставить банковскую политику инструментов и почему не в промпте? Что такое guard и почему его отказ нельзя отменить? Чем ask отличается от never? Что такое allowed-once?","Что уходит наружу при настройках по умолчанию и как это закрыть? Что ограничивает workspace-write, а что — нет? Почему MCP off по умолчанию? Что такое enforcement partial и что с ним делать?","Как работает компакция и что она гарантирует? Что такое PTC и чем он лучше/опаснее нативных вызовов? Как skills попадают в промпт? Чем spawn отличается от fork и почему внешние субагенты без follow-up?","Как вы бы внедряли dsh в банке за 8 недель? Какие метрики harness покажете CTO? Как управлять обновлениями preview с ломающими изменениями? Какой план Б и триггер пересмотра?","Как развивать технологию: какие seams экспериментальные (agentTeams, browserUse, computerUse, worktrees, speech), что вынести в плагины для сообщества, как строить eval на логах сессий?"]},{"title":"Архитектура агента на салфетке (C4 уровня контейнеров)","lines":["Слева направо: Каналы (приложение, веб, кол-центр) → API-gateway (аутентификация, rate limit, trace id) → Входной guard (инъекции, тематика, PII-маскирование) → Оркестратор агента (состояние, цикл, allow-list, max steps, чекпоинты) → LLM-сервис (маршрутизатор: on-prem для ПДн / внешний API без ПДн; версии в реестре) + Поиск (векторный + BM25 → RRF → reranker, фильтр прав до поиска) → Адаптеры инструментов (авторизация сессией, идемпотентные ключи, тайм-ауты) → Системы банка (АБС, CRM, антифрод) → Выходной guard (PII, финсоветы, валидатор цитат) → Канал.","Сбоку: реестр промптов/моделей/баз (release = набор версий), трассы и логи (маскированные), метрики и дашборд, eval-платформа (golden set, судья, red-team), feature flags.","Данные: векторная БД (чанки), PostgreSQL (метаданные, права, версии), Redis (сессии, кэш), ClickHouse (трассы, метрики), объектное хранилище (документы). Данные клиента — через API систем, не копией.","Проговорить NFR вслух: p95 ≤ 5 с (TTFT ≤ 1,5 с, streaming), доступность 99,5%, стоимость ≤ 12 ₽/диалог, hallucination < 2% и 0 на суммах, red-team 0 успехов на критических, откат ≤ 2 мин.","Принципы: ПДн не покидают контур; агентность на чтении, запись — подтверждение + ключ; промпт — не граница безопасности; релиз поведения — через eval gate; цифры — из систем."]},{"title":"System design ИИ-агента за 45 минут (сценарий ответа)","lines":["0–5 мин. Уточнить: задача клиента и канал; объём (RPS, диалогов/мес); данные (ПДн? какие системы); действия (чтение/запись); ограничения (on-prem? латентность? бюджет); как меряем успех. Назвать 2–3 допущения вслух.","5–10 мин. Сценарий и границы: 1–2 интента, что делает агент, где эскалация, не-цели. North Star с условием качества (решённые задачи при CSAT ≥ оператора).","10–25 мин. Схема (см. «салфетку»): рисовать слева направо, называя для каждой коробки, зачем она и какой у неё риск. Отдельно: workflow vs агент (решение по сценарию), RAG-конвейер, HITL и идемпотентность, размещение модели.","25–33 мин. Качество и безопасность: пирамида eval (CI → golden + судья → онлайн), eval gate с критическими кейсами, red-team, guard-слои, hallucination-контроль.","33–40 мин. NFR и экономика: бюджет латентности по компонентам, ёмкость GPU формулой, SLO и error budget, стоимость диалога и рычаги (кэш, top-k, каскад).","40–45 мин. План: зависимости первыми (API, ИБ), вехи с критериями, ОПЭ → ПРОМ, команда и роли, риски с триггерами. Закончить: «что бы я проверил первым и что отложил»."]},{"title":"Метрики ИИ-продукта за 60 секунд","lines":["North Star: решённые задачи без оператора при CSAT не ниже оператора. Containment только в паре с task success.","Драйверы: containment (30–50% в первый год), task success (> 80%; прокси — нет повторного обращения 7 дней + разметка выборки + «помогло?»), эскалации по причинам, повторные обращения (< 15%), время до решения.","Качество модели: hallucination rate (< 2%, 0 на суммах), faithfulness (≥ 95%), recall@5 (≥ 90%), точность интента, балл судьи (калибровка ≥ 85%), «не знаю» rate.","Ограничители (guardrail): жалобы «неверный ответ», эскалации по гневу, обрывы, hallucination, p95, стоимость — рост главной не засчитывается за порогом.","Техника: p95 ≤ 5 с, TTFT ≤ 1,5 с, доступность 99,5%, ошибки инструментов, стоимость диалога (≈ 10 ₽), ёмкость/очередь.","Бизнес: экономия = N × containment × task success × стоимость обращения − затраты; конверсия; отток. Ритуал: еженедельно 20 диалогов глазами; проверка, что офлайн предсказывает онлайн."]},{"title":"Формулы, которые надо уметь считать на доске","lines":["Стоимость диалога = Σ ходов (tok_in × p_in + tok_out × p_out) + поиск + guard + инфра. Пример: 17k × 0,5/1k + 0,8k × 1,5/1k + 1 = 10,7 ₽. Входные — 80%.","Латентность ≈ guard + RAG + инструменты (параллельно) + TTFT + токены/скорость. 240 ток / 40 ток/с = 6 с → ограничить ответ, streaming.","Узлы GPU = ⌈RPS × ток/ответ ÷ ток/с_узла × (1 + запас)⌉. 20 × 250 ÷ 1 500 × 1,4 = 4,7 → 5.","Error budget = (1 − SLO) × окно. 99,5% × 30 дней = 216 мин. Сгорел — freeze.","recall@k = вопросы с нужным чанком в top-k / все вопросы. 348/400 = 87%. faithfulness = подтверждённые утверждения / все.","Согласие судьи = совпадения с людьми / размеченные. 172/200 = 86% ≥ 85%.","Экономия/мес = N × containment × task success × c_оператора − N × cost_диалог − команда. 300k × 0,4 × 0,85 × 150 − 3 млн − 4 млн = 8,3 млн ₽.","Приоритет сценария ≈ объём × стоимость обращения × достижимый containment ÷ (риск × усилие). RICE = reach × impact × confidence ÷ effort."]},{"title":"Чек-лист релиза поведения агента","lines":["Что меняется: код / промпт / модель (включая обновление вендора) / база знаний / пороги — всё это релиз.","CI: формат, схема, запреты, инструменты. Eval gate: golden set ≥ 200, балл ≥ base − 1 п.п., критические кейсы 0, red-team 0 на критических, p95 и стоимость в бюджете; пороги в конфиге.","Shadow 2–3 дня на живом трафике без показа; парное сравнение судьёй с перестановкой позиций.","Канарейка 1–5%, 3–7 дней, guardrail-метрики с автооткатом. A/B — если нужна статистическая уверенность в бизнес-эффекте.","Rollout по каналам: веб/сотрудники → приложение. Логика агента — на сервере (откат без ревью магазина).","Откат: feature flag, release = набор версий, runbook, MTTR ≤ 2 мин, учения раз в квартал. Паспорт релиза с подписями TPO, ИБ, владельца сценария.","Метрики процесса: откаты < 10%, MTTD/MTTR минуты, 100% релизов через gate, lead time — дни."]},{"title":"Фразы для управления ожиданиями заказчика","lines":["После демо: «Это пять лучших из двадцати. На выборке из логов — 78%, цель к запуску — 85% на двух сценариях. Когда агент не уверен — переводит оператору с резюме».","На «он ошибся — выключайте»: «Вот трасса: не нашёл документ. За неделю на 200 диалогах — 81%, растёт. Мы договаривались, что ошибки измеряются и снижаются, а не что их не будет».","На «запустите на месяц раньше»: «Можем раньше с меньшим объёмом: один сценарий, без действий с записью. Проверки качества и допуск ИБ не сокращаются — их цена — доверие клиентов и регулятор. Вот три варианта с ценой, рекомендую второй».","На «а кредиты и ипотеку заодно»: «Новый домен — новый набор из логов, владелец базы знаний, инструменты API. На платформе это 6–8 недель после первого ПРОМ, а не неделя».","На «сколько экономим»: «Экономия считается от решённых задач: 300 тысяч × 40% × 85% × 150 ₽ минус затраты — около 8 миллионов в месяц; каждые 5 пунктов качества — почти миллион».","Структура сложного разговора: факт → влияние → варианты с ценой → рекомендация → решение заказчика; письменно в Confluence, включая то, что не делаем."]},{"title":"Банк вопросов собеседования TPO (ответить вслух)","lines":["Архитектура: Спроектируйте агента для споров по операциям. Чем агент отличается от workflow и когда что? Как устроен RAG и как вы меряете его качество? Где хранятся данные агента и почему? On-prem или API — критерии? Как агент выполняет действие от имени клиента безопасно? Зачем идемпотентный ключ? Нарисуйте C4.","Качество: Как поймёте, что новая версия лучше? Что такое golden set и откуда он? Как калибруете LLM-судью? Что в eval gate? Как боретесь с галлюцинациями? Что такое prompt injection и как защищаетесь? Почему промпт — не граница безопасности?","Производительность и экономика: Из чего складывается латентность и как уложить p95 в 5 с? Зачем streaming? Что такое SLO и error budget? Сколько GPU на 30 RPS? Сколько стоит диалог и как снизить вдвое? Когда каскад моделей? Как выбираете модель?","Продукт: Как выбрали первый сценарий? Покажите CJM. Какие метрики на дашборде и какая главная? Почему containment — ловушка? Как мерите task success? Какие исследования делали до разработки? Какие тренды ГенИИ влияют на ваш план?","План и команда: Как выглядит ваш roadmap и как оценивали ресурсы? Что такое ADR и приведите пример. Как ставите ML-задачи в спринт? Кто в команде и кого не хватает чаще всего? Что в DoD? Как приоритизируете? Как релизите в мобильное приложение?","Стейкхолдеры и стратегия: Заказчик после демо хочет всё через две недели — ваши действия? Как объясняете ошибки агента? Чем торгуетесь при сжатии сроков? Что в стратегии на 3 квартала? Build/buy/partner по слоям? Какие OKR? Чего не делаете и почему?","О вас: Расскажите о своём ИИ-продукте: проблема → решение → метрики → что сделали бы иначе. Самая большая ошибка в ИИ-проекте и урок. Как используете LLM в своей работе (спеки, анализ логов, разметка, черновики ADR)."]},{"title":"Словарь за 2 минуты","lines":["Токен, контекстное окно, температура, системный промпт, structured output, function calling — слой L0.","Агент vs workflow, HITL, идемпотентность, RAG, чанк, эмбеддинг, гибрид + reranker, recall@k, faithfulness, ОПЭ/ПРОМ, C4 — слой L1.","Golden set, LLM-as-judge, eval gate, prompt injection, guardrails, red-team, PII/ПДн — слой L2.","p95, TTFT/streaming, SLO/error budget, каскад, стоимость диалога — слой L3.","CJM, containment, task success, guardrail-метрика — слой L4. ADR, веха, spike, DoD, канарейка/shadow, feature flag — слой L5. Контракт качества, OKR, build/buy/partner, платформа агентов — слой L6."]}],"DIAG":[{"mechanic":"single","points":1,"stem":"Что такое контекстное окно модели?","options":[{"id":"o0","text":"Максимум токенов, которые модель видит за один вызов","correct":true,"rationale":"Бюджет внимания и денег."},{"id":"o1","text":"Память модели между разговорами, где она хранит контекст клиента и прошлые обращения","correct":false,"rationale":"Между вызовами модель ничего не помнит."},{"id":"o2","text":"Число параметров модели, определяющее, сколько знаний она может удержать","correct":false,"rationale":"Другая характеристика."},{"id":"o3","text":"Размер базы знаний, к которой модель может обращаться при генерации ответа","correct":false,"rationale":"База живёт вне окна."}],"id":"d1","level":"L0"},{"mechanic":"single","points":1,"stem":"Если результат модели читает код, как его запрашивать?","options":[{"id":"o0","text":"Structured output по JSON-схеме с валидацией","correct":true,"rationale":"Надёжно разбирается."},{"id":"o1","text":"Свободным текстом с последующим разбором регулярными выражениями на стороне сервиса","correct":false,"rationale":"Хрупко."},{"id":"o2","text":"Markdown-таблицей с фиксированными колонками, которую парсер превращает в объект","correct":false,"rationale":"Для человека."},{"id":"o3","text":"Текстом с ключевыми словами-маркерами, по которым код находит нужные значения","correct":false,"rationale":"Не для кода."}],"id":"d2","level":"L0"},{"mechanic":"single","points":1,"stem":"Когда вместо агента лучше workflow?","options":[{"id":"o0","text":"Мало путей и необратимые действия — деньги, закрытие продукта","correct":true,"rationale":"Детерминизм на записи."},{"id":"o1","text":"Всегда: агенты в банке запрещены политикой ИБ","correct":false,"rationale":"Крайность."},{"id":"o2","text":"Когда модель маленькая и не справляется с планированием многошаговых задач","correct":false,"rationale":"Размер не критерий."},{"id":"o3","text":"Никогда: агент универсальнее и покрывает длинный хвост запросов без доработки кода","correct":false,"rationale":"Свобода — риск на деньгах."}],"id":"d3","level":"L1"},{"mechanic":"single","points":1,"stem":"Ответы плохие, recall@5 = 60%. Что чинить первым?","options":[{"id":"o0","text":"Поиск: чанкинг, гибрид, фильтры","correct":true,"rationale":"Модели нечего читать."},{"id":"o1","text":"Промпт: добавить требование опираться на документы и примеры хороших ответов","correct":false,"rationale":"Не вернёт фрагменты."},{"id":"o2","text":"Температуру: снизить до нуля","correct":false,"rationale":"Не про поиск."},{"id":"o3","text":"Размер модели: более крупная лучше понимает найденные фрагменты","correct":false,"rationale":"Галлюцинирует увереннее."}],"id":"d4","level":"L1"},{"mechanic":"single","points":1,"stem":"Зачем идемпотентный ключ на вызов перевода?","options":[{"id":"o0","text":"Повтор после таймаута не создаст второй перевод","correct":true,"rationale":"Сеть ненадёжна."},{"id":"o1","text":"Чтобы шифровать реквизиты клиента в запросе к системе банка уникальным ключом","correct":false,"rationale":"Не про это."},{"id":"o2","text":"Чтобы ускорить ответ: сервер узнаёт запрос по ключу и не проверяет права повторно","correct":false,"rationale":"Нет."},{"id":"o3","text":"Чтобы модель могла отменить операцию по ключу","correct":false,"rationale":"Отмена — другой процесс."}],"id":"d5","level":"L1"},{"mechanic":"single","points":1,"stem":"Судья даёт 4,4 против 4,1. Чего не хватает, чтобы верить?","options":[{"id":"o0","text":"Согласия судьи с людьми и интервала","correct":true,"rationale":"Калибровка — лицензия судьи."},{"id":"o1","text":"Названия модели-судьи и версии её промпта для воспроизводимости","correct":false,"rationale":"Не решает."},{"id":"o2","text":"Мнения заказчика о примерах, где версии разошлись сильнее всего","correct":false,"rationale":"Впечатление."},{"id":"o3","text":"Стоимости прогона и его длительности для оценки окупаемости","correct":false,"rationale":"Не про валидность."}],"id":"d6","level":"L2"},{"mechanic":"single","points":1,"stem":"Почему промпт — не граница безопасности?","options":[{"id":"o0","text":"Модель исполняет инструкции вероятностно; граница — технические права и фильтры","correct":true,"rationale":"Любой промпт обходится."},{"id":"o1","text":"Промпт дорогой: правила безопасности занимают тысячи токенов на каждом ходе диалога","correct":false,"rationale":"Нет."},{"id":"o2","text":"Промпт виден клиенту при утечке, и злоумышленник узнаёт, что именно запрещено","correct":false,"rationale":"Не причина."},{"id":"o3","text":"Это неверно: хороший промпт с примерами атак защищает, вопрос только в качестве текста","correct":false,"rationale":"Не существует такого промпта."}],"id":"d7","level":"L2"},{"mechanic":"single","points":1,"stem":"Почему SLO формулируют через p95, а не среднее?","options":[{"id":"o0","text":"Среднее скрывает хвост, который клиенты помнят","correct":true,"rationale":"p95 — худший обычный опыт."},{"id":"o1","text":"p95 проще считать на потоке событий и дешевле хранить в системе мониторинга","correct":false,"rationale":"Сложнее."},{"id":"o2","text":"Регулятор требует перцентили для систем, взаимодействующих с клиентами банка","correct":false,"rationale":"Нет."},{"id":"o3","text":"Среднее нельзя корректно посчитать для LLM из-за разной длины ответов","correct":false,"rationale":"Можно, но обманчиво."}],"id":"d8","level":"L3"},{"mechanic":"single","points":1,"stem":"Входные токены — 80% стоимости диалога. Первый рычаг?","options":[{"id":"o0","text":"Кэш системного промпта, сжатие истории, меньший top-k","correct":true,"rationale":"Самая большая статья."},{"id":"o1","text":"Ответы по 40 токенов: выходные токены втрое дороже","correct":false,"rationale":"Выходные — 10%."},{"id":"o2","text":"Температура 0: модель генерирует короче и стабильнее, что снижает расходы","correct":false,"rationale":"Не влияет."},{"id":"o3","text":"Отключить guard: он добавляет вызов на каждый ход и удорожает диалог","correct":false,"rationale":"Опасно и мало."}],"id":"d9","level":"L3"},{"mechanic":"single","points":1,"stem":"Containment вырос с 38% до 57%, повторные обращения — с 11% до 19%. Вывод?","options":[{"id":"o0","text":"Агент удерживает, не решая; проверить task success и вернуть эскалацию","correct":true,"rationale":"Ловушка containment."},{"id":"o1","text":"Успех: containment вырос в полтора раза, расширяем агента на соседние интенты","correct":false,"rationale":"Качество просело."},{"id":"o2","text":"Сезонность: в этом месяце меньше сложных обращений","correct":false,"rationale":"Совпало с релизом."},{"id":"o3","text":"Убрать метрику повторных обращений: она зависит от маркетинговых кампаний и шумит","correct":false,"rationale":"Отказ от измерения."}],"id":"d10","level":"L4"},{"mechanic":"single","points":1,"stem":"Что отличает хорошую веху roadmap?","options":[{"id":"o0","text":"Результат с критерием, датой и владельцем","correct":true,"rationale":"Проверяемо."},{"id":"o1","text":"Технология и длительность: «RAG","correct":false,"rationale":"Активность."},{"id":"o2","text":"Обещание заказчику «будет работать хорошо» с перечислением задействованных команд","correct":false,"rationale":"Непроверяемо."},{"id":"o3","text":"Список задач JIRA с оценками в story points, сгруппированный по эпикам","correct":false,"rationale":"Уровень спринта."}],"id":"d11","level":"L5"},{"mechanic":"single","points":1,"stem":"После демо заказчик требует запуск на всех через 2 недели. Первые 30 секунд?","options":[{"id":"o0","text":"Назвать цифры: показано / есть / цель / срок; ОПЭ после ИБ; письменно","correct":true,"rationale":"Из впечатления в измерение."},{"id":"o1","text":"Согласиться, чтобы не портить момент, и разобраться с деталями на рабочей встрече","correct":false,"rationale":"Ожидание зафиксировано ложно."},{"id":"o2","text":"Сказать, что ничего не готово и демо было нерепрезентативным","correct":false,"rationale":"Без плана."},{"id":"o3","text":"Попросить две недели подумать и подготовить презентацию с рисками и бюджетом","correct":false,"rationale":"Ожидание живёт."}],"id":"d12","level":"L6"},{"mechanic":"single","points":1,"stem":"Что уходит наружу при настройках dsh по умолчанию с официальным API?","options":[{"id":"o0","text":"События лога сессии и web-search запросы в DeepSeek","correct":true,"rationale":"Выключается в конфиге."},{"id":"o1","text":"Ничего: всё локально, наружу только текст запроса к модели","correct":false,"rationale":"Лог уходит по умолчанию."},{"id":"o2","text":"Только анонимная телеметрия без содержимого","correct":false,"rationale":"Лог содержит содержимое."},{"id":"o3","text":"Файлы рабочего пространства для дообучения","correct":false,"rationale":"Файлы не загружаются."}],"id":"d13","level":"L7"},{"mechanic":"single","points":1,"stem":"Может ли поздний слушатель отменить отказ guard в dsh?","options":[{"id":"o0","text":"Нет: у guards нет allow, отказ монотонен","correct":true,"rationale":"После pre-execute, только deny."},{"id":"o1","text":"Да, с prepend: true в waterfall слушатель встанет первым", /* ================= ГЛИФЫ: параметрические SVG-якоря памяти =================

function ganiMark(inner){var out="",pos=0,i=0,re=/<(rect|line|circle|path|text|g)\b/g,m;while((m=re.exec(inner))){var te=inner.indexOf(">",m.index);if(te<0)break;var d=Math.min(i*70,840);out+=inner.slice(pos,m.index)+"<"+m[1]+' class="ga" style="animation-delay:'+d+'ms"'+inner.slice(m.index+m[0].length,te+1);pos=te+1;i++;}out+=inner.slice(pos);return out;}

function ci(x,y,r,c,o){o=o||{};return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+c+'"'+(o.s?' stroke="'+o.s+'" stroke-width="1.5"':'')+(o.op!=null?' opacity="'+o.op+'"':'')+'/>';}
function path(d,c,w,fill){return '<path d="'+d+'" stroke="'+(c||'var(--line2)')+'" stroke-width="'+(w||1.5)+'" fill="'+(fill||'none')+'" stroke-linecap="round" stroke-linejoin="round"/>';}

/* Две группы: A и B как две колонки людей; подписи — доли. p={pa,pb,label} */
G.twoGroups=function(p){var h=136;var s='';var ya=92,x0=40,x1=200;function col(x,pct,c,lbl,soft){var hh=Math.max(6,Math.round(pct*64));s+=rc(x,ya-64,80,64,soft,{r:6});s+=rc(x,ya-hh,80,hh,c,{r:6});s+=t(x+40,ya+15,lbl,{a:'middle',b:true,c:c,fs:11});s+=t(x+40,ya-hh-6,fmtPct(pct,1),{a:'middle',m:true,c:INK,fs:12});}
  col(x0,p.pa,A,'A · контроль',ASOFT);col(x1,p.pb,B,'B · вариант',BSOFT);if(p.label){var lf=10;if(p.label.length*5>290)lf=Math.max(8,Math.floor(2900/(p.label.length*5)));s+=t(160,128,p.label,{a:'middle',fs:lf});}return svg(h,s);};

/* Шум: две одинаковые монеты дали разные доли. p={a,b} в долях */

/* Пункты против процентов: две шкалы. p={a,b} доли */
G.ppVsPct=function(p){var s='';var y1=36,y2=86;var x0=30,w=260;s+=ln(x0,y1,x0+w,y1,LN,6);s+=rc(x0,y1-3,w*p.a*4,6,A,{r:3});s+=rc(x0+w*p.a*4,y1-3,w*(p.b-p.a)*4,6,B,{r:0});
  s+=t(x0,y1-10,fmtPct(p.a,1),{m:true,c:A});s+=t(x0+w*p.b*4+4,y1-10,fmtPct(p.b,1),{m:true,c:B});s+=t(x0+w,y1+16,'+'+fmtPct(p.b-p.a,1).replace('%','')+' п.п. — разница долей',{a:'end',fs:11,c:INK,b:true});
  s+=ln(x0,y2,x0+w,y2,LN,6);s+=rc(x0,y2-3,w*0.6,6,A,{r:3});s+=rc(x0+w*0.6,y2-3,w*0.6*((p.b-p.a)/p.a),6,B,{r:0});s+=t(x0,y2-10,'база = 100%',{m:true,c:A});s+=t(x0+w,y2+16,'+'+fmtPct((p.b-p.a)/p.a,0)+' отн. — лифт от базы',{a:'end',fs:11,c:INK,b:true});return svg(112,s);};

/* Две колокольни: эффект против шума. p={se, diff} в п.п.; рисуем контроль и вариант, стрелка разницы. */
G.bells=function(p){var s='';var base=92;var sd=Math.max(10,Math.min(40,22));var cx=120,dx=Math.max(8,Math.min(120,p.diff/p.se*sd));

G.ci=function(p){var s='';var dot=ci;var lo=Math.min(p.lo,0,p.mde||0),hi=Math.max(p.hi,0,p.mde||0);var pad=(hi-lo)*0.2||1;lo-=pad;hi+=pad;function X(v){return 24+(v-lo)/(hi-lo)*272;}var y=56;

G.srm=function(p){var s='';var mx=Math.max(p.na,p.nb);function col(x,n,c,lbl){var h=Math.round(n/mx*70);s+=rc(x,96-h,70,h,c,{r:5});s+=t(x+35,110,lbl,{a:'middle',fs:10,c:c,b:true});s+=t(x+35,96-h-6,fmt(n),{a:'middle',m:true,fs:11,c:INK});}

function calcEval(expr){var s=String(expr).replace(/[\s ]/g,'').replace(/,/g,'.').replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/sqrt/gi,'√');if(!/^[0-9.+\-*/^()%√]+$/.test(s))throw new Error('bad');var i=0;
  function num(){var m=/^\d*\.?\d+/.exec(s.slice(i));if(m){i+=m[0].length;var v=parseFloat(m[0]);if(s[i]==='%'){i++;v/=100;}return v;}if(s[i]==='('){i++;var v2=sum();if(s[i]!==')')throw new Error('paren');i++;return v2;}if(s[i]==='-'){i++;return -num();}if(s[i]==='√'){i++;var v3=num();if(v3<0)throw new Error('neg');return Math.sqrt(v3);}throw new Error('num');}
  function pow(){var a=num();while(s[i]==='^'){i++;a=Math.pow(a,num());}return a;}
  function mul(){var a=pow();while(s[i]==='*'||s[i]==='/'){var op=s[i++];var b=pow();a=op==='*'?a*b:a/b;}return a;}
  function sum(){var a=mul();while(s[i]==='+'||s[i]==='-'){var op=s[i++];var b=mul();a=op==='+'?a+b:a-b;}return a;}
  var r=sum();if(i<s.length)throw new Error('tail');if(!isFinite(r))throw new Error('inf');return r;}

var VAC_LV=['—','База','Уверенно','Эксперт','Лидер'];
function vacStore(){return S.get('vac',{tab:'role',grade:null});}
function vacSave(st){S.set('vac',st);}
function vacNameOf(kind,id){
  if(kind==='units'){var u=UNIT_BY_ID[id];return u?u.title:id;}
  if(kind==='bosses'){var b=null;(D.BOSSES||[]).forEach(function(x){if(x.id===id)b=x;});return b?b.title:id;}
  if(kind==='etudes'){var e=null;(D.ETUDES||[]).forEach(function(x){if(x.id===id)e=x;});return e?e.title:id;}
  if(kind==='nums'){var n=null;(D.NUM||[]).forEach(function(x){if(x.id===id)n=x;});return n?n.title:id;}
  if(kind==='audits'){var a=null;(D.AUDITS||[]).forEach(function(x){if(x.id===id)a=x;});return a?a.title:id;}
  if(kind==='artifacts'){var r=null;(D.ARTIFACTS||[]).forEach(function(x){if(x.id===id)r=x;});return r?r.title:id;}
  if(kind==='studio'){var m=null;(typeof ST_MISSIONS!=='undefined'?ST_MISSIONS:[]).forEach(function(x){if(x.id===id)m=x;});return m?(id.toUpperCase()+' · '+m.title):id;}
  if(kind==='labs'){return {cost:'Стоимость диалога',lat:'Бюджет латентности',evals:'Eval-набор и судья',slo:'SLO и GPU',rag:'RAG-индекс'}[id]||id;}
  return id;}
function vacDone(kind,id){
  if(kind==='units'){var p=unitProg(id);return !!(p&&p.acc>=0.6);}
  if(kind==='bosses')return bossBest(id)>=1;
  if(kind==='etudes')return etudeBest(id)>=0.6;
  if(kind==='nums')return numBest(id)>=0.6;
  if(kind==='audits')return (((S.get('audit',{}))[id]||{}).best||0)>=1;
  if(kind==='studio'){var st=S.get('studio',{best:{}});return ((st.best||{})[id]||0)>=1;}
  if(kind==='terms')return lexLevel(id)>=2;
  return null;}
var VAC_KINDS=[['units','Юниты','level'],['terms','Термины','lex'],['bosses','Боссы','boss'],['etudes','Этюды','etude'],['nums','Цифры','num'],['audits','Аудит','auditcase'],['artifacts','Артефакты','artifact'],['studio','Студия','studio'],['labs','Лаборатория','lab'],['cheat','Шпаргалки','cheat']];
function vacCoverage(skillId){var mp=(D.VACANCY.mapping||{})[skillId]||{};var tot=0,done=0;VAC_KINDS.forEach(function(k){(mp[k[0]]||[]).forEach(function(id){var d=vacDone(k[0],id);if(d===null)return;tot++;if(d)done++;});});return {tot:tot,done:done,pct:tot?done/tot:0};}
function vacGo(kind,id){
  if(kind==='units'){var u=UNIT_BY_ID[id];if(u)startUnitMaybe({id:u.id,title:u.title,steps:unitSteps(u)},{back:{name:'vacancy'}});return;}
  if(kind==='terms'){openLesson(id);return;}

  var un=S.get('units',{});var us=xfList(D.UNITS);w.w(us.length,8);us.forEach(function(id){var u=un[id];w.w(u?1:0,1);if(u)w.w(Math.round(Math.min(1,u.acc)*15),4);});
  var certs=S.get('certs',{});D.LEVELS.forEach(function(L){w.w(Math.round(Math.min(1,certs[L.id]||0)*15),4);});
  function bests(key,list){var st=S.get(key,{});var ids=xfList(list);w.w(ids.length,8);ids.forEach(function(id){w.w(Math.round(Math.min(1,(st[id]||{}).best||0)*15),4);});}
  bests('bosses',D.BOSSES||[]);bests('etudes',D.ETUDES||[]);bests('num',D.NUM||[]);bests('audit',D.AUDITS||[]);bests('arts',D.ARTIFACTS||[]);
  var lex=S.get('lex',{});var ts=xfList(D.TERMS||[],'name');w.w(ts.length,8);ts.forEach(function(n){w.w(Math.min(3,lex[n]||0),2);});
  w.w(Math.min(totalXp(),1048575),20);w.w(Math.min(streakCount(),255),8);
  var bd=badges();w.w(BADGES.length,5);BADGES.forEach(function(b){w.w(bd.indexOf(b.id)>=0?1:0,1);});
  var ex=S.get('exam',{});w.w(Math.round(Math.min(1,ex.best||0)*15),4);

  var nu=r.r(8);var us=xfList(D.UNITS);if(nu!==us.length)throw new Error('units');var un={};us.forEach(function(id){if(r.r(1))un[id]={acc:r.r(4)/15,n:1,last:Date.now()};});
  var certs={};D.LEVELS.forEach(function(L){var v=r.r(4);if(v)certs[L.id]=v/15;});
  function bests(list){var ids=xfList(list);var k=r.r(8);if(k!==ids.length)throw new Error('list');var o={};ids.forEach(function(id){var v=r.r(4);if(v)o[id]={best:v/15,n:1};});return o;}
  var bosses=bests(D.BOSSES||[]),etudes=bests(D.ETUDES||[]),num=bests(D.NUM||[]),audit=bests(D.AUDITS||[]),arts=bests(D.ARTIFACTS||[]);

  var exb=r.r(4);var lab={};['size','analyze','srm','peek','cuped'].forEach(function(k2){if(r.r(1))lab[k2]=1;});
  S.set('res',res);S.set('units',un);S.set('certs',certs);S.set('bosses',bosses);S.set('etudes',etudes);S.set('num',num);S.set('audit',audit);S.set('arts',arts);S.set('lex',lex);S.set('xp',xp);

/* RLE по байтам: 0x00 run → [0,len]; иначе байт как есть; байт 0 литерал кодируется [0,0]? — проще: escape 0xFF */

    h+='<div class="mech" style="margin-top:10px">Решение</div><div class="opt '+(r.vOk?'ok':'bad')+'" style="cursor:default"><span><b>'+esc(VERDICT_LABELS[a.verdict])+'</b><div class="why">'+esc(a.verdictWhy)+'</div></span></div>';
    h+='<div class="sol" style="border-color:var(--b)"><b>Урок.</b> '+esc(a.lesson)+'</div><button class="btn wide" id="done" style="margin-top:12px">Готово</button></div>';}
  $app.innerHTML=h;bindTop();document.getElementById('quit').onclick=function(){if(AUD.ph>0&&AUD.ph<3)resumeSave('audit',id,a.title,AUD,'этап '+(AUD.ph+1));AUD=null;go('audit');};
  if(AUD.ph===0){document.getElementById('nx').onclick=function(){AUD.ph=1;auditCaseView(id);window.scrollTo(0,0);};}
  else if(AUD.ph===1){var fl=document.getElementById('fl');a.flags.forEach(function(f,i){var b=el('<button class="opt'+(AUD.flags[f.id]?' sel':'')+'"><span class="key">'+String.fromCharCode(65+i)+'</span><span>'+esc(f.t)+'</span></button>');b.onclick=function(){AUD.flags[f.id]=!AUD.flags[f.id];b.classList.toggle('sel',!!AUD.flags[f.id]);};fl.appendChild(b);});
    document.getElementById('nx').onclick=function(){AUD.ph=2;auditCaseView(id);window.scrollTo(0,0);};}
  else if(AUD.ph===2){var vd=document.getElementById('vd');var ok=document.getElementById('nx');var keys=['invalid','ship','kill','iterate','undecided'];
    keys.forEach(function(k,i){var b=el('<button class="opt'+(AUD.verdict===k?' sel':'')+'"><span class="key">'+String.fromCharCode(65+i)+'</span><span>'+esc(VERDICT_LABELS[k])+'</span></button>');b.onclick=function(){AUD.verdict=k;each(vd.children,function(x){x.classList.remove('sel');});b.classList.add('sel');ok.disabled=false;};vd.appendChild(b);});
    ok.onclick=function(){AUD.ph=3;auditCaseView(id);window.scrollTo(0,0);};}
  else{document.getElementById('done').onclick=function(){AUD=null;go('audit');};if(auditScore(a).score>=1)SFX.fanfare();}}
function auditScore(a){var hit=0,fp=0;a.defects.forEach(function(d){if(AUD.flags[d.id])hit++;});a.decoys.forEach(function(d){if(AUD.flags[d.id])fp++;});var vOk=AUD.verdict===a.verdict;
  var nd=a.defects.length;var fpart=nd?Math.max(0,(hit-fp*0.5)/nd):(fp?0:1);var score=0.7*fpart+0.3*(vOk?1:0);if(hit===nd&&!fp&&vOk)score=1;return {hit:hit,fp:fp,vOk:vOk,score:score};}
