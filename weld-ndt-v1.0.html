text":"Расход аргона 3 л/мин на горелке TIG вместо 8–12 л/мин","correct":true,"rationale":"Колпак не накрывает ванну целиком — окисление краёв и поры."},{"id":"o3","text":"Ток 120 А для электрода d 3 мм в нижнем положении на пластине 6 мм","correct":false,"rationale":"120 А — середина диапазона 90–130 А; это не влияет на защиту ванны."}]},{"id":"u0-3-q4","mechanic":"sjt_bw","points":3,"stem":"Середина шва TIG на нержавейке, стрелка редуктора упала на ноль — аргон кончился. Наставник вышел, до конца смены час. Что делать?","options":[{"id":"s0","text":"Прервать шов, дождаться наставника и сменить баллон под его присмотром","correct":true,"rationale":"Без аргона нержавейка окисляется, вольфрам горит; баллон меняют с наставником — это сосуд под давлением."},{"id":"s1","text":"Довести шов до конца на остатке давления в шланге, пока ванна не остыла","correct":false,"rationale":"Остатка хватает на секунды; дальше шов идёт в воздухе — серый, пористый, и пластина в брак."},{"id":"s2","text":"Переключить шланг на баллон CO₂ с соседнего поста и доварить","correct":false,"rationale":"CO₂ при TIG окисляет вольфрам и хром; шов чёрный, хотя пластина формально «доварена»."},{"id":"s3","text":"Самому открутить редуктор, поставить новый баллон и продолжить","correct":false,"rationale":"Баллон — сосуд под давлением; ученик без допуска и наставника к нему не прикасается."}],"worst":"s1","worstRationale":"Варить без газа «пока горячо» — худшее: защита пропала мгновенно, а шов и вольфрам испорчены за первые же секунды."},{"id":"v0-3-a","mechanic":"visual","points":3,"stem":"Горелка TIG, норма расхода аргона 8–12 л/мин. На какой картинке расход в норме?","vopts":[{"id":"v0","v":{"g":"weeks","p":{"w":[3],"ax":"G, л/мин","max":30,"ref":8,"refl":"8"}},"lbl":"","correct":false,"rationale":"3 л/мин — колпак не накрывает ванну, края шва темнеют."},{"id":"v1","v":{"g":"weeks","p":{"w":[26],"ax":"G, л/мин","max":30,"ref":8,"refl":"8"}},"lbl":"","correct":false,"rationale":"26 л/мин — турбулентная струя подсасывает воздух, защита хуже."},{"id":"v2","v":{"g":"weeks","p":{"w":[18],"ax":"G, л/мин","max":30,"ref":8,"refl":"8"}},"lbl":"","correct":false,"rationale":"18 л/мин — это норма для МП, для горелки TIG уже много."},{"id":"v3","v":{"g":"weeks","p":{"w":[10],"ax":"G, л/мин","max":30,"ref":8,"refl":"8"}},"lbl":"","correct":true,"rationale":"10 л/мин — чуть выше линии 8 и ниже 12: ламинарный колпак."}]},{"id":"v0-3-b","mechanic":"visual","points":3,"stem":"МП у открытых ворот, ветер 4 м/с, укрытия нет. Какое сечение шва получится?","vopts":[{"id":"v0","v":{"g":"weldx","p":{"s":6,"g":2,"root":"ok","crack":true,"txt":false}},"lbl":"","correct":false,"rationale":"Трещина — от напряжений или водорода, не от сдутого газа."},{"id":"v1","v":{"g":"weldx","p":{"s":6,"g":2,"root":"ok","pores":5,"txt":false}},"lbl":"","correct":true,"rationale":"Ветер выше 2–3 м/с уносит газ: ванна глотает воздух, цепочка пор."},{"id":"v2","v":{"g":"weldx","p":{"s":6,"g":2,"root":"lack","txt":false}},"lbl":"","correct":false,"rationale":"Непровар корня — мало тока или зазора; с ветром не связан."},{"id":"v3","v":{"g":"weldx","p":{"s":6,"g":2,"root":"ok","slag":true,"txt":false}},"lbl":"","correct":false,"rationale":"Шлак между проходами — плохая зачистка при РД, при МП со смесью его почти нет."}]}],"framework":"Ванна дышать не должна: TIG — аргон 8–12 л/мин, МП — 12–18 л/мин при вылете 10–15 мм, РД — сухие прокалённые электроды. Ветер > 2–3 м/с и «побольше газа» рвут защиту одинаково.","anchor":{"g":"formula","p":{"f":"воздух (N₂ + O₂) → поры ⇒ Ar 8–12 л/мин","sub":"больше газа — хуже; ветер > 2–3 м/с — ширма"},"cap":"над ванной — зонт: 8–12 л/мин TIG, 12–18 МП; ветер > 2–3 м/с его рвёт"},"layers":{"simple":"Жидкий металл в ванне — как раскалённая губка: он впитывает воздух, а при остывании воздух остаётся внутри пузырьками. Поэтому над ванной всегда держат зонт. Зонт бывает трёх видов. При сварке вольфрамом в аргоне зонт — струя газа из сопла горелки, 8–12 л/мин. При сварке проволокой — углекислый газ или смесь, 12–18 л/мин. При сварке электродом с обмазкой зонт встроен в сам электрод: обмазка сгорает в газ и всплывает коркой шлака, которая накрывает валик.\nЗонт легко сломать. Ветер сильнее 2–3 м/с сдувает газ, как зонт выворачивает на остановке, — и шов весь в порах. Слишком большой расход, 25 л/мин, не помогает, а вредит: струя закручивается и сама засасывает воздух снаружи, как сквозняк из открытой двери. Отсыревшие электроды с обмазкой — это зонт с дырками: влага даёт водород, водород — поры.\nУченик думает «добавлю тока — ванна успеет схватиться». Не успеет: горячий металл впитывает воздух ещё жаднее. Проверь себя: почему расход аргона (G) 25 л/мин защищает хуже, чем 10 л/мин?","how":"1. Определяешь, что защищает ванну в твоём способе: TIG — аргон 99,993 % через сопло; МП — CO₂ или смесь Ar + CO₂ (82/18); РД — обмазка электрода; сварка под флюсом — слой флюса.\n2. Выставляешь расход по ротаметру: TIG 8–12 л/мин (ставишь 10), МП 12–18 л/мин (ставишь 15). Проверяешь, что газ действительно идёт: нажал кнопку — шипит, стрелка стоит.\n3. Держишь сопло близко к ванне: при МП вылет проволоки 10–15 мм; оттянул до 25 мм — газ рассеялся, проволока перегрелась.\n4. Убираешь ветер: у открытых ворот при 4 м/с ставишь ширму или переносишь пост; порог — 2–3 м/с.\n5. Для РД берёшь электроды из пенала: УОНИ-13/55 прокалены при 350–400 °C 1–2 ч; из вскрытой неделю назад пачки — не берёшь.\n6. После обрыва дуги при TIG держишь горелку над кратером, пока идёт газ: кратер и вольфрам остывают под аргоном.\n7. Проверяешь результат: серебристый шов — защита была; серый или чёрный, с цепочкой пор — защита сорвана, и первый вопрос «что с газом?», а не «какой ток?».","formula":{"f":"защита держится = расход в норме  И  ветер ≤ 2–3 м/с  И  сопло близко  И  материалы сухие","legend":[["расход, G","TIG 8–12 л/мин; МП 12–18 л/мин — не больше","10"],["ветер","скорость воздуха у поста, м/с","4 — плохо"],["сопло близко","вылет проволоки при МП, мм","10–15"],["материалы сухие","прокалка основных электродов, °C и ч","350–400, 1–2"]],"note":"Любое одно «нет» ломает всю цепочку: правильный расход при ветре 4 м/с не спасает, и ток в этой схеме вообще не участвует."},"pitfalls":"Опытные срывают защиту не от незнания, а от уверенности: «на улице еле дует» — а анемометр показывает 4 м/с, и стык Ø 530 мм уходит на ремонт за 25–60 тыс. ₽ из-за цепочки пор. В журнале это выглядит как «МП, 15 л/мин, поры по всей длине» — расход правильный, и поэтому ищут ток или проволоку, а не ветер. Второй капкан — электроды «из вчерашней пачки»: прокалка была, пенал открыт с утра, к вечеру основное покрытие уже набрало влагу, и на снимке поры «гроздью» в начале каждого шва. Третий — расход «с запасом»: 25 л/мин вместо 10 при TIG, струя турбулентная, шов серый, а сварщик уверен, что газа «точно хватало». Вопрос, который вскрывает всё: «где поры — везде, в начале шва или с одной стороны?». Везде — ветер или расход; в начале — влага в электроде; с одной стороны — сопло забито брызгами или сквозняк сбоку. Под давлением сроков: «ширму ставлю за пять минут, переварка стыка — смена».","checks":[{"q":"Почему расход аргона (G) 25 л/мин защищает ванну хуже, чем 10 л/мин?","o":["Струя становится турбулентной и сама подсасывает воздух снаружи","Аргон при большом расходе остывает и быстрее уходит вверх","Большой расход сдувает присадку и отбрасывает ванну назад"],"a":0,"w":"Ламинарный колпак при 8–12 л/мин накрывает ванну; при 25 л/мин струя закручивается и втягивает воздух."},{"q":"МП у открытых ворот, ветер 4 м/с, расход 15 л/мин, шов в порах. Какой шаг из цепочки нарушен?","o":["Расход: 15 л/мин мало для смеси, нужно 25","Ветер: порог 2–3 м/с превышен, нужна ширма","Вылет: при ветре его надо увеличить до 25 мм"],"a":1,"w":"15 л/мин — внутри нормы 12–18; ветер 4 м/с уносит газ, и никакой расход это не компенсирует."},{"q":"По схеме «защита = расход И ветер И сопло И сухие материалы» два условия в норме, два нет. Защита есть?","o":["Есть наполовину: поры будут мельче и реже обычного","Есть, если добавить тока и прогреть ванну сильнее","Нет: любое одно нарушение ломает всю цепочку"],"a":2,"w":"Связка «И»: ветер 4 м/с при идеальном расходе даёт те же поры; ток в схеме защиты не участвует."},{"q":"На снимках поры «гроздью» в начале каждого шва, по длине чисто. Что проверяет опытный первым?","o":["Электроды: пенал открыт с утра, основное покрытие набрало влагу","Ток: в начале шва он мал, и ванна не успевает прогреться","Массу: в начале шва контакт зажима ещё не прогрелся"],"a":0,"w":"Поры в начале шва — влажная обмазка: водород выходит, пока электрод не прогрелся; по длине чисто — не ветер."}],"rules":["TIG: аргон 99,993 %, 8–12 л/мин; больше расход — турбулентность и воздух в ванне; газ держать после обрыва дуги.","МП: 12–18 л/мин, вылет 10–15 мм; ветер > 2–3 м/с — ширма, а не ток.","РД: защита в обмазке; основные электроды — прокалка 350–400 °C 1–2 ч и пенал.","Поры — сначала вопрос «что с защитой?»: расход, ветер, влага, вылет, сопло.","На трубах и нержавейке корень защищают с обратной стороны — 4–8 л/мин, пока не нарастёт 2–3 прохода."]}},{"id":"u0-4","level":"L0","title":"Дефект глазами: шесть групп","lead":"Сначала назови группу дефекта — потом решай, что с ним делать","concept":"Все дефекты сварных швов разложены по шести группам ГОСТ Р ИСО 6520-1: 100 — трещины, 200 — полости (поры), 300 — твёрдые включения (шлак, вольфрам), 400 — несплавления и непровары, 500 — дефекты формы (подрез, превышение усиления, смещение, прожог, наплыв), 600 — прочие (брызги, задиры). Для ученика это азбука визуального контроля (ВИК): смотрят при освещённости не ниже 500 лк, с лупой 2–7×, на поверхности, зачищенной на 20 мм в обе стороны от шва, и меряют шаблоном УШС-3. Дефекты неравноценны: трещина (100) недопустима всегда, непровар корня (400) для ответственных стыков тоже; подрез (500) допускают до 0,5 мм, а брызги (600) просто счищают. Ученик ошибается, когда называет всё подряд «дыркой» или «царапиной», не переворачивает пластину, чтобы посмотреть корень, и принимает волосяную извилистую линию за риску от щётки — а это трещина.","points":[{"h":"Группа 100 — трещины: тонкая, извилистая, недопустима","t":"Трещина — разрыв металла, на поверхности выглядит как тонкая извилистая тёмная линия, часто от кратера в конце шва или вдоль оси. Отличие от царапины щёткой: царапина прямая и блестящая внутри, трещина ветвится и темнеет от окислов. Под лупой 5× трещина видна как линия с острыми концами. Для ответственных стыков трещина недопустима в любом классе — шов вырезают. Ученик, увидев «волосок» в кратере, обязан показать его наставнику, а не зашлифовать."},{"h":"Группы 200 и 300 — поры и включения: круглое и угловатое","t":"Пора (200) — газовая полость, на поверхности круглая ямка с гладкими стенками; цепочка пор по длине — признак сорванной защиты, гроздь в начале — влажный электрод. Включение (300) — чужеродное твёрдое тело: шлак выглядит угловатым тёмным пятном между валиками, вольфрам — на снимке светлыми точками. Допустимость пор зависит от класса и толщины по таблице ГОСТ 23055: для класса 1 — самые жёсткие размеры, для класса 7 — мягкие. Ученику достаточно уметь сказать: «круглая — пора, угловатая между проходами — шлак»."},{"h":"Группа 400 — непровар и несплавление: кромки не сплавились","t":"Непровар — кромки или корень не расплавились; на обратной стороне стыка это тёмная ровная бороздка по оси, на снимке — прямая тёмная линия. Несплавление — валик лёг на кромку, не расплавив её, часто по краю разделки при малом токе или длинной дуге. Оба дефекта почти не видны с лицевой стороны: шов сверху красивый, а работает половиной сечения. Для ответственных стыков непровар корня недопустим. Поэтому правило ученика: пластину всегда переворачивать и смотреть корень первым."},{"h":"Группа 500 — форма: подрез, горб, смещение, прожог, наплыв","t":"Дефекты формы меряются шаблоном: подрез (h) — канавка по краю шва, норма ≤ 0,5 мм; превышение усиления — горб выше 3 мм; смещение кромок (e) — ступенька больше 0,1·s; прожог — сквозная дыра с провисанием; наплыв — металл натёк на лист, не сплавившись с ним. Подрез 0,8 мм при норме 0,5 мм — уже дефект, хотя выглядит мелочью: это надрез-концентратор вдоль всего шва. Ученик видит горб и считает запасом, видит подрез и называет «тенью» — шаблон снимает оба спора за секунду."},{"h":"Как смотрит контролёр: свет, зачистка, лупа, две стороны","t":"ВИК начинается с условий: освещённость не ниже 500 лк (яркая лампа над постом), поверхность зачищена на 20 мм в обе стороны от шва — при ширине шва 10 мм осматривают полосу 50 мм. Лупа 2–7× для сомнительных мест, УШС-3 для подреза, усиления, катета и смещения. Порядок: лицевая сторона → обратная сторона (корень) → кратеры в начале и конце → околошовная зона. На следующем грейде появится акт ВИК с номером стыка и клеймом; ученику достаточно научиться называть группу и показывать место наставнику."}],"practice":{"id":"u0-4-pr","mechanic":"matching","points":3,"stem":"Сопоставь, что видно на пластине после сварки, с группой дефекта по ГОСТ Р ИСО 6520-1.","pairs":[{"l":"Тонкая извилистая тёмная линия от кратера в конце шва","r":"100 — трещина, недопустима всегда"},{"l":"Цепочка круглых ямок с гладкими стенками по длине валика","r":"200 — поры, защита ванны сорвана"},{"l":"Угловатое тёмное пятно между двумя проходами","r":"300 — шлаковое включение"},{"l":"Ровная тёмная бороздка по оси на обратной стороне стыка","r":"400 — непровар корня"},{"l":"Канавка 0,8 мм вдоль края шва при норме 0,5 мм","r":"500 — подрез, дефект формы"},{"l":"Шарики металла на листе рядом со швом, счищаются","r":"600 — брызги, прочие дефекты"}],"solution":"Группы: 100 трещины (извилистая линия), 200 поры (круглые), 300 включения (угловатые, шлак), 400 непровар и несплавление (бороздка в корне), 500 форма (подрез, горб, смещение, прожог, наплыв — меряет шаблон), 600 прочее (брызги)."},"test":[{"id":"u0-4-q1","mechanic":"single","points":2,"stem":"На обратной стороне стыка пластин 6 мм по всей длине ровная тёмная бороздка; лицевая сторона ровная и красивая. Что это?","options":[{"id":"o0","text":"Непровар корня, группа 400: кромки снизу не сплавились, шов работает частью толщины","correct":true,"rationale":"Ровная бороздка по оси корня — следы несплавленных кромок; тока или зазора не хватило на проплав."},{"id":"o1","text":"Подрез корня, группа 500: канавка в пределах нормы 0,5 мм, допустимо","correct":false,"rationale":"Подрез — канавка по краю шва на лицевой стороне; бороздка по оси корня — это непровар."},{"id":"o2","text":"Шлаковое включение, группа 300: шлак первого прохода вытек вниз","correct":false,"rationale":"Шлак — угловатое пятно между проходами, а не ровная линия по оси обратной стороны."},{"id":"o3","text":"Норма: обратная сторона стыка всегда темнее из-за окалины","correct":false,"rationale":"Тёмный цвет — окисление, а бороздка — геометрия несплавленных кромок; это дефект, не окалина."}],"anchor":{"g":"weldx","p":{"s":6,"g":2,"root":"lack","lbl":"бороздка по оси корня"},"cap":"лицевая сторона ровная, а корень не сплавлен — переворачивай первой"}},{"id":"u0-4-q2","mechanic":"single","points":2,"stem":"Шаблон УШС-3 показал подрез h 0,8 мм вдоль края шва на пластине 6 мм. Норма для ответственного стыка — не более 0,5 мм. Вывод?","options":[{"id":"o0","text":"Дефект формы группы 500 выше нормы: устранить и проверить снова","correct":true,"rationale":"0,8 мм против 0,5 мм — канавка-концентратор вдоль шва на 60 % глубже допуска; надо устранить."},{"id":"o1","text":"Допустимо: подрез меньше 1 мм на пластине 6 мм считается мелким и не записывается","correct":false,"rationale":"Норма 0,5 мм задана числом; 0,8 мм — превышение, «меньше миллиметра» не аргумент."},{"id":"o2","text":"Это трещина группы 100 по линии сплавления, шов вырезать","correct":false,"rationale":"Трещина — извилистая линия с острыми концами; подрез — ровная канавка, которую меряет шаблон."},{"id":"o3","text":"Это брызги группы 600 у края шва, зачистить щёткой и принять","correct":false,"rationale":"Брызги — шарики на листе; канавка глубиной 0,8 мм — углубление в металле, щётка её не уберёт."}]},{"id":"u0-4-q3","mechanic":"multi","points":3,"stem":"Что относится к группе 500 — дефектам формы шва?","options":[{"id":"o0","text":"Усиление стыкового шва 4,5 мм при норме 0,5–3 мм","correct":true,"rationale":"Превышение усиления — дефект формы: горб и резкий переход к листу."},{"id":"o1","text":"Смещение кромок 1,5 мм на пластинах 6 мм при норме 0,6 мм","correct":true,"rationale":"Смещение — геометрия стыка, относится к дефектам формы."},{"id":"o2","text":"Ровная тёмная бороздка по оси корня на обратной стороне стыка пластин толщиной 6 мм","correct":false,"rationale":"Это непровар — группа 400, кромки не сплавились."},{"id":"o3","text":"Угловатое тёмное пятно шлака между двумя проходами на лицевой стороне шва","correct":false,"rationale":"Шлак — твёрдое включение группы 300, не форма."}]},{"id":"u0-4-q4","mechanic":"numeric","points":3,"stem":"ВИК: ширина шва на пластине 10 мм, зачистка нужна на 20 мм в обе стороны от шва. Какой ширины полосу (в мм) ты осматриваешь?","answer":50,"tol":1,"unit":"мм","solution":"Полоса осмотра = 20 + 10 + 20 = 50 мм. Освещённость при этом не ниже 500 лк, сомнительные места — под лупой 2–7×. Ученик часто зачищает только сам шов 10 мм и не видит подрез и трещины в околошовной зоне."},{"id":"v0-4-a","mechanic":"visual","points":3,"stem":"Четыре сечения шва. На каком — дефект группы 100, недопустимый всегда?","vopts":[{"id":"v0","v":{"g":"weldx","p":{"s":6,"g":2,"root":"ok","pores":4,"txt":false}},"lbl":"","correct":false,"rationale":"Круглые полости — поры, группа 200; допустимость по таблице."},{"id":"v1","v":{"g":"weldx","p":{"s":6,"g":2,"root":"ok","slag":true,"txt":false}},"lbl":"","correct":false,"rationale":"Угловатое тёмное тело — шлак, группа 300."},{"id":"v2","v":{"g":"weldx","p":{"s":6,"g":2,"h":1,"root":"ok","txt":false}},"lbl":"","correct":false,"rationale":"Канавка по краю — подрез, группа 500, норма ≤ 0,5 мм."},{"id":"v3","v":{"g":"weldx","p":{"s":6,"g":2,"root":"ok","crack":true,"txt":false}},"lbl":"","correct":true,"rationale":"Извилистая линия сквозь металл шва — трещина, группа 100, вырезать."}]},{"id":"v0-4-b","mechanic":"visual","points":3,"stem":"Четыре снимка шва. На каком — непровар корня (группа 400)?","vopts":[{"id":"v0","v":{"g":"film","p":{"kind":"pores","n":5}},"lbl":"","correct":false,"rationale":"Круглые тёмные пятна — поры, группа 200."},{"id":"v1","v":{"g":"film","p":{"kind":"lop"}},"lbl":"","correct":true,"rationale":"Прямая тёмная линия по оси шва — несплавленные кромки корня, группа 400."},{"id":"v2","v":{"g":"film","p":{"kind":"slag"}},"lbl":"","correct":false,"rationale":"Угловатое тёмное пятно — шлаковое включение, группа 300."},{"id":"v3","v":{"g":"film","p":{"kind":"crack"}},"lbl":"","correct":false,"rationale":"Тонкая извилистая линия — трещина, группа 100."}]}],"framework":"Шесть групп: 100 трещина, 200 пора, 300 включение, 400 непровар, 500 форма, 600 прочее. Смотри при 500 лк на зачищенных 20 мм с каждой стороны, обе стороны, кратеры — и называй группу, а не «дырку».","anchor":{"g":"weldx","p":{"s":6,"g":2,"h":1,"pores":3,"root":"lack","lbl":"назови группу"},"cap":"назови группу: канавка по краю — 500, ямки — 200, бороздка в корне — 400"},"layers":{"simple":"Врач не говорит «что-то болит» — он называет: перелом, ушиб, растяжение. У шва тоже есть шесть «диагнозов», и каждый выглядит по-своему. Трещина — тонкая извилистая тёмная ниточка, чаще в конце шва, как волос на стекле. Пора — круглая ямка с гладкими стенками, как дырочка в хлебе. Включение — угловатый тёмный кусочек шлака, застрявший между проходами, как камешек в бетоне. Непровар — бороздка снизу, где два края так и не слиплись, как клей, не дошедший до дна щели. Дефекты формы — всё, что не так по размеру: канавка по краю шва, горб выше 3 мм, ступенька между пластинами, дыра насквозь, натёк. И прочее — брызги, которые счищаются.\nЧтобы увидеть всё это, нужен свет не хуже, чем на кухне, — 500 лк, зачищенная полоса по 20 мм с каждой стороны шва, лупа для сомнительных мест и обязательно обе стороны пластины: самое важное прячется снизу.\nУченик называет любую ямку «дыркой», а любую линию «царапиной». Контролёр называет группу — и от группы зависит, что делать: трещину вырезают всегда, брызги просто счищают. Проверь себя: чем трещина на вид отличается от царапины щёткой?","how":"1. Готовишь условия: свет не ниже 500 лк, зачистка на 20 мм в обе стороны от шва (при ширине шва 10 мм — полоса 50 мм), шаблон УШС-3 и лупа 2–7× под рукой.\n2. Смотришь лицевую сторону и называешь по виду: извилистая тонкая линия с острыми концами — 100 трещина; круглые ямки — 200 поры; угловатое тёмное пятно между проходами — 300 шлак; канавка по краю, горб, ступенька, дыра, натёк — 500 форма; шарики на листе — 600 брызги.\n3. Переворачиваешь: ровная тёмная бороздка по оси обратной стороны — 400 непровар корня; валик лёг на кромку, не расплавив её, — 400 несплавление.\n4. Меряешь форму шаблоном: канавка по краю 0,8 мм при норме ≤ 0,5 мм — дефект; горб 4,5 мм при норме 0,5–3 — дефект; ступенька 1,5 мм на 6 мм при допуске 0,6 — дефект.\n5. Решаешь по группе: 100 — недопустимо всегда; 400 в корне ответственного стыка — недопустимо; 200 и 300 — по таблице класса и толщины; 500 — по норме размера; 600 — счистить.\n6. Записываешь: «стык 2, лицевая: подрез 0,8 мм, 40 мм длины; корень: непровар 60 мм» — и показываешь наставнику.","formula":{"f":"вид → группа:  извилистая линия → 100 · круглая ямка → 200 · угловатое пятно → 300 · бороздка в корне → 400 · размер не по норме → 500 · брызги → 600","legend":[["100","трещины — недопустимы всегда","ниточка из кратера"],["200","полости, поры","цепочка ямок"],["300","твёрдые включения — шлак, вольфрам","пятно между проходами"],["400","несплавления и непровары","бороздка в корне"],["500","форма: подрез h ≤ 0,5 мм, усиление g 0,5–3 мм, e ≤ 0,1·s","h 0,8 мм"],["600","прочие — брызги, задиры","шарики на листе"]],"note":"Группа по виду — за секунду, допустимость — по норме класса и толщины: число пор для класса 1 и класса 7 разное, а трещина не проходит нигде."},"pitfalls":"Опытные ошибаются в сторону «мелочи»: подрез 0,8 мм на фоне идеального валика кажется тенью, и в акте ВИК пишут «годен», а при повторном осмотре II уровня стоит «подрез 0,8 > 0,5, устранить» — и стык возвращается сварщику. Второй капкан — зачистка только самого шва: при полосе 10 мм вместо 50 мм трещина в околошовной зоне остаётся под окалиной, пока её не найдёт рентген. Третий — лицевая сторона: пластина красивая, корень не перевернули, непровар 60 мм уехал в сдачу. Вопрос, который вскрывает все три: «какую группу ты назвал и чем мерил?». Ответ «ну, царапина какая-то» означает, что осмотра не было. Под давлением сроков отвечай: «шаблон и переворот — минута на стык; вырезка трубы Ø 530 мм после рентгена — 25–60 тыс. ₽ и смена». На следующем грейде это станет актом ВИК с номером стыка и подписью, и спор «тень или подрез» решится числом h в миллиметрах.","checks":[{"q":"Чем трещина на вид отличается от царапины щёткой?","o":["Трещина прямая и блестит металлом, царапина извивается и темнеет от окислов","Трещина извилистая и тёмная, царапина прямая и светлая внутри","Они не различимы глазом — только шаблоном УШС-3 по глубине канавки"],"a":1,"w":"Трещина — разрыв с окисленными стенками, ветвится и темнеет; риска от щётки прямая и блестит металлом."},{"q":"На обратной стороне стыка ровная тёмная бороздка по оси, лицевая сторона ровная. Какая группа?","o":["500 — дефект формы корня, мерить шаблоном","300 — шлак первого прохода вытек вниз","400 — непровар корня, кромки не сплавились"],"a":2,"w":"Бороздка по оси корня — следы несплавленных кромок; это группа 400, недопустимо для ответственного стыка."},{"q":"По схеме «вид → группа»: круглые ямки с гладкими стенками цепочкой по валику. Что это и о чём говорит?","o":["200 поры — защита ванны была сорвана","300 включения — шлак не успел всплыть","600 брызги — слишком длинная дуга"],"a":0,"w":"Круглая гладкая полость — газ; цепочка по длине говорит о сорванной защите (ветер, расход, влага)."},{"q":"Контролёр зачистил только сам шов шириной 10 мм вместо полосы 50 мм. Что он рискует пропустить?","o":["Горб усиления выше нормы 3 мм по центру шва","Трещину или подрез в околошовной зоне под окалиной","Поры внутри валика, видимые только на снимке"],"a":1,"w":"Зачистка 20 мм в обе стороны нужна именно для околошовной зоны: там подрез и трещины от кратера."}],"rules":["100 трещина — извилистая тёмная линия с острыми концами; недопустима всегда, показать, не шлифовать.","200 пора — круглая, 300 включение — угловатое; допустимость — по таблице класса и толщины.","400 непровар — бороздка по оси корня; с лицевой стороны не виден, пластину переворачивать первой.","500 форма меряется шаблоном: подрез ≤ 0,5 мм, усиление 0,5–3 мм, смещение ≤ 0,1·s.","ВИК: 500 лк, зачистка 20 мм в обе стороны, лупа 2–7×, обе стороны и кратеры; называть группу, а не «дырку»."]}},{"id":"u0-5","level":"L0","title":"Первая смена безопасно","lead":"Пост готов, когда убрано горючее, сухие руки и баллон закреплён","concept":"Сварочный пост опасен четырьмя вещами сразу: электричеством (на держателе напряжение холостого хода, мокрые рукавицы делают тело частью цепи), огнём (брызги летят на метры, ветошь и масло рядом загораются через минуты), газом под давлением (баллон без колпака с отбитым вентилем — снаряд, кислородный редуктор с маслом — взрыв) и излучением дуги (ожог глаз «зайчиками» и кожи ультрафиолетом). Правила ученика конкретны: горючее убрать на расстояние не ближе 5 м или закрыть ширмой; рукавицы и обувь сухие, кабели без оголений, масса на изделии; баллон закреплён цепью, вентиль открывать плавно, редуктор кислородный — без следов масла, на ацетилене — обратный клапан; маска опущена до зажигания дуги, вытяжка включена. Огневые работы вне цеха — только по наряду-допуску с пожарным постом, высота — страховочная привязь, замкнутое пространство — газоанализ и наблюдающий снаружи. Ученик чаще всего ошибается не от незнания, а от спешки: «подержу баллон без колпака», «докурю рядом с постом», «зажгу дугу, а маску потом» — каждая из этих мелочей в журнале несчастных случаев.","points":[{"h":"Электричество: сухие руки и целые кабели","t":"Пока дуга не горит, на держателе напряжение холостого хода источника; при сырых рукавицах и потной спецодежде сопротивление тела падает, и ток идёт через человека. Поэтому рукавицы сухие, обувь на резиновой подошве, кабели без оголённых жил, зажим массы — на изделии или стальном столе, а не на батарее отопления. Инвертор заземлён. Электрод меняют только в рукавице; держатель на пол не кладут — он может замкнуть на стол и зажечь дугу под кем-то."},{"h":"Огонь: 5 метров и ширма","t":"Брызги при 150 А летят на 2–3 м и прожигают ветошь, пластик, промасленные опилки. Ориентир: горючее убрать не ближе 5 м от поста или отгородить негорючей ширмой; огнетушитель и ведро с песком — у поста, ты знаешь, где они, до первого шва. После смены пост осматривают: тлеющая ветошь даёт пожар через час, когда никого нет. Огневые работы вне постоянного поста — только по наряду-допуску с назначенным пожарным постом, и ученик их один не ведёт."},{"h":"Баллон: колпак, цепь, плавный вентиль, редуктор без масла","t":"Баллон аргона — 150 атмосфер в стальной бочке. Переносят только с колпаком: отбитый вентиль превращает баллон в реактивный снаряд. У поста баллон стоит в цепи или хомуте, чтобы не упал. Вентиль открывают плавно, стоя сбоку от редуктора — мембрана может лопнуть. Кислородный редуктор и вентиль — без единого масляного пятна: масло в кислороде самовоспламеняется. На ацетилене — обратный клапан против обратного удара пламени. Ученик баллоны не перекатывает и редукторы не меняет — это делает наставник."},{"h":"Дуга и дым: маска, кожа, вытяжка","t":"Дуга излучает ультрафиолет: 10 секунд без маски — и вечером «песок в глазах», ожог роговицы. Маска опускается до зажигания дуги, светофильтр — по таблице маски для твоего тока, а не «потемнее». Открытая кожа на шее и запястьях за смену получает ожог как на пляже. Дым от обмазки и особенно от нержавейки (хром, никель) — вытяжка у поста обязательна, а в замкнутом объёме без газоанализа и наблюдающего снаружи варить нельзя. Рядом стоящих защищает ширма: «зайчиков» ловят те, кто просто прошёл мимо."},{"h":"Как смотрит наставник: 30 секунд перед дугой","t":"Опытный сварщик перед первой дугой делает один круг глазами: горючее дальше 5 м или за ширмой, кабели целы, масса на изделии, баллон закреплён и редуктор сухой, рукавицы и обувь сухие, маска на голове, вытяжка гудит, огнетушитель на месте. Это 30 секунд, и они повторяются каждую смену, даже на тысячной. На следующем грейде добавятся наряд-допуск, страховочная привязь на высоте и газоанализ в замкнутом пространстве; ученику достаточно, чтобы 30-секундный круг стал рефлексом."}],"practice":{"id":"u0-5-pr","mechanic":"ranking","points":3,"stem":"Первая смена, учебный пост с инвертором и баллоном аргона. Расставь действия в правильном порядке — от прихода на пост до первого шва.","options":[{"id":"r0","text":"Осмотреть зону: горючее убрать не ближе 5 м или закрыть ширмой, найти огнетушитель","why":"Сначала зона: пожар — самое дорогое, что можно устроить"},{"id":"r1","text":"Проверить оборудование: кабели без оголений, масса на изделии, баллон в цепи, редуктор без масла","why":"Потом железо: электричество и газ проверяют до того, как трогать"},{"id":"r2","text":"Надеть сухие рукавицы, спецодежду с закрытыми запястьями, включить вытяжку","why":"Защита себя — после того, как пост безопасен для всех"},{"id":"r3","text":"Опустить маску и зажечь пробную дугу на учебной пластине, не на столе","why":"Дуга — только с опущенной маской и на изделии"}],"solution":"Порядок: зона (5 м, ширма, огнетушитель) → оборудование (кабели, масса, баллон, редуктор) → СИЗ и вытяжка → маска → пробная дуга на пластине. Сначала безопасность для всех вокруг, потом для себя, потом дуга."},"test":[{"id":"u0-5-q1","mechanic":"single","points":2,"stem":"Ученик к концу смены жалуется: «в глазах песок, слезятся». Маску он опускал «сразу после зажигания дуги». Что произошло?","options":[{"id":"o0","text":"Ожог глаз ультрафиолетом дуги: маска должна быть опущена до зажигания","correct":true,"rationale":"Даже 10 секунд открытой дуги за смену в сумме дают ожог роговицы — «зайчики» проявляются к вечеру."},{"id":"o1","text":"Пересушил глаза вытяжкой: вентилятор у поста гонит воздух в лицо","correct":false,"rationale":"Поток воздуха не вызывает ожог роговицы с болью и слезотечением; это типичная картина УФ-ожога."},{"id":"o2","text":"Надышался дымом обмазки: раздражение глаз от газов покрытия","correct":false,"rationale":"Дым раздражает горло и нос; «песок в глазах» к вечеру — классика после открытой дуги."},{"id":"o3","text":"Светофильтр слишком тёмный: глаза устали напрягаться в маске","correct":false,"rationale":"Тёмный фильтр утомляет, но не даёт ожога; боль и слёзы — от излучения, которое фильтр не закрыл."}]},{"id":"u0-5-q2","mechanic":"single","points":2,"stem":"На кислородном редукторе у газового поста ученик заметил масляное пятно от рукавицы. Редуктор исправен, давление держит. Что делать?","options":[{"id":"o0","text":"Не использовать: масло в кислороде самовоспламеняется, доложить наставнику","correct":true,"rationale":"Кислород под давлением окисляет масло со взрывом; исправность редуктора здесь не имеет значения."},{"id":"o1","text":"Протереть ветошью насухо и работать: пятно снаружи, в газ не попадёт","correct":false,"rationale":"Следы масла остаются в порах и резьбе; при открытии вентиля струя кислорода их найдёт."},{"id":"o2","text":"Работать, но открыть вентиль медленнее обычного, чтобы не разогреть","correct":false,"rationale":"Скорость открытия не отменяет самовоспламенения масла в кислороде."},{"id":"o3","text":"Переставить редуктор на баллон аргона: аргон инертный, масло не опасно","correct":false,"rationale":"Кислородный редуктор не ставят на другие газы, и загрязнённый редуктор в работу не идёт."}],"anchor":{"g":"wording","p":{"bad":"«протру ветошью — пятно же снаружи»","good":"редуктор с маслом в работу не идёт — доложить"},"cap":"кислород + масло = самовоспламенение; исправность редуктора не спасает"}},{"id":"u0-5-q3","mechanic":"sjt_bw","points":3,"stem":"Наставник вышел. Сосед по посту просит: «Помоги перекатить баллон аргона к моему посту, колпак искать некогда, тут 5 метров». Что делаешь?","options":[{"id":"s0","text":"Отказываюсь и предлагаю дождаться наставника; без колпака баллон не перемещают","correct":true,"rationale":"Отбитый при падении вентиль превращает баллон в снаряд; ученик к баллонам без наставника не прикасается."},{"id":"s1","text":"Помогаю: держу баллон вдвоём, 5 метров по ровному полу — риска нет","correct":false,"rationale":"Падение на 5 метрах пути так же вероятно, как на 50; без колпака вентиль не защищён."},{"id":"s2","text":"Предлагаю не катить, а подтянуть шланг от его редуктора к моему баллону","correct":false,"rationale":"Удлинение шланга через цех — спотыкание и перегиб, но хотя бы баллон не трогают."},{"id":"s3","text":"Иду искать колпак сам, чтобы потом перекатить баллон вдвоём","correct":false,"rationale":"Колпак — правильно, но перекатывать баллон ученик всё равно должен только с наставником."}],"worst":"s1","worstRationale":"Перекатить баллон без колпака «на 5 метров» — худшее: одно падение, и вентиль отбит."},{"id":"u0-5-q4","mechanic":"multi","points":3,"stem":"Что из увиденного перед сменой запрещает зажигать дугу, пока не исправлено?","options":[{"id":"o0","text":"Рукавицы влажные после мытья пола в цехе","correct":true,"rationale":"Мокрые рукавицы — путь тока через тело при напряжении холостого хода."},{"id":"o1","text":"Ветошь с маслом лежит в 2 м от поста","correct":true,"rationale":"Горючее ближе 5 м без ширмы — брызги при 150 А долетают и поджигают."},{"id":"o2","text":"На сварочном кабеле оголённая жила длиной 3 см","correct":true,"rationale":"Оголение — замыкание на стол или человека; кабель заменить или заизолировать."},{"id":"o3","text":"Температура воздуха в цехе +18 °C при сварке пластин 6 мм","correct":false,"rationale":"Подогрев нужен углеродистым сталям при −10…0 °C и толщинах > 20 мм; +18 °C — норма."}]},{"id":"v0-5-a","mechanic":"visual","points":3,"stem":"Ориентир: горючее не ближе 5 м от поста. На какой картинке ветошь можно оставить без ширмы?","vopts":[{"id":"v0","v":{"g":"weeks","p":{"w":[1.5],"ax":"до горючего, м","max":8,"ref":5,"refl":"5 м"}},"lbl":"","correct":false,"rationale":"1,5 м — брызги при 150 А летят на 2–3 м, ветошь загорится."},{"id":"v1","v":{"g":"weeks","p":{"w":[3],"ax":"до горючего, м","max":8,"ref":5,"refl":"5 м"}},"lbl":"","correct":false,"rationale":"3 м — ниже ориентира 5 м; нужна ширма или перенос."},{"id":"v2","v":{"g":"weeks","p":{"w":[6],"ax":"до горючего, м","max":8,"ref":5,"refl":"5 м"}},"lbl":"","correct":true,"rationale":"6 м — столбик выше линии 5 м: допустимо без ширмы."},{"id":"v3","v":{"g":"weeks","p":{"w":[4.5],"ax":"до горючего, м","max":8,"ref":5,"refl":"5 м"}},"lbl":"","correct":false,"rationale":"4,5 м — чуть ниже линии: «почти 5» — это не 5, брызги долетают."}]}],"framework":"Перед дугой — 30-секундный круг: горючее ≥ 5 м или ширма, кабели целы, масса на изделии, баллон в цепи и редуктор без масла, сухие рукавицы, маска опущена до дуги, вытяжка включена.","anchor":{"g":"wording","p":{"bad":"«ветошь в двух метрах, успею потушить»","good":"горючее ≥ 5 м или ширма; маска до дуги"},"cap":"30-секундный круг перед дугой: зона, кабели, баллон, маска"},"layers":{"simple":"Горящая свеча на столе безопасна, пока рядом нет занавески, под ней не стоит лужа, а ты не трогаешь фитиль мокрыми руками. Сварочный пост — та же свеча, только искры летят на три метра, в держателе — напряжение, а в углу стоит баллон, в котором газ сжат в сто пятьдесят раз.\nОтсюда четыре привычки первого дня. Огонь: всё, что горит, — ветошь, масло, пластик — дальше 5 м или за ширмой; огнетушитель ты нашёл глазами до первой искры. Электричество: рукавицы и обувь сухие, кабели без оголённых мест, зажим массы на пластине, а не на батарее. Баллон: стоит в цепи, переносится только с колпаком, вентиль открывают плавно, на кислородном редукторе ни пятнышка масла — масло в кислороде вспыхивает само. Излучение: маска опущена до того, как зажёг дугу, запястья закрыты, вытяжка включена — дуга жжёт глаза и кожу, как солнце на пляже, только за секунды.\nСамое опасное в первый день — не незнание, а спешка: «подержу баллон без колпака», «маску потом». Проверь себя: что делать, если на кислородном редукторе ты увидел масляное пятно?","how":"1. Зона: убираешь горючее не ближе 5 м от поста или ставишь негорючую ширму; смотришь, где огнетушитель и песок. Пример: ветошь с маслом в 2 м — уносишь на 6 м.\n2. Электричество: осматриваешь кабели по длине — оголённая жила 3 см означает замену или изоляцию; зажим массы ставишь на пластину или стальной стол; проверяешь, что инвертор заземлён.\n3. Газ: баллон в цепи или хомуте; редуктор сухой, без масла; вентиль открываешь плавно, стоя сбоку. Перекатывать баллон или менять редуктор — только наставник.\n4. Себя: сухие рукавицы, застёгнутая куртка с закрытыми запястьями, обувь на резиновой подошве; вытяжка включена, рядом с соседом — ширма.\n5. Дуга: маска опущена до зажигания, светофильтр по таблице маски для твоего тока (например, 120 А); первая дуга — на учебной пластине, не на столе.\n6. После смены: осмотр поста на тлеющую ветошь, инвертор выключен, вентиль баллона закрыт. На этот круг уходит 30 секунд до смены и минута после — каждую смену.","formula":{"f":"пост готов = горючее ≥ 5 м (или ширма)  И  кабели целы + масса на изделии + сухие рукавицы  И  баллон в цепи + редуктор без масла  И  маска до дуги + вытяжка","legend":[["5 м","расстояние до горючего, м (ориентир)","6"],["кабели целы","нет оголений, длина осмотра — весь кабель","3 см оголения → замена"],["редуктор без масла","кислород + масло = самовоспламенение","пятно → не работать"],["маска до дуги","светофильтр по таблице маски для тока","120 А"]],"note":"Схема — связка «И»: один мокрый элемент или одна ветошь в 2 м обнуляют всё остальное. Огневые вне поста, высота и замкнутые объёмы добавят свои условия на следующем грейде."},"pitfalls":"Опытные травмируются на «мелочах», которые делали тысячу раз: баллон «на пять метров» без колпака, электрод вставляют голой рукой «на секунду», маску поднимают, чтобы «посмотреть, как легло», пока сосед ещё варит. В журнале смены это выглядит как запись «ожог глаз, 2 дня нетрудоспособности» у человека с двадцатилетним стажем. Второй капкан — кислородный редуктор после рукавицы в масле: «протёр ветошью» не очищает резьбу, и при открытии вентиля струя кислорода находит остаток. Третий — зона: ветошь «же в двух метрах» загорается от брызг при 150 А через полчаса после ухода бригады. Вопрос, который вскрывает все три: «ты сам это проверял сегодня или помнишь со вчера?». Под давлением сроков отвечай: «30-секундный круг — я его уже делаю», а не «потом». На следующем грейде добавятся наряд-допуск на огневые вне поста, страховочная привязь и газоанализ в замкнутом объёме, но привычка круга — отсюда.","checks":[{"q":"На кислородном редукторе масляное пятно от рукавицы. Редуктор исправен и держит давление. Что делать?","o":["Протереть насухо ветошью и работать: давление держит","Не использовать: масло в кислороде самовоспламеняется, доложить","Работать, но открывать вентиль медленнее обычного"],"a":1,"w":"Кислород под давлением окисляет масло со взрывом; исправность редуктора здесь не имеет значения."},{"q":"В круге перед дугой: ветошь с маслом в 2 м от поста, огнетушитель на месте. Что делаешь первым?","o":["Убираю ветошь дальше 5 м, потом остальное","Начинаю варить: огнетушитель рядом, при искре успею потушить","Прошу соседа по посту следить за ветошью, пока варю"],"a":0,"w":"Брызги при 150 А летят на 2–3 м; горючее должно быть дальше 5 м или за ширмой до первой искры."},{"q":"По схеме «пост готов = … И … И …» всё в норме, кроме влажных рукавиц. Пост готов?","o":["Готов на 90 %: рукавицы высохнут от первого шва","Готов, если масса надёжно стоит на пластине","Не готов: связка «И» — один мокрый элемент обнуляет всё"],"a":2,"w":"Мокрые рукавицы — путь тока через тело при напряжении холостого хода; одно «нет» ломает всю схему."},{"q":"Сварщик со стажем 20 лет поднимает маску «на секунду посмотреть шов», пока сосед варит. Что он рискует получить?","o":["Ожог глаз от чужой дуги, «зайчики» к вечеру","Ничего: его собственная дуга в этот момент уже погашена","Усталость глаз от резкого перепада яркости в маске"],"a":0,"w":"Дуга соседа излучает тот же УФ; секунды складываются, и роговица получает ожог — поэтому между постами ширма."}],"rules":["Пока дуга не горит, на держателе напряжение холостого хода: сухие рукавицы, целые кабели, масса на изделии.","Горючее дальше 5 м или за ширмой; огнетушитель найден глазами до первой искры; осмотр поста после смены.","Баллон в цепи, переносят только с колпаком, вентиль плавно, кислородный редуктор без масла; ученик баллоны не трогает.","Маска опущена до дуги, фильтр по таблице маски, запястья закрыты, вытяжка включена, соседей закрывает ширма.","30-секундный круг перед дугой — каждую смену, и на тысячной тоже."]}},{"id":"u0-6","level":"L0","title":"Кто кому что должен: клеймо, журнал, контролёр, надзор","lead":"Шов подписывает тот, кто варил; годность решает тот, кто контролировал","concept":"Сварной шов на опасном объекте — это не только металл, но и цепочка ответственности. Сварщик с действующим удостоверением НАКС (I уровень, срок 2 года) варит шов и ставит рядом с ним своё клеймо — личный номер, по которому через десять лет найдут, кто варил. Мастер ведёт журнал сварочных работ: дата, стык, марка стали, электроды, режим, клеймо. Контролёр (дефектоскопист) смотрит шов: I уровень НК выполняет контроль по карте и записывает результаты, но заключение не выдаёт; II уровень настраивает приборы, оценивает и подписывает заключение; III уровень решает спорные случаи и руководит лабораторией; удостоверение по методу действует 3 года. Надзор (Ростехнадзор) проверяет всю цепочку по документам: нет клейма, нет записи в журнале, нет удостоверения — шов юридически не существует, а работа на опасном объекте без допуска стоит до 400 тыс. ₽ штрафа (ориентир). Ученик без удостоверения варит только учебные пластины, своё клеймо не имеет и чужое не ставит — даже «по просьбе наставника». С 01.03.2027 аттестацию на опасных объектах заменит проверка готовности через центры СРО, но документы, выданные раньше, действуют до конца срока.","points":[{"h":"Клеймо — подпись сварщика на металле","t":"Клеймо — личный номер сварщика, выбитый или нанесённый краской рядом со швом (обычно в 50–100 мм от него по норме объекта). Клеймо ставит только тот, кто варил шов, и только имея действующее удостоверение НАКС на этот способ и группу. Чужое клеймо на своём шве — подлог: при аварии ответственность ляжет на того, чей номер стоит, а виноват будет тот, кто варил. Ученик клейма не имеет; на учебной пластине он пишет свою фамилию маркером — и это та же привычка: за шов отвечает автор."},{"h":"Журнал сварки — память объекта","t":"Журнал сварочных работ ведёт мастер или руководитель работ: номер стыка, дата, марка стали (например, 08Х18Н10Т), способ (РАД), сварочные материалы с партией, режим (I, U, полярность), клеймо сварщика, результат контроля. Запись «стык 12, РАД, 110 А, клеймо 47, ВИК годен» через год позволяет ответить на любой вопрос надзора. Нет записи — стык нельзя предъявить. Ученик пока заполняет учебный журнал по каждой пластине: d, I, полярность, что получилось — та же дисциплина."},{"h":"Уровни НК: кто смотрит, кто подписывает","t":"Дефектоскопист I уровня выполняет контроль по утверждённой карте и фиксирует результаты — заключения он не выдаёт. II уровень настраивает аппаратуру, проводит контроль, оценивает и подписывает заключение, разрабатывает карты и руководит I уровнем. III уровень разрабатывает методики, обучает, аттестует и решает спорные случаи. Удостоверение по методу действует 3 года. Ученик-сварщик должен знать, что «годен» ему говорит не наставник и не мастер, а контролёр с удостоверением II уровня, подписавший заключение."},{"h":"Надзор смотрит документы, а не шов","t":"Инспектор Ростехнадзора проверяет цепочку: удостоверение сварщика действует и покрывает способ и группу; клеймо на стыке совпадает с журналом; заключение контроля подписано II уровнем; материалы с сертификатами. Шов без клейма или без записи — не существует юридически, даже если он идеален. Сварка на опасном объекте без допуска — ч. 1 ст. 9.1 КоАП, ориентир штрафа до 400 тыс. ₽ (ncpo.ru, 05.2026), плюс остановка работ. Ученику важно одно: «я просто помог заварить» на объекте — это нарушение, а не помощь."},{"h":"Что меняется с 01.03.2027","t":"По 94-ФЗ от 09.04.2026 с 1 марта 2027 года аттестацию на опасных объектах заменяет «проверка готовности к выполнению сварочных работ» через центры СРО; удостоверения, выданные раньше, действуют до конца своего срока (для сварщика I уровня — 2 года с даты выдачи); для специалистов сварочного производства вводится независимая оценка квалификации по профстандарту. Для ученика это значит: путь в профессию — разряд в учебном центре, затем проверка готовности или аттестация по способу и группе. Без документа — только учебные пластины."}],"practice":{"id":"u0-6-pr","mechanic":"matching","points":3,"stem":"Кто за что отвечает: сопоставь действие с тем, кто его выполняет или подписывает.","pairs":[{"l":"Ставит клеймо рядом со сварным швом","r":"сварщик, который варил, с действующим удостоверением"},{"l":"Записывает стык, режим и клеймо в журнал сварочных работ","r":"мастер или руководитель сварочных работ"},{"l":"Проводит контроль по карте, записывает результат, заключение не выдаёт","r":"дефектоскопист I уровня"},{"l":"Оценивает результат и подписывает заключение о годности","r":"дефектоскопист II уровня"},{"l":"Проверяет удостоверения, клейма и журналы по всей цепочке","r":"инспектор надзора (Ростехнадзор)"},{"l":"Варит только учебные пластины и клейма не имеет","r":"ученик без удостоверения"}],"solution":"Сварщик варит и клеймит, мастер ведёт журнал, I уровень НК контролирует и записывает, II уровень оценивает и подписывает заключение, III уровень решает спорное, надзор проверяет цепочку документов. Ученик — только учебные пластины."},"test":[{"id":"u0-6-q1","mechanic":"single","points":2,"stem":"На опасном объекте нужно срочно заварить стык. Сварщик с удостоверением занят, ученик умеет держать дугу. Мастер говорит: «Завари, клеймо Иванова поставим». Как это правильно назвать?","options":[{"id":"o0","text":"Подлог: шов без допуска под чужим клеймом, ответственность ляжет на Иванова","correct":true,"rationale":"Клеймо — подпись сварщика; чужое клеймо на чужом шве — подделка документа, а работа без допуска — ч. 1 ст. 9.1 КоАП."},{"id":"o1","text":"Обычная практика: клеймо принадлежит бригаде, а не человеку","correct":false,"rationale":"Клеймо личное, закреплено за сварщиком с удостоверением; «бригадного» клейма не существует."},{"id":"o2","text":"Допустимо при условии, что Иванов потом осмотрит шов и согласится","correct":false,"rationale":"Осмотр не превращает ученика в аттестованного сварщика; удостоверение покрывает того, кто варит."},{"id":"o3","text":"Допустимо, если стык затем пройдёт контроль у дефектоскописта II уровня","correct":false,"rationale":"Годность по контролю не отменяет отсутствие допуска; надзор проверяет оба документа."}],"anchor":{"g":"wording","p":{"bad":"«заварю я, клеймо поставим Иванова»","good":"варит и клеймит только аттестованный сварщик"},"cap":"чужое клеймо на своём шве — подлог, а не помощь"}},{"id":"u0-6-q2","mechanic":"single","points":2,"stem":"Дефектоскопист I уровня осмотрел стык по карте, дефектов не нашёл. Мастер просит его подписать заключение «годен». Что верно?","options":[{"id":"o0","text":"Заключение подписывает II уровень; I уровень только фиксирует результат контроля","correct":true,"rationale":"По уровням НК I уровень выполняет контроль по карте и записывает, оценку и заключение даёт II уровень."},{"id":"o1","text":"I уровень вправе подписать, если дефектов не найдено и карта соблюдена","correct":false,"rationale":"Право подписи не зависит от результата: заключение выдаёт только II уровень."},{"id":"o2","text":"Заключение может подписать мастер, раз он отвечает за участок","correct":false,"rationale":"Мастер не аттестован по методу НК; заключение — документ дефектоскописта II уровня."},{"id":"o3","text":"Подписывает сварщик, который варил стык, вместе с I уровнем","correct":false,"rationale":"Сварщик — сторона, которую контролируют; он заключение о своём шве не подписывает."}]},{"id":"u0-6-q3","mechanic":"single","points":2,"stem":"Удостоверение сварщика НАКС выдано 15.03.2025. Когда оно перестаёт действовать и что с ним будет после 01.03.2027?","options":[{"id":"o0","text":"Действует до 15.03.2027 — два года, независимо от даты 01.03.2027","correct":true,"rationale":"Удостоверение I уровня — 2 года; выданные до 01.03.2027 действуют до конца своего срока."},{"id":"o1","text":"Действует до 15.03.2028 — три года, как любое удостоверение по методу НК","correct":false,"rationale":"3 года — срок удостоверения дефектоскописта по методу; у сварщика НАКС — 2 года."},{"id":"o2","text":"Прекращает действовать 01.03.2027 вместе с отменой аттестации на опасных объектах","correct":false,"rationale":"Закон сохраняет действие ранее выданных документов до конца их срока."},{"id":"o3","text":"Действует бессрочно, пока сварщик не сменит способ сварки или группу объектов","correct":false,"rationale":"Срок у удостоверения конечный — 2 года, затем продление или проверка готовности."}]},{"id":"u0-6-q4","mechanic":"sjt_bw","points":3,"stem":"Учебный цех. Наставник отошёл, звонит мастер соседнего участка: «Пришли ученика на час, там на трубе 530 мм корень подварить, рядом буду я». Что делаешь?","options":[{"id":"s0","text":"Отказываюсь: на объекте варит только аттестованный сварщик; передаю просьбу наставнику","correct":true,"rationale":"Ученик без удостоверения на производственном стыке — работа без допуска, какой бы ни была подстраховка."},{"id":"s1","text":"Иду: мастер рядом, а корень на пластинах у меня уже получается ровно","correct":false,"rationale":"Учебная пластина и труба 530 мм под давлением — разные вещи; и допуска нет ни при каком мастере."},{"id":"s2","text":"Иду, но только зачистить и подготовить стык, не касаясь дуги","correct":false,"rationale":"Подготовка под присмотром возможна, но решает это наставник, а не звонок мастера."},{"id":"s3","text":"Прошу мастера прислать письменный запрос наставнику на моё участие","correct":false,"rationale":"Бумага не даёт допуска; вопрос решается не формой запроса, а удостоверением."}],"worst":"s1","worstRationale":"Пойти варить корень на трубе без удостоверения — худшее: «мастер рядом» не заменяет допуска, а клеймо на стык ставить некому."},{"id":"v0-6-a","mechanic":"visual","points":3,"stem":"Срок действия документов. На какой картинке показан срок удостоверения сварщика НАКС (I уровень)?","vopts":[{"id":"v0","v":{"g":"weeks","p":{"w":[1],"ax":"лет","max":5,"ref":2,"refl":""}},"lbl":"","correct":false,"rationale":"1 год — такого срока у удостоверения НАКС нет."},{"id":"v1","v":{"g":"weeks","p":{"w":[3],"ax":"лет","max":5,"ref":2,"refl":""}},"lbl":"","correct":false,"rationale":"3 года — срок удостоверения дефектоскописта по методу, не сварщика."},{"id":"v2","v":{"g":"weeks","p":{"w":[5],"ax":"лет","max":5,"ref":2,"refl":""}},"lbl":"","correct":false,"rationale":"5 лет — ни у сварщика, ни у дефектоскописта такого срока нет."},{"id":"v3","v":{"g":"weeks","p":{"w":[2],"ax":"лет","max":5,"ref":2,"refl":""}},"lbl":"","correct":true,"rationale":"2 года — срок удостоверения сварщика I уровня; столбик ровно на пунктире."}]},{"id":"v0-6-b","mechanic":"visual","points":3,"stem":"Два документа на одном посту. На какой картинке пара «сварщик НАКС / дефектоскопист по методу» показана с верными сроками?","vopts":[{"id":"v0","v":{"g":"split","p":{"na":2,"nb":3,"la":"сварщик","lb":"НК"}},"lbl":"","correct":true,"rationale":"Сварщик — 2 года, дефектоскопист по методу — 3 года: столбик НК выше."},{"id":"v1","v":{"g":"split","p":{"na":3,"nb":2,"la":"сварщик","lb":"НК"}},"lbl":"","correct":false,"rationale":"Сроки перепутаны местами: 3 года — у дефектоскописта, не у сварщика."},{"id":"v2","v":{"g":"split","p":{"na":2,"nb":2,"la":"сварщик","lb":"НК"}},"lbl":"","correct":false,"rationale":"Сроки разные: у НК удостоверение по методу действует 3 года."},{"id":"v3","v":{"g":"split","p":{"na":3,"nb":3,"la":"сварщик","lb":"НК"}},"lbl":"","correct":false,"rationale":"У сварщика I уровня срок 2 года, а не 3."}]}],"framework":"Варил — клеймишь; мастер пишет журнал; I уровень НК смотрит и записывает; II уровень подписывает заключение; надзор сверяет документы. Без удостоверения — только учебные пластины, чужое клеймо не ставить.","anchor":{"g":"wording","p":{"bad":"«завари, клеймо Иванова поставим»","good":"клеймо своё с допуском; заключение — II уровень"},"cap":"шов подписывает тот, кто варил; годность — тот, кто контролировал"},"layers":{"simple":"Когда повар готовит в ресторане, его имя стоит в меню, заказ записан в журнале, блюдо пробует шеф, а проверяет всё санитарная инспекция. У шва та же цепочка. Сварщик варит и ставит рядом со швом клеймо — свой личный номер, как подпись на картине: по нему через десять лет найдут автора. Мастер записывает в журнал, какой стык, какая сталь, какие электроды, какой ток и чьё клеймо. Контролёр смотрит шов: младший контролёр смотрит и записывает, старший — решает «годен» и подписывает. Инспектор надзора проверяет не шов, а бумаги: есть ли у сварщика удостоверение, совпадает ли клеймо с журналом, кто подписал заключение.\nДля ученика правило простое: без удостоверения ты варишь только учебные пластины. У тебя нет клейма, и ты не ставишь чужое, даже если очень просят. На учебной пластине ты пишешь свою фамилию маркером — это та же привычка: за шов отвечает тот, кто его сделал.\nЧисла, которые стоит запомнить: удостоверение сварщика действует 2 года, удостоверение контролёра по методу — 3 года, а шов без клейма и записи для надзора просто не существует. Проверь себя: кто может подписать заключение «годен» — младший контролёр или старший?","how":"1. Сварщик с действующим удостоверением НАКС (I уровень, 2 года) на этот способ и группу варит стык и ставит рядом клеймо — личный номер. Пример: стык 12, клеймо 47.\n2. Мастер или руководитель работ записывает в журнал сварочных работ: дата, стык 12, сталь 08Х18Н10Т, способ РАД, материалы с партией, режим 110 А DCEN, клеймо 47.\n3. Дефектоскопист I уровня проводит контроль по карте и записывает результат; заключение он не выдаёт. Дефектоскопист II уровня оценивает результат и подписывает заключение «годен / не годен»; удостоверение по методу — 3 года. III уровень решает спорные случаи.\n4. Инспектор надзора сверяет: удостоверение сварщика действует и покрывает способ и группу; клеймо 47 на стыке совпадает с журналом; заключение подписано II уровнем. Нет любого звена — стык не предъявлен, а работа без допуска на опасном объекте стоит до 400 тыс. ₽ (ориентир).\n5. Ученик без удостоверения варит учебные пластины, пишет на них фамилию маркером и ведёт учебный журнал: d, I, полярность, результат. На объект — только после разряда и аттестации по способу и группе; с 01.03.2027 аттестацию заменяет проверка готовности через центры СРО, а выданные раньше документы действуют до конца срока.","formula":{"f":"стык существует = клеймо сварщика с допуском  И  запись в журнале  И  заключение, подписанное II уровнем","legend":[["клеймо","личный номер сварщика с удостоверением НАКС (I уровень, 2 года)","47"],["журнал","стык, сталь, материалы, режим, клеймо — пишет мастер","стык 12"],["I уровень НК","контроль по карте и запись; заключения нет","ВИК выполнен"],["II уровень НК","оценка и подпись заключения; удостоверение 3 года","годен"],["надзор","сверяет документы, а не шов","до 400 тыс. ₽"]],"note":"Связка «И»: идеальный шов без клейма или без записи юридически не существует; ученик — вне этой цепочки, пока нет удостоверения."},"pitfalls":"Опытные попадаются на «помощи»: удостоверение просрочено на месяц, стыки горят, мастер говорит «клеймо Иванова поставим, потом переоформим» — и в журнале появляется подлог, за который при аварии отвечает Иванов, а при проверке — все трое. Второй капкан — заключение «по-соседски»: I уровень подписывает «годен», потому что II уровня нет на вахте, и надзор признаёт весь объём контроля недействительным, а это повторный рентген каждого стыка по 1,5–4 тыс. ₽. Третий — срок: удостоверение «кончилось вчера», но «аттестация же всё равно отменяется с марта 2027» — нет, документы действуют до конца своего срока, а не бессрочно, и просроченный допуск — работа без допуска. Вопрос, который вскрывает всё: «покажи, чьё клеймо, чья подпись и до какого числа действует». Под давлением сроков отвечай: «без допуска стык не предъявить — он не существует; потерять смену дешевле, чем 400 тыс. ₽ и остановку работ». Ученику это нужно сейчас: привычка писать фамилию на учебной пластине — та же, что ставить клеймо на трубе.","checks":[{"q":"Кто подписывает заключение «годен» по стыку — младший контролёр (I уровень) или старший (II уровень)?","o":["Младший: он смотрел стык и видел его своими глазами","Старший, II уровень: младший только записывает результат","Мастер участка: он отвечает за всю сварку на объекте"],"a":1,"w":"I уровень выполняет контроль по карте и фиксирует; оценку и заключение даёт только II уровень."},{"q":"Стык 12 сварен идеально, но сварщик забыл поставить клеймо, а запись в журнале есть. Что с этим стыком для надзора?","o":["Годен: запись в журнале заменяет клеймо на металле","Годен условно: клеймо можно поставить после контроля","Не предъявлен: нет клейма — нет звена цепочки ответственности"],"a":2,"w":"Клеймо связывает металл с человеком и журналом; без него шов юридически не существует, каким бы ни был."},{"q":"По схеме «стык существует = клеймо И журнал И заключение II уровня»: заключение подписал I уровень. Результат?","o":["Контроль недействителен: нужна подпись II уровня","Стык годен, если I уровень работал строго по утверждённой карте","Стык годен, если мастер участка заверил подпись I уровня своей"],"a":0,"w":"Заключение — документ II уровня; подпись I уровня не даёт оценки, и объём контроля придётся повторить."},{"q":"Удостоверение сварщика просрочено на месяц. Мастер: «с марта 2027 аттестацию всё равно отменяют». Что отвечаешь?","o":["Варю: закон уже принят, значит, допуск фактически стал бессрочным","Варю, но клеймо ставит действующий сварщик с соседнего поста","Не варю: просроченный допуск — работа без допуска"],"a":2,"w":"Документы действуют до конца своего срока, а не бессрочно; просрочка — отсутствие допуска со всеми последствиями."}],"rules":["Клеймо ставит тот, кто варил, с действующим удостоверением; чужое клеймо — подлог.","Журнал сварки пишет мастер: стык, сталь, материалы, режим, клеймо; нет записи — нет стыка.","I уровень НК контролирует и записывает, II уровень оценивает и подписывает заключение (удостоверение 3 года).","Надзор сверяет документы: удостоверение, клеймо, журнал, подпись; без допуска — до 400 тыс. ₽ и остановка.","С 01.03.2027 — проверка готовности через центры СРО; ранее выданные документы действуют до конца срока (сварщик — 2 года)."]}}],"TERMS":[{"name":"Сварочная дуга","level":"L0","def":"Устойчивый электрический разряд между электродом и изделием, в котором столб газа нагрет до нескольких тысяч градусов и плавит металл.","when":"Все три ручки сварщика — ток (I), длина дуги (напряжение U) и полярность — управляют именно дугой; понимая её, ты понимаешь, почему валик узкий, широкий или пористый.","ex":"Электрод d 3 мм, 120 А, дуга длиной 3 мм — напряжение около 20–22 В, валик шириной 6–9 мм; оттянул дугу до 8 мм — напряжение 28–30 В, валик расплылся, в нём поры.","near":[{"t":"Сварочная ванна","why":"Ванна — жидкий металл под дугой; дуга — источник тепла, ванна — его результат."}],"nb":[{"t":"Напряжение дуги (U)","why":"Растёт с длиной дуги: короткая 2–3 мм — 20–22 В, длинная 8 мм — 28–30 В."},{"t":"Полярность","why":"Решает, на каком конце дуги — на электроде или изделии — выделяется больше тепла."}],"apps":{"ok":"Ученик держит дугу длиной примерно равной диаметру электрода (3 мм при d 3 мм).","okWhy":"Короткая дуга — низкое напряжение, плотный валик и целая защита; длинная рвёт защиту и даёт поры.","bad":[{"t":"«Дуга — это искра при касании электродом металла»","why":"Искра — момент зажигания; дуга — устойчивый разряд, который горит, пока держишь расстояние."},{"t":"«Чем длиннее дуга, тем глубже проплав»","why":"Глубину даёт ток; длинная дуга лишь ширит валик и впускает воздух."},{"t":"«Дугу регулируют ручкой напряжения на инверторе»","why":"При ручной сварке напряжение задаёт сама длина дуги; ручкой выставляют ток."}]},"simple":"Дуга — это паяльник на 5 000 градусов: электрическая искра, которая горит непрерывно, пока держишь электрод на 3 мм от металла. При 120 А она плавит стальную пластину 6 мм, как паяльник олово. Взрослому на работе это главный инструмент: всё качество шва начинается с того, какой ток и какая длина дуги.","remember":"Дуга короткая — валик плотный, защита цела."},{"name":"Сварочная ванна","level":"L0","def":"Объём жидкого металла под дугой, который после её ухода кристаллизуется в сварной шов.","when":"Всё, что попадёт в ванну, — воздух, влага, шлак — останется в шве; поэтому защита ванны и её размер (от тока) решают качество шва.","ex":"При 120 А электродом d 3 мм ванна на пластине 6 мм — лужица шириной 6–9 мм; при 180 А она кипит и проваливается, при 90 А — не растекается, электрод липнет.","near":[{"t":"Сварочная дуга","why":"Дуга греет, ванна — то, что расплавилось; дуга может гореть и без ванны, при зажигании."}],"nb":[{"t":"Защита ванны","why":"Аргон 8–12 л/мин, смесь 12–18 л/мин или обмазка — «зонт», без которого ванна глотает воздух."},{"t":"Корень шва","why":"Нижняя часть ванны при первом проходе — там должны сплавиться обе кромки."}],"apps":{"ok":"Ученик видит, что ванна не растекается и электрод липнет, — поднимает ток на 10–20 А.","okWhy":"Размер ванны задаёт ток: при 90 А для d 3 мм ванна мала, 110–120 А — середина диапазона.","bad":[{"t":"«Ванна — это готовый шов после остывания»","why":"Ванна — жидкая фаза; после кристаллизации это уже шов с усилением и корнем."},{"t":"«Чем больше ванна, тем прочнее шов»","why":"Большая ванна при 180 А на 6 мм — провал корня и подрез, не прочность."},{"t":"«Ванна сама выталкивает воздух при остывании»","why":"Газ остаётся пузырьками — порами; поэтому защита нужна до остывания."}]},"simple":"Ванна — лужица расплавленного металла под дугой, как капля воска под фитилём свечи, только 1 500 градусов. При 120 А она 6–9 мм шириной; остывая, она становится швом. На работе важно, что всё, что попало в ванну, — воздух, влага, шлак — останется в шве навсегда.","remember":"Что попало в ванну — осталось в шве."},{"name":"Полярность","level":"L0","def":"Распределение «плюса» и «минуса» источника постоянного тока между электродом и изделием: прямая (DCEN) — минус на электроде, обратная (DCEP) — плюс на электроде.","when":"На плюсе выделяется больше тепла; перепутанная полярность — оплавленный вольфрам при TIG или рваная дуга и поры у электродов УОНИ.","ex":"TIG по нержавейке 08Х18Н10Т — DCEN, минус на горелке; УОНИ-13/55 d 3 мм на 120 А — DCEP, плюс на держателе; включил TIG на DCEP — около 70 % тепла в вольфрам, он плавится шариком.","near":[{"t":"Род тока","why":"Постоянный или переменный — это другой выбор: переменный нужен алюминию, полярность — про знак при постоянном."}],"nb":[{"t":"Сварочная дуга","why":"Полярность задаёт, какой конец дуги горячее."},{"t":"Сварочный ток (I)","why":"Величина тока от полярности не зависит, зависит распределение тепла."}],"apps":{"ok":"Перед установкой УОНИ после соседа-TIG ученик переставляет клеммы: плюс на держатель.","okWhy":"Основное покрытие устойчиво горит только на обратной полярности; на прямой дуга рвётся.","bad":[{"t":"«Полярность влияет только на цвет шва»","why":"Она решает, кто плавится — электрод или изделие; вольфрам на плюсе горит за секунды."},{"t":"«Для всех электродов — плюс на держателе»","why":"TIG по стали варят на минусе; УОНИ — на плюсе; смотри на электрод, не на привычку."},{"t":"«Если дуга рвётся, надо добавить тока»","why":"Рваная дуга у УОНИ на DCEN лечится перестановкой клемм, а не амперами."}]},"simple":"У батарейки есть плюс и минус, и плюс при сварке всегда горячее. Поэтому вольфрам при сварке в аргоне ставят на минус — чтобы не плавился, — а электроды УОНИ на плюс, чтобы дуга горела ровно. Перепутал — вольфрам оплавится за 10 секунд, а электрод будет рваться и давать поры.","remember":"Плюс греет сильнее: TIG на минус, УОНИ на плюс.","legend":[["DCEN","прямая полярность: минус на электроде"],["DCEP","обратная полярность: плюс на электроде"]]},{"name":"Стыковое соединение","level":"L0","def":"Соединение двух деталей, расположенных в одной плоскости кромка к кромке; на чертеже обозначается буквой С.","when":"Тип соединения решает, что мерить: у стыкового — усиление сверху и корень снизу, а не катет; трубы и листы под давлением — почти всегда стыковые.","ex":"Две пластины 200×100×6 мм встык: усиление g 2 мм (норма 0,5–3), смещение кромок e ≤ 0,1·6 = 0,6 мм, корень проплавлен на обратной стороне.","near":[{"t":"Тавровое соединение","why":"Деталь торцом в плоскость другой, буквой Т; мерят катет, а не усиление."}],"nb":[{"t":"Усиление шва","why":"Выпуклость стыкового шва над листом."},{"t":"Корень шва","why":"Обратная сторона стыка, первый проход."}],"apps":{"ok":"Увидев кромка к кромке в одной плоскости, ученик переворачивает пластину и смотрит корень.","okWhy":"У стыкового соединения главный дефект прячется снизу — непровар корня; лицевая сторона его не показывает.","bad":[{"t":"«У стыкового шва меряют катет»","why":"Катет — размер углового и таврового шва; у стыкового — усиление и корень."},{"t":"«Стыковое — это когда листы лежат один на другом»","why":"Один на другом — нахлёсточное (Н); стыковое — кромка к кромке в одной плоскости."},{"t":"«Если лицевая сторона ровная, стык годен»","why":"Корень снизу может быть не проплавлен при идеальной лицевой стороне."}]},"simple":"Две доски положили на стол торцами друг к другу и склеили по торцу — это стыковое соединение. У сварки так же: две пластины 6 мм кромка к кромке. У такого шва есть верх с небольшим горбиком до 3 мм и низ — корень, где клей должен дойти до самого дна. На работе так варят трубы и листы под давлением, и главное прячется снизу.","remember":"Стык: горбик сверху, корень снизу — переверни."},{"name":"Угловое соединение","level":"L0","def":"Соединение двух деталей, расположенных под углом и сваренных в месте примыкания кромок; на чертеже — буква У; его размер — катет.","when":"Угловые и тавровые швы меряют катетом по знаку △ на чертеже, а не усилением; это определяет, какой шаблон и куда прикладывать.","ex":"Чертёж △5: шаблон УШС-3 выемкой 5 мм к двум полкам ложится без просвета — норма; 4 мм — недобор, сечение меньше на треть; 7 мм — перебор, лишнее тепло.","near":[{"t":"Тавровое соединение","why":"Деталь торцом упирается в плоскость другой буквой Т; тоже описывается катетом, но геометрия иная."}],"nb":[{"t":"Катет шва","why":"Главный размер углового шва."},{"t":"Нахлёсточное соединение","why":"Листы внахлёст, два угловых шва по кромкам."}],"apps":{"ok":"Ученик по букве У и положению деталей сразу берёт шаблон на катет.","okWhy":"Тип соединения определяет измеряемый размер: угол — катет, стык — усиление.","bad":[{"t":"«Угловой шов меряют по ширине линейкой»","why":"Ширина — гипотенуза, она всегда больше катета; шаблон меряет катет."},{"t":"«△5 — это ширина шва 5 мм»","why":"△5 — катет 5 мм, сторона вписанного треугольника."},{"t":"«Угловое и стыковое — одно и то же, если шов ровный»","why":"Разная геометрия нагрузки и разные измеряемые размеры."}]},"simple":"Две доски поставили углом, как крышу домика, и скрепили по месту встречи — это угловое соединение. Его размер — не высота горбика, а катет: сторона треугольника, который помещается в шов, на чертеже △5 — 5 мм. На работе так варят рёбра, уголки и полки, и мерят их шаблоном, а не линейкой.","remember":"Угол и тавр — мерь катет по △."},{"name":"Катет шва","level":"L0","def":"Сторона наибольшего равнобедренного прямоугольного треугольника, вписанного в сечение углового шва; обозначается k, на чертеже △k.","when":"Катет — расчётный размер углового шва: недобор 4 мм вместо 5 ослабляет сечение, перебор 7 мм даёт лишнее тепло и деформацию; мерят только шаблоном.","ex":"△5 на тавровом соединении: УШС-3 показал 4 мм — недобор, подварить; 7 мм — на 40 % больше металла, чем нужно.","near":[{"t":"Усиление шва","why":"Выпуклость стыкового шва; катет — размер углового. Путают на чертеже и в акте."}],"nb":[{"t":"Угловое соединение","why":"Шов, для которого катет и задаётся."},{"t":"Шаблон УШС-3","why":"Инструмент, которым катет меряют по двум полкам."}],"apps":{"ok":"Ученик прикладывает УШС-3 к обеим полкам и проверяет, ложится ли выемка 5 мм без просвета.","okWhy":"Шаблон меряет именно катет, а линейка по ширине — гипотенузу.","bad":[{"t":"«Катет больше чертёжного — это запас прочности»","why":"Лишний металл — лишнее тепло, деформация и перерасход; норма задаёт нужный размер."},{"t":"«Катет меряют у стыкового шва»","why":"У стыкового шва меряют усиление и корень; катета там нет."},{"t":"«Катет 7 мм по ширине значит 7 мм по чертежу»","why":"Ширина — гипотенуза; при ширине 7 мм катет около 5 мм."}]},"simple":"Положи в угол между двумя пластинами треугольник из бумаги с равными сторонами — длина его стороны и есть катет, например 5 мм. На чертеже пишут △5. Если шаблон показывает 4 мм — шов на треть слабее, если 7 — зря потратили металл и перегрели деталь. Взрослому на работе катет — первый размер, за который спрашивает контролёр.","remember":"Катет — сторона треугольника, не ширина шва.","legend":[["k","катет углового шва, мм"],["△k","знак катета на чертеже"]],"sym":"k","abbr":"мм, K в старых обозначениях","confuse":"не усиление g и не чувствительность K (заглавная, РК)","how":["ЗАДАЁТСЯ · чертёж: обозначение шва ▲k6 — катет 6 мм","ИЗ ДАННЫХ · УШС-3 шаблон катета","ОБРАТНО · k ≈ 0,7–1,0 толщины тонкой детали, если чертёж не задаёт"]},{"name":"Усиление шва","level":"L0","def":"Выпуклость стыкового шва над поверхностью основного металла; обозначается g, норма для ответственных стыков 0,5–3 мм.","when":"Горб выше 3 мм — не запас, а дефект формы с концентратором напряжений; в акте ВИК это «превышение усиления», снять шлифовкой.","ex":"Пластина 6 мм: усиление 2 мм — норма; 4,5 мм — превышение, снять до 3 мм; 0 мм или вогнутость — сечение меньше расчётного.","near":[{"t":"Катет шва","why":"Размер углового шва, а усиление — выпуклость стыкового."}],"nb":[{"t":"Стыковое соединение","why":"Где усиление вообще меряют."},{"t":"Подрез","why":"Канавка по краю шва рядом с усилением — тоже дефект формы."}],"apps":{"ok":"Ученик ставит УШС-3 поперёк шва и читает высоту горба: 2 мм — в норме 0,5–3.","okWhy":"Норма задана числом; «на глаз нормально» в журнал не записывается.","bad":[{"t":"«Чем выше усиление, тем прочнее шов»","why":"Прочность даёт проплав; горб 4,5 мм — концентратор напряжений."},{"t":"«Усиление — это катет стыкового шва»","why":"У стыкового шва нет катета; усиление — выпуклость над листом."},{"t":"«Превышение усиления требует переварки шва»","why":"Лишний металл снимают шлифовкой до нормы, переваривать не нужно."}]},"simple":"Усиление — горбик шва над поверхностью листа, как корочка хлеба над формой. Хороший горбик — 0,5–3 мм; 4,5 мм — не «запас», а ступенька, на которой металл при нагрузке надрывается. На работе такой горб заставят снять шлифовкой и показать контролёру ещё раз.","remember":"Горбик до 3 мм — норма, выше — снять.","legend":[["g","усиление стыкового шва, мм"]],"sym":"g","abbr":"мм, выпуклость","confuse":"не катет k углового шва","how":["ИЗ ДАННЫХ · УШС-3: высота над поверхностью","ТАБЛИЦА · норма по ПТД (ориентир 1–3 мм для труб; ИСО 5817: ≤ 1 + 0,1·b_ш, где b_ш — ширина шва)","НЕЛЬЗЯ · считать «чем выше, тем прочнее» — концентратор напряжений"]},{"name":"Корень шва","level":"L0","def":"Зона первого прохода у обратной стороны стыка, где кромки должны быть проплавлены насквозь.","when":"Корень — место, где чаще всего прячется непровар; с лицевой стороны его не видно, поэтому контролёр переворачивает пластину первым делом.","ex":"Пластина 6 мм: хороший корень — ровный валик 1–2 мм на обратной стороне; ровная тёмная бороздка по оси — непровар, группа 400.","near":[{"t":"Усиление шва","why":"Усиление — лицевая выпуклость; корень — обратная сторона. Оба размера нормируются, но смотрят их с разных сторон."}],"nb":[{"t":"Непровар","why":"Главный дефект корня."},{"t":"Стыковое соединение","why":"Где корень — сквозной проплав обеих кромок."}],"apps":{"ok":"Закончив стык, ученик переворачивает пластину и ищет бороздку по оси.","okWhy":"Непровар корня виден только с обратной стороны и недопустим для ответственных стыков.","bad":[{"t":"«Корень — это начало шва, где зажгли дугу»","why":"Начало шва — кратер; корень — зона первого прохода по толщине, снизу."},{"t":"«Корень не важен, его не видно»","why":"Корень держит половину толщины и первым трескается под нагрузкой."},{"t":"«Провисший корень 3 мм — это надёжный проплав»","why":"Норма выпуклости корня — ориентир ≤ 1–2 мм; провис — дефект формы."}]},"simple":"Корень — дно шва, обратная сторона стыка, куда первый проход должен «протечь», как клей в щель до самого дна. На пластине 6 мм хороший корень — ровный валик снизу высотой 1–2 мм. Если снизу тёмная бороздка — кромки не слиплись. На работе контролёр первым делом переворачивает и смотрит именно сюда.","remember":"Корень смотри первым, лицевая сторона врёт."},{"name":"Пора","level":"L0","def":"Газовая полость в металле шва округлой формы; дефект группы 200 по ГОСТ Р ИСО 6520-1.","when":"Поры говорят о сорванной защите ванны — ветер, расход, влага; их расположение подсказывает причину, и первый вопрос — «что с газом?», а не «какой ток?».","ex":"МП, 14 л/мин, ветер 4 м/с у ворот — цепочка пор по всей длине; УОНИ из вскрытой неделю назад пачки — поры гроздью в начале шва.","near":[{"t":"Шлаковое включение","why":"Угловатое твёрдое тело группы 300; пора — круглая газовая полость группы 200."}],"nb":[{"t":"Защита ванны","why":"Её срыв — главная причина пор."},{"t":"Прокалка электродов","why":"350–400 °C 1–2 ч убирает влагу — источник водорода и пор."}],"apps":{"ok":"Ученик видит цепочку круглых ямок по валику и проверяет расход, ветер и электроды.","okWhy":"Пора — газ, попавший в ванну; причина всегда в защите, а не в токе.","bad":[{"t":"«Поры выгорают, если добавить тока»","why":"Горячая ванна поглощает азот ещё охотнее; тока добавлять нельзя."},{"t":"«Пора — это царапина от щётки»","why":"Пора — круглая полость с гладкими стенками; царапина — прямая риска."},{"t":"«Поры лечатся большим расходом газа, 25 л/мин»","why":"25 л/мин закручивает струю и подсасывает воздух — пор больше."}]},"simple":"Пора — пузырёк воздуха, застывший в металле, как дырочка в хлебе. Появляется, когда над ванной порвался «зонт» защиты: ветер 4 м/с, расход газа 3 вместо 10 л/мин, сырые электроды. На работе цепочка пор по шву — повод проверить газ и погоду, а не крутить ток.","remember":"Пора — вопрос к защите, не к току."},{"name":"Подрез","level":"L0","def":"Канавка в основном металле вдоль края шва, образованная дугой и не заполненная металлом; глубина h, дефект формы группы 500.","when":"Подрез — надрез-концентратор вдоль всего шва; норма для ответственных стыков ≤ 0,5 мм, и 0,8 мм — уже дефект, хотя выглядит тенью.","ex":"УШС-3 показал h 0,8 мм на пластине 6 мм при норме ≤ 0,5 мм — подварить или зачистить и проверить снова; причины — большой ток или длинная дуга.","near":[{"t":"Непровар","why":"Непровар — несплавление кромок внутри или в корне; подрез — канавка снаружи по краю."}],"nb":[{"t":"Усиление шва","why":"Соседний дефект формы — горб."},{"t":"Сварочный ток (I)","why":"Ток выше диапазона — главная причина подреза."}],"apps":{"ok":"Ученик меряет канавку по краю шва шаблоном, а не называет её «тенью».","okWhy":"Норма задана числом 0,5 мм; спор «тень или подрез» решает шаблон.","bad":[{"t":"«Подрез меньше 1 мм не считается»","why":"Норма 0,5 мм; 0,8 мм — превышение на 60 %."},{"t":"«Подрез — это непровар по краю»","why":"Непровар — несплавление; подрез — канавка в основном металле у края шва."},{"t":"«Подрез убирают щёткой»","why":"Щётка не заполнит канавку; нужна подварка или зачистка с повторной проверкой."}]},"simple":"Подрез — канавка вдоль края шва, как бороздка от ногтя по краю пластилина: дуга выплавила металл, а шов его не заполнил. Норма — не глубже 0,5 мм; 0,8 мм — уже дефект, хотя выглядит тенью. На работе его меряют шаблоном, а причина — ток выше нормы или длинная дуга.","remember":"Подрез глубже 0,5 мм — надрез вдоль шва.","legend":[["h","глубина подреза, мм"]],"sym":"h","abbr":"мм","confuse":"не высота усиления g","how":["ИЗ ДАННЫХ · УШС-3 или глубиномер по линии сплавления","ТАБЛИЦА · B: ≤ 0,05·s, ≤ 0,5 мм · C: ≤ 0,1·s, ≤ 0,5 · D: ≤ 0,2·s, ≤ 1 (ИСО 5817, ориентир)","НЕЛЬЗЯ · «зашлифовать» подрез глубже нормы — утонение стенки"]},{"name":"Трещина","level":"L0","def":"Разрыв металла шва или околошовной зоны, на поверхности видимый как тонкая извилистая линия с острыми концами; группа 100.","when":"Трещина недопустима в любом классе для ответственных стыков — её не шлифуют, а показывают и вырезают; отличать от царапины щёткой обязан даже ученик.","ex":"В кратере в конце шва на пластине 6 мм — тёмная извилистая ниточка длиной 5 мм; под лупой 5× концы острые — трещина, пластину наставнику.","near":[{"t":"Подрез","why":"Подрез — ровная канавка по краю, которую меряет шаблон; трещина — извилистый разрыв."}],"nb":[{"t":"Корень шва","why":"Непровар корня — концентратор, от которого идут трещины."},{"t":"Дефекты группы 100–600","why":"Трещина — первая и самая опасная группа."}],"apps":{"ok":"Ученик, увидев волосок в кратере, не шлифует, а зовёт наставника.","okWhy":"Трещина — недопустимый дефект; спрятанная трещина растёт под нагрузкой.","bad":[{"t":"«Волосок в кратере — зашлифовать и забыть»","why":"Трещина растёт под нагрузкой; её вырезают, а не прячут."},{"t":"«Трещина допустима, если короче 5 мм»","why":"Для ответственных стыков трещины недопустимы любой длины."},{"t":"«Прямая блестящая риска — это трещина»","why":"Прямая и блестящая внутри — царапина щёткой; трещина извилистая и тёмная."}]},"simple":"Трещина — тонкий извилистый тёмный волосок в шве, как трещинка на стекле: начинается маленькой, а под нагрузкой растёт. Отличие от царапины щёткой: царапина прямая и блестит, трещина извивается и тёмная. На работе трещину не шлифуют, а показывают и вырезают — она недопустима всегда.","remember":"Волосок извилистый и тёмный — показать, не прятать."},{"name":"Непровар","level":"L0","def":"Отсутствие сплавления между кромками или между кромкой и металлом шва, чаще в корне; группа 400 по ГОСТ Р ИСО 6520-1.","when":"Непровар корня — недопустимый дефект ответственных стыков, который с лицевой стороны не виден; шов работает частью толщины.","ex":"Обратная сторона стыка пластин 6 мм: ровная тёмная бороздка по оси на 60 мм длины — непровар; причина — 90 А вместо 120 для d 3 мм или ступенька 1,5 мм.","near":[{"t":"Подрез","why":"Подрез — канавка снаружи у края шва; непровар — несплавление внутри или в корне."}],"nb":[{"t":"Корень шва","why":"Где непровар чаще всего."},{"t":"Сварочный ток (I)","why":"Малый ток — первая причина."}],"apps":{"ok":"Ученик переворачивает пластину и ищет бороздку по оси обратной стороны.","okWhy":"Непровар виден только с обратной стороны; лицевая красота ничего не говорит.","bad":[{"t":"«Бороздка в корне — это окалина, зачистить»","why":"Бороздка — геометрия несплавленных кромок; зачистка её не уберёт."},{"t":"«Непровар допустим, если лицевая сторона в норме»","why":"Для ответственных стыков непровар корня недопустим."},{"t":"«Непровар лечится горбом усиления сверху»","why":"Усиление не доходит до корня; нужна подвар
