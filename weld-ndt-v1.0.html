ка корня под контролем."}]},"simple":"Непровар — место, где две кромки так и не слиплись, как клей, который не дошёл до дна щели. С лицевой стороны шов красивый, а снизу тёмная бороздка по оси — и шов держит половину толщины. На работе такой стык на трубе вырезают; на учебной пластине 6 мм причина чаще всего — 90 А вместо 120.","remember":"Бороздка в корне — кромки не слиплись."}],"BOSSES":[{"id":"b-l0-1","level":"L0","icon":"🧑‍🏭","title":"Первая смена в цехе","sub":"6 ходов · ~8 минут · без таймера","meters":{"t":"Доверие надзора и заказчика","v":"Качество шва и вывода","s":"Срок сдачи"},"intro":"Понедельник, 8:00, учебный цех. Наставник Фёдорыч выдал тебе пост: инвертор, баллон аргона, пачку УОНИ-13/55 d 3 мм и десять пластин 200×100×6 мм. Задание на смену — четыре стыка под визуальный осмотр к 16:00. В 8:40 Фёдорыча вызвали на участок: «Работай, я к обеду». Рядом сосед Лёха, второй год ученик, у которого на всё есть быстрый совет.","steps":[{"q":"8:45. Пост твой. На столе ветошь с маслом в полутора метрах, кабель массы с оголённой жилой 3 см, баллон стоит без цепи. Первый ход?","opts":[{"text":"Убрать ветошь дальше 5 м, закрепить баллон цепью, кабель массы заменить или заизолировать — потом дуга","d":{"t":1,"v":1,"s":-1},"fb":"Полчаса на подготовку, но пост безопасен; оголённая жила и масло у поста — две причины травмы за одну смену."},{"text":"Отодвинуть ветошь на пару метров, зажим массы поставить так, чтобы жила не касалась стола, и начать","d":{"t":0,"v":-1,"s":1},"fb":"Два метра — всё ещё ближе 5 м; оголённая жила «не касается» ровно до первого рывка кабеля."},{"text":"Начать варить сразу: Фёдорыч сам ставил пост, значит, всё в порядке","d":{"t":-1,"v":-2,"s":2},"fb":"Пост проверяет тот, кто варит; масло и оголённый кабель — это уже не «порядок»."},{"text":"Позвонить Фёдорычу и ждать, пока он вернётся и сам всё поправит","d":{"t":-1,"v":0,"s":-2},"fb":"Ветошь и цепь ты можешь убрать сам; ждать два часа ради этого — потеря половины смены."}]},{"q":"9:10. Режим. На инверторе осталось 180 А от соседа, электрод d 3 мм, пластина 6 мм. Лёха: «Оставь 180, прожжёт насквозь — и корень точно будет». Что ставишь?","opts":[{"text":"110–120 А и плюс на держатель: диапазон для d 3 мм — 90–130 А","d":{"t":1,"v":2,"s":0},"fb":"Ток от диаметра: 120 А — середина таблицы; УОНИ на обратной полярности горят устойчиво."},{"text":"180 А, как советует Лёха: 6 мм — толстая пластина, запас по теплу не помешает","d":{"t":0,"v":-2,"s":1},"fb":"180 А для d 3 мм — на 50 А выше верхней границы: подрез, брызги, на 6 мм — дыры."},{"text":"150 А как компромисс между таблицей и советом Лёхи","d":{"t":0,"v":-1,"s":1},"fb":"150 А всё ещё выше 130 А; компромисс между нормой и ошибкой — это ошибка поменьше."},{"text":"90 А, чтобы наверняка не прожечь, и минус на держатель, как на TIG","d":{"t":0,"v":-1,"s":0},"fb":"90 А — нижняя граница, электрод липнет; DCEN для УОНИ — рваная дуга и поры."}]},{"q":"10:30. Первый стык сварен. Лицевая сторона ровная. Лёха: «Красота, клади в сдачу». Что делаешь до того, как отложить пластину?","opts":[{"text":"Переворачиваю, смотрю корень, проверяю кратеры и края шва шаблоном УШС-3","d":{"t":1,"v":2,"s":-1},"fb":"Обратная сторона и кратеры — там живут непровар и трещины; лицевая красота ничего не гарантирует."},{"text":"Откладываю в сдачу: лицевая сторона — главный признак хорошего шва","d":{"t":0,"v":-2,"s":2},"fb":"Непровар корня с лица не виден; пластина уйдёт на контроль с дефектом группы 400."},{"text":"Зачищаю лицевую сторону щёткой до блеска, чтобы контролёру было приятнее","d":{"t":0,"v":-1,"s":0},"fb":"Блеск не отменяет корень; щётка к тому же маскирует подрез, который потом найдёт шаблон."},{"text":"Прошу Лёху глянуть ещё раз, раз он второй год учится","d":{"t":0,"v":-1,"s":0},"fb":"Второй ученик — не контролёр; оценку даёт шаблон и наставник, а не мнение соседа."}]},{"q":"11:15. На обратной стороне второго стыка — ровная тёмная бороздка по оси. Лёха: «Это окалина, зашлифуй — и никто не заметит». До обеда час.","opts":[{"text":"Называю это непроваром корня (группа 400), откладываю пластину наставнику как есть","d":{"t":2,"v":2,"s":-1},"fb":"Бороздка по оси корня — несплавленные кромки; показать дефект — единственный способ научиться его не делать."},{"text":"Зашлифовываю бороздку: на учебной пластине это ничего не стоит","d":{"t":-2,"v":-2,"s":2},"fb":"Привычка прятать дефект формируется на учебной пластине и приходит на трубу под давлением."},{"text":"Подвариваю бороздку с обратной стороны на 120 А и кладу в сдачу молча","d":{"t":-1,"v":0,"s":1},"fb":"Подварка без слова наставнику — ремонт без записи; на объекте это уже нарушение."},{"text":"Вырезаю участок болгаркой, чтобы наставник не увидел брак","d":{"t":-2,"v":-1,"s":-1},"fb":"Уничтожить улику — худшее для доверия; наставник сам ищет такие бороздки, чтобы учить."}]},{"q":"13:40. Фёдорыч не вернулся. Звонит мастер соседнего участка: «Пришли ученика, на трубе 530 корень подварить, я рядом постою». Лёха уже собирается.","opts":[{"text":"Отказываюсь: без удостоверения на стык не иду, передаю просьбу Фёдорычу","d":{"t":2,"v":1,"s":0},"fb":"Работа на объекте без допуска — нарушение, которое не закрывает «мастер рядом»; клеймо ставить некому."},{"text":"Иду: на пластинах корень уже получается ровно, а мастер будет рядом","d":{"t":-2,"v":-2,"s":1},"fb":"Учебная пластина 6 мм и труба 530 мм под давлением — разные профессии; допуска нет ни при каком мастере."},{"text":"Иду только посмотреть, как варят трубу 530 мм, дугу не трогаю","d":{"t":0,"v":0,"s":0},"fb":"Посмотреть — не нарушение, но стыки к 16:00 стоят; это уход от дела, а не решение."},{"text":"Отправляю Лёху вместо себя — у него второй год, он опытнее меня","d":{"t":-1,"v":-1,"s":0},"fb":"Удостоверения у Лёхи тоже нет; подставить другого — не выход."}]},{"q":"15:50. Три стыка готовы, четвёртый не начат. Фёдорыч вернулся: «Ну, что сдаём?» Как докладываешь?","opts":[{"text":"Три стыка с режимом и клеймом-маркером, во втором непровар корня, четвёртый не успел","d":{"t":2,"v":1,"s":-1},"fb":"Честный доклад с числами и дефектом — именно то, что наставник хочет услышать; четвёртый доварят завтра."},{"text":"Четыре стыка готовы: второй подварил сам, всё по норме, журнал заполню завтра","d":{"t":-2,"v":-2,"s":2},"fb":"Подварка без наставника и «всё по норме» — две неправды; наставник найдёт обе за минуту."},{"text":"Три стыка, все годные; про бороздку не говорю — пластина же учебная, не труба","d":{"t":-2,"v":-1,"s":1},"fb":"Скрытый дефект на учебной пластине — репетиция скрытого дефекта на трубе."},{"text":"Прошу ещё час и доваривать четвёртый при Фёдорыче, чтобы он сам всё видел","d":{"t":0,"v":0,"s":-2},"fb":"Доваривать можно и завтра; доклад о сделанном — сейчас, а не после ещё часа."}]}],"debrief":"Первая смена выигрывается не скоростью, а порядком: пост безопасен (5 м, цепь, целые кабели), режим от диаметра, корень смотрят первым, дефект называют и показывают. Самое дорогое, что ты можешь испортить в первый день, — не пластину, а доверие наставника.","anchor":{"g":"wording","p":{"bad":"«оставь 180 А — прожжёт, корень будет»","good":"120 А от d 3; корень первым; дефект показать"},"cap":"порядок первой смены: пост → режим → корень → честный доклад"}}],"ETUDES":[],"NUM":[],"ARTIFACTS":[{"id":"a-l0-1","level":"L0","title":"Карта поста и чек-лист безопасности","why":"Документ, который ученик заполняет перед каждой сменой: что стоит на посту, какой режим, что проверено. Без него режим «помнят примерно», баллон стоит без цепи, а первый ожог случается на второй неделе. Карта делает 30-секундный круг наставника письменным и проверяемым.","fields":[{"k":"post","label":"Пост и оборудование","hint":"Номер поста, источник, способ сварки, газ и редуктор, вытяжка","ex":"Пост 3 · инвертор 250 А · РД + РАД · баллон аргона 40 л, закреплён цепью, редуктор без масла · вытяжка включена"},{"k":"task","label":"Задание и материалы","hint":"Что варим: размер пластин, марка стали, электроды/проволока, присадка","ex":"4 стыка пластин 200×100×6 мм, Ст3 · УОНИ-13/55 d 3 мм, прокалка 350 °C 1 ч, из пенала · нижнее положение"},{"k":"mode","label":"Режим из таблицы","hint":"d → I по K_d 30…50 А/мм, полярность, длина дуги, расход газа","ex":"d 3 мм → I 110–120 А (диапазон 90–130 А) · обратная полярность, плюс на держателе · дуга ≈ 3 мм · аргон для TIG 10 л/мин"},{"k":"zone","label":"Зона и огонь","hint":"Горючее дальше 5 м или ширма, огнетушитель, наряд на огневые вне поста","ex":"Ветошь и масло убраны на 6 м · ширма со стороны прохода · огнетушитель ОП-5 у колонны, проверил · работы только на постоянном посту"},{"k":"elec","label":"Электробезопасность","hint":"Кабели, зажим массы, заземление, рукавицы и обувь","ex":"Кабели без оголений, осмотрел 3 м · масса на пластине · инвертор заземлён · рукавицы и обувь сухие"},{"k":"ppe","label":"СИЗ и излучение","hint":"Маска и светофильтр, закрытые запястья, ширма для соседей","ex":"Маска опущена до зажигания дуги · светофильтр по таблице маски для 120 А · куртка застёгнута · ширма от Лёхи"},{"k":"sign","label":"Проверил и подпись","hint":"Кто проверил пост, время; что докладывать наставнику","ex":"Проверил сам 8:50, наставник Фёдорыч 9:00 · доложить: 2-й стык — бороздка в корне, показать до сдачи"}],"blank":"Пост и оборудование: …\nЗадание и материалы: …\nРежим из таблицы (d → I, полярность, дуга, газ): …\nЗона и огонь (≥ 5 м, ширма, огнетушитель): …\nЭлектробезопасность (кабели, масса, рукавицы): …\nСИЗ и излучение (маска до дуги, фильтр, ширма): …\nПроверил, время, подпись: …","rubric":["Режим выведен из диаметра электрода с числами (d, I в диапазоне таблицы, полярность) — 0/1/2","Зона: расстояние до горючего и место огнетушителя указаны числом и местом, не «убрано» — 0/1/2","Электричество: кабели, масса на изделии, сухие рукавицы проверены и записаны — 0/1/2","Газ: баллон закреплён, редуктор без масла, расход для TIG в норме 8–12 л/мин — 0/1/2","Подпись и время проверки есть; что доложить наставнику сформулировано словами — 0/1/2"]}],"CHEAT":[{"title":"Формулы на салфетке","lines":["Обозначения в формулах курса: I ток · U напряжение дуги · v скорость сварки · Q тепловложение · η КПД способа · d диаметр электрода · s толщина · b зазор · c притупление · β угол скоса · e смещение · g усиление · k катет · h подрез · G расход газа · T_п/T_м подогрев/межпроходная · t экспозиция · f фокусное расстояние · F фокус · b_ф объект–плёнка · u нерезкость · D плотность · K чувствительность · λ длина волны · c_з скорость звука · f_з частота · α угол ввода · r путь по лучу · X, Y координаты · S_э эквивалентная площадь · N ближняя зона.","Тепловложение: Q = η·U·I·60/(v·1000) кДж/мм. 0,8·24 В·120 А·60/(120 мм/мин·1000) = 1,15 кДж/мм. Аустенитные — держать ≤ 1,5 (ориентир), тонкостенка 0,3–0,8.","Ток РД: I ≈ K_d·d; K_d 40–50 низ, 30–35 потолок. Электрод 3 мм → 90–130 А; 4 мм → 130–180 А.","Газ: горелка TIG 8–12 л/мин, поддув 4–8, МП 12–18. Баллон 40 л × 150 бар = 6000 л → 600 мин при 10 л/мин.","Межпроходная T_м ≤ 150 °C для аустенитных; подогрев T_п 100–200 °C для углеродистых при s > 20–25 мм или на морозе; 12Х1МФ 200–300 + термообработка.","РК: нерезкость u = F·b_ф/f; экспозиция t₂ = t₁·(f₂/f₁)²; плотность D 1,5–3,0; чувствительность K_отн = K/s·100 % (0,2 мм на 10 мм = 2 %).","УЗК: λ = c_з/f_з (3230 м/с ÷ 2,5 МГц ≈ 1,3 мм; 5 МГц ≈ 0,65); ближняя зона N = D_п²/(4λ); X = r·sin α, Y = r·cos α; отражённый луч Y = 2s − r·cos α.","Пример: α 65°, r 48 мм → X = 48·0,906 = 43,5 мм, Y = 48·0,423 = 20,3 мм. Если s = 12 мм → луч отражённый: Y = 24 − 20,3 = 3,7 мм от поверхности.","Выборка: вероятность пропустить все n дефектных стыков при доле контроля q: P = (1 − q)ⁿ. 10 % контроль, 20 дефектных: 0,9²⁰ ≈ 12 % — но ≈ 18 стыков пройдут.","Экономика: ремонт стыка Ø 530 — 25–60 тыс. ₽ и 1–2 смены; снимок — 1,5–4 тыс. ₽; простой бригады — 150–300 тыс. ₽/день; отказ на ОПО — десятки–сотни миллионов."]},{"title":"Чек-лист перед сваркой (карта · стык · пост)","lines":["1. Карта: способ, материал, присадка/электрод, d, I, U, v, G, T_п, T_м, последовательность проходов, контроль. Нет карты — нет сварки на ОПО.","2. Допуск: удостоверение НАКС по способу и группе ОТУ, срок (2 года), клеймо; с 01.03.2027 — проверка готовности через СРО.","3. Стык: β 30° ± 2°, c 1–2,5 мм, b 2–3 мм, e ≤ 0,1·s (норма проекта), зачистка 20 мм, прихватки по карте, без влаги и масла.","4. Материалы: сертификат на трубу/лист, электроды прокалены (УОНИ 350–400 °C, 1–2 ч) и в пенале, проволока без ржавчины, аргон 99,993 %.","5. Пост: заземление, кабели, держак, газ без утечек (мыльный раствор), ротаметр показывает G, укрытие от ветра > 2–3 м/с, подогрев при морозе по карте.","6. Безопасность: наряд-допуск на огневые работы, пожарный пост, привязь на высоте, газоанализ в замкнутом пространстве, маска и рукавицы.","7. Самоконтроль после каждого прохода: зачистка, осмотр корня/валика, T_м пирометром, запись в журнал."]},{"title":"Чтение шва и снимка: порядок","lines":["ВИК (РД 03-606-03): освещённость ≥ 500 лк, лупа 2–7×, УШС-3. Порядок: трещины → непровар/несплавление на поверхности → поры и свищи → подрез h → усиление g → смещение e → катет k → наплывы, прожоги, брызги. Запись — все измерения, не только дефекты.","Снимок (ГОСТ 7512 → ГОСТ 23055): 1) маркировка и метки — стык опознан; 2) эталон виден, K соответствует классу; 3) плотность D 1,5–3,0 в зоне шва; 4) нерезкость в норме; 5) только потом — индикации: тип (пора/шлак/непровар/трещина/вольфрам), размер, число на 100 мм, координата; 6) класс и норма — «годен/ремонт».","Признаки на плёнке: пора — круглое тёмное пятно с резким краем; шлак — тёмное неправильное, часто вдоль кромки; непровар корня — прямая тёмная линия по оси; трещина — тонкая извилистая тёмная линия; вольфрам — светлое пятно; подрез — тёмная полоска вдоль границы шва.","УЗК: настройка по СОП/АРД → поисковый уровень (−12 дБ) → при эхе: контрольный (−6 дБ) и браковочный уровни → координаты X, Y (прямой/отражённый луч) → протяжённость при шаге → отличить геометрию (усиление, провисание корня — положение совпадает с расчётом по геометрии) от дефекта.","ПВК: очистка → пенетрант 10 мин → удаление → проявитель 10–20 мин → осмотр ≥ 500 лк / УФ → запись. Индикация: линейная (трещина, несплавление) против округлой (пора); ширина пятна ≫ раскрытия.","Любое заключение: без эталона, без плотности, без маркировки — недействительно, какой бы чистый ни был шов."]},{"title":"Дефект → причина → лекарство","lines":["Поры: влага/ржавчина/масло, сырые электроды, сдутая защита (ветер, низкий G, засорённое сопло), длинная дуга, большой вылет. Лекарство: прокалка, зачистка, укрытие, G по карте, короткая дуга.","Шлаковые включения: не удалён шлак между проходами, малый ток, неправильный угол электрода, глубокая узкая разделка. Лекарство: зачистка каждого прохода, ток по карте, β 30°.","Непровар корня: мал зазор b, велико притупление c, мал ток, высокая v, смещение e. Лекарство: сборка по карте, корень TIG/электрод 2,5–3 мм, ток на нижней границе не ниже карты.","Несплавление по кромке: велика v, мал ток, неправильный наклон, окисленная кромка, большой наплыв предыдущего прохода. Лекарство: колебания с задержкой на кромках, зачистка.","Подрез: велики ток/напряжение, длинная дуга, неверный угол, быстрая v на вертикали. Лекарство: снизить I/U, короткая дуга, задержка на кромках. Исправление: зачистка и подварка, не «зашлифовать».","Прожог: велик ток, мал c, велик b, тонкий металл. Лекарство: c по карте, снизить I, импульс TIG, подкладка.","Трещины горячие (аустенит, кратер): большое Q, кратер не заварен, вредные примеси. Холодные (углеродистые, толстые): водород, жёсткость, нет подогрева. Лекарство: Q вниз, заварка кратера, подогрев и сухие электроды. Трещина — всегда вырезка.","Вольфрамовые включения: касание ванны электродом, DCEP на вольфраме, велик ток для d электрода. Лекарство: DCEN, заточка, ток под d."]},{"title":"Какой метод что видит","lines":["ВИК: поверхность и геометрия (g, h, e, k, b, c), трещины и поры, выходящие наружу. Не видит: внутреннее. Всегда первый и обязательный.","ПВК: поверхностные несплошности с выходом на поверхность (раскрытие от 1 мкм при I классе), любые металлы, включая аустенит. Не видит: подповерхностные, закрытые краской.","МК: поверхностные и подповерхностные (1–2 мм) в ферромагнетиках. Не видит: аустенитную нержавейку, медь, алюминий.","РК: объёмные внутренние дефекты (поры, шлак, непровар с зазором), с документом-снимком. Плохо видит: плоские дефекты не вдоль луча (трещины под углом), несплавления по кромке. Требует доступа с двух сторон и радиационной безопасности.","УЗК: плоскостные дефекты (трещины, несплавления, непровары) по всей толщине, с одной стороны, без излучения. Плохо: поры и шлак (слабое эхо), тонкостенка < 4 мм, грубая поверхность, аустенит (затухание, структурный шум). Результат — не картинка, а оператор.","Правило ОПО: ВИК 100 % всегда; трубопроводы давления — РК и/или УЗК по категории (100 % на I–II); ПВК — нержавейка и там, где требует ПТД; дублирование РК+УЗК — для самых ответственных."]},{"title":"Сдача надзору и документы","lines":["Комплект на стык: запись в журнале сварки (клеймо, дата, материалы, режим), акт ВИК, заключение РК/УЗК с номером, схема расположения стыков, сертификаты на материалы, удостоверения сварщика и контролёров.","Заключение по НК: объект, стык, норма оценки (документ и класс/уровень), метод и схема, аппарат и чувствительность (эталон, K, D или СОП и уровни), результат по каждому участку (тип, размер, координата), вывод «годен/ремонт/брак», подписи II уровня и руководителя лаборатории.","Ремонт: акт на ремонт → вырезка/подварка по карте ремонта → повторный контроль тем же методом в том же объёме (+ ВИК) → новое заключение с ссылкой на первое. Два ремонта одного участка — обычно предел, дальше вырезка стыка (по ПТД).","Строительный контроль и заказчик проверяют: соответствие стыка журналу и схеме, сроки заключений, чувствительность, подписи, объём контроля по категории. Ростехнадзор — допуски, ПТД, аттестации, ИИИ, наряды.","Честность: заключение подписывает тот, кто смотрел снимок; «подправить класс», «переснять до годного», «подписать за коллегу» — основания для отзыва допуска и уголовной ответственности при аварии. Отказ фиксируй письменно.","Нормативы-опоры: РД 03-606-03 (ВИК), ГОСТ 7512 и ГОСТ 23055 (РК), ГОСТ Р 55724 (УЗК), ГОСТ 18442 (ПВК), ГОСТ Р ИСО 5817 и 6520-1, ГОСТ 16037/5264/14771 (швы), СП 70/СП 86, РТМ-1с, ПТД объекта — именно ПТД говорит, какой класс."]},{"title":"Безопасность: правила, которые не обсуждаются","lines":["Баллоны: колпак при перевозке, крепление стоя, вентиль открывать плавно и стоя сбоку, кислородный редуктор без масла, ацетилен — обратный клапан, ≥ 5 м от огня, не греть, не бросать.","Электро: исправные кабели и держак, сухие рукавицы, не менять электрод на мокром, заземление изделия, отключать источник при перерыве, в сырых/металлических ёмкостях — ограничитель напряжения холостого хода.","Огневые работы: наряд-допуск, пожарный пост, убрать горючее на 5 м (или защитить), проверка после окончания через 2 часа (по инструкции объекта).","Высота и стеснённость: страховочная привязь с двумя стропами, люлька по допуску, в траншее — откосы/крепление, в замкнутом объёме — газоанализ, вентиляция, наблюдающий снаружи, аргон вытесняет кислород без запаха.","РК: ограждение и знаки, расчёт зоны, дозиметр у каждого, работа по наряду, допуск персонала группы А, сигнализация источника; никто не входит в зону во время экспозиции.","Здоровье: маска с нужным светофильтром, респиратор при нержавейке (хром, марганец), вытяжка, не смотреть на дугу без защиты, кожа закрыта. Нет СИЗ — нет работы, это не геройство."]}],"DIAG":[{"id":"d1","mechanic":"single","points":2,"stem":"Шов на нержавейке получился с порами по всей длине. Сварщик говорит: «аргон шёл, 10 л/мин». Что проверить первым?","options":[{"id":"o0","text":"Чистоту кромок: масло и влага дают водород в ванне","correct":false,"rationale":"Поры по всей длине чаще от защиты, но влага — вторая причина; проверять после защиты."},{"id":"o1","text":"Защиту ванны: сопло, вылет вольфрама, сквозняк, подсос воздуха в шланге","correct":true,"rationale":"Поры по всей длине — классический признак нарушенной защиты даже при «правильном» расходе."},{"id":"o2","text":"Полярность: при обратной полярности вольфрам перегревается","correct":false,"rationale":"DCEP даёт вольфрамовые включения и оплавление электрода, а не поры."},{"id":"o3","text":"Ток: на 20 А выше карты — ванна кипит и захватывает газ","correct":false,"rationale":"Избыток тока даёт подрез и прожог; поры по длине — защита или грязь."}]},{"id":"d2","mechanic":"single","points":2,"stem":"На снимке стыка нет эталона чувствительности, но шов выглядит чистым. Что делать с заключением?","options":[{"id":"o0","text":"Выдать «годен» с пометкой, что эталон не установлен","correct":false,"rationale":"Без эталона чувствительность не подтверждена — любое заключение по снимку недействительно."},{"id":"o1","text":"Выдать «годен», если плотность в норме и маркировка на месте","correct":false,"rationale":"Плотность и маркировка нужны, но не заменяют эталон."},{"id":"o2","text":"Переснять стык с эталоном; заключение по этому снимку не выдавать","correct":true,"rationale":"Чувствительность подтверждается только эталоном на снимке; иначе пора 1 мм могла быть просто не видна."},{"id":"o3","text":"Приложить эталон со следующего снимка того же аппарата","correct":false,"rationale":"Эталон привязан к конкретной экспозиции и геометрии, а не к аппарату."}]},{"id":"d3","mechanic":"single","points":2,"stem":"Угол ввода 65°, путь по лучу 48 мм, стенка 12 мм. Где дефект?","options":[{"id":"o0","text":"На глубине 20,3 мм — прямой луч, X = 43,5 мм","correct":false,"rationale":"20,3 мм больше толщины 12 — прямой луч невозможен, это отражённый."},{"id":"o1","text":"На глубине 3,7 мм от поверхности, X = 43,5 мм","correct":true,"rationale":"Y = 2s − r·cos α = 24 − 20,3 = 3,7 мм; X = 48·0,906 = 43,5 мм."},{"id":"o2","text":"На глубине 12 мм — сигнал от донной поверхности","correct":false,"rationale":"Донный сигнал у наклонного ПЭП не приходит; r·cos α ≠ s."},{"id":"o3","text":"На глубине 48 мм — прибор показывает глубину напрямую","correct":false,"rationale":"Развёртка показывает путь по лучу r, а не глубину."}]},{"id":"d4","mechanic":"single","points":2,"stem":"Электроды УОНИ-13/55 пролежали ночь на открытом стеллаже в цехе. Можно ли варить ответственный стык?","options":[{"id":"o0","text":"Можно, если на покрытии нет видимой влаги и цех сухой","correct":false,"rationale":"Основное покрытие набирает влагу из воздуха без видимых следов — водород и поры в шве."},{"id":"o1","text":"Можно после прокалки 100 °C в течение получаса","correct":false,"rationale":"Для основного покрытия норма прокалки 350–400 °C, 1–2 ч; 100 °C воду не удалит."},{"id":"o2","text":"Нельзя до прокалки 350–400 °C и хранения в пенале","correct":true,"rationale":"Основное покрытие гигроскопично; водород даёт поры и холодные трещины."},{"id":"o3","text":"Можно на обратной полярности: дуга «сушит» покрытие на ходу","correct":false,"rationale":"Полярность не удаляет водород из покрытия."}]},{"id":"d5","mechanic":"single","points":2,"stem":"Подрез 0,8 мм на стыке трубы s = 10 мм, норма — уровень B по ИСО 5817. Как поступить?","options":[{"id":"o0","text":"Годен: до 1 мм на трубах допускается без ремонта","correct":false,"rationale":"1 мм — предел уровня D; для B норма ≤ 0,05·s и ≤ 0,5 мм."},{"id":"o1","text":"Зашлифовать до гладкого перехода и принять как геометрию","correct":false,"rationale":"Шлифовка подреза 0,8 мм утонит стенку ниже допуска."},{"id":"o2","text":"Ремонт: зачистка, подварка, повторный ВИК и контроль","correct":true,"rationale":"Для B допустимо ≤ 0,5 мм (и ≤ 0,05·s = 0,5); 0,8 — дефект, лечится подваркой."},{"id":"o3","text":"Принять, если сварщик 6 разряда подтвердит геометрию стыка","correct":false,"rationale":"Решает норма и измерение, а не разряд."}]},{"id":"d6","mechanic":"single","points":2,"stem":"Мастер просит заполнить журнал сварки за вчера «по памяти» — стыки сварены, клейма стоят. Что делать?","options":[{"id":"o0","text":"Заполнить по клеймам на стыках: данные совпадут с фактом сварки","correct":false,"rationale":"Режимы, материалы и время восстановить по клеймам нельзя; это подлог записи."},{"id":"o1","text":"Заполнить вчерашней датой и подписать с пометкой «восстановлено по памяти»","correct":false,"rationale":"Пометка не делает запись первичной; надзор признает журнал недостоверным."},{"id":"o2","text":"Записать сегодняшней датой только подтверждённое и доложить о пропуске","correct":true,"rationale":"Журнал — первичный документ; пропуск фиксируется честно, а не маскируется."},{"id":"o3","text":"Отказаться и ничего не писать, пока мастер не решит вопрос сам","correct":false,"rationale":"Отказ без фиксации пропуска оставляет дыру в ИД и перекладывает ответственность."}]},{"id":"d7","mechanic":"single","points":2,"stem":"Аустенитная сталь 08Х18Н10Т, стык s = 6 мм. Сварщик варит быстро, не давая остыть, «чтобы меньше коробило». Что происходит на самом деле?","options":[{"id":"o0","text":"Коробление меньше: меньше проходов — меньше суммарная усадка шва","correct":false,"rationale":"Непрерывная сварка перегревает зону: аустенит расширяется сильнее углеродистой — коробление растёт."},{"id":"o1","text":"Межпроходная температура выше 150 °C: риск МКК и горячих трещин","correct":true,"rationale":"Аустенит плохо отводит тепло; выдержка 500–800 °C даёт сенсибилизацию и МКК."},{"id":"o2","text":"Ничего: нержавейка к перегреву не чувствительна, в отличие от углеродистой стали","correct":false,"rationale":"Наоборот: аустенитные требуют ограничения Q и T_м."},{"id":"o3","text":"Шов станет прочнее: больше тепла — глубже и надёжнее проплавление","correct":false,"rationale":"Глубина проплавления не цель; перегрев ухудшает коррозионную стойкость."}]},{"id":"d8","mechanic":"single","points":2,"stem":"Чем отличается заключение I уровня НК от заключения II уровня?","options":[{"id":"o0","text":"I уровень выдаёт заключение по простым стыкам, II — по сложным и спорным","correct":false,"rationale":"I уровень вообще не выдаёт заключений — только выполняет контроль по карте."},{"id":"o1","text":"I уровень контролирует по карте и записывает, заключение подписывает II","correct":true,"rationale":"По СДАНК-02-2020: оценка результатов и заключение — право II уровня."},{"id":"o2","text":"I уровень — стажёр, его подпись ставится рядом с подписью II уровня","correct":false,"rationale":"I уровень — самостоятельный исполнитель контроля, но без права оценки."},{"id":"o3","text":"Разницы нет, если у обоих есть действующий допуск по методу контроля","correct":false,"rationale":"Уровень определяет права, а не допуск по методу."}]},{"id":"d9","mechanic":"single","points":2,"stem":"Трубопровод II категории, 400 стыков, проект требует РК 100 %. Прораб предлагает 20 % «по статистике бригады» ради срока. Ваш ответ?","options":[{"id":"o0","text":"Согласиться, если доля ремонта по первым 50 стыкам ниже 1 %","correct":false,"rationale":"Объём контроля задан проектом и категорией; статистика бригады его не отменяет."},{"id":"o1","text":"Согласиться, но добавить УЗК ещё на 20 % стыков для подстраховки","correct":false,"rationale":"Добавление метода не заменяет объём, заданный ПТД."},{"id":"o2","text":"Отказать: объём 100 % задан проектом и категорией, менять только через проект","correct":true,"rationale":"Объём контроля — требование проекта и норм для категории, не предмет торга на площадке."},{"id":"o3","text":"Согласиться на 50 % как компромисс между нормой проекта и сроком","correct":false,"rationale":"Компромисс по объёму на ОПО — нарушение, за которое отвечает подписавший."}]},{"id":"d10","mechanic":"single","points":2,"stem":"Какая картина на А-скане скорее говорит о геометрии шва (провисание корня), а не о дефекте?","options":[{"id":"o0","text":"Эхо на глубине стенки в зоне корня, симметричное с обеих сторон шва","correct":true,"rationale":"Провисание корня даёт эхо в расчётном месте корня с обеих сторон; дефект редко симметричен."},{"id":"o1","text":"Эхо выше браковочного уровня в середине толщины, в зоне заполнения","correct":false,"rationale":"Середина толщины — зона заполнения, геометрия там не отражает."},{"id":"o2","text":"Эхо, которое пропадает при смещении ПЭП на 2 мм вдоль шва","correct":false,"rationale":"Короткая протяжённость — скорее точечный дефект (пора, шлак)."},{"id":"o3","text":"Эхо, амплитуда которого растёт при повороте ПЭП на 10° вокруг оси","correct":false,"rationale":"Рост при повороте — ориентированный плоский дефект."}]},{"id":"d11","mechanic":"single","points":2,"stem":"Что такое тепловложение Q и почему его считают?","options":[{"id":"o0","text":"Мощность дуги U·I в ваттах: чем она больше, тем глубже проплавление","correct":false,"rationale":"Это мощность в единицу времени; без скорости сварки Q не получить."},{"id":"o1","text":"Тепло на единицу длины шва по формуле η·U·I·60/(v·1000)","correct":true,"rationale":"Q связывает режим с металлургией: перегрев аустенита, хрупкость, коробление."},{"id":"o2","text":"Температура подогрева металла перед началом сварки по карте","correct":false,"rationale":"Подогрев — T_п, отдельная величина."},{"id":"o3","text":"Расход электродов на метр шва в килограммах по норме","correct":false,"rationale":"Это норма расхода материалов, а не тепло."}]},{"id":"d12","mechanic":"single","points":2,"stem":"Сварщик на вахте варит 11-й час, осталось 3 стыка до конца смены, рука дрожит. Решение мастера?","options":[{"id":"o0","text":"Дать доварить: три стыка — это час, завтра переделывать дольше и дороже","correct":false,"rationale":"Час усталой руки на корне — это ремонт по 40 тыс. ₽ за стык."},{"id":"o1","text":"Перевести на заполнение, корень отдать свежему сварщику, остаток — завтра","correct":true,"rationale":"Корень — самый чувствительный проход; качество важнее часа графика."},{"id":"o2","text":"Перевести на полуавтомат: там дрожь руки почти не сказывается","correct":false,"rationale":"Усталость одинаково портит любой проход; МП не лечит дрожь."},{"id":"o3","text":"Остановить все работы на участке до утра: безопасность важнее графика","correct":false,"rationale":"Полная остановка не нужна; достаточно снять с ответственного прохода."}]}],"AUDITS":[],"LEGEND":"Обозначения в формулах курса: I ток · U напряжение дуги · v скорость сварки · Q тепловложение · η КПД способа · d диаметр электрода · s толщина · b зазор · c притупление · β угол скоса · e смещение · g усиление · k катет · h подрез · G расход газа · T_п/T_м подогрев/межпроходная · t экспозиция · f фокусное расстояние · F фокус · b_ф объект–плёнка · u нерезкость · D плотность · K чувствительность · λ длина волны · c_з скорость звука · f_з частота · α угол ввода · r путь по лучу · X, Y координаты · S_э эквивалентная площадь · N ближняя зона.","FORMULAS":[{"n":"Тепловложение","b":"Q = η·U·I·60 / (v·1000)","v":[{"s":"Q","e":"η·U·I·60 / (v·1000)","w":"кДж/мм; U — В, I — А, v — мм/мин"},{"s":"I","e":"Q·v·1000 / (η·U·60)","w":"какой ток давал известное Q"},{"s":"U","e":"Q·v·1000 / (η·I·60)","w":""},{"s":"v","e":"η·U·I·60 / (Q·1000)","w":"какая скорость держит Q в норме"},{"s":"η","e":"Q·v·1000 / (U·I·60)","w":"проверка способа: 0,6 — TIG, 0,8 — РД/МП"}]},{"n":"Ток по диаметру электрода (РД)","b":"I = K_d·d","v":[{"s":"I","e":"K_d·d","w":"K_d 30…50 А/мм"},{"s":"d","e":"I / K_d","w":"какой электрод под ток"},{"s":"K_d","e":"I / d","w":"в каком положении так варят: 45 — низ, 32 — потолок"}]},{"n":"Минуты в баллоне","b":"T_б = V_б·p_б / G","v":[{"s":"T_б","e":"V_б·p_б / G","w":"V_б — л (водяной объём), p_б — бар, G — л/мин: 40·150/10 = 600 мин"},{"s":"G","e":"V_б·p_б / T_б","w":""},{"s":"p_б","e":"T_б·G / V_б","w":"какое давление нужно, чтобы хватило на T_б"}]},{"n":"Геометрическая нерезкость","b":"u = F·b_ф / f","v":[{"s":"u","e":"F·b_ф / f","w":"мм"},{"s":"f","e":"F·b_ф / u","w":"минимальное фокусное расстояние под допуск u"},{"s":"F","e":"u·f / b_ф","w":""},{"s":"b_ф","e":"u·f / F","w":""}]},{"n":"Экспозиция при смене расстояния","b":"t_2 = t_1·(f_2/f_1)²","v":[{"s":"t_2","e":"t_1·(f_2/f_1)²","w":"закон обратных квадратов"},{"s":"f_2","e":"f_1·√(t_2/t_1)","w":""},{"s":"t_1","e":"t_2·(f_1/f_2)²","w":""}]},{"n":"Относительная чувствительность РК","b":"K_отн = K / s · 100","v":[{"s":"K_отн","e":"K / s · 100","w":"%"},{"s":"K","e":"K_отн·s / 100","w":"какой эталон нужен"},{"s":"s","e":"K / K_отн · 100","w":""}]},{"n":"Длина волны и ближняя зона","b":"λ = c_з / f_з;  N = D_п² / (4λ)","v":[{"s":"λ","e":"c_з / f_з","w":"c_з в мм/мкс (3,23), f_з в МГц → λ в мм"},{"s":"f_з","e":"c_з / λ","w":""},{"s":"c_з","e":"λ·f_з","w":""},{"s":"N","e":"D_п² / (4λ)","w":""},{"s":"D_п","e":"√(4·N·λ)","w":""},{"s":"λ (из N)","e":"D_п² / (4N)","w":""}]},{"n":"Координаты дефекта (прямой луч)","b":"X = r·sin α;  Y = r·cos α","v":[{"s":"X","e":"r·sin α","w":""},{"s":"Y","e":"r·cos α","w":"прямой луч"},{"s":"r","e":"√(X² + Y²)","w":""},{"s":"r (из Y)","e":"Y / cos α","w":""},{"s":"α","e":"arctg(X / Y)","w":"проверка угла ввода по координатам"}]},{"n":"Координаты (однократно отражённый луч)","b":"Y = 2s − r·cos α","v":[{"s":"Y","e":"2s − r·cos α","w":"r больше, чем s/cos α"},{"s":"r","e":"(2s − Y) / cos α","w":""},{"s":"s","e":"(Y + r·cos α) / 2","w":"какая толщина даёт такую глубину"}]},{"n":"Вероятность пропуска при выборочном контроле","b":"P_проп = (1 − q)^n","v":[{"s":"P_проп","e":"(1 − q)^n","w":"q — доля проконтролированных стыков, n — число дефектных стыков в партии"},{"s":"n","e":"ln P_проп / ln(1 − q)","w":""},{"s":"q","e":"1 − P_проп^(1/n)","w":"какой объём контроля даст нужную уверенность"}]},{"n":"Цена ремонта против контроля","b":"C_рем = n_деф·(C_выр + C_подв + C_РК) + C_прост·T_прост","v":[{"s":"C_рем","e":"n_деф·(C_выр + C_подв + C_РК) + C_прост·T_прост","w":"₽ за партию"},{"s":"n_деф","e":"(C_рем − C_прост·T_прост) / (C_выр + C_подв + C_РК)","w":"сколько дефектных стыков «окупят» 100 % контроль"},{"s":"T_прост","e":"(C_рем − n_деф·(C_выр + C_подв + C_РК)) / C_прост","w":""}]}],"FALSE_WIN":{"title":"💸 Экономика решений: цена пропущенного дефекта против цены лишнего ремонта","cols":["пропуск","ложный брак","соотношение","когда"],"rows":["Цена пропуска дефекта","Цена ложного брака (лишний ремонт)","Доля дефектных стыков","Баланс пропуск/брак"],"intro":"Контроль — это выбор между двумя ошибками: пропустить дефект (принять брак) и забраковать годное (лишний ремонт, простой). Обе стоят денег, но разных: пропуск на трубопроводе давления — авария, ложный брак — 40 тысяч и смена. Объём контроля, чувствительность и норма оценки выбираются так, чтобы ожидаемые потери от обеих ошибок были сопоставимы, а не «как всегда».","steps":[["1. Цена пропуска C_проп","Сложи: (а) последствия отказа — остановка объекта, ремонт в эксплуатации, экологический ущерб, штрафы, в худшем случае жертвы (для ОПО это сотни миллионов); (б) вероятность, что пропущенный дефект доживёт до отказа (трещина — почти наверняка; одиночная пора 1 мм в середине шва — почти никогда); (в) репутация и допуск компании."],["2. Цена ложного брака C_брак","Вырезка + подварка + повторный РК (25–60 тыс. ₽ на стык Ø 530) + простой бригады (150–300 тыс. ₽/день) + сдвиг графика. Плюс цена «перестраховки» в документах: заказчик перестаёт верить заключениям, которые бракуют всё подряд."],["3. Доля дефектных стыков q_деф","Из статистики участка: доля ремонта 1–5 % — норма для трассы, 0,3–1 % — хорошая бригада, > 8 % — сломана технология или сборка. Новая бригада без истории — считай 5 %."],["4. Баланс","Пропуск дороже ложного брака в 100–1000 раз на ОПО → контроль 100 % на категориях I–II и жёсткая норма (класс 1–2, уровень B); на вспомогательных трубопроводах пропуск дешевле → выборка 10–20 % и уровень C. Выборку считай через P_проп = (1 − q)^n."],["5. Проверка здравого смысла","Если расчёт говорит «контролировать меньше», проверь, что цена пропуска включает отказ, а не только переделку. Если говорит «контролировать всё» на водопроводе из ПНД — ты переоценил пропуск. Решение фиксируется в плане контроля с числами."]],"grid":[["100 %","РК + УЗК дублирование","пропуск ≫ брак","трубопроводы давления I–II категории, корпусное оборудование, нержавейка на химии"],["100 % РК","ВИК всех","пропуск ≫ брак","ответственные стыки труб, где доступ один раз: под засыпку, под изоляцию"],["20–50 %","выборка по сварщику","пропуск > брак","трубопроводы III–IV категории, металлоконструкции с полным проваром"],["5–10 %","выборка по партии","пропуск ≈ брак","вспомогательные конструкции, вода низкого давления; при первом дефекте — удвоение выборки"],["ВИК","без РК/УЗК","пропуск < брак","неответственные элементы, временные конструкции, площадки"]],"cases":[{"t":"Выборка 10 % на трассе Ø 530, 400 стыков","n":"Бригада новая, доля ремонта по первым 40 стыкам — 5 %. Заказчик требует сдать на неделю раньше.","miss":"Отказ под давлением: 50–300 млн ₽ + остановка","fp":"Ремонт стыка 40 тыс. ₽ + 0,5 смены","prior":"q_деф 5 % → ≈ 20 дефектных из 400","bal":"P_проп (10 %) = 0,9²⁰ ≈ 12 % пропустить ВСЕ, но ≈ 18 стыков пройдут","dec":"100 % РК; при доле ремонта < 1 % после 100 стыков — обсуждать 50 %"},{"t":"Индикация на границе нормы: пора 2,1 мм при допуске 2,0","n":"Класс 2 по ГОСТ 23055, s = 10 мм, стык под засыпку завтра.","miss":"Одиночная пора в середине шва почти не растёт; риск мал, но норма — закон","fp":"Ремонт 40 тыс. ₽ + смена","prior":"Погрешность измерения ±0,1 мм — результат на пределе","bal":"Пересмотреть снимок с лупой и линейкой, второй читающий; не «округлять в пользу»","dec":"Если 2,1 подтверждено — ремонт; если 2,0 — годен, обе фамилии в заключении"},{"t":"Переход лаборатории на цифровую радиографию","n":"6 000 снимков в год по 3 тыс. ₽ (плёнка, химия, время); панель и ПО — 6 млн ₽.","miss":"Не меняется: чувствительность та же при правильной настройке","fp":"Не меняется","prior":"Экономия 1–1,5 тыс. ₽ на снимке + архив без потерь","bal":"6 000 × 1,2 тыс. = 7,2 млн ₽/год","dec":"Окупаемость < 1 года — переходить, обучив II уровень на цифровые нормы"},{"t":"Просят подписать «годен» на стык с непроваром корня 15 мм","n":"Сдача завтра, мастер «решит вопрос», стык под изоляцию.","miss": вне курса (помечено).","demand":"Москва и вахта из Москвы, октябрь 2026: hh.ru — 42 вакансии «сварщик НАКС СК», 29 «дефектоскопист», 62 «специалист по НК» по Москве; спрос — нефтегаз (Газстройпром, Стройтранснефтегаз, Газпром нефть), энергетика (Интер РАО, Мосэнерго, Росатом/ТСМ Энерджи), машиностроение (Авангард, Рубин, НЦВ Миля и Камова), метро и сервис (МВМ Сервис), лаборатории НК (НДТ Консалтинг, Триада). Доля вахтовых вакансий у сварщиков НАКС — большинство.","asof":"октябрь 2026","grades":[{"id":"g0","name":"Ученик / до входа","short":"L0","level":["L0"],"years":"0 лет · колледж, курсы, ученик сварщика, стажёр НК","mission":"Понимать, что происходит в дуге и в металле, не бояться оборудования и видеть дефект на картинке раньше, чем на шве.","duties":["Готовить пост, баллоны и защиту; зачищать кромки","Варить учебные пластины в нижнем положении по карте","Называть элементы шва и соединения на чертеже","Отличать подрез от наплыва, пору от шлака на фотографиях"],"proof":["Пройден L0 с зачётом ≥ 85%","Босс «Первая смена в цехе»","Артефакт: карта поста и чек-лист безопасности"],"signals":["Называет полярность и зачем она","Не кладёт баллон без колпака — знает, почему","Отличает дефект от геометрии на картинке"]},{"id":"g1","name":"Сварщик 3–4 разряда / контролёр-ученик","short":"L1","level":["L1"],"years":"0,5–2 года","mission":"Самостоятельно варить швы средней сложности по технологической карте в любом положении и сдавать их под ВИК с первого раза.","duties":["Собирать стык по карте: зазор, притупление, смещение, прихватки","Выбирать режим РД/МП по карте и корректировать по шву","Проверять свой шов шаблоном УШС и вести журнал","Соблюдать ОТ: баллоны, электробезопасность, огневые работы"],"proof":["Боссы «Стык, который не сходится», «Позиционный шов»","Аудиты L1 (акт ВИК, записи журнала)","Артефакт: операционная карта сборки-сварки"],"signals":["Меряет зазор и притупление, а не «на глаз»","Объясняет, откуда взялись поры именно в этом шве","Знает, что сделать с бал /* Пункты против процентов: две шкалы. p={a,b} доли */

/* Доверительный интервал на числовой оси против 0 и MDE. p={lo,hi,est,mde,unit} */

function renderLayers(st,card){var u=st.unit,L=u.layers,uid=u.id;var need=reqLayers(u.level);var prog=layerProg(uid);var cur=0;for(var i=0;i<4;i++){if(prog.done[i])cur=Math.min(3,i+1);else break;}

    each(card.querySelectorAll('.ltab'),function(b){b.onclick=function(){var i=+b.getAttribute('data-l');if(!unlocked(i)){toastMsg('Сначала пройди проверку предыдущего слоя');return;}cur=i;draw();window.scrollTo(0,0);};});
    card.querySelector('#nx').onclick=function(e){if(!canGo())return;addXp(2);SES.xp+=2;xpFloat(e.clientX,e.clientY,'+2');stepDone(null);};
    drawCheck();bindTop();}

      b.onclick=function(ev){if(state.ok)return;state.tries++;var ok=oi===q.a;if(ok){state.ok=true;b.classList.add('ok');SFX.ok();if(!was){saveLayer(uid,cur);prog=layerProg(uid);if(state.tries===1){addXp(3);SES.xp+=3;xpFloat(ev.clientX,ev.clientY,'+3');}}

          var nb=box.querySelector('#lnext');if(nb)nb.onclick=function(){cur=cur+1;draw();window.scrollTo(0,0);};var nx=card.querySelector('#nx');if(canGo()){nx.disabled=false;nx.textContent='Дальше';}}
        else{b.classList.add('bad');b.disabled=true;SFX.bad();box.querySelector('#lwhy').innerHTML='<div class="fbk mid">Не то. Перечитай слой выше и попробуй ещё раз — у каждого варианта есть зацепка в тексте.</div>';}};});
    if(state.ok||was){each(wrap.querySelectorAll('.opt'),function(b,k){if(order[k]===q.a)b.classList.add('ok');});if(was&&!state.ok)box.querySelector('#lwhy').innerHTML='<div class="fbk ok"><b>Напоминание.</b> '+linkTerms(esc(q.w))+'</div>'+(cur<3?'<button type="button" class="btn sm ghost" id="lnext" style="margin-top:10px">К слою '+(cur+2)+' →</button>':'');var nb2=box.querySelector('#lnext');if(nb2)nb2.onclick=function(){cur=cur+1;draw();window.scrollTo(0,0);};}}

function stepDone(ratio){SES.res.push(ratio);SES.idx++;if(SES.idx<SES.unit.steps.length)sesSnapshot();else if(!SES.noSave)resumeClear('unit',SES.unit.id);playView();window.scrollTo(0,0);}

var CONF_CUR=null;
function logAnswer(item,full){var conf=CONF_CUR;CONF_CUR=null;
  if(conf){var cb=S.get('calib',{sure:{n:0,hit:0},unsure:{n:0,hit:0}});cb[conf]=cb[conf]||{n:0,hit:0};cb[conf].n++;if(full)cb[conf].hit++;S.set('calib',cb);}
  var elg=S.get('errlog',{});var r=elg[item.id];
  if(!full){r=r||{n:0,fixed:0,sm:0};r.n++;r.fixed=0;if(conf==='sure')r.sm=(r.sm||0)+1;r.ts=Date.now();elg[item.id]=r;S.set('errlog',elg);}
  else if(r&&(r.fixed||0)<2){r.fixed=(r.fixed||0)+1;elg[item.id]=r;S.set('errlog',elg);}}
function settle(item,ratio,ev,bet){
  var dt=itemTimeDone(item.id);if(SES){SES.tItems=(SES.tItems||0)+dt;}
  logAnswer(item,ratio>=0.999);dayLog('q');if(ratio>=0.999)dayLog('ok');
  var stp=SES.unit.steps[SES.idx]||{};var pre=!!stp.pre,redo=!!stp.redo;var full=ratio>=0.999;
  if(!pre&&!redo){SES.nItems++;SES.hits+=ratio;}
  var base=(item.points||1)*10;var mult=1+0.1*Math.min(10,SES.combo);var xp=Math.round(base*ratio*mult);if(redo)xp=Math.round(xp*0.5);
  if(bet){if(full)xp*=2;else xp=0;}
  if(full){SES.combo++;SES.maxCombo=Math.max(SES.maxCombo,SES.combo);}else if(!pre){SES.combo=0;}
  if(xp>0){addXp(xp);SES.xp+=xp;if(ev)xpFloat(ev.clientX,ev.clientY,'+'+xp);}
  if(full){SFX.ok();if(xp>0)setTimeout(SFX.coin,140);}else if(!pre){SFX.bad();}
  if(!full&&!pre&&!redo)SES.wrong.push(item);
  if(redo&&full)SES.wrong=SES.wrong.filter(function(w){return w.id!==item.id;});
  if(!redo)noteResult(item,ratio);
  var nRedo=0;for(var k in SES.redoIds)if(has(SES.redoIds,k))nRedo++;
  if(!full&&!pre&&!redo&&!SES.exam&&!SES.cert&&!SES.diag&&!SES.redoIds[item.id]&&nRedo<3){SES.redoIds[item.id]=1;SES.unit.steps.push({t:'item',item:item,redo:true});}
  SES.lastItem=item;SES.lastFull=full;SES.lastPre=pre||redo;
  var tb=$app.querySelector('.playtop');if(tb){tb.outerHTML=playTop();bindQuit();}
  return {xp:xp,full:full};}
function contBtn(box,ratio){
  var it=SES&&SES.lastItem;if(it&&ITEM_LAST_DT!=null){var st=itemStat(it.id);box.insertAdjacentHTML('beforeend','<div class="small faint tline">⏱ '+fmtDur(ITEM_LAST_DT*1000)+(st&&st.n>1?' · твоё среднее по этому вопросу '+fmtDur(st.sum/st.n*1000):'')+' · на результат не влияет</div>');}
  if(it&&it.anchor&&!box.querySelector('.anchor'))box.insertAdjacentHTML('beforeend',glyphHtml(it.anchor));
  if(it&&SES.lastFull===false&&!SES.lastPre&&['single','sjt_bw','multi','visual'].indexOf(it.mechanic)>=0){var q=elabQuiz(it);if(q)box.appendChild(q);}
  var b=el('<button class="btn wide" style="margin-top:14px">Дальше</button>');box.appendChild(b);b.onclick=function(){stepDone(ratio);};}
function elabQuiz(item){var co=null,ws=[];(item.options||item.vopts||[]).forEach(function(o){var r=o.why||o.rationale;if(!r)return;if(o.correct){if(!co)co={r:r,ok:true};}else ws.push({r:r,ok:false});});
  if(!co||ws.length<2)return null;ws=shuffle(ws);var opts=shuffle([co,ws[0],ws[1]]);
  var wrap=el('<div class="elab reveal"><b>🧩 Закрепим: какое объяснение стоит за верным ответом?</b></div>');
  opts.forEach(function(o){var b=el('<button class="opt"><span>'+esc(o.r)+'</span></button>');b._ok=o.ok;b.onclick=function(ev){each(wrap.querySelectorAll('.opt'),function(x){x.disabled=true;});if(o.ok){b.classList.add('ok');addXp(5);SES.xp+=5;if(ev)xpFloat(ev.clientX,ev.clientY,'+5');}else{b.classList.add('bad');each(wrap.querySelectorAll('.opt'),function(x){if(x._ok)x.classList.add('ok');});}};wrap.appendChild(b);});
  return wrap;}
function fbBox(ok,title,txt){return '<div class="fbk '+(ok===true?'ok':(ok==='mid'?'mid':'bad'))+' reveal"><b>'+esc(title)+'</b>'+(txt?esc(txt):'')+'</div>';}

function betRow(box,cb){var r=el('<div class="conf"><span class="muted">Прогноз:</span><button class="btn xs ghost" data-conf="sure">😎 Уверен</button><button class="btn xs ghost" data-conf="unsure">🤔 Сомневаюсь</button><button class="btn xs ghost" data-bet="1" title="XP ×2 при верном, 0 при ошибке">🎯 Ставка ×2</button></div>');

  var bt=r.querySelector('[data-bet]');bt.onclick=function(){on=!on;bt.className=on?'btn xs':'btn xs ghost';cb(on);};box.appendChild(r);}

var GATE_SKIP={};
function renderItem(item,box){
  CONF_CUR=null;ITEM_T0=Date.now();
  var terms=itemTerms(item);var st=S.get('lex',{});var un=null;
  for(var i=0;i<terms.length;i++){if(!st[terms[i].name]&&!GATE_SKIP[terms[i].name]){un=terms[i];break;}}
  if(un&&SES&&!SES.exam&&!SES.cert&&!SES.diag)return rTermGate(un,item,box);
  var m=item.mechanic;
  if(m==='single')return rSingle(item,box);
  if(m==='sjt_bw')return rSjtBW(item,box);
  if(m==='multi')return multiCore(item,box,{tag:'Выбери все верные',hint:'Верных: {n}. Отметь и проверь.',isOk:function(o){return !!o.correct;},why:function(o){return o.rationale||o.why||'';}});
  if(m==='keymoves')return multiCore(item,box,{tag:'Собери сильный ответ',hint:'Выбери ходы сильного ответа ({n}). Среди вариантов есть ловушки.',isOk:function(o){return !!o.correct;},why:function(o){return o.why||o.rationale||'';},after:function(bx){if(item.reference)bx.insertAdjacentHTML('beforeend',fold('<span class="a-c">Эталонный ответ целиком</span>','<div class="ref">'+esc(item.reference)+'</div>',{cls:'refbox reveal',copy:true}));bindFolds(bx);}});
  if(m==='ranking')return rRanking(item,box);
  if(m==='matching')return rMatching(item,box);

  box.innerHTML=mechHead('Шаг',item.stem||'');contBtn(box,1);}
function rTermGate(term,item,box){

function rSingle(item,box){var opts=shuffle(item.options);box.innerHTML=mechHead('Один верный',item.stem);var bet=false;betRow(box,function(v){bet=v;});var wrap=el('<div></div>');box.appendChild(wrap);

      opts.forEach(function(oo,j){var ex=wrap.children[j];if(oo.correct){ex.classList.add('ok');ex.insertAdjacentHTML('beforeend','<div class="why">'+esc(oo.rationale||'')+'</div>');}else if(oo===o){ex.classList.add('bad');ex.insertAdjacentHTML('beforeend','<div class="why">'+esc(oo.rationale||'')+'</div>');}else{ex.classList.add('dim');if(oo.rationale)ex.insertAdjacentHTML('beforeend','<div class="why" style="opacity:.8">'+esc(oo.rationale)+'</div>');}});

function rSjtBW(item,box){var opts=shuffle(item.options);var bestId=null;item.options.forEach(function(o){if(o.correct)bestId=o.id;});var worstId=item.worst;

          else if(oo.id===worstId){ex.classList.add('bad');ex.insertAdjacentHTML('beforeend','<div class="why"><b class="err-c">Худшее.</b> '+esc(item.worstRationale||oo.rationale||'')+'</div>');}

function fld(id,label,val,attrs){return '<div class="fld"><label for="'+id+'">'+label+'</label><input id="'+id+'" value="'+esc(val)+'" '+(attrs||'inputmode="decimal"')+'></div>';}

function svgLine(pts,w,h,color,opts){opts=opts||{};if(!pts.length)return '';var xs=pts.map(function(p){return p[0];}),ys=pts.map(function(p){return p[1];});var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs),y0=opts.y0!=null?opts.y0:Math.min.apply(null,ys),y1=opts.y1!=null?opts.y1:Math.max.apply(null,ys);if(y1===y0)y1=y0+1;if(x1===x0)x1=x0+1;
  function X(x){return 36+(x-x0)/(x1-x0)*(w-46);}function Y(y){return 8+(1-(y-y0)/(y1-y0))*(h-28);}
  var d=pts.map(function(p,i){return (i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1);}).join(' ');
  var s='<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2"/>';
  if(opts.hline!=null)s+='<line x1="36" x2="'+(w-10)+'" y1="'+Y(opts.hline)+'" y2="'+Y(opts.hline)+'" stroke="var(--err)" stroke-dasharray="4 3"/>';

  return s;}
function labView(){var tabs=[['size','Выборка'],['analyze','Результат'],['srm','SRM'],['peek','Подглядывание'],['cuped','CUPED']];

function labSize(box){var st=S.get('labsize',{p:5,mde:10,alpha:5,power:80,sides:2,traffic:20000,k:2});
  box.innerHTML='<div class="lab"><h3>Размер выборки для конверсии</h3><div class="small muted">Сколько пользователей на группу (n) нужно, чтобы поймать эффект размером MDE: n ≈ 16·p(1−p)/δ² при α 5% и мощности (1 − β) 80%.</div><div class="two">'+fld('ls-p','Базовая конверсия (p), %',st.p)+fld('ls-mde','MDE (δ, относительный), %',st.mde)+'</div><div class="two">'+fld('ls-alpha','Уровень значимости α, % (ложная победа)',st.alpha)+fld('ls-power','Мощность (1 − β), %',st.power)+'</div><div class="two"><div class="fld"><label>Гипотеза</label><select id="ls-sides"><option value="2"'+(st.sides===2?' selected':'')+'>двусторонняя</option><option value="1"'+(st.sides===1?' selected':'')+'>односторонняя</option></select></div>'+fld('ls-k','Групп (k, включая контроль)',st.k)+'</div>'+fld('ls-traffic','Трафик в тест (N в день), пользователей',st.traffic)+'<button class="btn wide" id="ls-go">Посчитать</button><div id="ls-res"></div></div>';
  function run(){var p=gv('ls-p')/100,mde=gv('ls-mde')/100,alpha=gv('ls-alpha')/100,power=gv('ls-power')/100,sides=+document.getElementById('ls-sides').value,k=gv('ls-k')||2,tr=gv('ls-traffic');if(!(p>0&&p<1&&mde>0&&alpha>0&&alpha<1&&power>0&&power<1))return;
    S.set('labsize',{p:p*100,mde:mde*100,alpha:alpha*100,power:power*100,sides:sides,traffic:tr,k:k});labUsed('size');
    var p2=p*(1+mde);var n=nProp(p,p2,alpha,power,sides);var total=n*k;var days=tr>0?Math.ceil(total/tr):null;var weeks=days?Math.max(1,Math.ceil(days/7)):null;
    var pts=[];for(var m=0.02;m<=0.3;m+=0.01){pts.push([m*100,nProp(p,p*(1+m),alpha,power,sides)]);}
    var r='<div class="res"><div class="k">На группу</div><div class="big">'+fmtNum(n)+'</div><div class="small muted">Всего '+fmtNum(total)+' при '+k+' '+plural(k,'группе','группах','группах')+(days?' · при '+fmtNum(tr)+'/день — <b>'+days+' '+plural(days,'день','дня','дней')+'</b>, округляй до целых недель: '+weeks+' '+plural(weeks,'неделя','недели','недель'):'')+'</div></div>';
    r+='<div class="ab2"><div class="va"><span class="k">A: '+fmtPct(p,2)+'</span><b>'+fmtNum(Math.round(n*p))+'</b><span class="small muted">конверсий</span></div><div class="vb"><span class="k">B при успехе: '+fmtPct(p2,2)+'</span><b>'+fmtNum(Math.round(n*p2))+'</b><span class="small muted">конверсий</span></div></div>';
    r+='<svg class="chart" viewBox="0 0 320 120">'+svgLine(pts,320,120,'var(--a)',{fx:function(x){return x+'% MDE';},fy:function(y){return fmtNum(y);},y0:0})+'</svg><div class="small faint">Как растёт n на группу при уменьшении MDE: выборка ∝ 1/MDE². Вдвое меньший эффект — вчетверо больше людей.</div>';
    r+='<div class="sol small">n = (z<sub>1−α/2</sub> + z<sub>1−β</sub>)² · [p₁(1−p₁) + p₂(1−p₂)] / (p₂−p₁)². Здесь z<sub>α</sub> = '+fmtNum(qnorm(1-alpha/(sides===1?1:2)))+', z<sub>β</sub> = '+fmtNum(qnorm(power))+', p₂ − p₁ = '+fmtPct(p2-p,3)+' (абсолютных).\nГрубая формула для памяти: n ≈ 16·p(1−p)/δ² при α=5%, мощности 80%.</div>';
    document.getElementById('ls-res').innerHTML=r;}
  document.getElementById('ls-go').onclick=run;run();}

function labAnalyze(box){var st=S.get('labana',{na:50000,xa:2500,nb:50000,xb:2650,mde:5});
  box.innerHTML='<div class="lab"><h3>Анализ результата: две доли</h3><div class="small muted">Z-тест для конверсии: разница долей (Δ = p_B − p_A), стандартная ошибка (SE), 95% доверительный интервал (ДИ), p-value — и сравнение интервала с MDE из паспорта.</div><div class="two">'+fld('la-na','A: пользователей (n_A)',st.na)+fld('la-xa','A: конверсий (x_A)',st.xa)+'</div><div class="two">'+fld('la-nb','B: пользователей (n_B)',st.nb)+fld('la-xb','B: конверсий (x_B)',st.xb)+'</div>'+fld('la-mde','MDE из паспорта (δ, относительный), %',st.mde)+'<button class="btn wide" id="la-go">Посчитать</button><div id="la-res"></div></div>';
  function run(){var na=gv('la-na'),xa=gv('la-xa'),nb=gv('la-nb'),xb=gv('la-xb'),mde=gv('la-mde')/100;if(!(na>0&&nb>0&&xa>=0&&xb>=0&&xa<=na&&xb<=nb))return;S.set('labana',{na:na,xa:xa,nb:nb,xb:xb,mde:mde*100});labUsed('analyze');
    var z=zProp(xa,na,xb,nb);var relLo=z.pa?z.lo/z.pa:0,relHi=z.pa?z.hi/z.pa:0;
    var verdict;if(z.p<0.05&&z.diff>0)verdict=relLo>=mde?'Значимо и интервал целиком выше MDE — победа по паспорту.':'Значимо, но интервал задевает значения ниже MDE: эффект, скорее всего, меньше, чем планировали. Решай по экономике, не по звёздочке.';
    else if(z.p<0.05&&z.diff<0)verdict='Значимое ухудшение. Откат и разбор механизма.';
    else verdict=(relHi>=mde)?'Незначимо, но интервал ещё включает MDE — это недолёт по мощности, а не «эффекта нет». Либо добирай выборку по плану, либо честно закрывай как неразрешённый.':'Незначимо и интервал целиком ниже MDE — эффекта размером с MDE почти наверняка нет. Можно закрывать как «не сработало».';
    var r='<div class="ab2"><div class="va"><span class="k">A</span><b>'+fmtPct(z.pa,2)+'</b><span class="small muted">'+fmtNum(xa)+' / '+fmtNum(na)+'</span></div><div class="vb"><span class="k">B</span><b>'+fmtPct(z.pb,2)+'</b><span class="small muted">'+fmtNum(xb)+' / '+fmtNum(nb)+'</span></div></div>';
    r+='<div class="res"><div class="k">Разница B − A</div><div class="big">'+(z.diff>=0?'+':'')+fmtPct(z.diff,2)+' <span class="small muted">п.п.</span> · '+(z.rel>=0?'+':'')+fmtPct(z.rel,1)+' <span class="small muted">отн.</span></div><div class="small">95% ДИ: '+fmtPct(z.lo,2)+' … '+fmtPct(z.hi,2)+' п.п. (отн. '+fmtPct(relLo,1)+' … '+fmtPct(relHi,1)+') · z = '+fmtNum(z.z)+' · p = '+(z.p<0.0001?'< 0,0001':fmtNum(z.p))+'</div></div>';
    var lo=Math.min(z.lo,0,mde*z.pa)-Math.abs(z.hi-z.lo)*0.3,hi=Math.max(z.hi,0,mde*z.pa)+Math.abs(z.hi-z.lo)*0.3;function X(v){return 20+(v-lo)/(hi-lo)*280;}
    r+='<svg class="chart" viewBox="0 0 320 60"><line x1="'+X(0)+'" x2="'+X(0)+'" y1="8" y2="44" stroke="var(--faint)" stroke-dasharray="3 3"/><line x1="'+X(mde*z.pa)+'" x2="'+X(mde*z.pa)+'" y1="8" y2="44" stroke="var(--b)" stroke-dasharray="3 3"/><line x1="'+X(z.lo)+'" x2="'+X(z.hi)+'" y1="26" y2="26" stroke="var(--a)" stroke-width="4"/><circle cx="'+X(z.diff)+'" cy="26" r="5" fill="var(--a)"/><text x="'+X(0)+'" y="56" font-size="10" text-anchor="middle" fill="var(--faint)">0</text><text x="'+X(mde*z.pa)+'" y="56" font-size="10" text-anchor="middle" fill="var(--b)">MDE</text></svg>';
    r+='<div class="fbk '+(z.p<0.05&&z.diff>0&&relLo>=mde?'ok':(z.p<0.05&&z.diff<0?'bad':'mid'))+'"><b>Вердикт</b>'+esc(verdict)+'</div>';
    r+='<div class="sol small">SE разницы = √(p<sub>A</sub>(1−p<sub>A</sub>)/n<sub>A</sub> + p<sub>B</sub>(1−p<sub>B</sub>)/n<sub>B</sub>) = '+fmtPct(z.se,3)+'. ДИ = разница ± 1,96·SE. Для z берётся объединённая доля. Множественных метрик здесь нет — одна primary, один тест.</div>';
    document.getElementById('la-res').innerHTML=r;}
  document.getElementById('la-go').onclick=run;run();}

function labSrm(box){var st=S.get('labsrm',{na:50000,nb:49200,ra:50,rb:50});
  box.innerHTML='<div class="lab"><h3>SRM: проверка сплита</h3><div class="small muted">Sample Ratio Mismatch — пропорция групп не совпадает с задуманной. Самый частый симптом сломанного эксперимента: результат читать нельзя, пока не найдена причина.</div><div class="two">'+fld('sr-na','A: пользователей (n_A)',st.na)+fld('sr-nb','B: пользователей (n_B)',st.nb)+'</div><div class="two">'+fld('sr-ra','Ожидаемая доля A (план), %',st.ra)+fld('sr-rb','Ожидаемая доля B (план), %',st.rb)+'</div><button class="btn wide" id="sr-go">Проверить</button><div id="sr-res"></div></div>';
  function run(){var na=gv('sr-na'),nb=gv('sr-nb'),ra=gv('sr-ra'),rb=gv('sr-rb');if(!(na>0&&nb>0&&ra>0&&rb>0))return;S.set('labsrm',{na:na,nb:nb,ra:ra,rb:rb});labUsed('srm');var t=srmTest(na,nb,ra,rb);var bad=t.p<0.001;
    var r='<div class="res"><div class="k">χ² = '+fmtNum(t.chi)+' · p</div><div class="big">'+(t.p<0.0001?'< 0,0001':fmtNum(t.p))+'</div><div class="small muted">Ожидалось A '+fmtNum(Math.round(t.ea))+' / B '+fmtNum(Math.round(t.eb))+' · фактически '+fmtNum(na)+' / '+fmtNum(nb)+' · отклонение A '+fmtPct((na-t.ea)/t.ea,2)+'</div></div>';
    r+='<div class="fbk '+(bad?'bad':'ok')+'"><b>'+(bad?'SRM: результат читать нельзя':'Сплит в норме')+'</b>'+(bad?'Порог для SRM — p < 0,001 (не 0,05: проверок много, цена ложной тревоги мала). Ищи причину: редиректы и потери на стороне B, боты в одной группе, фильтры логирования, разный момент присвоения, баг хеширования, переиспользованная соль.':'При p ≥ 0,001 сплит не противоречит плану. Это не доказывает, что всё хорошо, но снимает самый частый дефект.')+'</div>';
    r+='<div class="sol small">χ² = Σ (факт − ожидание)² / ожидание, одна степень свободы. Проверяй SRM в начале, в середине и в конце теста — и отдельно по платформам и дням.</div>';
    document.getElementById('sr-res').innerHTML=r;}
  document.getElementById('sr-go').onclick=run;run();}

function labPeek(box){var st=S.get('labpeek',{days:14,n:5000,p:5,eff:0,alpha:5,sims:400});
  box.innerHTML='<div class="lab"><h3>Симулятор подглядывания</h3><div class="small muted">Запускаем сотни A/A-тестов (истинный эффект 0 или заданный) и смотрим, как часто «побеждает» тот, кто проверяет p-value каждый день и останавливается на первом значимом, против того, кто смотрит один раз в конце.</div><div class="two">'+fld('pk-days','Дней теста',st.days)+fld('pk-n','Пользователей в день на группу (n/день)',st.n)+'</div><div class="two">'+fld('pk-p','Базовая конверсия (p), %',st.p)+fld('pk-eff','Истинный эффект (δ, относительный), %',st.eff)+'</div><div class="two">'+fld('pk-alpha','Уровень значимости α, %',st.alpha)+fld('pk-sims','Симуляций',st.sims)+'</div><button class="btn wide" id="pk-go">Запустить симуляцию</button><div id="pk-res"></div></div>';
  function run(){var days=Math.round(gv('pk-days')),n=Math.round(gv('pk-n')),p=gv('pk-p')/100,eff=gv('pk-eff')/100,alpha=gv('pk-alpha')/100,sims=Math.min(2000,Math.max(50,Math.round(gv('pk-sims'))));if(!(days>0&&n>0&&p>0&&p<1&&alpha>0&&alpha<1))return;S.set('labpeek',{days:days,n:n,p:p*100,eff:eff*100,alpha:alpha*100,sims:sims});labUsed('peek');
    var zc=qnorm(1-alpha/2);var pb=p*(1+eff);var peekWins=0,endWins=0,firstDayHits=[];var traj=null;
    for(var s=0;s<sims;s++){var ca=0,cb=0,na=0,nb=0,stopped=false,endSig=false,tr=[];
      for(var d=1;d<=days;d++){var a=Math.round(n*p+gaussRand()*Math.sqrt(n*p*(1-p)));var b=Math.round(n*pb+gaussRand()*Math.sqrt(n*pb*(1-pb)));ca+=Math.max(0,a);cb+=Math.max(0,b);na+=n;nb+=n;var zr=zProp(ca,na,cb,nb);var sig=Math.abs(zr.z)>zc;if(s===0)tr.push([d,zr.p]);if(sig&&!stopped){stopped=true;firstDayHits.push(d);}if(d===days)endSig=sig;}
      if(stopped)peekWins++;if(endSig)endWins++;if(s===0)traj=tr;}
    var fpPeek=peekWins/sims,fpEnd=endWins/sims;var label=eff?'Мощность (1 − β)':'Доля ложных побед (α факт.)';
    var r='<div class="ab2"><div class="vb"><span class="k">Смотрит каждый день, стоп на первом значимом</span><b>'+fmtPct(fpPeek,1)+'</b><span class="small muted">'+label+'</span></div><div class="va"><span class="k">Смотрит один раз в конце</span><b>'+fmtPct(fpEnd,1)+'</b><span class="small muted">'+label+'</span></div></div>';
    r+='<div class="fbk '+(eff?'ok':'bad')+'"><b>'+(eff?'С реальным эффектом обе стратегии ловят его, но подглядывающий переоценивает размер':'Без эффекта честный тест ошибается примерно в α = '+fmtPct(alpha,0)+' случаев, подглядывающий — в '+fmtPct(fpPeek,0))+'</b>'+(eff?'Остановка на первом значимом дне систематически выбирает удачный шум: оценка лифта в такой момент завышена. Это winner\'s curse в чистом виде.':'Каждая дополнительная проверка — ещё один шанс поймать случайный выброс. '+days+' проверок при α='+fmtPct(alpha,0)+' дают ложную победу примерно в '+fmtPct(fpPeek,0)+' экспериментов. Лечится либо фиксированным горизонтом, либо последовательными методами с поправленными границами.')+'</div>';
    if(traj)r+='<svg class="chart" viewBox="0 0 320 120">'+svgLine(traj,320,120,'var(--a)',{y0:0,y1:1,hline:alpha,fx:function(x){return 'день '+x;},fy:function(y){return 'p='+fmtNum(y);}})+'</svg><div class="small faint">Траектория p-value одного случайного теста по дням; пунктир — порог α. Оно гуляет, иногда ныряет под порог и выныривает обратно.</div>';
    if(firstDayHits.length){var cnt={};firstDayHits.forEach(function(d2){cnt[d2]=(cnt[d2]||0)+1;});var pts=[];for(var d3=1;d3<=days;d3++)pts.push([d3,(cnt[d3]||0)/sims*100]);r+='<svg class="chart" viewBox="0 0 320 100">'+svgLine(pts,320,100,'var(--b)',{y0:0,fx:function(x){return 'день '+x;},fy:function(y){return fmtNum(y)+'%';}})+'</svg><div class="small faint">В какой день подглядывающий впервые видел «значимость» (% симуляций). Ранние дни особенно коварны: выборка мала, шум велик.</div>';}
    document.getElementById('pk-res').innerHTML=r;}

function labCuped(box){var st=S.get('labcuped',{rho:0.6,n:120000,days:14});

function vacancyCard(){var V=D.VACANCY;if(!V)return '';var cur=vacCurrentGrade();var idx=V.grades.indexOf(cur);var next=V.grades[Math.min(idx+1,V.grades.length-1)];var r=vacReadiness(next);
  return '<button class="rowbtn" data-go="vacancy"><span class="ic">🎯</span><span class="tt"><b>Целевая вакансия: '+esc(V.title)+'</b><span>Грейды, скиллы и где они в курсе · сейчас '+esc(cur.name)+(next!==cur?' → '+esc(next.name)+' '+Math.round(r*100)+'%':'')+'</span></span><span class="st">'+esc(cur.short)+'</span></button>';}

/* ================= АУДИТ ОТЧЁТА ================= */
var VERDICT_LABELS=(META.verdicts)||{invalid:'Результат читать нельзя: дефект валидности',ship:'Раскатить (с holdout)',kill:'Закрыть идею',iterate:'Доработать и перезапустить',undecided:'Тест не ответил: недолёт по мощности'};
function auditBest(id){return ((S.get('audit',{}))[id]||{}).best||0;}
function auditView(){var list=D.AUDITS||[];var done=list.filter(function(a){return auditBest(a.id)>=1;}).length;
  var h=topbar()+'<div class="card">'+backBtn()+'<h2 style="margin:10px 0 4px">🔍 Аудит отчётов</h2><div class="small muted">Отчёты команд с намеренными дефектами — и без них. Задача: пометить блоки с дефектом до того, как поверить эффекту, и вынести решение. Зачёт — все дефекты найдены, ложных пометок нет, решение верное. Пройдено: <b>'+done+'/'+list.length+'</b></div></div>';
  D.LEVELS.forEach(function(L){var ls=list.filter(function(a){return a.level===L.id;});if(!ls.length)return;h+='<div class="grp">'+lvTag(L.id)+' '+esc(L.rank)+'</div>';
    ls.forEach(function(a){var b=auditBest(a.id);h+='<button class="rowbtn'+(b>=1?' done':'')+'" data-audit="'+a.id+'"><span class="ic">'+(b>=1?'✅':'📋')+'</span><span class="tt"><b>'+esc(a.title)+'</b><span>'+esc(a.intro.slice(0,90))+'…</span></span><span class="st">'+(b?Math.round(b*100)+'%':'')+'</span></button>';});});
  $app.innerHTML=h;bindTop();bindBack('home');each($app.querySelectorAll('[data-audit]'),function(b){b.onclick=function(){AUD=null;go('auditcase',b.getAttribute('data-audit'));};});}
var AUD=null,AUD_FRESH=false;
function auditCaseView(id){var a=null;(D.AUDITS||[]).forEach(function(x){if(x.id===id)a=x;});if(!a)return go('audit');
  if(!AUD||AUD.id!==id){var rq=resumeGet('audit',id);if(rq&&rq.state&&rq.state.ph>0&&!AUD_FRESH){askResume(rq,function(){AUD=rq.state;AUD.t0=Date.now();auditCaseView(id);},function(){resumeClear('audit',id);AUD_FRESH=true;auditCaseView(id);});return;}AUD_FRESH=false;AUD={id:id,ph:0,flags:{},verdict:null,t0:Date.now()};}
  var PH=['Отчёт','Дефекты','Решение','Разбор'];
  var h=topbar()+'<div class="playtop"><button class="x" id="quit">←</button><div style="flex:1"><b>🔍 '+esc(a.title)+'</b><div class="small muted">Аудит отчёта · '+lvTag(a.level)+'</div></div></div><div class="tabs">'+PH.map(function(n,i){return '<span class="pill'+(i===AUD.ph?' b':(i<AUD.ph?' ok':''))+'">'+n+'</span>';}).join('')+'</div>';
  if(AUD.ph===0){h+='<div class="card note small">'+esc(a.intro)+'</div>';a.blocks.forEach(function(bl){h+='<div class="card tight"><div class="small" style="font-weight:700;color:var(--a)">'+esc(bl.h)+'</div><div style="margin-top:4px;font-size:calc(14.5px * var(--fs,1));line-height:1.5">'+linkTerms(esc(bl.t))+'</div></div>';});h+='<button class="btn wide" id="nx" style="margin:10px 0">Прочитал — к дефектам</button>';}
  else if(AUD.ph===1){h+='<div class="card"><div class="mech">Где дефект?</div><div class="stem">Отметь блоки, в которых есть дефект валидности или решения. Если дефектов нет — не отмечай ничего.</div><div class="hint">Чистые отчёты тоже бывают: аудитор ищет не проблемы, а правду.</div><div id="fl"></div><button class="btn wide" id="nx" style="margin-top:12px">К решению</button></div>';}
  else if(AUD.ph===2){h+='<div class="card"><div class="mech">Решение</div><div class="stem">Что делать с этим тестом?</div><div id="vd"></div><button class="btn wide" id="nx" style="margin-top:12px" disabled>Проверить</button></div>';}
  else{var r=auditScore(a);var es=S.get('audit',{});var cur=es[id]||{best:0,n:0};cur.best=Math.max(cur.best,r.score);cur.n++;resumeClear('audit',id);es[id]=cur;S.set('audit',es);dayLog('a');dayPush('audits',id);touchStreak();addXp(Math.round(r.score*30));
    h+='<div class="card"><div class="fbk '+(r.score>=1?'ok':(r.score>=0.5?'mid':'bad'))+'"><b>'+(r.score>=1?'Аудит безупречен':'Аудит: '+Math.round(r.score*100)+'%')+'</b>Найдено дефектов '+r.hit+' из '+a.defects.length+(r.fp?', ложных пометок '+r.fp:'')+' · решение '+(r.vOk?'верное':'неверное')+'.</div>'+'<div class="small faint tline">⏱ попытка '+fmtDur(Date.now()-(AUD.t0||Date.now()))+' · всего на это '+fmtDur(timeOf('audit',id)*1000)+'</div>';
    h+='<div class="mech" style="margin-top:12px">Дефекты</div>';if(!a.defects.length)h+='<div class="small">Дефектов нет — это чистый отчёт.</div>';a.defects.forEach(function(d){var fl=null;a.flags.forEach(function(f){if(f.id===d.id)fl=f;});h+='<div class="opt '+(AUD.flags[d.id]?'ok':'miss')+'" style="cursor:default"><span><b>'+esc(fl?fl.t:d.id)+'</b><div class="why">'+(AUD.flags[d.id]?'':'<b class="gold-c">Пропущено.</b> ')+esc(d.why)+'</div></span></div>';});
    var fps=a.decoys.filter(function(d){return AUD.flags[d.id];});if(fps.length){h+='<div class="mech" style="margin-top:10px">Ложные пометки</div>';fps.forEach(function(d){var fl=null;a.flags.forEach(function(f){if(f.id===d.id)fl=f;});h+='<div class="opt bad" style="cursor:default"><span><b>'+esc(fl?fl.t:d.id)+'</b><div class="why">'+esc(d.why)+'</div></span></div>';});}
    h+='<div class="mech" style="margin-top:10px">Решение</div><div class="opt '+(r.vOk?'ok':'bad')+'" style="cursor:default"><span><b>'+esc(VERDICT_LABELS[a.verdict])+'</b><div class="why">'+esc(a.verdictWhy)+'</div></span></div>';
    h+='<div class="sol" style="border-color:var(--b)"><b>Урок.</b> '+esc(a.lesson)+'</div><button class="btn wide" id="done" style="margin-top:12px">Готово</button></div>';}
  $app.innerHTML=h;bindTop();document.getElementById('quit').onclick=function(){if(AUD.ph>0&&AUD.ph<3)resumeSave('audit',id,a.title,AUD,'этап '+(AUD.ph+1));AUD=null;go('audit');};
  if(AUD.ph===0){document.getElementById('nx').onclick=function(){AUD.ph=1;auditCaseView(id);window.scrollTo(0,0);};}
  else if(AUD.ph===1){var fl=document.getElementById('fl');a.flags.forEach(function(f,i){var b=el('<button class="opt'+(AUD.flags[f.id]?' sel':'')+'"><span class="key">'+String.fromCharCode(65+i)+'</span><span>'+esc(f.t)+'</span></button>');b.onclick=function(){AUD.flags[f.id]=!AUD.flags[f.id];b.classList.toggle('sel',!!AUD.flags[f.id]);};fl.appendChild(b);});
    document.getElementById('nx').onclick=function(){AUD.ph=2;auditCaseView(id);window.scrollTo(0,0);};}
  else if(AUD.ph===2){var vd=document.getElementById('vd');var ok=document.getElementById('nx');var keys=['invalid','ship','kill','iterate','undecided'];
    keys.forEach(function(k,i){var b=el('<button class="opt'+(AUD.verdict===k?' sel':'')+'"><span class="key">'+String.fromCharCode(65+i)+'</span><span>'+esc(VERDICT_LABELS[k])+'</span></button>');b.onclick=function(){AUD.verdict=k;each(vd.children,function(x){x.classList.remove('sel');});b.classList.add('sel');ok.disabled=false;};vd.appendChild(b);});
    ok.onclick=function(){AUD.ph=3;auditCaseView(id);window.scrollTo(0,0);};}
  else{document.getElementById('done').onclick=function(){AUD=null;go('audit');};if(auditScore(a).score>=1)SFX.fanfare();}}
function auditScore(a){var hit=0,fp=0;a.defects.forEach(function(d){if(AUD.flags[d.id])hit++;});a.decoys.forEach(function(d){if(AUD.flags[d.id])fp++;});var vOk=AUD.verdict===a.verdict;
  var nd=a.defects.length;var fpart=nd?Math.max(0,(hit-fp*0.5)/nd):(fp?0:1);var score=0.7*fpart+0.3*(vOk?1:0);if(hit===nd&&!fp&&vOk)score=1;return {hit:hit,fp:fp,vOk:vOk,score:score};}

/* ================= СТАРТ ================= */
applyTheme();
applyFont();
if(!S.get('epoch'))S.set('epoch',1);
render();
window.__ABF={SES_UNIT_ID:function(){return SES&&SES.unit&&SES.unit.id;},glyphHtml:glyphHtml,visualOptHtml:visualOptHtml,G:G,V:V,xfDump:xfDump,xfLoad:xfLoad,xfFrames:xfFrames,xfAssemble:xfAssemble,qrEncode:qrEncode,go:go,S:S,D:D,ALL_ITEMS:ALL_ITEMS,nProp:nProp,zProp:zProp,srmTest:srmTest,qnorm:qnorm,levelProgress:levelProgress,overall:overall,startUnit:startUnit,unitSteps:unitSteps,UNIT_BY_ID:UNIT_BY_ID,calcEval:calcEval};
})();


</script>
