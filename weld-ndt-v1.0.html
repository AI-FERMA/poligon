<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Сварщик-контролёр · от ученика до главного сварщика (v1.0)</title>
<style>
:root{
  --paper:#f3f5f0; --paper2:#eaede6; --card:#ffffff; --card2:#f7f8f4;
  --line:#d8ddd3; --line2:#bfc6ba;
  --ink:#141c26; --muted:#5b6774; --faint:#8a95a1;
  --a:#2a5bd7; --a-soft:rgba(42,91,215,.10); --a-line:rgba(42,91,215,.35);
  --b:#e8782a; --b-hot:#f59a4f; --b-deep:#c45f17; --b-soft:rgba(232,120,42,.12); --b-line:rgba(232,120,42,.4);
  --ok:#1b8f5c; --ok-soft:rgba(27,143,92,.12); --err:#c93b3b; --err-soft:rgba(201,59,59,.10);
  --gold:#b58a10; --gold-soft:rgba(181,138,16,.14);
  --grid:rgba(42,91,215,.07);
  --r:14px; --r-sm:10px; --shadow:0 2px 10px rgba(20,28,38,.06);
  --maxw:680px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --disp:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
html[data-theme="dark"]{
  --paper:#0f1620; --paper2:#141d29; --card:#182230; --card2:#1d2837;
  --line:#2a3647; --line2:#3b495c;
  --ink:#e8edf3; --muted:#9aa7b6; --faint:#6b7786;
  --a:#7ea3ff; --a-soft:rgba(126,163,255,.14); --a-line:rgba(126,163,255,.4);
  --b:#ff9a4d; --b-hot:#ffb36f; --b-deep:#d9701f; --b-soft:rgba(255,154,77,.14); --b-line:rgba(255,154,77,.45);
  --ok:#4fd48f; --ok-soft:rgba(79,212,143,.14); --err:#ff7676; --err-soft:rgba(255,118,118,.12);
  --gold:#f0c24a; --gold-soft:rgba(240,194,74,.14);
  --grid:rgba(126,163,255,.06);
  --shadow:0 4px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto} *{animation:none!important;transition:none!important}}
html{font-size:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.55 var(--font);min-height:100vh;min-height:100dvh;overflow-x:hidden}
html.has-sheet,html.has-sheet body{overflow:hidden}
body::before{content:"";position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;-webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.9),rgba(0,0,0,.35) 60%,transparent);mask-image:linear-gradient(180deg,rgba(0,0,0,.9),rgba(0,0,0,.35) 60%,transparent)}
#app{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto;padding:12px 16px calc(44px + env(safe-area-inset-bottom))}
#app,.sheet{transition:max-width .18s ease}
h1,h2,h3{line-height:1.22;margin:0;font-family:var(--disp);font-weight:600;letter-spacing:-.005em}
h2{font-size:calc(23px * var(--fs,1))} h3{font-size:calc(19px * var(--fs,1))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:.93em}
:focus-visible{outline:2px solid var(--a);outline-offset:2px;border-radius:6px}
a{color:var(--a)}
.small{font-size:calc(13.5px * var(--fs,1))} .muted{color:var(--muted)} .faint{color:var(--faint)}
.ok-c{color:var(--ok)} .err-c{color:var(--err)} .gold-c{color:var(--gold)} .a-c{color:var(--a)} .b-c{color:var(--b)}
.top{display:flex;align-items:center;gap:8px;padding:2px 0 10px}
.brand{font-family:var(--disp);font-size:calc(17px * var(--fs,1));letter-spacing:.01em;white-space:nowrap}
.brand i{font-style:normal;display:inline-block;padding:0 5px;border-radius:6px;margin-right:3px;font-family:var(--mono);font-size:calc(13px * var(--fs,1));font-weight:700}
.brand .ia{background:var(--a);color:#fff} .brand .ib{background:var(--b);color:#fff}
.top .sp{margin-left:auto;display:flex;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:calc(13px * var(--fs,1));font-weight:650;white-space:nowrap}
.chip.hot{color:var(--b-deep)} .chip.xp{color:var(--a)}
.ico{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);font-size:calc(16px * var(--fs,1));position:relative}
.ico.fs{font-size:calc(12px * var(--fs,1));font-weight:800;font-family:var(--mono)}
.ico .bdg{position:absolute;top:-6px;right:-6px;min-width:16px;height:16px;border-radius:8px;background:var(--b);color:#fff;font-size:calc(10px * var(--fs,1));font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:12px 0;box-shadow:var(--shadow)}
.card.tight{padding:12px 14px}
.card.note{background:var(--card2)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:calc(12px * var(--fs,1));font-weight:650;padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.pill.a{background:var(--a-soft);color:var(--a);border-color:var(--a-line)}
.pill.b{background:var(--b-soft);color:var(--b-deep);border-color:var(--b-line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.gold{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.pill.err{background:var(--err-soft);color:var(--err);border-color:transparent}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--b);color:#fff;font-weight:700;font-size:calc(14px * var(--fs,1));border-radius:10px;padding:9px 18px;box-shadow:0 2px 0 var(--b-deep);transition:transform .08s,box-shadow .08s;user-select:none;margin-left:auto;margin-right:auto}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--b-deep)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 2px 0 var(--line2);border:1px solid var(--line)}
.btn.blue{background:var(--a);box-shadow:0 3px 0 #1d3f99}
.btn.wide{width:auto;min-width:150px;max-width:240px;padding:9px 22px;background:rgba(255,255,255,0);color:var(--b);border:1.5px solid var(--b);box-shadow:none;opacity:.75;font-size:calc(14px * var(--fs,1));margin-left:auto;margin-right:auto;display:flex}
.btn.ghost.wide{color:var(--ink);border-color:var(--line2)}
.btn:disabled{opacity:.45;pointer-events:none}
.row .btn.wide{flex:0 1 auto;min-width:150px;max-width:220px}
.btn.next-btn,.btn.wide.next-btn{width:auto;min-width:150px;max-width:200px;padding:9px 22px;background:rgba(255,255,255,0);color:var(--b);border:1.5px solid var(--b);box-shadow:none;opacity:.75;font-size:calc(14px * var(--fs,1));margin-left:auto;margin-right:auto;display:flex}
.btn.next-btn:active{transform:translateY(1px);opacity:.6}
.btn.sm{padding:8px 14px;font-size:calc(14px * var(--fs,1));border-radius:10px}
.btn.xs{padding:5px 10px;font-size:calc(12.5px * var(--fs,1));border-radius:8px;box-shadow:none}
.ladder{position:relative;border:1px solid var(--line);background:linear-gradient(180deg,var(--card) 0%,var(--card2) 100%);border-radius:var(--r);padding:16px 16px 10px;margin:12px 0;box-shadow:var(--shadow);overflow:hidden}
.ladder h2{font-size:calc(21px * var(--fs,1));margin-bottom:2px}
.ladder .sub{color:var(--muted);font-size:calc(14px * var(--fs,1));margin-bottom:12px}
.rung{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px dashed var(--line);text-align:left;width:100%}
.rung:last-child{border-bottom:1px dashed var(--line)}
.rung .n{width:34px;height:34px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:calc(12px * var(--fs,1));font-weight:800;border:2px solid var(--line2);color:var(--muted);background:var(--card)}
.rung.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.rung.cur .n{background:var(--b);border-color:var(--b);color:#fff;box-shadow:0 0 0 4px var(--b-soft)}
.rung.lock{opacity:.5}
.rung .t{flex:1;min-width:0}
.rung .t b{display:block;font-size:calc(15px * var(--fs,1))}
.rung .t span{font-size:calc(12.5px * var(--fs,1));color:var(--muted)}
.rung .pc{font-family:var(--mono);font-size:calc(12.5px * var(--fs,1));color:var(--faint);min-width:44px;text-align:right}
.bar{height:7px;border-radius:99px;background:var(--paper2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));border-radius:99px}
.rowbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 13px;margin:8px 0;box-shadow:var(--shadow)}
.rowbtn:active{background:var(--card2)}
.rowbtn .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:calc(18px * var(--fs,1));background:var(--card2);border:1px solid var(--line);flex:0 0 auto}
.rowbtn .tt{flex:1;min-width:0}
.rowbtn .tt b{display:block;font-size:calc(15px * var(--fs,1))}
.rowbtn .tt span{font-size:calc(12.5px * var(--fs,1));color:var(--muted);display:block}
.rowbtn .tt b .sym{display:inline-block;width:auto;font-size:calc(11px * var(--fs,1));color:var(--a);margin-left:6px}
.rowbtn .st{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:calc(12px * var(--fs,1));color:var(--faint);font-family:var(--mono);white-space:nowrap}
.rowbtn.done{border-color:rgba(27,143,92,.35)}
.rowbtn.lock{opacity:.55}
.grp{margin:14px 0 4px;font-family:var(--disp);font-size:calc(17px * var(--fs,1));display:flex;align-items:baseline;gap:8px}
.grp .cnt{font-family:var(--mono);font-size:calc(12px * var(--fs,1));color:var(--faint)}
.playtop{display:flex;align-items:center;gap:10px;padding:8px 0 10px;position:sticky;top:0;z-index:20;background:var(--paper);margin:0 -2px;padding-left:2px;padding-right:2px}
.playtop .tools{display:flex;gap:6px;flex:0 0 auto;position:relative}
.playtop .x .bdg{position:absolute;top:-4px;right:-4px;background:var(--b);color:#fff;font-size:calc(10px * var(--fs,1));line-height:1;padding:2px 5px;border-radius:99px;font-weight:700}
.playtop .x{position:relative;cursor:pointer;width:36px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:calc(16px * var(--fs,1));flex:0 0 auto}
.segs{flex:1;display:flex;gap:4px}
.segs i{flex:1;height:6px;border-radius:99px;background:var(--paper2);border:1px solid var(--line)}
.segs i.on{background:var(--b);border-color:transparent}
.segs i.ok{background:var(--ok);border-color:transparent}
.segs i.bad{background:var(--err);border-color:transparent;opacity:.7}
.combo{font-family:var(--mono);font-size:calc(13px * var(--fs,1));font-weight:700;color:var(--b-deep);min-width:40px;text-align:right}
.theory h3{margin-bottom:8px}
.theory p{margin:0;white-space:pre-wrap;font-size:calc(16px * var(--fs,1));line-height:1.6}
.theory .fr{font-size:calc(12.5px * var(--fs,1));color:var(--a);font-weight:700;margin-bottom:6px}
.stem{font-size:calc(17px * var(--fs,1));font-weight:600;margin:0 0 8px;white-space:pre-wrap;line-height:1.5}
.mech{font-size:calc(12px * var(--fs,1));font-weight:700;color:var(--a);margin-bottom:8px}
.hint{font-size:calc(13px * var(--fs,1));color:var(--faint);margin:-2px 0 8px}
.opt{display:flex;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:12px 13px;margin:8px 0;font-size:calc(15px * var(--fs,1));line-height:1.45;transition:border-color .12s,background .12s;flex-wrap:wrap}
.opt:not(:disabled):hover{border-color:var(--line2)}
.opt .key{width:22px;height:22px;flex:0 0 auto;border-radius:7px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:calc(12px * var(--fs,1));font-weight:750;color:var(--muted);margin-top:1px;font-family:var(--mono)}
.opt>span:not(.key):not(.ord){flex:1;min-width:0}
.opt.sel{border-color:var(--a);background:var(--a-soft)}
.opt.sel .key{border-color:var(--a);color:var(--a)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .key{border-color:var(--ok);color:var(--ok)}
.opt.bad{border-color:var(--err);background:var(--err-soft)}
.opt.bad .key{border-color:var(--err);color:var(--err)}
.opt.miss{border-color:var(--gold);background:var(--gold-soft)}
.opt.dim{opacity:.6}
.opt .ord{margin-left:auto;font-weight:800;color:var(--b-deep);font-family:var(--mono);min-width:28px;text-align:right}
.why{font-size:calc(14px * var(--fs,1));line-height:1.5;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);display:block;width:100%;flex-basis:100%}
.fbk{border-radius:12px;padding:12px 14px;margin-top:12px;font-size:calc(15px * var(--fs,1))}
.fbk b{display:block;margin-bottom:2px}
.fbk.ok{background:var(--ok-soft);border:1px solid rgba(27,143,92,.35)}
.fbk.mid{background:var(--gold-soft);border:1px solid rgba(181,138,16,.35)}
.fbk.bad{background:var(--err-soft);border:1px solid rgba(201,59,59,.35)}
.sol{margin-top:10px;padding:10px 12px;border-left:3px solid var(--a);background:var(--card2);border-radius:8px;font-size:calc(14.5px * var(--fs,1));line-height:1.55;white-space:pre-wrap}
.numin{width:100%;border:1px solid var(--line2);background:var(--card2);border-radius:12px;padding:12px 14px;font-size:calc(20px * var(--fs,1));font-family:var(--mono)}
.pretag{display:inline-block;font-size:calc(12.5px * var(--fs,1));color:var(--b-deep);background:var(--b-soft);border-radius:8px;padding:4px 10px;margin-bottom:10px;font-weight:650}
.pretag.redo{color:var(--a);background:var(--a-soft)}
.tl{border-bottom:1px dotted var(--a);color:inherit;cursor:pointer}
.tl:hover{color:var(--a)}
.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.reveal{animation:rv .25s ease-out}
@keyframes rv{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.elab{margin-top:12px;padding:12px;border-radius:12px;background:var(--card2);border:1px dashed var(--line2)}
.elab b{display:block;margin-bottom:6px}
.conf{display:flex;gap:6px;align-items:center;margin:0 0 10px;font-size:calc(13px * var(--fs,1));flex-wrap:wrap}
.meters{display:flex;gap:8px;margin:8px 0 12px}
.meter{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.meter .l{font-size:calc(11.5px * var(--fs,1));color:var(--muted);display:flex;justify-content:space-between;gap:4px}
.meter .l span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter .bar{margin-top:5px}
.meter .bar i{background:var(--a)} .meter.m2 .bar i{background:var(--ok)} .meter.m3 .bar i{background:var(--b)}
.rank{font-family:var(--disp);font-size:calc(56px * var(--fs,1));line-height:1;color:var(--b);text-align:center;margin:8px 0}
.lab{border:1px solid var(--a-line);background:linear-gradient(180deg,var(--card),var(--card2));border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.lab h3{margin-bottom:4px}
.fld{margin:10px 0}
.fld label{display:block;font-size:calc(12.5px * var(--fs,1));color:var(--muted);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:10px 12px;font-size:calc(16px * var(--fs,1))}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.res{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
.res .big{font-family:var(--mono);font-size:calc(26px * var(--fs,1));font-weight:700;line-height:1.2;word-break:break-word}
.res .k{font-size:calc(12.5px * var(--fs,1));color:var(--muted)}
.ab2{display:flex;gap:10px;margin-top:8px}
.ab2>div{flex:1;border-radius:10px;padding:10px;border:1px solid var(--line);min-width:0}
.ab2 .va{border-color:var(--a-line);background:var(--a-soft)} .ab2 .vb{border-color:var(--b-line);background:var(--b-soft)}
.ab2 b{font-family:var(--mono);font-size:calc(20px * var(--fs,1));display:block}
.ab2 .k{font-size:calc(12px * var(--fs,1));color:var(--muted);display:block}
svg.chart{width:100%;height:auto;display:block;margin-top:8px}
.kbd{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kbd button{height:44px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:calc(18px * var(--fs,1));font-family:var(--mono)}
.kbd button.op{background:var(--a-soft);color:var(--a)}
.kbd button.eq{background:var(--b);color:#fff;grid-column:span 2;font-weight:700}
.kbd button.fn{background:var(--gold-soft);color:var(--gold)}
.ovl{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(14,22,32,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fd .18s ease-out;-webkit-tap-highlight-color:transparent}
@keyframes fd{from{opacity:0}to{opacity:1}}
.sheet{position:relative;display:flex;flex-direction:column;background:var(--card);color:var(--ink);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;width:100%;max-width:var(--maxw);max-height:88vh;max-height:88dvh;overflow:hidden;box-shadow:0 -8px 30px rgba(20,28,38,.18);-webkit-transform:translateZ(0);transform:translateZ(0)}
.sheet-h{display:flex;align-items:center;gap:10px;padding:12px 14px 10px 18px;border-bottom:1px solid var(--line);background:var(--card);flex:0 0 auto}
.sheet-h::before{content:"";position:absolute;top:6px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:99px;background:var(--line2)}
.sheet-tt{flex:1;min-width:0;padding-top:6px}
.sheet-t{font-family:var(--disp);font-size:calc(19px * var(--fs,1));font-weight:600;line-height:1.25}
.sheet-x{flex:0 0 auto;width:36px;height:36px;border-radius:12px;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:calc(16px * var(--fs,1));margin-top:4px}
.sheet-b{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 18px 16px;background:var(--card);overscroll-behavior:contain}
.sheet-f{flex:0 0 auto;padding:10px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
.sheet.confirm{border-radius:20px;border-bottom:1px solid var(--line);margin:0 12px calc(12px + env(safe-area-inset-bottom));max-width:480px}
.sheet.confirm .sheet-b{padding:18px}
@media (min-width:700px){.ovl{align-items:center;padding:24px}.sheet{border-radius:20px;border-bottom:1px solid var(--line);max-height:80vh;max-height:80dvh;box-shadow:var(--shadow)}.sheet-h::before{display:none}.sheet-tt{padding-top:0}.sheet-x{margin-top:0}}
.sheet h3{margin-bottom:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:60;background:var(--card);border:1px solid var(--gold);border-radius:14px;padding:11px 16px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;max-width:92vw}
.xpf{position:fixed;z-index:70;font-family:var(--mono);font-weight:800;color:var(--b-deep);pointer-events:none;animation:xf .9s ease-out forwards}

.nb-in{width:100%;border:1px solid var(--line2);background:var(--card2);border-radius:10px;padding:10px 12px;font-size:calc(15px * var(--fs,1))}
.cheat p{margin:4px 0;font-size:calc(14.5px * var(--fs,1))}
.tabs{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}

.spark{display:flex;gap:3px;align-items:flex-end;height:46px}

/* ---- визуальные якоря и графические задачи ---- */

.vwhy-row.ok{background:var(--ok-soft);color:var(--ink)} .vwhy-row.ok .key{border-color:var(--ok);color:var(--ok)}

@media (max-width:360px){.vgrid{grid-template-columns:1fr}}

.nb-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:calc(14px * var(--fs,1))}

.tt .sym,.rowbtn .sym{display:inline-block;width:auto;margin:0 0 0 6px}

/* слои «Сути» */
.ltabs{display:flex;gap:6px;margin:10px 0 12px;flex-wrap:wrap}
.ltab{display:inline-flex;align-items:center;gap:4px;font-size:calc(12.5px * var(--fs,1));font-weight:650;padding:6px 10px;border-radius:999px;background:var(--card2);color:var(--muted);border:1px solid var(--line)}

.ltab.done{color:var(--ok)} .ltab.done.on{background:var(--ok-soft);border-color:transparent}
.ltab.lkd{opacity:.55} .ltab.optl span::after{content:" · по желанию";font-weight:500;font-size:calc(11px * var(--fs,1))}
.lbody p{margin:0 0 10px;white-space:normal;font-size:calc(16px * var(--fs,1));line-height:1.6} .lbody p:last-child{margin-bottom:0}

.theory p{white-space:normal;margin:0 0 10px} .theory p:last-of-type{margin-bottom:0}
ol.steps{margin:0 0 10px;padding-left:22px;font-size:calc(16px * var(--fs,1));line-height:1.6} ol.steps li{margin:4px 0}
.formula{font-family:var(--mono);font-size:calc(15.5px * var(--fs,1));font-weight:700;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px;text-align:left;white-space:pre;overflow-x:auto;-webkit-overflow-scrolling:touch;line-height:1.7}
.legend{width:100%;border-collapse:collapse;font-size:calc(14px * var(--fs,1))} .legend th{text-align:left;font-size:calc(11.5px * var(--fs,1));color:var(--muted);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--line)} .legend td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top} .legend tr:last-child td{border-bottom:0} .legend td:first-child{white-space:nowrap} .legend td:last-child{min-width:90px}
.lcheck{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line2)}
.lcheck .stem{font-size:calc(15.5px * var(--fs,1));margin:4px 0 8px}
.rule{margin:10px 0 0;padding:10px 12px;border-left:3px solid var(--b);background:var(--b-soft);border-radius:0 10px 10px 0;font-size:calc(15px * var(--fs,1))}
.plain{font-size:calc(15.5px * var(--fs,1));line-height:1.55;padding:10px 12px;background:var(--ok-soft);border-left:3px solid var(--ok);border-radius:0 10px 10px 0;margin:8px 0}
.remember{font-family:var(--disp);font-style:italic;font-size:calc(15px * var(--fs,1));color:var(--ink);padding:8px 12px;margin:8px 0 0;border-top:1px dashed var(--line2)}
.remember::before{content:'Запомни: ';font-style:normal;font-weight:700;color:var(--b-deep);font-family:var(--font);font-size:calc(12.5px * var(--fs,1))}
/* дневник по дням */
.todaycard{width:100%;text-align:left;display:block;cursor:pointer}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.tile{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}

.tile span{display:block;font-size:calc(11px * var(--fs,1));color:var(--muted);margin-top:3px;line-height:1.2}

@media (max-width:420px){.tiles{grid-template-columns:repeat(2,1fr)}}
.cal{margin-top:14px}
.cal-wd{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.cal-wd span{font-size:calc(11px * var(--fs,1));color:var(--faint);text-align:center;font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-d.l1{background:var(--a-soft);color:var(--a)} .cal-d.l2{background:rgba(42,91,215,.28);color:var(--ink);border-color:transparent}
.cal-d.l3{background:rgba(42,91,215,.55);color:#fff;border-color:transparent} .cal-d.l4{background:var(--a);color:#fff;border-color:transparent;font-weight:700}
html[data-theme="dark"] .cal-d.l2{background:rgba(126,163,255,.3)} html[data-theme="dark"] .cal-d.l3{background:rgba(126,163,255,.6);color:#0f1620}
.cal-leg{display:flex;align-items:center;gap:4px;margin-top:8px;font-size:calc(11px * var(--fs,1));color:var(--faint);justify-content:flex-end}
.cal-leg i{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid var(--line);background:var(--card2)}
.cal-leg i.l1{background:var(--a-soft)} .cal-leg i.l2{background:rgba(42,91,215,.28)} .cal-leg i.l3{background:rgba(42,91,215,.55)} .cal-leg i.l4{background:var(--a)}
.dayhead{display:flex;align-items:center;gap:12px}
.dayhead h3{margin:0;font-size:calc(20px * var(--fs,1))}
.daymood{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:calc(26px * var(--fs,1));background:var(--card2);border:1px solid var(--line);flex:0 0 auto}
.daymood.gold{background:var(--gold-soft);border-color:var(--gold)} .daymood.b{background:var(--b-soft);border-color:var(--b-line)} .daymood.a{background:var(--a-soft);border-color:var(--a-line)} .daymood.ok{background:var(--ok-soft);border-color:transparent}
.achs{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.ach{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--card2);border:1px solid var(--line);border-radius:12px}
.ach .ic{font-size:calc(20px * var(--fs,1));flex:0 0 auto;line-height:1.2}
.ach b{font-size:calc(14.5px * var(--fs,1))}
.mlegend{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line2);display:flex;flex-direction:column;gap:4px;font-size:calc(12.5px * var(--fs,1))}
.mlegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.mlegend i.m1{background:var(--a)} .mlegend i.m2{background:var(--ok)} .mlegend i.m3{background:var(--b)}
.mlegend .faint{margin-top:4px}
.tline{margin-top:8px;font-variant-numeric:tabular-nums}
.tbars{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.tbar{display:grid;grid-template-columns:90px 1fr 44px;align-items:center;gap:6px;font-size:calc(12px * var(--fs,1));color:var(--muted)}
.tbar i{display:block;height:8px;border-radius:4px;background:var(--a);min-width:3px}
.tbar em{font-style:normal;font-family:var(--mono);text-align:right;color:var(--ink)}
.ach > div{flex:1;min-width:0}
.resume{border-color:var(--b-line);background:var(--b-soft)}
.resume .ell{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* дневник и лестницы */
.journal{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-top:10px}
.journal textarea{margin-top:8px;resize:vertical;min-height:64px;font-size:calc(15px * var(--fs,1));line-height:1.45;background:var(--card)}
.stairs{margin:8px 0 12px;padding:12px;border:1px solid var(--b-line);border-radius:12px;background:var(--b-soft)}
.st-steps{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:8px}
.st-steps .st{height:34px;border-radius:7px;border:1px solid var(--b-line);background:var(--card);font-family:var(--mono);font-size:calc(11px * var(--fs,1));color:var(--muted);transition:transform .08s}
.st-steps .st.on{background:var(--b);color:#fff;border-color:transparent;font-weight:700}
.st-steps .st:active{transform:scale(.92)}
.tiles .tile.st b{color:var(--b-deep)}
.stchart .stbars{display:flex;gap:4px;align-items:flex-end;height:74px;margin-top:8px}
.stchart .stb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.stchart .stb i{display:block;width:100%;max-width:26px;background:var(--b);border-radius:4px 4px 0 0;opacity:.85}
.stchart .stb i.none{background:var(--line2)} .stchart .stb i.max{background:var(--gold)}
.stchart .stb.t i{opacity:1;box-shadow:0 0 0 2px var(--b-soft)}
.stchart .stb span{font-size:calc(9px * var(--fs,1));color:var(--faint);margin-top:3px;line-height:1}
@media (min-width:700px){.tiles{grid-template-columns:repeat(5,1fr)}}

/* фото дня */
.photo{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.ph-view{display:flex;gap:12px;align-items:center;margin-top:8px;flex-wrap:wrap}
.ph-view img{width:120px;height:120px;border-radius:12px;object-fit:cover;box-shadow:0 2px 8px rgba(20,28,38,.15)}
.ph-acts{display:flex;flex-direction:column;gap:6px}

/* момент дня: фото + голос + слова */
.moment{margin:12px 0 10px;padding:12px;border-radius:16px;background:linear-gradient(135deg,var(--a-soft),var(--b-soft));border:1px solid var(--line)}
.moment-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 10px}

.moment-g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.moment-g{grid-template-columns:1fr}}
.voice{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.vplayer{display:flex;align-items:center;gap:10px;margin-top:10px}
.vplay,.vstop{width:42px;height:42px;border-radius:50%;border:none;background:var(--a);color:#fff;font-size:calc(15px * var(--fs,1));flex:0 0 auto;box-shadow:0 2px 8px rgba(42,91,215,.3);transition:transform .1s}
.vplay:active,.vstop:active{transform:scale(.92)}
.vstop{background:var(--err);box-shadow:0 2px 8px rgba(201,59,59,.3)}
.vtrack{position:relative;flex:1;height:32px;display:flex;align-items:center;overflow:hidden;border-radius:8px}
.vbars{display:flex;align-items:center;gap:3px;width:100%;height:100%}
.vbars i{flex:1;background:var(--line2);border-radius:2px;display:block}
.vplayer.on .vbars i{background:var(--a-line)}
.vprog{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--a-soft);border-right:2px solid var(--a);transition:width .2s linear;pointer-events:none}
.vtime{font-size:calc(12px * var(--fs,1));color:var(--muted);min-width:34px;text-align:right}
.vrec{display:flex;align-items:center;gap:10px;margin-top:10px;padding:8px 10px;border-radius:12px;background:var(--err-soft);border:1px solid rgba(201,59,59,.25)}
.vdot{width:10px;height:10px;border-radius:50%;background:var(--err);flex:0 0 auto;animation:vpulse 1s ease-in-out infinite}
@keyframes vpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
.vlevel{flex:1;display:flex;align-items:center;gap:3px;height:32px}

/* график: лестницы + минуты */
.ch-row{position:relative;margin-top:12px}
.ch-lab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.ch-t{font-weight:700;font-size:calc(13px * var(--fs,1))}
.stchart .stbars{height:62px;align-items:flex-end;border-bottom:1px solid var(--line)}
.stchart .stbars.mins i{background:var(--a)} .stchart .stbars.mins i.max{background:var(--gold)} .stchart .stbars.mins i.none{background:var(--line2)}
.stchart .stbars.mins .stb.t i{box-shadow:0 0 0 2px var(--a-soft)}
.stchart .stb .ch-v{font-size:calc(8px * var(--fs,1));color:var(--muted);margin:0 0 2px;line-height:1;order:-1;font-family:var(--mono)}
.stchart .stbars.lbls{height:auto;border:none;margin-top:4px}
.stchart .stbars.lbls span{font-size:calc(9px * var(--fs,1));color:var(--faint)}
.stchart .stbars.lbls .stb.t span{color:var(--b-deep);font-weight:700}
.ch-axis{display:flex;justify-content:space-between;font-size:calc(8px * var(--fs,1));color:var(--faint);font-family:var(--mono);margin-top:2px}
.ch-lab .ch-t{white-space:nowrap;margin-right:8px}.ch-lab .small{text-align:right}

/* календарь: фото + дата, минуты учёбы, лестницы */
.cal-d{position:relative;overflow:hidden;aspect-ratio:1/1.12;min-height:50px;border-radius:10px;border:1px solid var(--line);background:var(--card2);display:block;padding:0;font-family:var(--mono);color:var(--muted);transition:transform .12s ease;text-align:left}
.cal-d .n{position:absolute;left:4px;top:3px;font-size:calc(9.5px * var(--fs,1));font-weight:600;line-height:1;color:var(--faint);z-index:1}
.cal-d .tr{position:absolute;right:3px;top:3px;display:flex;align-items:center;gap:2px;z-index:1;line-height:1}
.cal-d .m{font-size:calc(8px * var(--fs,1));color:var(--faint);font-family:var(--font);font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.cal-d .mn{position:absolute;left:4px;bottom:4px;font-size:calc(15px * var(--fs,1));font-weight:800;color:var(--a);line-height:1;z-index:1;letter-spacing:-.02em}
.cal-d .sd{position:absolute;right:4px;bottom:4px;font-size:calc(15px * var(--fs,1));font-weight:800;color:var(--b-deep);line-height:1;z-index:1;letter-spacing:-.02em}
.cal-d.jr .tr::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--gold);display:block}
.cal-d.hasvc .tr::before{content:"🎤";font-size:calc(9px * var(--fs,1));line-height:1;display:block;font-family:var(--font)}
.cal-d.l2 .n,.cal-d.l3 .n,.cal-d.l4 .n{color:rgba(255,255,255,.8)} .cal-d.l3 .mn,.cal-d.l4 .mn{color:#eaf0ff} .cal-d.l3 .sd,.cal-d.l4 .sd{color:#ffe0c2} .cal-d.l3 .m,.cal-d.l4 .m{color:rgba(255,255,255,.75)}
.cal-d.today{box-shadow:inset 0 0 0 2px var(--b)}
.cal-d.sel{transform:scale(1.08);box-shadow:0 0 0 2px var(--b),0 4px 12px rgba(20,28,38,.15);z-index:2}
.cal-d.fut{opacity:.35}
.cal-d .ph{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.cal-d.hasph::after{content:"";position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(to top,rgba(10,16,24,.72),rgba(10,16,24,0));pointer-events:none}
.cal-d.hasph .n{background:rgba(20,28,38,.5);color:#fff;border-radius:999px;padding:2px 4px;left:3px;top:3px;backdrop-filter:blur(2px)}
.cal-d.hasph .m{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.cal-d.hasph .mn{color:#cfe0ff;text-shadow:0 1px 2px rgba(0,0,0,.7);z-index:2} .cal-d.hasph .sd{color:#ffd2a8;text-shadow:0 1px 2px rgba(0,0,0,.7);z-index:2}
.cal-d.hasph.jr .tr::after{box-shadow:0 0 0 1.5px rgba(0,0,0,.35)}
.cal-d.hasph.l1,.cal-d.hasph.l2,.cal-d.hasph.l3,.cal-d.hasph.l4{border-color:var(--a)}
.cal-leg.cal-lg{margin-top:4px;gap:10px;flex-wrap:wrap} .cal-lg span{display:inline-flex;align-items:center;gap:3px;white-space:nowrap} .cal-lg i.dot{width:5px;height:5px;border-radius:50%;background:var(--gold);border:none}
@media (max-width:420px){.cal-d .n{font-size:calc(8.5px * var(--fs,1))} .cal-d .mn,.cal-d .sd{font-size:calc(11.5px * var(--fs,1));letter-spacing:-.04em} .cal-d .mn{left:3px} .cal-d .sd{right:3px}}

 — тепловложение, <b>G<\/b> — расход газа; <b>t<\/b> — экспозиция, <b>D<\/b> — плотность снимка, <b>K<\/b> — чувствительность; <b>α<\/b> — угол ввода, <b>r<\/b> — путь по лучу, <b>X, Y<\/b> — координаты дефекта.","date":"27.10.2026","skin":{"name":"tetrada"}},"LEVELS":[{"id":"L0","rank":"Ученик / до входа","title":"Дуга, металл, шов","sub":"ток и полярность · соединения на чертеже · защита ванны · дефект на картинке · безопасность · кто что подписывает","intro":"Уровень учит узнавать и называть: что происходит в дуге при 120 А, как на чертеже выглядит катет 5 мм, зачем ванне аргон 10 л/мин и чем пора отличается от трещины. На грейде ученика это проявляется просто: ты выставляешь режим из таблицы, а не наугад, не трогаешь баллон без наставника и не ставишь чужое клеймо. Всё, что дальше в курсе, стоит на этих шести юнитах."},{"id":"L1","rank":"Сварщик 3–4 разряда / контролёр-ученик","title":"Ровный шов по карте","sub":"сборка стыка · РД · МП · положения · ВИК шаблоном · дефект → причина · открывается в полной версии","intro":"На этом грейде ты варишь балки, фермы и лестницы из 09Г2С и Ст3 толщиной 6–16 мм по карте, а мастер и контролёр ВИК принимают каждый шов. Уровень учит собирать стык по трём числам, выставлять режим РД и МП по диаметру и положению, проверять себя шаблоном до контролёра и по виду дефекта называть, что именно было не так в режиме или сборке. Ставка пока не авария, а переделка валика, замечание в журнале и потерянные часы смены — но привычки закладываются именно здесь."},{"id":"L2","rank":"Сварщик 5 разряда НАКС / дефектоскопист I–II уровня","title":"Корень и контроль","sub":"TIG · нержавейка · труба давления · РК · УЗК · ПВК · карта и наряд · открывается в полной версии","intro":"Здесь сварщик впервые отвечает за корень трубы под рентген и впервые сам держит в руках плёнку, преобразователь и пенетрант. Уровень учит варить корень TIG с поддувом на нержавейке и стали 20, держать тепловложение (Q) и межпроходную (T_м) числом, а не на глаз, и проводить ВИК, ПВК, РК и УЗК по готовой карте так, чтобы II уровень подписал протокол без исправлений. Цена ошибки на грейде — вырезанный стык за 25–60 тыс. ₽ и контрольный стык под НАКС, который переваривают заново."},{"id":"L3","rank":"Сварщик 6 разряда НАКС + НК II · целевая вакансия","title":"Узел под рентгеном","sub":"снимок · координаты УЗК · нормы оценки · заключение · тонкостенка · поле · сдача надзору · открывается в полной версии","intro":"На этом грейде ты сам варишь ответственный узел трубопровода давления, сам читаешь его снимок, сам считаешь координаты по УЗК и сам ставишь подпись под заключением, которое уйдёт в Ростехнадзор. Каждое число здесь имеет цену: ремонт стыка — около 40 тыс. ₽ и смена, пропущенный непровар — авария, «подправленный» класс — подпись под чужой бедой. Уровень учит держать три вещи одновременно: шов, норму и честность."},{"id":"L4","rank":"Мастер / прораб СМУ · начальник лаборатории НК","title":"Участок и лаборатория","sub":"ПТД и карты · объём контроля · ИД · экономика брака · ИИИ · бригада · открывается в полной версии","intro":"На этом грейде ты больше не варишь и не снимаешь сам — ты пишешь карты, по которым варят десять человек, назначаешь объём контроля, собираешь исполнительную документацию и отвечаешь перед надзором за людей, источник излучения и срок. Ошибка здесь стоит не стыка, а дня простоя бригады (200 тыс. ₽), предписания или остановки работ. Уровень учит считать участок и лабораторию в числах: процентах контроля, рублях брака, днях вахты и сроках удостоверений."},{"id":"L5","rank":"Главный сварщик / руководитель службы НК","title":"Система качества","sub":"ISO 3834 · 94-ФЗ и СРО · технологии · отказы · риск и бюджет · открывается в полной версии","intro":"На этом грейде ты отвечаешь не за стык, а за 300 сварщиков на 20 объектах: за то, чтобы любой стык любой смены можно было проследить до человека, карты и заключения, чтобы допуски не истекали, а технологии покупались под дефект и объём, а не под каталог. Отказ на объекте, проверка надзора и защита бюджета контроля перед директором — твои рабочие ситуации, и в каждой ты говоришь на языке вероятности и денег."}],"UNITS":[{"id":"u0-1","level":"L0","title":"Дуга и ванна: ток, напряжение, полярность, тепло","lead":"Ток задаёт глубину, напряжение — ширину, полярность — куда идёт тепло","concept":"Сварочная дуга — это электрический разряд между электродом и металлом, в котором температура столба достигает нескольких тысяч градусов, а металл под дугой превращается в жидкую сварочную ванну. Три ручки управляют этим процессом: сварочный ток (I) определяет, сколько металла расплавится и как глубоко; напряжение дуги (U) растёт с длиной дуги и делает валик шире и площе; полярность решает, где выделяется больше тепла — на электроде или на изделии. Для ручной дуговой сварки ток выбирают по диаметру электрода (d): I ≈ K_d·d, где K_d = 30…50 А/мм, то есть для d 3 мм — 90–130 А, для d 4 мм — 130–180 А в нижнем положении. Суммарно вложенное тепло описывает тепловложение (Q) = η·U·I·60 / (v·1000) кДж/мм: при U 24 В, I 120 А, v 150 мм/мин и η 0,8 получается 0,92 кДж/мм. Ученик чаще всего ошибается в двух местах: ставит ток «побольше, чтобы проплавить» и получает подрез и прожог на 6 мм пластине, либо тянет длинную дугу 8–10 мм и получает поры и разбрызгивание. Полярность путают постоянно: при TIG на стали и нержавейке «минус» на электроде (DCEN), а для электродов УОНИ-13/55 — «плюс» на электроде (DCEP); перепутал — вольфрам оплавляется или дуга рвётся.","points":[{"h":"Ток — глубина, напряжение — ширина","t":"Сварочный ток (I) управляет количеством расплавленного металла: при 90 А электродом d 3 мм на пластине 6 мм валик узкий и высокий, электрод залипает; при 120 А ванна растекается, корень проплавляется; при 180 А тем же электродом металл кипит, по краям появляется подрез, а на тонком месте — сквозная дыра. Напряжение дуги (U) ты не крутишь ручкой при ручной сварке — оно растёт с длиной дуги: короткая дуга 2–3 мм даёт 20–22 В и узкий плотный валик, длинная 8 мм — 28–30 В, широкий плоский валик и поры, потому что защита ванны рвётся. Правило ученика: длина дуги примерно равна диаметру электрода (d)."},{"h":"Ток по диаметру: K_d = 30…50 А/мм","t":"Ток (I) считают от диаметра электрода (d): I ≈ K_d·d. Для нижнего положения берут 40–50 А/мм, для потолочного 30–35 А/мм, потому что в потолке ванну держит только поверхностное натяжение, и лишний металл просто упадёт. Проверка: d 3 мм × 40 = 120 А, d 4 мм × 40 = 160 А — обе цифры внутри табличных диапазонов 90–130 и 130–180 А. Типичная ошибка — взять электрод d 4 мм на ток, настроенный под d 3 мм: 110 А ниже нижней границы 130 А, электрод липнет, шов не проплавлен. Перед сменой диаметра всегда пересчитывай ток."},{"h":"Полярность: куда уходит тепло","t":"При постоянном токе на аноде («плюс») выделяется больше тепла, чем на катоде. Прямая полярность (DCEN) — «минус» на электроде: горячее изделие, холоднее электрод; так варят TIG по стали и нержавейке, и вольфрам живёт долго. Обратная полярность (DCEP) — «плюс» на электроде: так работают электроды с основным покрытием УОНИ-13/55 и проволока при механизированной сварке. Если включить TIG на DCEP, около 70 % тепла уходит в вольфрам, он оплавляется шариком и сыплет в шов вольфрамовые включения. Если УОНИ зажечь на DCEN — дуга горит неустойчиво, рвётся, шов пористый."},{"h":"Тепловложение — одно число про всё","t":"Тепловложение (Q) собирает ток, напряжение и скорость сварки (v) в одно число: Q = η·U·I·60 / (v·1000) кДж/мм, где η — термический КПД способа (РД и МП 0,8, TIG 0,6). Пример: U 24 В, I 120 А, v 150 мм/мин, η 0,8 → 0,8·24·120·60 / 150 000 = 0,92 кДж/мм. Если ученик замедлился вдвое до 75 мм/мин, Q удваивается до 1,84 кДж/мм — пластина 6 мм перегревается, коробится, а на нержавейке это уже выше ориентира 1,5 кДж/мм. На следующем грейде Q станет рабочим параметром карты, сейчас достаточно понимать: медленнее — горячее."},{"h":"Как это выглядит у сварщика 5 разряда","t":"Опытный сварщик не «чувствует» ток — он знает его из карты и проверяет по валику: ширина валика при РД примерно 2–3 диаметра электрода (d), чешуйки ровные, подреза нет. Он меняет ток на 10–20 А между корнем и заполнением, а не на 50, потому что знает цену каждого ампера. Ученику полезно завести привычку: перед каждой пластиной записать d, I, полярность и положение — и сверить результат с валиком. Через 20 пластин связь «цифра → картинка» уже в руках."}],"practice":{"id":"u0-1-pr","mechanic":"keymoves","points":3,"stem":"Первая учебная пластина 200×100×6 мм, электрод УОНИ-13/55 d 3 мм, нижнее положение, инвертор на столе. Наставник отошёл, сказал «выставь режим сам». Собери ходы.","options":[{"id":"k0","text":"Выставить 110–120 А — середину диапазона для d 3 мм","correct":true,"why":"Ток от диаметра: 40·3 = 120 А, внутри таблицы для d 3 мм, пластина 6 мм проплавится без подреза."},{"id":"k1","text":"Поставить «плюс» на электрододержатель — обратная полярность для основного покрытия","correct":true,"why":"УОНИ-13/55 горят устойчиво только на DCEP; на DCEN дуга рвётся и шов пористый."},{"id":"k2","text":"Держать дугу короткой, около 3 мм — примерно равной диаметру электрода","correct":true,"why":"Короткая дуга — низкое напряжение, плотный валик; длинная 8 мм даёт поры и брызги."},{"id":"k3","text":"Проверить, что зажим массы стоит на пластине или столе, а не на кабеле","correct":true,"why":"Без надёжной массы дуга горит неустойчиво, а ток уходит по случайным путям и греет контакты."},{"id":"f0","text":"Поставить 170–180 А, чтобы 6 мм точно проплавились с первого прохода","correct":false,"why":"180 А для d 3 мм — выше диапазона на 50 А: металл кипит, подрез по краям, на 6 мм возможна дыра."},{"id":"f1","text":"Тянуть дугу 8–10 мм, чтобы валик вышел шире и ровнее на вид","correct":false,"why":"Длинная дуга поднимает U до 28–30 В, защита рвётся, в шве поры и брызги вокруг."},{"id":"f2","text":"Поставить «минус» на держатель — как на TIG, который показывали вчера","correct":false,"why":"DCEN для УОНИ-13/55 — неустойчивая дуга и поры; это полярность TIG, не основного электрода."},{"id":"f3","text":"Взять электрод d 4 мм при тех же 110 А, чтобы шов вышел шире","correct":false,"why":"110 А ниже нижней границы 130 А для d 4 мм — электрод липнет, корень не проплавлен."}],"reference":"Режим собирается от диаметра: d 3 мм → I ≈ 40·3 = 120 А (диапазон 90–130 А), DCEP для УОНИ-13/55, дуга ≈ d (3 мм), масса на изделии. Больше тока «для надёжности» — подрез и прожог; длиннее дуга «для ширины» — поры."},"test":[{"id":"u0-1-q1","mechanic":"single","points":2,"stem":"Электрод с основным покрытием d 4 мм, нижнее положение, пластина 8 мм. Какой ток выставить?","options":[{"id":"o0","text":"Около 150 А — внутри диапазона 130–180 А для этого диаметра","correct":true,"rationale":"K_d 40 А/мм × 4 мм = 160 А; таблица для d 4 мм даёт 130–180 А в нижнем положении."},{"id":"o1","text":"Около 110 А — чтобы не было подреза на пластине","correct":false,"rationale":"110 А ниже границы 130 А: электрод d 4 мм липнет, корень не проплавляется, валик горбом."},{"id":"o2","text":"Около 220 А — пластина 8 мм требует запаса тепла","correct":false,"rationale":"220 А на 40 А выше верхней границы 180 А: ванна кипит, подрез, разбрызгивание, перегрев 8 мм."},{"id":"o3","text":"Около 90 А — как для d 3 мм, электрод сам доберёт","correct":false,"rationale":"90 А — это нижняя граница для d 3 мм; для d 4 мм это 22 А/мм, дуга не зажжётся устойчиво."}]},{"id":"u0-1-q2","mechanic":"single","points":2,"stem":"TIG по пластине нержавейки 08Х18Н10Т, постоянный ток. Какую полярность включить и почему?","options":[{"id":"o0","text":"Прямую (DCEN): «минус» на электроде, основное тепло — в изделие, вольфрам цел","correct":true,"rationale":"На DCEN анодом становится изделие — ему достаётся больше тепла; электрод остаётся холодным и острым."},{"id":"o1","text":"Обратную (DCEP): «плюс» на электроде, так дуга лучше очищает поверхность","correct":false,"rationale":"На DCEP около 70 % тепла уходит в вольфрам: он оплавляется шариком и даёт включения в шве."},{"id":"o2","text":"Переменный ток: он разрушает плёнку окислов на любой стали","correct":false,"rationale":"Переменный ток нужен алюминию с его тугоплавкой окисной плёнкой; на нержавейке он лишь уменьшает проплав."},{"id":"o3","text":"Любую: при TIG тепло всё равно идёт в ванну, полярность влияет на цвет шва","correct":false,"rationale":"Полярность решает, кто греется — электрод или деталь; на DCEP вольфрам плавится за секунды."}]},{"id":"u0-1-q3","mechanic":"numeric","points":3,"stem":"Механизированная сварка: U 24 В, I 120 А, скорость v 150 мм/мин, η 0,8. Посчитай тепловложение Q в кДж/мм (два знака после запятой).","answer":0.92,"tol":0.03,"unit":"кДж/мм","solution":"Q = η·U·I·60 / (v·1000) = 0,8·24·120·60 / (150·1000) = 138 240 / 150 000 = 0,92 кДж/мм. Проверка здравого смысла: для МП на 6 мм пластине это нормальный, не перегретый режим; при v 75 мм/мин было бы 1,84 кДж/мм."},{"id":"u0-1-q4","mechanic":"sjt_bw","points":3,"stem":"Электрод УОНИ-13/55 d 3 мм, пластина 6 мм, на инверторе 90 А. Электрод липнет к металлу, валик узкий и высокий, чешуйки крупные. Что сделать первым?","options":[{"id":"s0","text":"Поднять ток до 115–120 А — залипание и узкий валик говорят, что тока мало","correct":true,"rationale":"Симптомы недостатка тока: при 90 А на нижней границе дуга вялая; 120 А — середина диапазона для d 3 мм."},{"id":"s1","text":"Перейти на электрод d 4 мм при тех же 90 А — больше металла в валик","correct":false,"rationale":"90 А для d 4 мм — это 22 А/мм, вдвое ниже нормы: залипание станет постоянным, корень не проплавится."},{"id":"s2","text":"Удлинить дугу до 6–8 мм — валик растянется и станет шире","correct":false,"rationale":"Длинная дуга поднимает напряжение и ширит валик, но рвёт защиту: поры и брызги вместо проплава."},{"id":"s3","text":"Позвать наставника и попросить его выставить режим заново","correct":false,"rationale":"Не вредно, но ученик уже видит симптом и знает таблицу: вопрос решается одной ручкой."}],"worst":"s1","worstRationale":"Сменить диаметр без пересчёта тока — худший ход: симптом «мало тока» усиливается вдвое, а причина остаётся.","anchor":{"g":"weldx","p":{"s":6,"g":4,"root":"lack","lbl":"90 А при d 3 мм"},"cap":"узкий горб и залипание — мало тока; канавка по краям — много"}},{"id":"v0-1-a","mechanic":"visual","points":3,"stem":"Электрод d 4 мм, нижнее положение, диапазон 130–180 А. На какой картинке выставленный ток попадает в диапазон?","vopts":[{"id":"v0","v":{"g":"weeks","p":{"w":[60],"ax":"I, А","max":250,"ref":130,"refl":"130 А"}},"lbl":"","correct":false,"rationale":"60 А — ниже 130 А вдвое: электрод d 4 мм липнет, дуга не держится."},{"id":"v1","v":{"g":"weeks","p":{"w":[150],"ax":"I, А","max":250,"ref":130,"refl":"130 А"}},"lbl":"","correct":true,"rationale":"150 А — внутри 130–180 А; столбик выше линии 130 и ниже 180."},{"id":"v2","v":{"g":"weeks","p":{"w":[220],"ax":"I, А","max":250,"ref":130,"refl":"130 А"}},"lbl":"","correct":false,"rationale":"220 А — выше верхней границы 180 А на 40 А: подрез и брызги."},{"id":"v3","v":{"g":"weeks","p":{"w":[110],"ax":"I, А","max":250,"ref":130,"refl":"130 А"}},"lbl":"","correct":false,"rationale":"110 А — чуть ниже линии 130 А: это диапазон для d 3 мм, не d 4."}]},{"id":"v0-1-b","mechanic":"visual","points":3,"stem":"Пластина 6 мм, электрод d 3 мм. На каком сечении видно, что ток был слишком большим?","vopts":[{"id":"v0","v":{"g":"weldx","p":{"s":6,"g":4,"root":"lack","txt":false}},"lbl":"","correct":false,"rationale":"Высокий узкий горб и непровар корня — признак малого тока, не большого."},{"id":"v1","v":{"g":"weldx","p":{"s":6,"g":2,"root":"ok","txt":false}},"lbl":"","correct":false,"rationale":"Усиление 2 мм, корень проплавлен — режим в норме, 110–120 А."},{"id":"v2","v":{"g":"weldx","p":{"s":6,"g":2,"h":1,"root":"excess","txt":false}},"lbl":"","correct":true,"rationale":"Канавки по краям и провисший корень — металл кипел: ток выше диапазона 90–130 А."},{"id":"v3","v":{"g":"weldx","p":{"s":6,"g":2,"pores":4,"root":"ok","txt":false}},"lbl":"","correct":false,"rationale":"Поры при нормальной форме — сорвана защита или длинная дуга, а не избыток тока."}]}],"framework":"Ток — от диаметра (K_d 30…50 А/мм), напряжение — от длины дуги (держи ≈ d), полярность — куда идёт тепло: TIG — минус на электроде, УОНИ — плюс. Медленнее ведёшь — горячее шов.","anchor":{"g":"formula","p":{"f":"I ≈ K_d · d → 3 мм × 40 = 120 А","sub":"d 3 мм: 90–130 А · TIG минус, УОНИ плюс"},"cap":"ток от диаметра, дуга длиной с диаметр, плюс — там, где горячее"},"layers":{"simple":"Представь паяльник. Маленький паяльник на 25 Вт еле плавит олово, большой на 100 Вт плавит сразу и может прожечь плату. Сварочная дуга — тот же паяльник, только в сто раз горячее, и его «мощность» ты задаёшь ручкой тока: 90 А — вялая лужица, 120 А — ровная ванна, 180 А на тонкой пластине — дыра насквозь.\nВторая ручка — расстояние от электрода до металла. Держишь близко, около 3 мм — пламя узкое и плотное; оттянул на 8 мм — дуга длинная, широкая, шипит и брызжет, а в шов попадает воздух. Третья «ручка» — куда воткнуть плюс и минус: на плюсе всегда горячее. Для вольфрама при сварке аргоном минус на горелке, чтобы вольфрам не плавился; для электродов с обмазкой УОНИ — плюс на держателе.\nДля ученика это три привычки: ток от диаметра электрода (d 3 мм → около 120 А), дуга короткая, полярность — по электроду. Проверь себя: что будет с вольфрамом, если на горелку подать плюс?","how":"1. Смотришь на электрод: диаметр d 3 мм. Ток считаешь как d × 40 А/мм = 120 А; таблица для d 3 мм даёт 90–130 А, 120 А внутри. Для d 4 мм было бы 160 А (диапазон 130–180 А). В потолочном положении множитель меньше, 30–35 А/мм, потому что ванну держит только поверхностное натяжение.\n2. Выбираешь полярность по электроду: УОНИ-13/55 — плюс на держателе (обратная, DCEP); TIG по стали и нержавейке — минус на горелке (прямая, DCEN), потому что на плюсе выделяется больше тепла, и вольфрам на плюсе оплавится.\n3. Зажигаешь дугу и держишь её длиной примерно d, то есть 3 мм. Напряжение при этом само устанавливается около 20–22 В; оттянул до 8 мм — выросло до 28–30 В, валик расплылся, пошли поры.\n4. Проверяешь по валику: ширина 2–3 диаметра электрода (6–9 мм), чешуйки ровные, по краям нет канавки. Узкий высокий валик и залипание — тока мало, подними на 10–20 А. Канавка по краям и брызги — тока много или дуга длинная.\n5. Если нужно одно число «сколько тепла вложил», считаешь Q = η·U·I·60/(v·1000): при U 24 В, I 120 А, v 150 мм/мин и η 0,8 это 0,92 кДж/мм. Замедлился вдвое — Q удвоился до 1,84.","formula":{"f":"I ≈ K_d · d;   Q = η · U · I · 60 / (v · 1000)","legend":[["I","сварочный ток, А","120"],["K_d","ампер на миллиметр диаметра, 30…50","40"],["d","диаметр электрода, мм","3"],["Q","тепловложение, кДж/мм","0,92"],["η","термический КПД способа (РД, МП 0,8; TIG 0,6)","0,8"],["U","напряжение дуги, В","24"],["v","скорость сварки, мм/мин","150"]],"note":"K_d — ориентир для нижнего положения 40–50, для потолочного 30–35; точный ток — из таблицы по диаметру и положению. Q растёт при замедлении и падает при ускорении — v в знаменателе."},"pitfalls":"Опытные ошибаются не в таблице, а в привычке: «я этим электродом всегда на 150 варю» — и на пластине 6 мм вместо 10 мм появляется подрез 0,8 мм по всей длине. В учебном журнале это выглядит так: записано «d 3, I 150», а в графе результата — «подрез», и наставник сразу спрашивает: «150 — это по какой таблице?». Второй капкан — полярность после соседа: инвертор переключили на DCEN под TIG, ты ставишь УОНИ и полчаса ищешь причину рваной дуги и пор в электродах, а причина — в клеммах. Третий — длина дуги под спешку: торопишься, оттягиваешь электрод, напряжение уходит к 28–30 В, и шов пористый, хотя ток «по таблице». Под давлением сроков отвечай цифрой: «d 3 мм — 120 А, диапазон 90–130, выше не пойду, иначе переделывать». Пересчёт режима занимает 20 секунд, переварка пластины — 20 минут, а на трубе Ø 530 мм ремонт стыка — 25–60 тыс. ₽ и смена.","checks":[{"q":"Почему при TIG по стали минус ставят на горелку, а не плюс?","o":["На плюсе выделяется больше тепла, и вольфрам на плюсе оплавится","На минусе дуга горит ярче, и ванну лучше видно сквозь маску","На минусе расход аргона из горелки получается заметно меньше"],"a":0,"w":"На аноде (плюсе) горячее: при DCEN горячее изделие, а холодный вольфрам остаётся острым и чистым."},{"q":"Электрод d 4 мм, нижнее положение. Какой ток по правилу K_d ≈ 40 А/мм?","o":["Около 120 А, как и для d 3 мм — электроды близкие","Около 160 А: 4 мм × 40 А/мм, внутри диапазона 130–180","Около 220 А: толстому электроду нужен запас по теплу"],"a":1,"w":"I ≈ K_d·d = 40·4 = 160 А; это середина табличного диапазона 130–180 А для d 4 мм."},{"q":"В формуле Q = η·U·I·60/(v·1000) ученик замедлил сварку вдвое при тех же U и I. Что с Q?","o":["Q уменьшится вдвое, потому что v стоит в числителе формулы","Q не изменится: тепло задают только ток и напряжение","Q удвоится: v в знаменателе, медленнее — горячее шов"],"a":2,"w":"v стоит в знаменателе: при v 75 вместо 150 мм/мин Q растёт с 0,92 до 1,84 кДж/мм."},{"q":"Шов пористый, ток 120 А «по таблице» для d 3 мм. Какой первый вопрос наставника?","o":["«Какой длины держал дугу и какая полярность стояла?»","«Почему не поднял ток до 150 А, чтобы ванна прогрелась?»","«Сколько минут прокаливал пластину перед сваркой?»"],"a":0,"w":"Поры при верном токе — длинная дуга (U 28–30 В) или перепутанная полярность после соседа; ток здесь ни при чём."}],"rules":["Ток — глубина проплава, напряжение (длина дуги) — ширина валика; дуга ≈ диаметру электрода (d).","I ≈ K_d·d: нижнее положение 40–50 А/мм, потолочное 30–35; сменил диаметр — пересчитай ток.","На плюсе горячее: TIG — минус на электроде (DCEN), УОНИ-13/55 — плюс (DCEP).","Q = η·U·I·60/(v·1000): замедлился вдвое — вложил вдвое больше тепла.","Опытный проверяет ток по валику: ширина 2–3 d, ровные чешуйки, без канавок по краям."]}},{"id":"u0-2","level":"L0","title":"Соединения и швы на чертеже: катет, усиление, корень","lead":"Чертёж говорит, какой шов нужен; шаблон говорит, какой получился","concept":"На чертеже сварное соединение обозначают буквой типа (С — стыковое, У — угловое, Т — тавровое, Н — нахлёсточное) и знаком шва на линии-выноске; угловой шов задают катетом: △5 означает катет (k) 5 мм. Стыковое соединение — две детали кромка к кромке в одной плоскости; у него есть лицевая сторона с усилением (g) — выпуклостью над плоскостью листа, норма для ответственных стыков 0,5–3 мм, — и обратная сторона, корень шва, где первый проход должен проплавить обе кромки насквозь. Угловое и тавровое соединения описываются катетом — стороной вписанного в сечение равнобедренного треугольника; катет по чертежу обычно близок к толщине тонкой детали. Смещение кромок (e) в стыке ограничивают долей толщины: e ≤ 0,1·s, для пластины 6 мм это 0,6 мм. Всё это измеряется шаблоном УШС-3: катет, усиление, подрез, смещение. Ученик ошибается, когда читает △5 как «ширину шва 5 мм», путает усиление с катетом и считает корень «тем, что снизу и не видно, поэтому неважно» — а именно корень чаще всего не проплавлен.","points":[{"h":"Четыре типа соединения — по взаимному положению деталей","t":"Стыковое (С): кромки встык в одной плоскости, типично для труб и листов — усилие проходит через шов напрямую. Угловое (У): детали под углом, шов в углу. Тавровое (Т): одна деталь торцом упирается в плоскость другой, буквой Т, — так варят рёбра и полки балок. Нахлёсточное (Н): листы лежат один на другом, два угловых шва по кромкам. Ученик узнаёт тип по картинке сечения за секунду, и это решает, что мерить: у стыкового — усиление и корень, у углового и таврового — катет."},{"h":"Катет: △5 — это 5 мм стороны треугольника","t":"Катет (k) — сторона равнобедренного прямоугольного треугольника, вписанного в сечение углового шва; знак △5 на полке линии-выноски задаёт k = 5 мм. Шаблон УШС-3 прикладывают к обеим полкам: выемка 5 мм должна лечь без просвета. Если прибор показывает 4 мм при чертёжных 5 — недобор катета, шов слабее на 20 % по сечению; 7 мм при чертёжных 5 — лишний металл, лишнее тепло и деформация. Частая ошибка ученика — мерить ширину шва (гипотенузу) и радоваться «целым 7 мм»."},{"h":"Усиление — выпуклость, а не прочность","t":"Усиление (g) — высота выпуклости стыкового шва над поверхностью листа; норма для ответственных стыков 0,5–3 мм, для труб обычно 1–3 мм в зависимости от толщины (s). Усиление 4–5 мм не делает шов прочнее: оно создаёт резкий переход к основному металлу, где концентрируются напряжения, и затрудняет контроль. Нулевое усиление или вогнутость — шов ниже поверхности листа, сечение меньше расчётного. Ученик видит «горб» и думает «запас», опытный — «дефект формы, снять до 3 мм». Мерят УШС-3 или линейкой на зачищенном участке."},{"h":"Корень — обратная сторона, которая держит всё","t":"Корень шва — зона первого прохода у обратной стороны стыка; именно там кромки должны сплавиться насквозь. Хороший корень на обратной стороне пластины 6 мм выглядит как ровный узкий валик высотой 1–2 мм; норма выпуклости/вогнутости корня — ориентир ≤ 1–2 мм. Если на обратной стороне видна тёмная бороздка — кромки не сплавились, это непровар, и шов фактически работает половиной толщины. Ученик смотрит на лицевую сторону, потому что она красивая; контролёр первым делом переворачивает пластину."},{"h":"Смещение кромок: доля толщины","t":"Смещение (e) — разность уровней кромок в стыке; норма e ≤ 0,1·s, для труб допускают до 0,15·s, но не более 2–3 мм по норме объекта. Для учебной пластины s 6 мм это 0,6 мм — толщина спички. Смещение 1,5 мм на 6 мм — это 25 % толщины: шов получает изгиб уже при сборке, а в корне образуется ступенька, которую не проплавить. На следующем грейде это проверяют до сварки, при сборке; ученику достаточно понять, что ступенька между пластинами — не «потом сравняется», а дефект."}],"practice":{"id":"u0-2-pr","mechanic":"matching","points":3,"stem":"Сопоставь, что ты видишь на чертеже или на пластине, с тем, как это называется.","pairs":[{"l":"Знак △5 на полке линии-выноски","r":"угловой шов с катетом 5 мм"},{"l":"Две пластины кромка к кромке в одной плоскости","r":"стыковое соединение, буква С"},{"l":"Выпуклость над плоскостью листа высотой 2 мм","r":"усиление шва в норме 0,5–3 мм"},{"l":"Обратная сторона стыка, зона первого прохода","r":"корень шва, проплав обеих кромок"},{"l":"Лист поставлен торцом на другой лист, буквой Т","r":"тавровое соединение, мерят катет"},{"l":"Ступенька 1,5 мм между кромками пластин 6 мм","r":"смещение кромок выше нормы 0,1·s"}],"solution":"Тип соединения узнаётся по взаимному положению деталей (С, У, Т, Н), катет — по знаку △ с числом, усиление — выпуклость стыкового шва 0,5–3 мм, корень — обратная сторона с первым проходом, смещение — доля толщины, для 6 мм не больше 0,6 мм."},"test":[{"id":"u0-2-q1","mechanic":"single","points":2,"stem":"На чертеже таврового соединения написано △6. Ученик приложил УШС-3 и получил 4 мм. Что это значит?","options":[{"id":"o0","text":"Недобор катета: сечение шва меньше чертёжного, нужна подварка до 6 мм","correct":true,"rationale":"Катет 4 вместо 6 мм — треугольник сечения на треть меньше; шов не выдержит расчётную нагрузку."},{"id":"o1","text":"Норма: чертёж задаёт максимум, а 4 мм экономит металл и тепло","correct":false,"rationale":"△6 — требуемое значение, а не предел сверху; меньше катет — слабее шов и меньше проплав."},{"id":"o2","text":"Ошибка измерения: катет меряют линейкой по ширине шва, а не шаблоном","correct":false,"rationale":"Ширина шва — гипотенуза, она всегда больше катета; шаблон УШС-3 как раз и меряет катет."},{"id":"o3","text":"Это усиление 4 мм, а катет в тавровом соединении не меряется","correct":false,"rationale":"Усиление — выпуклость стыкового шва; у таврового главный размер — именно катет."}]},{"id":"u0-2-q2","mechanic":"single","points":2,"stem":"Стыковой шов на пластине 6 мм, усиление измерено: 4,5 мм. Норма для ответственных стыков 0,5–3 мм. Как это оценить?","options":[{"id":"o0","text":"Превышение усиления — дефект формы, лишний металл снять до нормы","correct":true,"rationale":"Горб 4,5 мм даёт резкий переход к листу, концентратор напряжений и мешает контролю; норма 0,5–3 мм."},{"id":"o1","text":"Запас прочности: чем выше усиление, тем больше сечение шва","correct":false,"rationale":"Прочность задаёт проплав, а не горб; переход 4,5 мм — концентратор, а не запас."},{"id":"o2","text":"Норма, если усиление ровное по длине и без подреза по краям","correct":false,"rationale":"Ровный горб 4,5 мм всё равно выше 3 мм; ровность не отменяет размер."},{"id":"o3","text":"Нужно переварить шов целиком, снимать усиление запрещено","correct":false,"rationale":"Усиление снимают шлифовкой до нормы; переваривать из-за формы лицевой стороны не нужно."}],"anchor":{"g":"weldx","p":{"s":6,"g":4.5,"root":"ok","lbl":"норма ≤ 3"},"cap":"горб выше 3 мм — не запас, а концентратор"}},{"id":"u0-2-q3","mechanic":"numeric","points":3,"stem":"Учебная пластина толщиной s 6 мм, норма смещения кромок e ≤ 0,1·s. Какое наибольшее смещение в мм ещё допустимо?","answer":0.6,"tol":0.05,"unit":"мм","solution":"e ≤ 0,1·s = 0,1·6 = 0,6 мм. Это толщина спички; ступенька 1,5 мм на такой пластине — 25 % толщины, в корне образуется уступ, который не проплавится."},{"id":"u0-2-q4","mechanic":"multi","points":3,"stem":"Что из перечисленного относится к стыковому соединению двух пластин 6 мм?","options":[{"id":"o0","text":"Усиление (g) мерят над плоскостью листа, норма 0,5–3 мм","correct":true,"rationale":"Усиление — выпуклость именно стыкового шва над поверхностью; у угловых швов его не меряют так."},{"id":"o1","text":"Корень шва — обратная сторона, где первый проход проплавляет кромки","correct":true,"rationale":"В стыке корень — это сквозной проплав с обратной стороны; без него шов работает частью толщины."},{"id":"o2","text":"Катет (k) мерят шаблоном по двум полкам, норма по знаку △","correct":false,"rationale":"Катет — размер углового и таврового шва; у стыкового соединения катета нет."},{"id":"o3","text":"Нахлёст листов должен быть не меньше трёх толщин, 18 мм","correct":false,"rationale":"Нахлёст — признак нахлёсточного соединения (Н), а не стыкового."}]},{"id":"v0-2-a","mechanic":"visual","points":3,"stem":"Стыковой шов на пластине 6 мм, норма усиления 0,5–3 мм, подрез недопустим. Какое сечение в норме?","vopts":[{"id":"v0","v":{"g":"weldx","p":{"s":6,"g":4.5,"root":"ok","txt":false}},"lbl":"","correct":false,"rationale":"Горб 4,5 мм выше нормы 3 мм — превышение усиления, снять."},{"id":"v1","v":{"g":"weldx","p":{"s":6,"g":2,"h":0.8,"root":"ok","txt":false}},"lbl":"","correct":false,"rationale":"Усиление в норме, но канавка по краю — подрез, дефект формы."},{"id":"v2","v":{"g":"weldx","p":{"s":6,"g":0,"root":"ok","txt":false}},"lbl":"","correct":false,"rationale":"Усиления нет — шов вровень или ниже листа, сечение меньше расчётного."},{"id":"v3","v":{"g":"weldx","p":{"s":6,"g":2,"root":"ok","txt":false}},"lbl":"","correct":true,"rationale":"Выпуклость около 2 мм внутри 0,5–3 мм, края без канавок, корень проплавлен."}]},{"id":"v0-2-b","mechanic":"visual","points":3,"stem":"Пластины s 6 мм, норма смещения кромок e ≤ 0,1·s. На какой картинке стык собран с допустимой, но ненулевой ступенькой?","vopts":[{"id":"v0","v":{"g":"joint","p":{"s":6,"b":2,"c":1.5,"beta":30,"e":0}},"lbl":"","correct":false,"rationale":"Ступеньки нет вовсе — вопрос про допустимую, но ненулевую."},{"id":"v1","v":{"g":"joint","p":{"s":6,"b":2,"c":1.5,"beta":30,"e":0.5}},"lbl":"","correct":true,"rationale":"e 0,5 мм ≤ 0,1·6 = 0,6 мм — в допуске, ступенька едва заметна."},{"id":"v2","v":{"g":"joint","p":{"s":6,"b":2,"c":1.5,"beta":30,"e":1.5}},"lbl":"","correct":false,"rationale":"e 1,5 мм — 25 % толщины, в 2,5 раза больше допуска 0,6 мм."},{"id":"v3","v":{"g":"joint","p":{"s":6,"b":2,"c":1.5,"beta":30,"e":2.5}},"lbl":"","correct":false,"rationale":"e 2,5 мм — уступ почти в половину толщины, корень не проплавить."}]}],"framework":"Тип соединения — по положению деталей (С, У, Т, Н). Угловой и тавровый шов — катет по △; стыковой — усиление 0,5–3 мм снаружи и проплавленный корень снизу; смещение кромок (e) ≤ 0,1·s.","anchor":{"g":"weldx","p":{"s":6,"g":2,"root":"ok","lbl":"корень проплавлен"},"cap":"сверху усиление до 3 мм, снизу — проплавленный корень"},"layers":{"simple":"Чертёж — это рецепт, а шов — блюдо. В рецепте написано «две детали встык, лицевая сторона с горбиком не выше 3 мм», или «уголок, катет 5» — и повар, то есть сварщик, должен приготовить ровно это, а не «как получится». Четыре способа сложить детали узнаются с первого взгляда: кромка к кромке в одной плоскости — стыковое; торцом на плоскость, буквой Т — тавровое; под углом — угловое; один лист на другом — нахлёсточное.\nУ стыкового шва две стороны. Лицевая — с усилением: это выпуклость над листом, нормально 0,5–3 мм, как горбик у хорошо выпеченного хлеба. Обратная — корень: там первый проход должен проплавить обе пластины насквозь, как клей, прошедший до самого дна щели. У уголка и тавра главный размер — катет: сторона треугольника, который можно вписать в шов; на чертеже это △5, то есть 5 мм.\nЕщё одна вещь, которую видно глазами: ступенька между пластинами. На пластине 6 мм ступенька больше 0,6 мм — уже плохо, потому что в корне получится уступ, который не проплавить. Проверь себя: что меряют у таврового шва — усиление или катет?","how":"1. Смотришь на чертёж: буква типа соединения (С — стыковое, У — угловое, Т — тавровое, Н — нахлёсточное) и знак шва на линии-выноске. Если стоит △5 — это угловой шов с катетом k = 5 мм.\n2. Смотришь на детали: кромка к кромке в одной плоскости — стыковое, значит, мерить усиление (g) сверху и корень снизу; торцом в плоскость — тавровое, мерить катет (k).\n3. Берёшь шаблон УШС-3. Для катета прикладываешь выемку к двум полкам: △5 — выемка 5 мм ложится без просвета; 4 мм — недобор, 7 мм — перебор. Для усиления ставишь шаблон на лист поперёк шва: горб 2 мм — норма 0,5–3 мм; 4,5 мм — превышение, снять.\n4. Переворачиваешь: корень стыка на пластине 6 мм — ровный узкий валик 1–2 мм высотой. Тёмная бороздка по оси — кромки не сплавились.\n5. Проверяешь ступеньку между кромками: допуск e ≤ 0,1·s = 0,1·6 = 0,6 мм. Ступенька 1,5 мм — 25 % толщины, стык собран неправильно.\n6. Записываешь в журнал пластины: «стыковое, g 2 мм, корень проплавлен, e 0,5 мм» или «тавровое, k 5 мм по шаблону».","formula":{"f":"С/У/Т/Н → что мерить:   С → g (0,5–3 мм) + корень;   У, Т → k по △;   любой стык: e ≤ 0,1 · s","legend":[["С, У, Т, Н","стыковое, угловое, тавровое, нахлёсточное","С"],["g","усиление — выпуклость стыкового шва, мм","2"],["k","катет углового/таврового шва, мм; на чертеже △k","5"],["e","смещение кромок, мм","0,5"],["s","толщина пластины, мм","6"]],"note":"Для труб усиление обычно 1–3 мм, а смещение допускают до 0,15·s, но не более 2–3 мм — точные числа всегда по норме объекта и карте."},"pitfalls":"Опытные ошибаются в двух местах. Первое — «усиление как запас»: сварщик кладёт горб 4–5 мм, уверенный, что «лишнего металла не бывает», а в акте ВИК появляется «превышение усиления, g 4,5 мм при норме ≤ 3» и требование снять шлифовкой; на трубе это плюс час работы и повторный осмотр. Второе — катет по ширине: мерят линейкой гипотенузу, видят 7 мм при чертёжных △5 и радуются, тогда как шаблон показывает катет 4,5 мм — недобор. Вопрос, который вскрывает обе ошибки: «чем мерил?». Если ответ «на глаз» или «линейкой», результата нет. Третий капкан — корень: лицевая сторона ровная, а обратную никто не смотрел, и в журнале стоит «годен» с непроваром под ним. Под давлением сроков отвечай: «стыковое — переворачиваю и смотрю корень, 20 секунд; тавровое — шаблон на катет, 10 секунд». Не записанный размер на следующем грейде превращается в спор с контролёром, который всегда проигрывает сварщик.","checks":[{"q":"Две пластины 6 мм лежат кромка к кромке в одной плоскости и сварены. Какое это соединение и что у него мерят снаружи?","o":["Тавровое — мерят катет шаблоном по двум полкам","Стыковое — мерят усиление над плоскостью листа","Нахлёсточное — мерят величину перекрытия листов"],"a":1,"w":"Кромка к кромке в одной плоскости — стыковое (С); снаружи у него усиление g, снизу — корень."},{"q":"На чертеже таврового соединения стоит △5. Шаблон показал катет 7 мм. Что это?","o":["Перебор катета: лишний металл, лишнее тепло и деформация","Норма: чертёж задаёт минимум, больше — запас прочности","Недобор: шаблон меряет гипотенузу, катет ещё меньше"],"a":0,"w":"△5 — требуемый катет 5 мм; 7 мм — лишних 40 % металла, деформация и перерасход, а не «запас»."},{"q":"По схеме e ≤ 0,1·s: пластины 8 мм, ступенька между кромками 1 мм. Допустимо?","o":["Да: 1 мм меньше 0,1·8 = 0,8 мм с учётом округления","Да: для пластин толще 6 мм ступенька до 1,5 мм не нормируется","Нет: допуск 0,8 мм, ступенька 1 мм — больше"],"a":2,"w":"0,1·8 = 0,8 мм; 1 мм больше допуска — в корне получится уступ, который не проплавится."},{"q":"Сварщик уверен: «горб 5 мм — это запас прочности». Какой один вопрос снимает спор?","o":["«Какой ток и диаметр электрода ты ставил на этом шве?»","«Чем мерил и какая норма усиления в карте на этот стык?»","«Сколько проходов сделал и какая была длина дуги?»"],"a":1,"w":"Норма g 0,5–3 мм и шаблон закрывают спор: 5 мм — концентратор напряжений и дефект формы, а не запас."}],"rules":["Тип соединения — по положению деталей: С кромка к кромке, Т торцом в плоскость, У под углом, Н внахлёст.","△k на чертеже — катет k мм; мерят шаблоном по двум полкам, не линейкой по ширине.","Усиление стыкового шва 0,5–3 мм; выше — дефект формы, снять, а не «запас».","Корень — обратная сторона с первым проходом; смотреть его первым, бороздка по оси — непровар.","Смещение кромок e ≤ 0,1·s: на 6 мм — не больше 0,6 мм, ступенька 1,5 мм — брак сборки."]}},{"id":"u0-3","level":"L0","title":"Защита ванны: газ, обмазка, флюс","lead":"Воздух — враг ванны: его отсекают газом, обмазкой или флюсом","concept":"Жидкий металл при 1 500 °C жадно поглощает азот и кислород из воздуха, и при остывании они остаются в шве пузырьками — порами — и хрупкими окислами. Поэтому каждая технология несёт свою «крышу» над ванной. При TIG (РАД) ванну накрывает аргон чистотой 99,993 % с расходом через горелку (G) 8–12 л/мин; при механизированной сварке (МП) — CO₂ или смесь Ar + CO₂ (82/18) с расходом 12–18 л/мин при вылете проволоки 10–15 мм; при ручной дуговой (РД) защиту создаёт покрытие электрода, которое сгорает в газ и всплывает шлаком; при сварке под флюсом (АФ) дуга горит под слоем сыпучего флюса. Защита рвётся от трёх вещей: ветер больше 2–3 м/с сдувает газ, влажные электроды (УОНИ-13/55 нужно прокалить при 350–400 °C 1–2 ч) выделяют водород, а слишком большой расход 20–25 л/мин закручивает струю и подсасывает воздух. Ученик думает «больше газа — лучше защита» и «на ветру просто добавлю тока»: в обоих случаях результат — поры по всему шву.","points":[{"h":"Аргон над TIG: 8–12 л/мин и не больше","t":"Через сопло горелки идёт аргон 99,993 % с расходом 8–12 л/мин; струя ламинарная, как мягкий колпак над ванной. При 4 л/мин колпак не накрывает ванну целиком, и края шва темнеют от окислов. При 25 л/мин струя становится турбулентной, засасывает воздух снаружи — и защита хуже, чем при 10 л/мин, хотя баллон пустеет втрое быстрее. После обрыва дуги газ должен идти ещё несколько секунд: кратер и горячий вольфрам остывают под аргоном, иначе вольфрам окисляется, а в кратере поры."},{"h":"CO₂ и смесь при МП: 12–18 л/мин, вылет 10–15 мм","t":"Проволока Св-08Г2С d 1,2 мм горит в CO₂ или смеси Ar + CO₂ (82/18) с расходом 12–18 л/мин при токе 150–250 А и напряжении 20–28 В. Вылет проволоки 10–15 мм держит конец сопла близко к ванне; при вылете 25 мм сопло далеко, газ рассеивается, а проволока перегревается до дуги. Ветер больше 2–3 м/с сдувает защиту полностью: у открытых ворот цеха при 4 м/с шов выходит пористым даже при 18 л/мин — нужны ширма или укрытие, а не добавка тока."},{"h":"Обмазка и флюс: защита «из самого электрода»","t":"При РД покрытие электрода делает три вещи: сгорая, даёт защитный газ; образует шлак, который накрывает валик и замедляет остывание; легирует металл. Основное покрытие (УОНИ-13/55) гигроскопично: электроды из вскрытой пачки, пролежавшие неделю, набирают влагу, и водород даёт поры — поэтому прокалка 350–400 °C 1–2 ч и хранение в пенале. Рутиловые (МР-3, АНО) проще и терпимее к влаге, но для ответственных стыков берут основные. При сварке под флюсом (АФ) та же защита, только слоем сыпучего флюса над дугой."},{"h":"Как узнать, что защита сорвана","t":"Признаки читаются глазами: при TIG шов и околошовная зона серые или чёрные вместо серебристо-золотистых, вольфрам после сварки чёрный и оплавлен; при МП — цепочка пор по всей длине валика и сильное разбрызгивание; при РД — поры «гроздью» в начале шва, где ещё не прогрелся электрод, или по всей длине от влажной обмазки. Если ученик видит поры, первый вопрос не «какой ток?», а «что с защитой?»: расход, ветер, влага, вылет, сопло, забитое брызгами."},{"h":"На следующем грейде: поддув корня","t":"На трубах и нержавейке защита нужна и с обратной стороны стыка: корень поддувают аргоном или формир-газом 4–8 л/мин, пока над ним не нарастёт 2–3 прохода металла. Без поддува корень нержавейки покрывается «сахаром» — пористой окисной коркой, и такой стык не пройдёт контроль. Ученик пока варит пластины лицевой стороной, но привычка спрашивать «а что защищает обратную сторону?» закладывается именно сейчас."}],"practice":{"id":"u0-3-pr","mechanic":"keymoves","points":3,"stem":"Учебный пост TIG, пластина нержавейки 08Х18Н10Т 6 мм, баллон аргона с редуктором, рядом открытые ворота цеха — сквозняк. Собери защиту ванны перед первым швом.","options":[{"id":"k0","text":"Выставить по ротаметру 10 л/мин — внутри нормы 8–12 л/мин","correct":true,"why":"Ламинарный колпак накрывает ванну; 10 л/мин — середина нормы для горелки TIG."},{"id":"k1","text":"Закрыть ворота или поставить ширму: сквозняк сильнее 2–3 м/с сдувает аргон","correct":true,"why":"Ветер уносит газ быстрее, чем он успевает накрыть ванну; при 4 м/с поры гарантированы."},{"id":"k2","text":"Проверить, что на баллоне аргон 99,993 %, а не CO₂ с соседнего поста МП","correct":true,"why":"CO₂ при TIG окисляет вольфрам и ванну нержавейки; для РАД нужен чистый аргон."},{"id":"k3","text":"После обрыва дуги держать горелку над кратером, пока идёт газ","correct":true,"why":"Кратер и вольфрам остывают под аргоном; убрал сразу — чёрный вольфрам и поры в кратере."},{"id":"f0","text":"Поставить 25 л/мин: при сквозняке защиту лучше взять с запасом по расходу","correct":false,"why":"Турбулентная струя при 25 л/мин подсасывает воздух — защита хуже, чем при 10 л/мин."},{"id":"f1","text":"Добавить 20–30 А тока, чтобы ванна успела схватиться раньше, чем сквозняк её откроет","correct":false,"why":"Тепло не заменяет газ: горячая ванна поглощает азот ещё охотнее, поры крупнее."},{"id":"f2","text":"Взять баллон CO₂ с соседнего поста МП — газ тоже инертный, разницы для TIG нет","correct":false,"why":"CO₂ не инертный: он окисляет вольфрам и хром в нержавейке, шов чёрный, вольфрам горит."},{"id":"f3","text":"Снять сопло с горелки, чтобы лучше видеть ванну и вольфрам на первом шве","correct":false,"why":"Без сопла газ не формируется в струю; ванна открыта воздуху, шов серый с порами."}],"reference":"Защита TIG: аргон 99,993 %, 8–12 л/мин (больше — хуже), без сквозняка сильнее 2–3 м/с, сопло на месте, газ держать после обрыва дуги. Ток и «запас расхода» защиту не заменяют."},"test":[{"id":"u0-3-q1","mechanic":"single","points":2,"stem":"МП, проволока Св-08Г2С d 1,2 мм, смесь 82/18, расход 14 л/мин, ток 180 А. Пост у открытых ворот, ветер 4 м/с. Шов весь в порах. Главная причина?","options":[{"id":"o0","text":"Ветер 4 м/с сдувает защитный газ — нужна ширма или укрытие поста","correct":true,"rationale":"Порог 2–3 м/с превышен; струя 14 л/мин уносится, ванна глотает воздух — поры по всей длине."},{"id":"o1","text":"Расход 14 л/мин мал для смеси — поднять до 25 л/мин","correct":false,"rationale":"14 л/мин — в норме 12–18; 25 л/мин закрутит струю и подсосёт воздух, ветер при этом останется."},{"id":"o2","text":"Ток 180 А велик для d 1,2 мм — снизить до 120 А","correct":false,"rationale":"180 А — внутри диапазона 150–250 А; поры по всей длине — признак сорванной защиты, не тока."},{"id":"o3","text":"Проволока отсырела на катушке — заменить на новую","correct":false,"rationale":"Сплошная проволока не впитывает влагу как обмазка; поры «везде» при ветре 4 м/с — от ветра."}],"anchor":{"g":"formula","p":{"f":"ветер 4 м/с > 2–3 → газ сдут → поры","sub":"расход 14 и ток 180 в норме — виноват ветер"},"cap":"поры по всей длине — сначала вопрос про защиту, не про ток"}},{"id":"u0-3-q2","mechanic":"single","points":2,"stem":"Чем защищена ванна при ручной дуговой сварке электродом УОНИ-13/55, если никакого баллона у поста нет?","options":[{"id":"o0","text":"Покрытием электрода: оно сгорает в газ и всплывает шлаком над валиком","correct":true,"rationale":"Обмазка — встроенная защита: газ от сгорания покрытия плюс шлаковая корка, замедляющая остывание."},{"id":"o1","text":"Воздухом цеха: при 120 А дуга настолько горячая, что воздух выгорает","correct":false,"rationale":"Азот и кислород не выгорают — они растворяются в ванне и остаются порами и окислами."},{"id":"o2","text":"Самим стальным стержнем электрода: он плавится и накрывает ванну","correct":false,"rationale":"Стержень — присадочный металл; защиту даёт именно покрытие, голый стержень даёт пористый шов."},{"id":"o3","text":"Ничем: при ручной сварке защита не нужна, поры выгорают в шлаке","correct":false,"rationale":"Без защиты шов пористый и хрупкий; шлак лишь часть защиты, а не «сжигатель» пор."}]},{"id":"u0-3-q3","mechanic":"multi","points":3,"stem":"Что из перечисленного реально срывает защиту ванны и даёт поры?","options":[{"id":"o0","text":"Сквозняк 4 м/с у открытых ворот при МП с расходом 14 л/мин","correct":true,"rationale":"Ветер выше 2–3 м/с уносит газ быстрее, чем он накрывает ванну."},{"id":"o1","text":"Электроды УОНИ-13/55 из пачки, вскрытой неделю назад, без прокалки","correct":true,"rationale":"Основное покрытие набрало влагу; водород из неё — поры по всей длине шва."},{"id":"o2","
