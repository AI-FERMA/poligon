<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Щит · классический AppSec и безопасная разработка (v1.0)</title>
<style>
:root{
  --paper:#f3f5f0; --paper2:#eaede6; --card:#ffffff; --card2:#f7f8f4;
  --line:#d8ddd3; --line2:#bfc6ba;
  --ink:#141c26; --muted:#5b6774; --faint:#8a95a1;
  --a:#2a5bd7; --a-soft:rgba(42,91,215,.10); --a-line:rgba(42,91,215,.35);
  --b:#e8782a; --b-hot:#f59a4f; --b-deep:#c45f17; --b-soft:rgba(232,120,42,.12); --b-line:rgba(232,120,42,.4);
  --ok:#1b8f5c; --ok-soft:rgba(27,143,92,.12); --err:#c93b3b; --err-soft:rgba(201,59,59,.10);
  --gold:#b58a10; --gold-soft:rgba(181,138,16,.14);
  --grid:rgba(42,91,215,.07);
  --r:14px; --r-sm:10px; --shadow:0 2px 10px rgba(20,28,38,.06);
  --maxw:680px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --disp:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
html[data-theme="dark"]{
  --paper:#0f1620; --paper2:#141d29; --card:#182230; --card2:#1d2837;
  --line:#2a3647; --line2:#3b495c;
  --ink:#e8edf3; --muted:#9aa7b6; --faint:#6b7786;
  --a:#7ea3ff; --a-soft:rgba(126,163,255,.14); --a-line:rgba(126,163,255,.4);
  --b:#ff9a4d; --b-hot:#ffb36f; --b-deep:#d9701f; --b-soft:rgba(255,154,77,.14); --b-line:rgba(255,154,77,.45);
  --ok:#4fd48f; --ok-soft:rgba(79,212,143,.14); --err:#ff7676; --err-soft:rgba(255,118,118,.12);
  --gold:#f0c24a; --gold-soft:rgba(240,194,74,.14);
  --grid:rgba(126,163,255,.06);
  --shadow:0 4px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto} *{animation:none!important;transition:none!important}}
html{font-size:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.55 var(--font);min-height:100vh;min-height:100dvh;overflow-x:hidden}
html.has-sheet,html.has-sheet body{overflow:hidden}
body::before{content:"";position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;-webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.9),rgba(0,0,0,.35) 60%,transparent);mask-image:linear-gradient(180deg,rgba(0,0,0,.9),rgba(0,0,0,.35) 60%,transparent)}
#app{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto;padding:12px 16px calc(44px + env(safe-area-inset-bottom))}
#app,.sheet{transition:max-width .18s ease}
h1,h2,h3{line-height:1.22;margin:0;font-family:var(--disp);font-weight:600;letter-spacing:-.005em}
h2{font-size:calc(23px * var(--fs,1))} h3{font-size:calc(19px * var(--fs,1))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:.93em}
:focus-visible{outline:2px solid var(--a);outline-offset:2px;border-radius:6px}
a{color:var(--a)}
.small{font-size:calc(13.5px * var(--fs,1))} .muted{color:var(--muted)} .faint{color:var(--faint)}
.ok-c{color:var(--ok)} .err-c{color:var(--err)} .gold-c{color:var(--gold)} .a-c{color:var(--a)} .b-c{color:var(--b)}
.top{display:flex;align-items:center;gap:8px;padding:2px 0 10px}
.brand{font-family:var(--disp);font-size:calc(17px * var(--fs,1));letter-spacing:.01em;white-space:nowrap}
.brand i{font-style:normal;display:inline-block;padding:0 5px;border-radius:6px;margin-right:3px;font-family:var(--mono);font-size:calc(13px * var(--fs,1));font-weight:700}
.brand .ia{background:var(--a);color:#fff} .brand .ib{background:var(--b);color:#fff}
.top .sp{margin-left:auto;display:flex;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:calc(13px * var(--fs,1));font-weight:650;white-space:nowrap}
.chip.hot{color:var(--b-deep)} .chip.xp{color:var(--a)}
.ico{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);font-size:calc(16px * var(--fs,1));position:relative}
.ico.fs{font-size:calc(12px * var(--fs,1));font-weight:800;font-family:var(--mono)}
.ico .bdg{position:absolute;top:-6px;right:-6px;min-width:16px;height:16px;border-radius:8px;background:var(--b);color:#fff;font-size:calc(10px * var(--fs,1));font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:12px 0;box-shadow:var(--shadow)}
.card.tight{padding:12px 14px}
.card.note{background:var(--card2)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:calc(12px * var(--fs,1));font-weight:650;padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.pill.a{background:var(--a-soft);color:var(--a);border-color:var(--a-line)}
.pill.b{background:var(--b-soft);color:var(--b-deep);border-color:var(--b-line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.gold{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.pill.err{background:var(--err-soft);color:var(--err);border-color:transparent}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--b);color:#fff;font-weight:700;font-size:calc(14px * var(--fs,1));border-radius:10px;padding:9px 18px;box-shadow:0 2px 0 var(--b-deep);transition:transform .08s,box-shadow .08s;user-select:none;margin-left:auto;margin-right:auto}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--b-deep)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 2px 0 var(--line2);border:1px solid var(--line)}
.btn.blue{background:var(--a);box-shadow:0 3px 0 #1d3f99}
.btn.wide{width:auto;min-width:150px;max-width:240px;padding:9px 22px;background:rgba(255,255,255,0);color:var(--b);border:1.5px solid var(--b);box-shadow:none;opacity:.75;font-size:calc(14px * var(--fs,1));margin-left:auto;margin-right:auto;display:flex}
.btn.ghost.wide{color:var(--ink);border-color:var(--line2)}
.btn:disabled{opacity:.45;pointer-events:none}
.row .btn.wide{flex:0 1 auto;min-width:150px;max-width:220px}
.btn.next-btn,.btn.wide.next-btn{width:auto;min-width:150px;max-width:200px;padding:9px 22px;background:rgba(255,255,255,0);color:var(--b);border:1.5px solid var(--b);box-shadow:none;opacity:.75;font-size:calc(14px * var(--fs,1));margin-left:auto;margin-right:auto;display:flex}
.btn.next-btn:active{transform:translateY(1px);opacity:.6}
.btn.sm{padding:8px 14px;font-size:calc(14px * var(--fs,1));border-radius:10px}
.btn.xs{padding:5px 10px;font-size:calc(12.5px * var(--fs,1));border-radius:8px;box-shadow:none}
.ladder{position:relative;border:1px solid var(--line);background:linear-gradient(180deg,var(--card) 0%,var(--card2) 100%);border-radius:var(--r);padding:16px 16px 10px;margin:12px 0;box-shadow:var(--shadow);overflow:hidden}
.ladder h2{font-size:calc(21px * var(--fs,1));margin-bottom:2px}
.ladder .sub{color:var(--muted);font-size:calc(14px * var(--fs,1));margin-bottom:12px}
.rung{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px dashed var(--line);text-align:left;width:100%}
.rung:last-child{border-bottom:1px dashed var(--line)}
.rung .n{width:34px;height:34px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:calc(12px * var(--fs,1));font-weight:800;border:2px solid var(--line2);color:var(--muted);background:var(--card)}
.rung.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.rung.cur .n{background:var(--b);border-color:var(--b);color:#fff;box-shadow:0 0 0 4px var(--b-soft)}
.rung.lock{opacity:.5}
.rung .t{flex:1;min-width:0}
.rung .t b{display:block;font-size:calc(15px * var(--fs,1))}
.rung .t span{font-size:calc(12.5px * var(--fs,1));color:var(--muted)}
.rung .pc{font-family:var(--mono);font-size:calc(12.5px * var(--fs,1));color:var(--faint);min-width:44px;text-align:right}
.bar{height:7px;border-radius:99px;background:var(--paper2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));border-radius:99px}
.rowbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 13px;margin:8px 0;box-shadow:var(--shadow)}
.rowbtn:active{background:var(--card2)}
.rowbtn .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:calc(18px * var(--fs,1));background:var(--card2);border:1px solid var(--line);flex:0 0 auto}
.rowbtn .tt{flex:1;min-width:0}
.rowbtn .tt b{display:block;font-size:calc(15px * var(--fs,1))}
.rowbtn .tt span{font-size:calc(12.5px * var(--fs,1));color:var(--muted);display:block}
.rowbtn .tt b .sym{display:inline-block;width:auto;font-size:calc(11px * var(--fs,1));color:var(--a);margin-left:6px}
.rowbtn .st{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:calc(12px * var(--fs,1));color:var(--faint);font-family:var(--mono);white-space:nowrap}
.rowbtn.done{border-color:rgba(27,143,92,.35)}
.rowbtn.lock{opacity:.55}
.grp{margin:14px 0 4px;font-family:var(--disp);font-size:calc(17px * var(--fs,1));display:flex;align-items:baseline;gap:8px}
.grp .cnt{font-family:var(--mono);font-size:calc(12px * var(--fs,1));color:var(--faint)}
.playtop{display:flex;align-items:center;gap:10px;padding:8px 0 10px;position:sticky;top:0;z-index:20;background:var(--paper);margin:0 -2px;padding-left:2px;padding-right:2px}
.playtop .tools{display:flex;gap:6px;flex:0 0 auto;position:relative}
.playtop .x .bdg{position:absolute;top:-4px;right:-4px;background:var(--b);color:#fff;font-size:calc(10px * var(--fs,1));line-height:1;padding:2px 5px;border-radius:99px;font-weight:700}
.playtop .x{position:relative;cursor:pointer;width:36px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:calc(16px * var(--fs,1));flex:0 0 auto}
.segs{flex:1;display:flex;gap:4px}
.segs i{flex:1;height:6px;border-radius:99px;background:var(--paper2);border:1px solid var(--line)}
.segs i.on{background:var(--b);border-color:transparent}
.segs i.ok{background:var(--ok);border-color:transparent}
.segs i.bad{background:var(--err);border-color:transparent;opacity:.7}
.combo{font-family:var(--mono);font-size:calc(13px * var(--fs,1));font-weight:700;color:var(--b-deep);min-width:40px;text-align:right}
.theory h3{margin-bottom:8px}
.theory p{margin:0;white-space:pre-wrap;font-size:calc(16px * var(--fs,1));line-height:1.6}
.theory .fr{font-size:calc(12.5px * var(--fs,1));color:var(--a);font-weight:700;margin-bottom:6px}
.stem{font-size:calc(17px * var(--fs,1));font-weight:600;margin:0 0 8px;white-space:pre-wrap;line-height:1.5}
.mech{font-size:calc(12px * var(--fs,1));font-weight:700;color:var(--a);margin-bottom:8px}
.hint{font-size:calc(13px * var(--fs,1));color:var(--faint);margin:-2px 0 8px}
.opt{display:flex;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:12px 13px;margin:8px 0;font-size:calc(15px * var(--fs,1));line-height:1.45;transition:border-color .12s,background .12s;flex-wrap:wrap}
.opt:not(:disabled):hover{border-color:var(--line2)}
.opt .key{width:22px;height:22px;flex:0 0 auto;border-radius:7px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:calc(12px * var(--fs,1));font-weight:750;color:var(--muted);margin-top:1px;font-family:var(--mono)}
.opt>span:not(.key):not(.ord){flex:1;min-width:0}
.opt.sel{border-color:var(--a);background:var(--a-soft)}
.opt.sel .key{border-color:var(--a);color:var(--a)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .key{border-color:var(--ok);color:var(--ok)}
.opt.bad{border-color:var(--err);background:var(--err-soft)}
.opt.bad .key{border-color:var(--err);color:var(--err)}
.opt.miss{border-color:var(--gold);background:var(--gold-soft)}
.opt.dim{opacity:.6}
.opt .ord{margin-left:auto;font-weight:800;color:var(--b-deep);font-family:var(--mono);min-width:28px;text-align:right}
.why{font-size:calc(14px * var(--fs,1));line-height:1.5;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);display:block;width:100%;flex-basis:100%}
.fbk{border-radius:12px;padding:12px 14px;margin-top:12px;font-size:calc(15px * var(--fs,1))}
.fbk b{display:block;margin-bottom:2px}
.fbk.ok{background:var(--ok-soft);border:1px solid rgba(27,143,92,.35)}
.fbk.mid{background:var(--gold-soft);border:1px solid rgba(181,138,16,.35)}
.fbk.bad{background:var(--err-soft);border:1px solid rgba(201,59,59,.35)}
.sol{margin-top:10px;padding:10px 12px;border-left:3px solid var(--a);background:var(--card2);border-radius:8px;font-size:calc(14.5px * var(--fs,1));line-height:1.55;white-space:pre-wrap}
.numin{width:100%;border:1px solid var(--line2);background:var(--card2);border-radius:12px;padding:12px 14px;font-size:calc(20px * var(--fs,1));font-family:var(--mono)}
.pretag{display:inline-block;font-size:calc(12.5px * var(--fs,1));color:var(--b-deep);background:var(--b-soft);border-radius:8px;padding:4px 10px;margin-bottom:10px;font-weight:650}
.pretag.redo{color:var(--a);background:var(--a-soft)}
.tl{border-bottom:1px dotted var(--a);color:inherit;cursor:pointer}
.tl:hover{color:var(--a)}
.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.reveal{animation:rv .25s ease-out}
@keyframes rv{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.elab{margin-top:12px;padding:12px;border-radius:12px;background:var(--card2);border:1px dashed var(--line2)}
.elab b{display:block;margin-bottom:6px}
.conf{display:flex;gap:6px;align-items:center;margin:0 0 10px;font-size:calc(13px * var(--fs,1));flex-wrap:wrap}
.meters{display:flex;gap:8px;margin:8px 0 12px}
.meter{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.meter .l{font-size:calc(11.5px * var(--fs,1));color:var(--muted);display:flex;justify-content:space-between;gap:4px}
.meter .l span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter .bar{margin-top:5px}
.meter .bar i{background:var(--a)} .meter.m2 .bar i{background:var(--ok)} .meter.m3 .bar i{background:var(--b)}
.rank{font-family:var(--disp);font-size:calc(56px * var(--fs,1));line-height:1;color:var(--b);text-align:center;margin:8px 0}
.lab{border:1px solid var(--a-line);background:linear-gradient(180deg,var(--card),var(--card2));border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.lab h3{margin-bottom:4px}
.fld{margin:10px 0}
.fld label{display:block;font-size:calc(12.5px * var(--fs,1));color:var(--muted);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:10px 12px;font-size:calc(16px * var(--fs,1))}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.res{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
.res .big{font-family:var(--mono);font-size:calc(26px * var(--fs,1));font-weight:700;line-height:1.2;word-break:break-word}
.res .k{font-size:calc(12.5px * var(--fs,1));color:var(--muted)}
.ab2{display:flex;gap:10px;margin-top:8px}
.ab2>div{flex:1;border-radius:10px;padding:10px;border:1px solid var(--line);min-width:0}
.ab2 .va{border-color:var(--a-line);background:var(--a-soft)} .ab2 .vb{border-color:var(--b-line);background:var(--b-soft)}
.ab2 b{font-family:var(--mono);font-size:calc(20px * var(--fs,1));display:block}
.ab2 .k{font-size:calc(12px * var(--fs,1));color:var(--muted);display:block}
svg.chart{width:100%;height:auto;display:block;margin-top:8px}
.kbd{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kbd button{height:44px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:calc(18px * var(--fs,1));font-family:var(--mono)}
.kbd button.op{background:var(--a-soft);color:var(--a)}
.kbd button.eq{background:var(--b);color:#fff;grid-column:span 2;font-weight:700}
.kbd button.fn{background:var(--gold-soft);color:var(--gold)}
.ovl{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(14,22,32,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fd .18s ease-out;-webkit-tap-highlight-color:transparent}
@keyframes fd{from{opacity:0}to{opacity:1}}
.sheet{position:relative;display:flex;flex-direction:column;background:var(--card);color:var(--ink);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;width:100%;max-width:var(--maxw);max-height:88vh;max-height:88dvh;overflow:hidden;box-shadow:0 -8px 30px rgba(20,28,38,.18);-webkit-transform:translateZ(0);transform:translateZ(0)}
.sheet-h{display:flex;align-items:center;gap:10px;padding:12px 14px 10px 18px;border-bottom:1px solid var(--line);background:var(--card);flex:0 0 auto}
.sheet-h::before{content:"";position:absolute;top:6px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:99px;background:var(--line2)}
.sheet-tt{flex:1;min-width:0;padding-top:6px}
.sheet-t{font-family:var(--disp);font-size:calc(19px * var(--fs,1));font-weight:600;line-height:1.25}
.sheet-x{flex:0 0 auto;width:36px;height:36px;border-radius:12px;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:calc(16px * var(--fs,1));margin-top:4px}
.sheet-b{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 18px 16px;background:var(--card);overscroll-behavior:contain}
.sheet-f{flex:0 0 auto;padding:10px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
.sheet.confirm{border-radius:20px;border-bottom:1px solid var(--line);margin:0 12px calc(12px + env(safe-area-inset-bottom));max-width:480px}
.sheet.confirm .sheet-b{padding:18px}
@media (min-width:700px){.ovl{align-items:center;padding:24px}.sheet{border-radius:20px;border-bottom:1px solid var(--line);max-height:80vh;max-height:80dvh;box-shadow:var(--shadow)}.sheet-h::before{display:none}.sheet-tt{padding-top:0}.sheet-x{margin-top:0}}
.sheet h3{margin-bottom:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:60;background:var(--card);border:1px solid var(--gold);border-radius:14px;padding:11px 16px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;max-width:92vw}
.xpf{position:fixed;z-index:70;font-family:var(--mono);font-weight:800;color:var(--b-deep);pointer-events:none;animation:xf .9s ease-out forwards}

.nb-in{width:100%;border:1px solid var(--line2);background:var(--card2);border-radius:10px;padding:10px 12px;font-size:calc(15px * var(--fs,1))}
.cheat p{margin:4px 0;font-size:calc(14.5px * var(--fs,1))}
.tabs{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}

.spark{display:flex;gap:3px;align-items:flex-end;height:46px}

/* ---- визуальные якоря и графические задачи ---- */

.vwhy-row.ok{background:var(--ok-soft);color:var(--ink)} .vwhy-row.ok .key{border-color:var(--ok);color:var(--ok)}

@media (max-width:360px){.vgrid{grid-template-columns:1fr}}

.nb-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:calc(14px * var(--fs,1))}

.tt .sym,.rowbtn .sym{display:inline-block;width:auto;margin:0 0 0 6px}

/* слои «Сути» */
.ltabs{display:flex;gap:6px;margin:10px 0 12px;flex-wrap:wrap}
.ltab{display:inline-flex;align-items:center;gap:4px;font-size:calc(12.5px * var(--fs,1));font-weight:650;padding:6px 10px;border-radius:999px;background:var(--card2);color:var(--muted);border:1px solid var(--line)}

.ltab.done{color:var(--ok)} .ltab.done.on{background:var(--ok-soft);border-color:transparent}
.ltab.lkd{opacity:.55} .ltab.optl span::after{content:" · по желанию";font-weight:500;font-size:calc(11px * var(--fs,1))}
.lbody p{margin:0 0 10px;white-space:normal;font-size:calc(16px * var(--fs,1));line-height:1.6} .lbody p:last-child{margin-bottom:0}

.theory p{white-space:normal;margin:0 0 10px} .theory p:last-of-type{margin-bottom:0}
ol.steps{margin:0 0 10px;padding-left:22px;font-size:calc(16px * var(--fs,1));line-height:1.6} ol.steps li{margin:4px 0}
.formula{font-family:var(--mono);font-size:calc(15.5px * var(--fs,1));font-weight:700;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px;text-align:left;white-space:pre;overflow-x:auto;-webkit-overflow-scrolling:touch;line-height:1.7}
.legend{width:100%;border-collapse:collapse;font-size:calc(14px * var(--fs,1))} .legend th{text-align:left;font-size:calc(11.5px * var(--fs,1));color:var(--muted);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--line)} .legend td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top} .legend tr:last-child td{border-bottom:0} .legend td:first-child{white-space:nowrap} .legend td:last-child{min-width:90px}
.lcheck{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line2)}
.lcheck .stem{font-size:calc(15.5px * var(--fs,1));margin:4px 0 8px}
.rule{margin:10px 0 0;padding:10px 12px;border-left:3px solid var(--b);background:var(--b-soft);border-radius:0 10px 10px 0;font-size:calc(15px * var(--fs,1))}
.plain{font-size:calc(15.5px * var(--fs,1));line-height:1.55;padding:10px 12px;background:var(--ok-soft);border-left:3px solid var(--ok);border-radius:0 10px 10px 0;margin:8px 0}
.remember{font-family:var(--disp);font-style:italic;font-size:calc(15px * var(--fs,1));color:var(--ink);padding:8px 12px;margin:8px 0 0;border-top:1px dashed var(--line2)}
.remember::before{content:'Запомни: ';font-style:normal;font-weight:700;color:var(--b-deep);font-family:var(--font);font-size:calc(12.5px * var(--fs,1))}
/* дневник по дням */
.todaycard{width:100%;text-align:left;display:block;cursor:pointer}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.tile{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}

.tile span{display:block;font-size:calc(11px * var(--fs,1));color:var(--muted);margin-top:3px;line-height:1.2}

@media (max-width:420px){.tiles{grid-template-columns:repeat(2,1fr)}}
.cal{margin-top:14px}
.cal-wd{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.cal-wd span{font-size:calc(11px * var(--fs,1));color:var(--faint);text-align:center;font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-d.l1{background:var(--a-soft);color:var(--a)} .cal-d.l2{background:rgba(42,91,215,.28);color:var(--ink);border-color:transparent}
.cal-d.l3{background:rgba(42,91,215,.55);color:#fff;border-color:transparent} .cal-d.l4{background:var(--a);color:#fff;border-color:transparent;font-weight:700}
html[data-theme="dark"] .cal-d.l2{background:rgba(126,163,255,.3)} html[data-theme="dark"] .cal-d.l3{background:rgba(126,163,255,.6);color:#0f1620}
.cal-leg{display:flex;align-items:center;gap:4px;margin-top:8px;font-size:calc(11px * var(--fs,1));color:var(--faint);justify-content:flex-end}
.cal-leg i{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid var(--line);background:var(--card2)}
.cal-leg i.l1{background:var(--a-soft)} .cal-leg i.l2{background:rgba(42,91,215,.28)} .cal-leg i.l3{background:rgba(42,91,215,.55)} .cal-leg i.l4{background:var(--a)}
.dayhead{display:flex;align-items:center;gap:12px}
.dayhead h3{margin:0;font-size:calc(20px * var(--fs,1))}
.daymood{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:calc(26px * var(--fs,1));background:var(--card2);border:1px solid var(--line);flex:0 0 auto}
.daymood.gold{background:var(--gold-soft);border-color:var(--gold)} .daymood.b{background:var(--b-soft);border-color:var(--b-line)} .daymood.a{background:var(--a-soft);border-color:var(--a-line)} .daymood.ok{background:var(--ok-soft);border-color:transparent}
.achs{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.ach{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--card2);border:1px solid var(--line);border-radius:12px}
.ach .ic{font-size:calc(20px * var(--fs,1));flex:0 0 auto;line-height:1.2}
.ach b{font-size:calc(14.5px * var(--fs,1))}
.mlegend{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line2);display:flex;flex-direction:column;gap:4px;font-size:calc(12.5px * var(--fs,1))}
.mlegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.mlegend i.m1{background:var(--a)} .mlegend i.m2{background:var(--ok)} .mlegend i.m3{background:var(--b)}
.mlegend .faint{margin-top:4px}
.tline{margin-top:8px;font-variant-numeric:tabular-nums}
.tbars{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.tbar{display:grid;grid-template-columns:90px 1fr 44px;align-items:center;gap:6px;font-size:calc(12px * var(--fs,1));color:var(--muted)}
.tbar i{display:block;height:8px;border-radius:4px;background:var(--a);min-width:3px}
.tbar em{font-style:normal;font-family:var(--mono);text-align:right;color:var(--ink)}
.ach > div{flex:1;min-width:0}
.resume{border-color:var(--b-line);background:var(--b-soft)}
.resume .ell{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* дневник и лестницы */
.journal{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-top:10px}
.journal textarea{margin-top:8px;resize:vertical;min-height:64px;font-size:calc(15px * var(--fs,1));line-height:1.45;background:var(--card)}
.stairs{margin:8px 0 12px;padding:12px;border:1px solid var(--b-line);border-radius:12px;background:var(--b-soft)}
.st-steps{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:8px}
.st-steps .st{height:34px;border-radius:7px;border:1px solid var(--b-line);background:var(--card);font-family:var(--mono);font-size:calc(11px * var(--fs,1));color:var(--muted);transition:transform .08s}
.st-steps .st.on{background:var(--b);color:#fff;border-color:transparent;font-weight:700}
.st-steps .st:active{transform:scale(.92)}
.tiles .tile.st b{color:var(--b-deep)}
.stchart .stbars{display:flex;gap:4px;align-items:flex-end;height:74px;margin-top:8px}
.stchart .stb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.stchart .stb i{display:block;width:100%;max-width:26px;background:var(--b);border-radius:4px 4px 0 0;opacity:.85}
.stchart .stb i.none{background:var(--line2)} .stchart .stb i.max{background:var(--gold)}
.stchart .stb.t i{opacity:1;box-shadow:0 0 0 2px var(--b-soft)}
.stchart .stb span{font-size:calc(9px * var(--fs,1));color:var(--faint);margin-top:3px;line-height:1}
@media (min-width:700px){.tiles{grid-template-columns:repeat(5,1fr)}}

/* фото дня */
.photo{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.ph-view{display:flex;gap:12px;align-items:center;margin-top:8px;flex-wrap:wrap}
.ph-view img{width:120px;height:120px;border-radius:12px;object-fit:cover;box-shadow:0 2px 8px rgba(20,28,38,.15)}
.ph-acts{display:flex;flex-direction:column;gap:6px}

/* момент дня: фото + голос + слова */
.moment{margin:12px 0 10px;padding:12px;border-radius:16px;background:linear-gradient(135deg,var(--a-soft),var(--b-soft));border:1px solid var(--line)}
.moment-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 10px}

.moment-g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.moment-g{grid-template-columns:1fr}}
.voice{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.vplayer{display:flex;align-items:center;gap:10px;margin-top:10px}
.vplay,.vstop{width:42px;height:42px;border-radius:50%;border:none;background:var(--a);color:#fff;font-size:calc(15px * var(--fs,1));flex:0 0 auto;box-shadow:0 2px 8px rgba(42,91,215,.3);transition:transform .1s}
.vplay:active,.vstop:active{transform:scale(.92)}
.vstop{background:var(--err);box-shadow:0 2px 8px rgba(201,59,59,.3)}
.vtrack{position:relative;flex:1;height:32px;display:flex;align-items:center;overflow:hidden;border-radius:8px}
.vbars{display:flex;align-items:center;gap:3px;width:100%;height:100%}
.vbars i{flex:1;background:var(--line2);border-radius:2px;display:block}
.vplayer.on .vbars i{background:var(--a-line)}
.vprog{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--a-soft);border-right:2px solid var(--a);transition:width .2s linear;pointer-events:none}
.vtime{font-size:calc(12px * var(--fs,1));color:var(--muted);min-width:34px;text-align:right}
.vrec{display:flex;align-items:center;gap:10px;margin-top:10px;padding:8px 10px;border-radius:12px;background:var(--err-soft);border:1px solid rgba(201,59,59,.25)}
.vdot{width:10px;height:10px;border-radius:50%;background:var(--err);flex:0 0 auto;animation:vpulse 1s ease-in-out infinite}
@keyframes vpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
.vlevel{flex:1;display:flex;align-items:center;gap:3px;height:32px}

/* график: лестницы + минуты */
.ch-row{position:relative;margin-top:12px}
.ch-lab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.ch-t{font-weight:700;font-size:calc(13px * var(--fs,1))}
.stchart .stbars{height:62px;align-items:flex-end;border-bottom:1px solid var(--line)}
.stchart .stbars.mins i{background:var(--a)} .stchart .stbars.mins i.max{background:var(--gold)} .stchart .stbars.mins i.none{background:var(--line2)}
.stchart .stbars.mins .stb.t i{box-shadow:0 0 0 2px var(--a-soft)}
.stchart .stb .ch-v{font-size:calc(8px * var(--fs,1));color:var(--muted);margin:0 0 2px;line-height:1;order:-1;font-family:var(--mono)}
.stchart .stbars.lbls{height:auto;border:none;margin-top:4px}
.stchart .stbars.lbls span{font-size:calc(9px * var(--fs,1));color:var(--faint)}
.stchart .stbars.lbls .stb.t span{color:var(--b-deep);font-weight:700}
.ch-axis{display:flex;justify-content:space-between;font-size:calc(8px * var(--fs,1));color:var(--faint);font-family:var(--mono);margin-top:2px}
.ch-lab .ch-t{white-space:nowrap;margin-right:8px}.ch-lab .small{text-align:right}

/* календарь: фото + дата, минуты учёбы, лестницы */
.cal-d{position:relative;overflow:hidden;aspect-ratio:1/1.12;min-height:50px;border-radius:10px;border:1px solid var(--line);background:var(--card2);display:block;padding:0;font-family:var(--mono);color:var(--muted);transition:transform .12s ease;text-align:left}
.cal-d .n{position:absolute;left:4px;top:3px;font-size:calc(9.5px * var(--fs,1));font-weight:600;line-height:1;color:var(--faint);z-index:1}
.cal-d .tr{position:absolute;right:3px;top:3px;display:flex;align-items:center;gap:2px;z-index:1;line-height:1}
.cal-d .m{font-size:calc(8px * var(--fs,1));color:var(--faint);font-family:var(--font);font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.cal-d .mn{position:absolute;left:4px;bottom:4px;font-size:calc(15px * var(--fs,1));font-weight:800;color:var(--a);line-height:1;z-index:1;letter-spacing:-.02em}
.cal-d .sd{position:absolute;right:4px;bottom:4px;font-size:calc(15px * var(--fs,1));font-weight:800;color:var(--b-deep);line-height:1;z-index:1;letter-spacing:-.02em}
.cal-d.jr .tr::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--gold);display:block}
.cal-d.hasvc .tr::before{content:"🎤";font-size:calc(9px * var(--fs,1));line-height:1;display:block;font-family:var(--font)}
.cal-d.l2 .n,.cal-d.l3 .n,.cal-d.l4 .n{color:rgba(255,255,255,.8)} .cal-d.l3 .mn,.cal-d.l4 .mn{color:#eaf0ff} .cal-d.l3 .sd,.cal-d.l4 .sd{color:#ffe0c2} .cal-d.l3 .m,.cal-d.l4 .m{color:rgba(255,255,255,.75)}
.cal-d.today{box-shadow:inset 0 0 0 2px var(--b)}
.cal-d.sel{transform:scale(1.08);box-shadow:0 0 0 2px var(--b),0 4px 12px rgba(20,28,38,.15);z-index:2}
.cal-d.fut{opacity:.35}
.cal-d .ph{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.cal-d.hasph::after{content:"";position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(to top,rgba(10,16,24,.72),rgba(10,16,24,0));pointer-events:none}
.cal-d.hasph .n{background:rgba(20,28,38,.5);color:#fff;border-radius:999px;padding:2px 4px;left:3px;top:3px;backdrop-filter:blur(2px)}
.cal-d.hasph .m{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.cal-d.hasph .mn{color:#cfe0ff;text-shadow:0 1px 2px rgba(0,0,0,.7);z-index:2} .cal-d.hasph .sd{color:#ffd2a8;text-shadow:0 1px 2px rgba(0,0,0,.7);z-index:2}
.cal-d.hasph.jr .tr::after{box-shadow:0 0 0 1.5px rgba(0,0,0,.35)}
.cal-d.hasph.l1,.cal-d.hasph.l2,.cal-d.hasph.l3,.cal-d.hasph.l4{border-color:var(--a)}
.cal-leg.cal-lg{margin-top:4px;gap:10px;flex-wrap:wrap} .cal-lg span{display:inline-flex;align-items:center;gap:3px;white-space:nowrap} .cal-lg i.dot{width:5px;height:5px;border-radius:50%;background:var(--gold);border:none}
@media (max-width:420px){.cal-d .n{font-size:calc(8.5px * var(--fs,1))} .cal-d .mn,.cal-d .sd{font-size:calc(11.5px * var(--fs,1));letter-spacing:-.04em} .cal-d .mn{left:3px} .cal-d .sd{right:3px}}

хема фичи: где проходят границы доверия, что за входные точки у приложения и как обычный текст пользователя превращается в чужой код, чужой заказ или чужие данные. После уровня ты смотришь на любой веб-продукт глазами атакующего: не «где защита», а «куда можно послать то, чего код не ждёт»."},{"id":"L1","rank":"Junior","title":"Первая находка в вебе","sub":"XSS и экранирование · SQL и командные инъекции · CSRF · Same-Origin Policy и заголовки · десериализация · отчёт о находке","intro":"Первая рабочая задача под присмотром: найти и описать находку в веб-приложении. Ты учишься видеть контексты вывода (где данные становятся кодом), понимать, почему фильтр слов не защита, чем CSRF отличается от XSS и что делают заголовки защиты. Финал уровня — отчёт о находке, который разработчик чинит за день: класс, шаги, минимальный PoC, место, предложение фикса."},{"id":"L2","rank":"Middle","title":"Вход в систему: от пароля до права","sub":"Пароли и их хранение · сессии и токены · OAuth2/OIDC · авторизация и IDOR · MFA и восстановление","intro":"Уровень, на котором ты отвечаешь за вход в систему целиком: как хранится пароль (медленный хэш с солью), как сервер узнаёт тебя (сессия, флаги куки, отзыв), как работает делегированный вход (OAuth2/OIDC с его граблями) и — самое важное — кто что может: права на объект, deny by default, поиск IDOR и матрица авторизации с автотестом «чужой объект». Восстановление доступа разбирается как равноправный путь атаки: слабейший канал определяет силу."},{"id":"L3","rank":"Senior","title":"Проверки и процесс","sub":"Threat modeling по STRIDE · SAST/DAST/SCA и триаж · CI/CD и секреты · управление уязвимостями с SLA","intro":"Уровень, на котором ты перестаёшь искать руками и начинаешь строить систему проверок. Модель угроз фичи: диаграмма, шесть классов STRIDE на каждой стрелке, контроли или осознанное принятие. Сканеры: что они видят и чего не видят, как строится триаж и пороги гейтов по цене ошибок. Пайплайн: секреты из vault, сторонние actions по SHA, права по стадиям. Управление уязвимостями: от находки до закрытия с SLA, эскалацией и метрикой доли в дедлайне."},{"id":"L4","rank":"Lead","title":"Конфигурация и целостность","sub":"Криптографические провалы · misconfiguration как код · цепочка поставок: pinning, SBOM, provenance","intro":"Уровень, на котором ты отвечаешь за платформу: криптографические контроли (режимы AEAD, ключи в KMS, ротация, сертификаты), конфигурацию как код (baseline с автопроверкой в PR и живой среде, исключения с владельцами) и целостность цепочки поставок (зависимости по digest, SBOM на каждый релиз, проверка новых пакетов, provenance сборки). Здесь же — порядок закрытия по активной утечке и миграции с планом, а не «отключили и разберёмся»."},{"id":"L5","rank":"Директор","title":"Инцидент и программа","sub":"Логи, алерты, наблюдение · fail secure · bounty и метрики · комплаенс · принятие остаточного риска","intro":"Уровень, на котором ты говоришь с советом директоров. Наблюдение: централизованные логи, алерты на аномалии, MTTD и MTTR с целями — потому что инцидент без алертов приходит звонком от партнёра. Поведение при сбоях: fail secure как правило по умолчанию для каждого контроля. Программа: bounty поэтапно, метрики результата вместо активности, комплаенс по контурам данных. И главное решение — принятие остаточного риска: альтернативы в рублях, кто подписал, индикаторы пересмотра и жёсткая дата."}],"UNITS":[{"id":"u0-1","level":"L0","title":"Уязвимость, эксплойт, риск, контроль","lead":"Четыре слова, из которых состоит весь язык безопасности","concept":"Уязвимость — это дефект в коде или настройке, которым можно воспользоваться. Эксплойт — код или сценарий, который этим пользуется. Риск — что случится, если воспользуются: чьи данные и какой ущерб. Контроль — конкретное изменение, которое закрывает дефект или снижает ущерб. У этих слов есть публичные номера: CWE — классификатор дефектов, CVE — номер конкретной находки, CVSS — шкала серьёзности.","points":[{"h":"Уязвимость — свойство системы","t":"Дефект живёт в коде, конфигурации или процессе, а не «в интернете». Нельзя закрыть уязвимость словами «мы следим за ситуацией» — нужен контроль."},{"h":"Эксплойт — не уязвимость","t":"Эксплойт — способ воспользоваться дефектом. Уязвимость может жить годами без эксплойта, но это не делает её безопасной."},{"h":"Риск = дефект × ценность активов","t":"Одна и та же ошибка в форме отзывов и в модуле оплаты — риски несопоставимы. Серьёзность назначают по активам и последствиям, а не по «как страшно звучит»."},{"h":"Контроль — то, что можно проверить","t":"«Стало безопаснее» — не контроль. Контроль формулируется как проверяемое требование: подготовленные выражения в SQL, заголовок CSP, требование MFA."}],"practice":{"id":"u0-1-pr","mechanic":"keymoves","points":3,"stem":"Команда отрапортовала: «Мы повысили безопасность продукта». Что стоит выписать, чтобы понять, что на самом деле произошло?","options":[{"id":"k0","text":"Какие дефекты нашли: CWE-класс, где в коде или конфигурации","correct":true,"why":"Без типа дефекта и места «повысили безопасность» — не заявление, а настроение."},{"id":"k1","text":"Какой эксплойт или сценарий существует: как именно дефект используют","correct":true,"why":"Эксплойт показывает реальный путь ущерба, а не теоретический."},{"id":"k2","text":"Чьи данные и какие процессы затронуты: активы и последствия","correct":true,"why":"Риск считается по активам: те же строки кода рядом с оплатой и рядом с отзывами — разный риск."},{"id":"k3","text":"Какие контроли ввели и как это проверяется","correct":true,"why":"Контроль без проверки — обещание. Проверка: тест, правило в CI, ревью."},{"id":"k4","text":"Назвать встречу «безопасность-спринтом» и указать дату в отчёте","correct":false,"why":"Процедурные renaming ничего не меняют ни в коде, ни в риске."},{"id":"k5","text":"Посчитать, сколько человек обучали на воркшопе по ИБ","correct":false,"why":"Обучение — слабый контроль: оно не проверяется автоматически и не закрывает конкретный дефект."},{"id":"k6","text":"Запросить у вендора сканера «передовую защиту на базе ИИ»","correct":false,"why":"Инструмент — не контроль. Он помогает искать дефекты, но сам по себе ничего не закрывает."}],"reference":"Формат разбора: дефект (CWE, место) → сценарий (эксплойт) → активы (последствия) → контроль (проверяемый). Это скелет любого отчёта о безопасности."},"test":[{"id":"u0-1-q1","mechanic":"single","points":2,"stem":"Что из этого — уязвимость, а не контроль?","options":[{"id":"o0","text":"Пароль хранится в открытом виде в базе","correct":true,"rationale":"Дефект хранения — конкретная слабость, которой можно воспользоваться."},{"id":"o1","text":"Пароли хэшируются Argon2id с индивидуальной солью","correct":false,"rationale":"Это контроль: проверяемое требование к хранению."},{"id":"o2","text":"Раз в квартал команда проходит обучение по ИБ","correct":false,"rationale":"Процедура и слабый контроль, но не дефект."}]},{"id":"u0-1-q2","mechanic":"single","points":2,"stem":"Код приложения содержит дефект, эксплойта нет ни в одной базе, атаки никто не видел. Что верно?","options":[{"id":"o0","text":"Дефект — риск до появления эксплойта: эксплойт лишь делает путь ущерба удобным","correct":true,"rationale":"Сценарий атаки пишется вручную и без готового эксплойта; наличие CVE-номера — не условие риска."},{"id":"o1","text":"Риск равен нулю: без публичного эксплойта никто не воспользуется","correct":false,"rationale":"Атакующие находят дефекты самостоятельно; тишина в базах не доказывает недоступность."},{"id":"o2","text":"Дефект можно не чинить, пока не выйдет эксплойт","correct":false,"rationale":"Политика «чинить по эксплойту» гарантирует, что починка начнётся после инцидента."}]},{"id":"u0-1-q3","mechanic":"sjt_bw","points":3,"stem":"Тестировщик нашёл, что параметр id в URL показывает чужой заказ: /order?id=1023. Какой ход лучший?","options":[{"id":"o0","text":"Оформить находку: тип (CWE-639, доступ к чужому объекту), шаги повторения, PoC на своём тестовом аккаунте","correct":true,"rationale":"Рабочий процесс: классифицировать, воспроизвести безопасно, передать в починку."},{"id":"o1","text":"Написать в общий чат «у нас большая дыра, доступ к чужим заказам»","correct":false,"rationale":"Без шагов и типа дефекта это жалоба; плюс лишний повод для слухов."},{"id":"o2","text":"Выгрузить заказы сотни чужих пользователей, чтобы доказать масштаб","correct":false,"rationale":"Разрушительный PoC с чужими данными — сам инцидент; масштаб доказывают метрикой на тестовых данных."},{"id":"o3","text":"Закрыть доступ к эндпойнту целиком, пока не починим","correct":false,"rationale":"Худшее действие: продукт ломается для всех, а дефект в других эндпойнтах того же типа остаётся."}],"worst":"o3","worstRationale":"Блокировка эндпойнта без разбора — реакция ударом по продукту: заказы у всех падают, а класс дефекта не проверен в других местах."},{"id":"u0-1-q4","mechanic":"single","points":2,"stem":"Что делает номер CVE?","options":[{"id":"o0","text":"Даёт находке публичный идентификатор, по которому ищут патчи и обсуждения","correct":true,"rationale":"CVE — каталожный номер: по нему строятся базы, сканеры и релиз-ноты."},{"id":"o1","text":"Оценивает серьёзность дефекта в числах","correct":false,"rationale":"Серьёзность — это CVSS; CVE только идентифицирует."},{"id":"o2","text":"Классифицирует дефект по типу ошибки в коде","correct":false,"rationale":"Классификация типов — CWE."}]}],"framework":"Четыре вопроса к любой находке: какой дефект, какой сценарий, чьи активы, какой проверяемый контроль.","anchor":{"g":"formula","p":{"f":"риск = дефект × активы; дефект → CWE, находка → CVE, серьёзность → CVSS","sub":"язык, на котором говорят отчёты","fs":12},"cap":"у слов есть номера: CWE, CVE, CVSS"},"layers":{"simple":"Представь дом. Сломанный замок — уязвимость. Отмычка — эксплойт. Ценности в доме — активы, из-за них взлом — риск. Новый замок и видеоглазок — контроль.","how":"1. Аудит или тест находит дефект и относит его к классу CWE. 2. Находке, если она признана публичной, дают номер CVE. 3. По шкале CVSS и по твоим активам назначают серьёзность. 4. Контроль закрывает дефект или срезает последствия, и это проверяется тестом или ревью.","formula":{"f":"риск = P(атаки) · ущерб(активы)\nконтроль ↓ P или ↓ ущерб","legend":[["P(атаки)","насколько легко этим воспользоваться"],["ущерб","потеря данных, денег, доверия, простоя"],["контроль","проверяемое изменение кода/конфигурации/процесса"]],"note":"Риск никогда не равен нулю: контроль снижает вероятность или ущерб, а остаточный риск фиксируют и принимают осознанно."},"pitfalls":"Опытные разработчики путают «найдено» и «опасно»: сканер напечатал 400 строк — значит, катастрофа. На деле у каждой находки свой вес: где-то сканер врёт, где-то дефект недоступен снаружи. Вторая ошибка — контроль формулируют действием («проверим логи»), а не требованием («логи собираются централизованно, ретеншен 90 дней, алерт на N событий»).","checks":[{"q":"Что означает CWE?","o":["Классификатор типов дефектов","Номер конкретной находки","Шкала серьёзности"],"a":0,"w":"CWE — каталог типов; CVE — номер находки; CVSS — шкала."},{"q":"Контроль считается введённым, когда...","o":["Есть проверяемое требование и его выполняет код или конфигурация","Команда пообещала на планёрке","Сканер перестал ругаться"],"a":0,"w":"Контроль — это факт в коде/конфигурации плюс способ его проверить."},{"q":"Риск одной и той же ошибки в форме отзывов и в оплате...","o":["Разный: он зависит от активов, до которых дефект позволяет добраться","Одинаковый: уязвимость есть уязвимость","Одинаковый, если ошибка одного типа CWE"],"a":0,"w":"Путь до активов определяет ущерб: отзывы не эквивалентны деньгам."},{"q":"Сканер напечатал 400 строк. Что это значит?","o":["400 дефектов — катастрофа, чинить всё сразу","400 находок: у каждой свой вес — доступность, эксплуатируемость, цена риска","Сканер сломан: столько дефектов не бывает"],"a":1,"w":"«Найдено» ≠ «опасно»: триаж определяет вес каждой находки."}],"rules":["Уязвимость — дефект; эксплойт — способ им воспользоваться; риск — цена по активам; контроль — проверяемое изменение.","CWE — тип, CVE — номер, CVSS — шкала серьёзности.","«Повысили безопасность» переводится в язык дефектов и контролей, иначе не обсуждается.","Серьёзность назначается по активам и последствиям, а не по громкости слова.","Остаточный риск фиксируют и принимают осознанно — и это тоже запись, а не молчание."]}},{"id":"u0-2","level":"L0","title":"OWASP Top 10 2025: карта рисков","lead":"Не учебник и не чек-лист — способ разложить риски по классам","concept":"OWASP Top 10 — консенсусный список самых критичных классов рисков веб-приложений, обновляется по данным и опросу практиков. В версии 2025: Broken Access Control (A01) — доступ к чужому; Security Misconfiguration (A02); Software Supply Chain Failures (A03); Cryptographic Failures (A04); Injection (A05); Insecure Design (A06); Authentication Failures (A07); Software or Data Integrity Failures (A08); Security Logging & Alerting Failures (A09); и новый класс — Mishandling of Exceptional Conditions (A10): необработанные ошибки и «отказ наружу».","points":[{"h":"Top 10 — карта, не протокол","t":"Список отвечает «что чаще всего реально ломают», а не «как задеплоить». Протоколы и требования живут в ASVS."},{"h":"2025 изменил список","t":"SSRF слился в A01 (доступ к чужому), supply chain вырос в самостоятельный A03, появился A10 про ошибки и отказы. Тренироваться по 2021-списку — учить прошлую карту."},{"h":"Категория ≠ баг-тип","t":"В категории десятки CWE: A01 содержит 40. Один и тот же продукт может попадать в категорию сотней маленьких дыр."},{"h":"Почему access control № 1","t":"Данные показывают, что чаще всего ломают именно проверку прав: «мой заказ», «мой профиль» — и забытое «чужой». Криптография и инъекции реже по числу приложений, но дороже по ущербу."}],"practice":{"id":"u0-2-pr","mechanic":"matching","points":3,"stem":"Сопоставь случай с категорией Top 10:2025.","pairs":[{"l":"Пользователь меняет 12 на 13 в URL и видит чужой профиль","r":"A01 · Broken Access Control: проверка прав отсутствует на объекте"},{"l":"В проде включён DEBUG, эндпойнт /actuator открыт без пароля","r":"A02 · Security Misconfiguration: небезопасная настройка"},{"l":"Сборка подтянула версию библиотеки из форка неизвестного автора","r":"A03 · Software Supply Chain Failures: недоверенный источник зависимости"},{"l":"Ошибка базы выведена пользователю вместе со структурой таблиц","r":"A10 · Mishandling of Exceptional Conditions: наружу утекли детали исключения"}],"solution":"A01 — «чужое стало моим»; A02 — «настройка из коробки»; A03 — «код приехал не оттуда»; A10 — «ошибка ударила наружу»."},"test":[{"id":"u0-2-q1","mechanic":"single","points":2,"stem":"Что нового в Top 10:2025 по сравнению с 2021?","options":[{"id":"o0","text":"SSRF вошёл в Broken Access Control, supply chain стал отдельной категорией, добавлен класс про обработку исключений","correct":true,"rationale":"Таковы три главных изменения 2025-списка."},{"id":"o1","text":"Injection вышел из списка — инъекции больше не встречаются","correct":false,"rationale":"Injection остался (A05), просто ниже в рейтинге."},{"id":"o2","text":"Список не менялся с 2021 года","correct":false,"rationale":"Менялся: и порядок, и состав категорий."}]},{"id":"u0-2-q2","mechanic":"single","points":2,"stem":"Команда ссылается на Top 10 как на полный чек-лист приёмки продукта. Что не так?","options":[{"id":"o0","text":"Top 10 — карта приоритетов классов рисков; требования к приёмке формулирует ASVS","correct":true,"rationale":"ASVS — стандарт с проверяемыми уровнями требований; Top 10 лишь показывает, куда смотреть в первую очередь."},{"id":"o1","text":"Ничего: Top 10 покрывает все возможные риски","correct":false,"rationale":"Категории срезаны до десяти классов; между ними и за их пределами сотни CWE."},{"id":"o2","text":"Top 10 устарел в 2024","correct":false,"rationale":"Актуальна версия 2025."}]},{"id":"u0-2-q3","mechanic":"multi","points":3,"stem":"Какие ситуации относятся к A01 · Broken Access Control? Выбери все.","options":[{"id":"o0","text":"Меняем id в URL — открывается чужой заказ","correct":true,"rationale":"Классический IDOR — отсутствующая проверка владельца объекта."},{"id":"o1","text":"Админ-панель отвечает по HTTP, пароль передаётся открытым текстом","correct":false,"rationale":"Это криптографический провал транспорта (A04), не проверка прав."},{"id":"o2","text":"Обычный пользователь вызывает эндпойнт удаления пользователя, скрытый из интерфейса","correct":true,"rationale":"Скрытый в UI ≠ недоступный: права проверяет сервер, а не интерфейс."},{"id":"o3","text":"Ошибка сервера печатает стек и пути файлов","correct":false,"rationale":"Утекшие детали ошибки — A10."}]}],"framework":"Top 10:2025 — карта приоритетов; требования к приёмке — ASVS; категория — класс рисков, а не один баг.","anchor":{"g":"wording","p":{"bad":"чек-лист Top 10 закрывает приёмку","good":"приёмка — требования ASVS; Top 10 — куда смотреть в первую очередь"},"cap":"карта и протокол — разные документы"},"layers":{"simple":"Top 10 — как сводка «самые частые аварии года» для дорог: не правила движения, а подсказка, где чаще всего бьются.","how":"1. Читаешь категории как классы: доступ, настройка, поставка, крипто, инъекции, дизайн, аутентификация, целостность, наблюдение, ошибки. 2. Для своей фичи спрашиваешь: какие из этих классов она трогает. 3. Для каждого тронутого класса — конкретные требования (ASVS) и проверки. 4. Список обновляется — карта обновляется тоже.","formula":{"f":"фича → классы Top 10 → требования ASVS → проверки в CI/ревью","legend":[["классы","десять категорий 2025"],["ASVS","проверяемые требования по уровням L1–L3"],["проверки","тесты, правила сканера, ревью"]],"note":"Top 10 помогает не забыть класс; ASVS превращает «обратить внимание» в проверяемое требование."},"pitfalls":"Опытные разработчики запоминают список 2017 или 2021 и учат по нему новичков: SSRF — «отдельная категория», supply chain — «это про старые библиотеки». Вторая ловушка — читать Top 10 как протокол: «у нас нет SQL-инъекций, значит A05 закрыт» — при этом авторизация не проверяется вовсе.","checks":[{"q":"К какой категории 2025 года относится SSRF?","o":["A01 · Broken Access Control","A05 · Injection","A02 · Security Misconfiguration"],"a":0,"w":"В 2025 SSRF слили в A01: это доступ к чужим ресурсам."},{"q":"A10:2025 — это про...","o":["Обработку исключительных условий: ошибки, отказы, fail open","Ошибки в веб-формах","Десятое по счёту место инъекций"],"a":0,"w":"Новая категория про то, как система ведёт себя в ненормальных условиях."},{"q":"В чём разница Top 10 и ASVS?","o":["Top 10 — карта приоритетов; ASVS — проверяемые требования к приложениям","Это названия одного стандарта","Top 10 для серверов, ASVS для мобильных"],"a":0,"w":"Карта и протокол: одно подсказывает куда смотреть, второе фиксирует требования."},{"q":"«У нас нет SQL-инъекций, значит A05 закрыт» — что не так?","o":["Всё так: A05 — про SQL","A05 закрывается проверкой всех классов инъекций и их мест, а не отсутствием одного","Top 10 вообще не про проверки"],"a":1,"w":"Категория закрывается контролем класса, а не отсутствием одного известного дефекта."}],"rules":["Top 10:2025 — карта классов рисков; ASVS — протокол требований.","A01 — доступ к чужому: самый частый класс; SSRF теперь здесь.","A02 — настройка, A03 — поставка, A04 — крипто, A05 — инъекции, A06 — дизайн.","A07 — аутентификация, A08 — целостность, A09 — логи и алерты, A10 — исключения.","Список меняется — тренировка по устаревшему списку формирует ложную карту."]}},{"id":"u0-3","level":"L0","title":"Граница доверия и поверхность атаки","lead":"Кто может изменить данные до того, как их увидит сервер","concept":"Граница доверия — место, где данные переходят от стороны, которую ты контролируешь, к стороне, которую контролирует кто-то другой. Всё, что приходит через границу — параметры URL, заголовки, куки, тело запроса, файлы, данные из баз и очередей — недоверенное, пока не проверено. Поверхность атаки — сумма всех таких входов: каждый новый эндпойнт, интеграция и cron-задача её расширяют.","points":[{"h":"«Недоверенное» — про происхождение","t":"Данные из собственной базы могут быть недоверенными: их туда мог записать пользователь. Проверка нужна на входе и на использовании."},{"h":"Границы рисуют на диаграмме","t":"Пока границы не нарисованы, каждый уверен, что «данные уже проверили» на предыдущем шаге. Диаграмма с границами — первый артефакт безопасности."},{"h":"Поверхность атаки растёт тихо","t":"Новый эндпойнт, вебхук, выгрузка в CSV, админ-скрипт — всё это входные точки, о которых забывают при threat modeling."},{"h":"Клиентская проверка — не граница","t":"JS-валидация — удобство. Граница — сервер: всё, что он получает, недоверенное, независимо от того, что «проверял браузер»."}],"practice":{"id":"u0-3-pr","mechanic":"keymoves","points":3,"stem":"Интернет-магазин: форма отзыва, корзина в локальном хранилище, выгрузка отчётов в CSV, интеграция с платёжным шлюзом, ночная синхронизация с 1С. Выпиши недоверенные входы.","options":[{"id":"k0","text":"Тело и параметры каждого HTTP-запроса: форма отзыва, поля заказа, фильтры","correct":true,"why":"Всё, что пришло снаружи, — недоверенное, даже если в форме есть JS-валидация."},{"id":"k1","text":"Заголовки и куки: Referer, User-Agent, пользовательские заголовки","correct":true,"why":"Заголовки формирует клиент — их подделывают без труда."},{"id":"k2","text":"Файлы: импорты, выгрузки, вложения, аватары","correct":true,"why":"Файл — и вход, и носитель: имя, тип, содержимое — всё недоверенное."},{"id":"k3","text":"Данные из интеграций: шлюз, 1С, очереди","correct":true,"why":"Граница не только «клиент-сервер»: партнёрский сервис тоже может прислать неожиданное."},{"id":"k4","text":"Значения из базы, записанные пользователем, при выводе на другую страницу","correct":true,"why":"Stored-путь: отзыв, записанный вчера, выводится сегодня на чужой странице."},{"id":"k5","text":"Локальное хранилище браузера пользователя — как источник для аутентификации","correct":false,"why":"Хранилище пользователя под его контролем — да, недоверенное, но это не «вход в систему», а клиентское удобство."},{"id":"k6","text":"Серверные переменные окружения прод-стенда, изменённые DevOps","correct":false,"why":"Это внутренняя сторона границы; правка с прод-доступом — другой класс риска (инсайд, контроль изменений)."}],"reference":"Недоверенное = всё, что приложению прислал кто-то другой: HTTP, файлы, интеграции, очередь, собственная база с пользовательскими данными."},"test":[{"id":"u0-3-q1","mechanic":"single","points":2,"stem":"Сервер получает куки session=abc123 и заголовок X-Role=admin. Что верно?","options":[{"id":"o0","text":"Оба недоверенные: их может отправить любой клиент с любыми значениями","correct":true,"rationale":"Куки и заголовки формирует клиент; роль проверяет сервер по сессии, а не по заголовку."},{"id":"o1","text":"Куки недоверенное, заголовок X-Role доверенный: его ставит сервер","correct":false,"rationale":"Заголовок пришёл в запросе — значит, его сформировал клиент."},{"id":"o2","text":"Оба доверенные: браузер не позволяет подделать куки","correct":false,"rationale":"curl, Burp, скрипты — куки задаются легко."}]},{"id":"u0-3-q2","mechanic":"single","points":2,"stem":"Отзыв пользователя хранится в базе и выводится в админ-панели. Админ-панель «внутренняя». Экранирование нужно?","options":[{"id":"o0","text":"Да: пользовательские данные недоверенные на любом выводе, включая внутренние интерфейсы","correct":true,"rationale":"Stored XSS срабатывает на админе — самая лакомая цель."},{"id":"o1","text":"Нет: админ-панель видят только сотрудники","correct":false,"rationale":"Сотрудник-админ — целевой аккаунт с наибольшими правами."},{"id":"o2","text":"Только если отзыв содержит HTML","correct":false,"rationale":"Контекст вывода решает экранирование, а не «очевидность» содержимого."}]},{"id":"u0-3-q3","mechanic":"sjt_bw","points":3,"stem":"Тимлид предлагает: «Валидацию делаем на фронте, чтобы не грузить бэк». Как ответить?","options":[{"id":"o0","text":"Фронтовая валидация — UX; серверная — граница. Обе нужны: первая без второй — дыра","correct":true,"rationale":"Разделение ролей: удобство на клиенте, гарантия на сервере."},{"id":"o1","text":"Согласиться: фронт видит всё, что вводит пользователь","correct":false,"rationale":"Фронт под контролем клиента; запрос обходится мимо формы."},{"id":"o2","text":"Отказаться от фронтовой валидации вовсе","correct":false,"rationale":"Худший ход: клиентская валидация экономит пользователей от собственных опечаток."},{"id":"o3","text":"Дублировать всю валидацию на фронте и бэке в двух разных файлах правил","correct":false,"rationale":"Дубли без единого источника правил расходятся — часть правил исчезнет на одной из сторон."}],"worst":"o3","worstRationale":"Две валидации из разных файлов гарантированно расходятся: правят одну, забывают вторую."}],"framework":"Граница — где данные меняют хозяина; недоверенное — про происхождение; поверхность атаки — сумма входов.","anchor":{"g":"wording","p":{"bad":"валидация на фронте — и мы защищены","good":"фронт — удобство; граница — сервер: всё пришедшее недоверенное"},"cap":"JS-валидация — не граница"},"layers":{"simple":"Почтальон приносит конверт (запрос). Секретарь читает и передаёт директору (сервер). Внутри конверта может быть что угодно, хоть песок: секретарь первым делом не верит содержимому.","how":"1. Рисуешь схему: браузеры, серверы, базы, интеграции. 2. Проводишь пунктир там, где данные приходят извне или из чужих систем. 3. Для каждой стрелки через пунктир — список проверок на входе и правил вывода. 4. Каждый новый эндпойнт и интеграция попадают на схему до релиза.","formula":{"f":"недоверенное = HTTP(параметры, куки, заголовки, тело) + файлы + интеграции + очередь + база(чужой ввод)","legend":[["HTTP","всё, что прислал клиент"],["файлы","импорты, вложения, аватары"],["интеграции","шлюзы, партнёры, 1С, вебхуки"],["база","данные, записанные пользователями ранее"]],"note":"Проверка на входе — формат и диапазон; проверка на выводе — контекст. Это два разных контроля, а не дубли."},"pitfalls":"Опытные команды рисуют границу только «клиент-сервер» и забывают очередь, cron и внутренние сервисы: вебхук платёжки, ночные выгрузки, выгрузка в CSV — всё это недоверенные входы. Вторая ловушка — считать доверенной внутреннюю сеть: один скомпрометированный сервис — и «доверенная» зона атакует остальное.","checks":[{"q":"X-User-Id в запросе — это...","o":["Недоверенный параметр; id берут из сессии на сервере","Надёжный способ передать пользователя","Проблема только если приложение мобильное"],"a":0,"w":"Идентичность определяет сервер по сессии, а не клиент заголовком."},{"q":"Данные из базы, записанные пользователем A, выводятся пользователю B. Это...","o":["Переход через границу доверия — экранирование обязательно","Внутренние данные — границы нет","Граница только если B — админ"],"a":0,"w":"Stored-путь — классический обход «внутренней» зоны."},{"q":"Поверхность атаки выросла после добавления выгрузки в CSV. Почему?","o":["Появился новый вход и новый формат вывода — своя логика экранирования","CSV всегда уязвим","Не выросла: выгрузка — исходящий поток"],"a":0,"w":"Исходящий поток тоже поверхность: формулы в ячейках CSV — классическая атака на Excel."},{"q":"Команда рисует границу только «клиент — сервер». Что пропущено?","o":["Ничего: пользователь — главный источник угроз","Очереди, cron, вебхуки и внутренние сервисы — тоже недоверенные входы","Только браузерные расширения"],"a":1,"w":"Любой канал, куда данные попадают без твоего ревью, — вход; очередь и cron не исключение."}],"rules":["Недоверенное — про происхождение, а не про «подозрительность».","Границы рисуют до релиза; каждый новый вход попадает на схему.","Клиентская проверка — UX; серверная — гарантия. Вместе, а не одно вместо другого.","Внутренняя сеть не доверенная по умолчанию.","Поверхность атаки = все входы: HTTP, файлы, интеграции, очередь, cron, база."]}},{"id":"u0-4","level":"L0","title":"HTTP глазами атакующего","lead":"Запрос, куки, состояния: почему GET может дорого стоить","concept":"HTTP — протокол без памяти: каждый запрос самодостаточен, состояние держат куки. Куки с флагами (HttpOnly, Secure, SameSite) и параметры запроса — то, с чем работает атакующий. Любой GET, меняющий данные (удалить, оплатить), — приглашение к CSRF и к предзагрузке роботов; любой ответ с телом ошибки — утечка внутренней структуры.","points":[{"h":"Запрос самодостаточен","t":"Сервер не «помнит» пользователя: кто ты — только из куки и токенов в запросе. Подделал идентификатор — стал другим."},{"h":"Куки — ключи, а не данные","t":"В куках хранят идентификатор сессии. Их видно в заголовке каждого запроса; флаги ограничивают, кто их может прочитать и отправить."},{"h":"GET меняющий данные — дыра по дизайну","t":"Предзагрузка, роботы, ссылки в письмах — GET выполняется без пользователя. Смена состояния должна требовать POST и токена."},{"h":"Ответы рассказывают о внутренностях","t":"Стек трейса, версии фреймворка, SQL-фрагменты в ошибке — карта для атакующего. Наружу — общий текст, детали в логи."}],"practice":{"id":"u0-4-pr","mechanic":"keymoves","points":3,"stem":"Проектируешь эндпойнт удаления аккаунта. Какие решения принять сразу?","options":[{"id":"k0","text":"Метод POST или DELETE, не GET","correct":true,"why":"GET выполняется предзагрузкой и роботами; удаление по ссылке — классика самоубийства."},{"id":"k1","text":"Проверка прав на сервере по сессии, а не по параметру из тела","correct":true,"why":"Идентичность и владелец определяются сервером."},{"id":"k2","text":"Подтверждение: токен формы или повторное подтверждение","correct":true,"why":"CSRF-токен и подтверждение отделяют «кнопку пользователя» от «поддельного запроса»."},{"id":"k3","text":"В ответе — общий текст и статус; детали в лог с идентификатором события","correct":true,"why":"Ошибки наружу не показывают внутренности; трассировка по событию в логах."},{"id":"k4","text":"Поставить метод GET, чтобы удобнее дёргать из скриптов мониторинга","correct":false,"why":"Удобство мониторинга не оправдывает удаление по предзагрузке."},{"id":"k5","text":"Хранить is_admin в локальном хранилище и проверять на клиенте","correct":false,"why":"Клиентская проверка — не граница; любой запрос уходит напрямую на сервер."},{"id":"k6","text":"Возвращать в ошибке стек и SQL-запрос для отладки","correct":false,"why":"Отладка — в логи; наружу — только статус и общий текст."}],"reference":"POST/DELETE + серверная проверка прав + CSRF-токен + общий текст ошибок — минимальный каркас любого эндпойнта со сменой состояния."},"test":[{"id":"u0-4-q1","mechanic":"single","points":2,"stem":"Куда сервер смотрит, чтобы понять, кто в запросе?","options":[{"id":"o0","text":"В идентификатор сессии в куке или токене, и проверяет его в своём хранилище","correct":true,"rationale":"HTTP без памяти: идентичность — то, что сервер сам проверил."},{"id":"o1","text":"В заголовок User-Agent","correct":false,"rationale":"UA описывает браузер и подделывается свободно."},{"id":"o2","text":"В IP-адрес клиента","correct":false,"rationale":"IP меняется, шарится NAT и подделывается прокси."}]},{"id":"u0-4-q2","mechanic":"single","points":2,"stem":"Куда записать детальный стек ошибки?","options":[{"id":"o0","text":"В серверный лог с идентификатором события; пользователю — статус и общий текст","correct":true,"rationale":"Разделение: диагностика внутренняя, наружу — ничего лишнего."},{"id":"o1","text":"В тело ответа — чтобы пользователь сообщил в поддержку","correct":false,"rationale":"Стек — карта внутренностей: версии, пути, SQL."},{"id":"o2","text":"Никуда: ошибки должны быть тихими","correct":false,"rationale":"Без логов инцидент не расследуется."}]},{"id":"u0-4-q3","mechanic":"sjt_bw","points":3,"stem":"Продакт просит: «Сделайте ссылку-отписку GET: /unsubscribe?user=123 — кликнул и отписан». Ваш ход?","options":[{"id":"o0","text":"GET со случайным недобрым угадыванию токеном отписки: /unsubscribe?t=<random>, действие идемпотентное","correct":true,"rationale":"Токен делает ссылку недобрым угадыванию, GET-предзагрузка не опасна, потому что действие безопасное и без параметров пользователя."},{"id":"o1","text":"Согласиться: отписка — не опасное действие","correct":false,"rationale":"Отписка от писем без подтверждения — возможность испортить рассылки другому человеку: любой, кто узнает id, отменит рассылки; email-сканеры провоцируют предзагрузку."},{"id":"o2","text":"Требовать входа в аккаунт для отписки","correct":false,"rationale":"Худший ход: отписка превращается в барьер и жалобы на спам растут — баланс UX и риска."},{"id":"o3","text":"GET с user=123, но проверять Referer","correct":false,"rationale":"Referer подделывается и часто отсутствует — это не защита."}],"worst":"o3","worstRationale":"Referer — необязательный и подделываемый заголовок; проверка по нему даёт иллюзию защиты."}],"framework":"HTTP без памяти: идентичность — из проверенных сервером куки/токенов; GET не меняет состояние; наружу — статусы, внутрь — логи.","anchor":{"g":"wording","p":{"bad":"GET /delete?user=123 — удобно","good":"POST + CSRF-токен + права на сервере"},"cap":"смена состояния — не по GET"},"layers":{"simple":"HTTP — официант без памяти: каждый столик каждый раз показывает карточку (куки). Подделай карточку — сядешь за чужой стол. Приказ «убрать стол» официант выполняет, только если карточка настоящая и просьба подана не шёпотом от чужого имени.","how":"1. Запрос приходит: метод, путь, заголовки, куки, тело. 2. Сервер определяет пользователя по сессии из куки, проверяет её в хранилище. 3. Проверяет права на объект. 4. Исполняет или отказывает; ошибки — в логи, наружу — статус и общий текст.","formula":{"f":"идентичность = проверка сервером (сессия/токен)\nправа = проверка сервером (объект, действие)\nошибка: наружу — статус, внутрь — лог+id события","legend":[["сессия","идентификатор в куке с флагами"],["права","владелец и разрешение на действие"],["лог","детали для расследования"]],"note":"Три независимые проверки: кто ты, что тебе можно, что мы пишем. Пропуск любой открывает свой класс атак."},"pitfalls":"Разработчики доверяют заголовкам: X-User-Id, X-Forwarded-For как источник идентичности или лимитов — подделываются на раз. Вторая ловушка — GET-эндпойнты для «внутренних» операций: мониторинг дёргает их, предзагрузка выполняет, и действие происходит без пользователя.","checks":[{"q":"Куки с HttpOnly...","o":["Недоступны из JavaScript — XSS не украдёт сессию","Шифруют содержимое куки","Запрещают пересылку на другие домены"],"a":0,"w":"HttpOnly запрещает чтение из JS; шифрования он не делает."},{"q":"Ответ 500 со стеком на проде — это...","o":["Утечка деталей (A10): наружу общий текст, стек в логи","Нормальная отладка","Проблема только если стек длинный"],"a":0,"w":"Детали ошибок — карта внутренностей для атакующего."},{"q":"Почему GET /delete опасен?","o":["Его выполняет предзагрузка и роботы без согласия пользователя","GET медленнее","GET нельзя защитить CSRF-токеном"],"a":0,"w":"Механизм предзагрузки исполняет GET автоматически."},{"q":"Мониторинг дёргает GET /internal/reset по расписанию. Чем это опасно?","o":["Ничем: GET не меняет данные","GET выполняет действие без пользователя: предзагрузка или сканер запустят его сами","Опасно только для POST"],"a":1,"w":"Действие в GET исполняется любой предзагрузкой; смена состояния — только POST с проверкой."}],"rules":["Идентичность определяет сервер по проверенной сессии, не по заголовкам клиента.","Куки — ключи: HttpOnly, Secure, SameSite — минимальный набор флагов.","GET не меняет состояние: удаление и оплата — POST/DELETE с токеном.","Ошибки: наружу общий текст, внутрь — лог с идентификатором.","Каждый эндпойнт — проверка прав на сервере, а не скрытие кнопки."]}}],"TERMS":[{"name":"Уязвимость","level":"L0","when":"Пока думаешь «уязвимость — это про антивирус», закрыт не тот класс; дефект — это конкретное место в твоём продукте.","ex":"Параметр id в URL без проверки владельца: любой пользователь, сменив число, видит чужой заказ.","near":[{"t":"Вредоносная программа, которая попала в систему","why":"Вредонос — следствие; уязвимость — дефект, через который он входит."}],"nb":[{"t":"Эксплойт","why":"Уязвимость — свойство системы; эксплойт — способ ею воспользоваться."}],"apps":{"ok":"Инженер в ревью ставит вопрос: «что пользователь может прислать в это поле, чего код не ждёт»","okWhy":"Уязвимость — расхождение между ожиданием кода и возможностями ввода.","bad":[{"t":"У нас нет уязвимостей — сканер зелёный","why":"Сканер ищет известные паттерны; логические дефекты он не видит."},{"t":"Уязвимость у поставщика — не наша проблема","why":"Дефект в библиотеке exploitable в твоём контексте — твой риск."},{"t":"Уязвимость = всё, что однажды сломается","why":"Уязвимость — дефект безопасности с возможностью misuse, а не любая ошибка."}]},"simple":"Сломанный замок на двери: замок есть, ключ крутится, но язычок не защёлкивается. Дверь «работает» — просто не защищает.","remember":"Уязвимость — дефект, которым можно воспользоваться; не «страшное слово», а конкретное место.","def":"Дефект в коде, настройке или процессе, которым можно воспользоваться и получить то, что тебе не положено."},{"name":"Эксплойт","level":"L0","when":"Оценивая риск находки, спрашивают: есть ли сценарий и как далеко он доходит — эксплойт делает путь осязаемым.","ex":"Строка ' OR '1'='1 в поле логина: дефект конкатенации превращается в вход под чужой учёткой.","near":[{"t":"Уязвимость","why":"Уязвимость — дефект; эксплойт — его использование."}],"nb":[{"t":"PoC","why":"PoC — минимальная демонстрация в отчёте; эксплойт — рабочий инструмент атаки."}],"apps":{"ok":"Инженер описывает в отчёте шаги повторения на тестовых данных, не выгружая реальных данных","okWhy":"Сценарий должен быть воспроизводимым и безопасным — это часть культуры отчёта.","bad":[{"t":"Эксплойта в базах нет — значит и риска нет","why":"Сценарий пишется вручную; тишина в базах не доказывает недоступность."},{"t":"Показать серьёзность, выгрузив сотни реальных записей","why":"Разрушительный PoC — сам инцидент."},{"t":"Эксплойт нужен только для CVE","why":"Эксплойт — аргумент приоритета в твоей команде, а не для базы."}]},"simple":"Отмычка: сама по себе ничего не ломает — показывает, что замок не удержал.","remember":"Эксплойт — способ воспользоваться дефектом; уязвимость опасна и без него.","def":"Код или сценарий, который пользуется уязвимостью: превращает дефект в действие — чтение чужих данных, обход проверки, исполнение кода."},{"name":"Риск","level":"L0","when":"Приоритеты ставятся по риску: одна и та же ошибка рядом с отзывами и рядом с оплатой — разные решения.","ex":"SQLi в публичном поиске — высокий риск: вероятность высока, доходит до базы заказов с ПДн.","near":[{"t":"Серьёзность","why":"Серьёзность — атрибут находки; риск — про твои активы и контекст."}],"nb":[{"t":"Угроза","why":"Угроза — «кто и как может навредить»; риск — оценка исхода."}],"apps":{"ok":"Портфель: список рисков с вероятностью, ущербом и решением — фикс, принятие, пересмотр","okWhy":"Риск, записанный с решением, управляем; «опасно всё» — нет.","bad":[{"t":"Риск назначается по громкости слова «страшно»","why":"Назначается по активам и вероятности."},{"t":"Риск нулевой, пока инцидента не было","why":"Вероятность не измеряется прошлыми инцидентами."},{"t":"Риск закрывается обучением сотрудников","why":"Обучение — слабый контроль; нужен проверяемый."}]},"simple":"Ржавый балкон над детским садом: вероятность падения мала, но цена последствий огромна — поэтому его чинят первым, а не «когда упадёт».","remember":"Риск = вероятность × ущерб по твоим активам.","def":"Оценка того, что случится, если уязвимостью воспользуются: вероятность события и цена последствий для активов."},{"name":"Контроль","level":"L0","when":"«Стало безопаснее» — не разговор инженера; разговор — «ввели контроль X, проверяется тестом Y».","ex":"Параметризованные запросы в модуле заказов — контроль SQLi, проверяемый автотестом на каждый эндпойнт.","near":[{"t":"Политика","why":"Политика — документ; контроль — работающий механизм, который выполняет политику."}],"nb":[{"t":"Уязвимость","why":"Контроль закрывает уязвимость; сам он — не находка."}],"apps":{"ok":"Контроль формулируется требованием: «соль индивидуальна, Argon2id, лимит 5 попыток» — и проверяется","okWhy":"Требование с проверкой живёт; лозунг умирает на планёрке.","bad":[{"t":"Контроль — «проверим логи раз в неделю»","why":"Это действие, а не механизм; без алерта не работает."},{"t":"Контроль — купить сканер","why":"Сканер — детектор, не контроль."},{"t":"Контроль введён — значит риск нулевой","why":"Контроль снижает риск; остаток фиксируется."}]},"simple":"Видеоглазок, крепкий замок и привычка не открывать незнакомцам: три контроля на одну дверь.","remember":"Контроль — проверяемый механизм; без проверки это обещание.","def":"Проверяемое изменение кода, конфигурации или процесса, которое закрывает дефект или снижает ущерб."},{"name":"CWE и CVE","level":"L0","when":"Находка без класса CWE и номера CVE не ищется в базах, не сравнивается и не чинится по готовым советам.","ex":"Отчёт: «CWE-639 (IDOR) в GET /orders/{id}, похож на CVE-2026-3211, фикс — проверка владельца» — разработчик понимает за минуту.","near":[{"t":"CVSS","why":"CVSS — шкала серьёзности; CWE — тип, CVE — номер."}],"nb":[{"t":"OWASP Top 10","why":"Top 10 группирует CWE в классы рисков."}],"apps":{"ok":"Триаж переводит находку в CWE-класс и сверяет с существующими CVE","okWhy":"По классу находятся стандартные фиксы и готовые тесты.","bad":[{"t":"Придумывать собственные названия дефектов","why":"Без CWE находка не ищется и не агрегируется."},{"t":"CWE-номер — доказательство опасности","why":"Это тип; опасность определяет контекст и CVSS."},{"t":"CVE есть только у чужих библиотек","why":"Твой продукт тоже может получить CVE."}]},"simple":"Больничный справочник: CWE — название болезни, CVE — номер конкретного случая в истории.","remember":"CWE — тип дефекта; CVE — номер находки; CVSS — шкала.","def":"CWE — публичный классификатор типов дефектов (CWE-79 XSS, CWE-89 SQLi); CVE — публичный номер конкретной находки в конкретном продукте."},{"name":"OWASP Top 10:2025","level":"L0","when":"Чтобы не разучивать риски по памяти и не пропустить класс: фича → какие классы трогает → требования и проверки.","ex":"Фича загрузки файлов трогает A01 (доступ), A02 (настройки хранилища), A03 (библиотека обработки), A05 (валидация).","near":[{"t":"Полный чек-лист приёмки","why":"Это карта приоритетов; требования к приёмке формулирует ASVS."}],"nb":[{"t":"ASVS","why":"Top 10 — куда смотреть; ASVS — что конкретно проверять."}],"apps":{"ok":"Дизайн фичи размечается по категориям Top 10, каждая — с требованием","okWhy":"Карта не даёт забыть класс; требования делают проверяемым.","bad":[{"t":"Тренировать команду по списку 2021","why":"Список изменился: SSRF вошёл в A01, появился A10."},{"t":"«У нас нет SQLi — значит A05 закрыт»","why":"Категория шире одного бага; инъекции включают LDAP, команды, NoSQL."},{"t":"Top 10 — для веба, нам не применим","why":"Классы применимы к API, мобильным и внутренним сервисам."}]},"simple":"Сводка ГИБДД «где чаще всего бьются»: не правила движения, а подсказка, где ставить радар и зеркало.","remember":"Top 10:2025 — карта классов рисков; приёмка — по ASVS.","def":"Консенсусный список десяти классов рисков веб-приложений: A01 Broken Access Control, A02 Misconfiguration, A03 Supply Chain, A04 Crypto, A05 Injection, A06 Insecure Design, A07 Authentication, A08 Integrity, A09 Logging, A10 Exceptional Conditions."},{"name":"ASVS","level":"L0","when":"Формулировать приёмку: «авторизация проверяется на каждый объект (V8.2.1)» — проверяемо; «безопасно» — нет.","ex":"Для банка клиентский сервис берут L2: V6 (аутентификация), V7 (сессии), V8 (авторизация) с пунктами-номерами.","near":[{"t":"Top 10","why":"Top 10 — карта приоритетов; ASVS — протокол требований."}],"nb":[{"t":"CIS Benchmark","why":"CIS — про конфигурацию инфраструктуры; ASVS — про приложение."}],"apps":{"ok":"Выбор уровня ASVS по ценности данных и запись его в требования релиза","okWhy":"Уровень выбирается по активам, а не «по возможности».","bad":[{"t":"«Сертифицируем всё по максимальному уровню»","why":"Стоимость растёт, смысл не меняется: уровень — по контуру данных."},{"t":"ASVS — только для банков","why":"Уровень L1 нужен любому продукту с пользователями."},{"t":"ASVS — книжка, которую читают раз","why":"Это чек-лист приёмки, который проверяют на каждом релизе."}]},"simple":"Санитарные правила ресторана: уровни чистоты по типу кухни — лоток с кофе требует меньше, чем холодильник с мясом.","remember":"ASVS — проверяемые требования по уровням; уровень выбирается по активам.","def":"OWASP Application Security Verification Standard: проверяемые требования к приложениям по уровням L1 (базовый), L2 (стандартный), L3 (критический), сгруппированные в главы V1–V17."},{"name":"Граница доверия","level":"L0","when":"Пока границы не нарисованы, каждый уверен, что «данные уже проверили» на предыдущем шаге — и никто их не проверяет.","ex":"Отзыв пользователя хранится в базе и выводится в админке: база → админка — тоже граница, экранирование обязательно.","near":[{"t":"Периметр сети","why":"Периметр — одна из границ; границы есть и внутри: очередь, интеграции, база с пользовательскими данными."}],"nb":[{"t":"Файрвол","why":"Файрвол — механизм на границе; граница — понятие схемы данных."}],"apps":{"ok":"Диаграмма фичи с пунктирами границ до релиза; каждая стрелка — с проверкой","okWhy":"Стрелка без проверки — дыра; диаграмма делает её видимой.","bad":[{"t":"Внутренняя сеть доверенная","why":"Один скомпрометированный сервис — и вся «доверенная» зона атакует остальное."},{"t":"Граница только клиент-сервер","why":"Файлы, интеграции, очередь, cron — тоже пересекают границы."},{"t":"Данные из своей базы доверенные","why":"Их записал пользователь — происхождение недоверенное."}]},"simple":"Приёмка на складе: всё, что въезжает с улицы, пересчитывают и проверяют. Внутри склада свои прави
